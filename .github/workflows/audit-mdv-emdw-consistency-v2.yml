name: Audit MDV EMDW Consistency V2

on:
  push:
    branches:
      - feature/auv-reply-bit-binding
    paths:
      - .github/workflows/audit-mdv-emdw-consistency-v2.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
      - name: Structural audit
        shell: bash
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from collections import defaultdict

          NS='http://lignex1.com/mcmc2/umsSchema'
          q=lambda n:f'{{{NS}}}{n}'
          SZ={'UInt8':1,'Int8':1,'UInt16':2,'Int16':2,'UInt32':4,'Int32':4,'UInt64':8,'Int64':8,'Float32':4,'Float64':8}
          cfgs={
            'MDV':('ProtocolXml/MDV/MdvPlatformSemantic.xml','ProtocolXml/MDV/MdvTcpBinding.xml','ProtocolXml/MDV/MdvSpecification.xml',{
              'T_MDV_MISSION_CTRL_CMD':28,'T_MDV_MODE_SET_CMD':24,'T_MDV_MISSION_PLAN_INFO':348,'T_MDV_EMERGENCY_STOP_CMD':20,'T_MDV_TARGET_INFO_CMD':16,'T_MDV_CTRL_RESP':28,'T_MDV_TRACKING_INFO':52,'T_MDV_STATUS_INFO':12,'T_MDV_MISSION_PROGRESS_INFO':24,'T_HEARTBEAT':8}),
            'EMDW':('ProtocolXml/EMDW/EmdwPlatformSemantic.xml','ProtocolXml/EMDW/EmdwTcpBinding.xml','ProtocolXml/EMDW/EmdwSpecification.xml',{
              'T_EMDW_MISSION_CTRL_CMD':28,'T_EMDW_MODE_SET_CMD':24,'T_EMDW_MISSION_PLAN_INFO':348,'T_EMDW_EMERGENCY_STOP_CMD':20,'T_EMDW_TARGET_INFO_CMD':16,'T_EMDW_DISPOSAL_CMD':28,'T_EMDW_CTRL_RESP':28,'T_EMDW_POSITION_INFO':16,'T_EMDW_STATUS_INFO':12,'T_EMDW_MISSION_PROGRESS_INFO':24,'T_EMDW_DISPOSAL_STATUS_INFO':12,'T_HEARTBEAT':8})}
          issues=[]
          def add(level,p,k,m): issues.append((level,p,k,m))
          def ln(e): return e.tag.rsplit('}',1)[-1]
          def elems(c): return [x for x in list(c) if ln(x) in {'Field','FixedField','DerivedField','PackedField','ArrayField'}]
          def size(e):
            t=ln(e)
            if t in {'Field','FixedField','DerivedField'}:
              dt=e.get('dataType')
              if dt not in SZ: raise ValueError(f'{t}:{e.get("name")} dataType={dt}')
              return SZ[dt]*int(e.get('length','1'))
            if t=='PackedField':
              w=int(e.get('width'))
              if w%8: raise ValueError(f'PackedField {e.get("name")} width={w}')
              return w//8
            if t=='ArrayField':
              mx=e.get('maxOccurs'); el=e.find(q('Element'))
              if not mx or not mx.isdigit() or el is None: raise ValueError(f'ArrayField {e.get("name")} maxOccurs={mx}')
              return int(mx)*sum(size(x) for x in elems(el))
            return 0
          def sig(e):
            t=ln(e)
            if t in {'Field','FixedField','DerivedField'}: return (e.get('name'),e.get('dataType'),e.get('length','1'))
            if t=='PackedField': return (e.get('name'),'Packed',e.get('width'))
            if t=='ArrayField':
              el=e.find(q('Element'))
              return (e.get('name'),'Array',e.get('maxOccurs'),tuple(sig(x) for x in elems(el)))

          for p,(sp,bp,vp,body_sizes) in cfgs.items():
            sr=ET.parse(sp).getroot(); br=ET.parse(bp).getroot(); vr=ET.parse(vp).getroot()
            st=Path(sp).read_text(encoding='utf-8'); bt=Path(bp).read_text(encoding='utf-8')
            enc=vr.find(q('DataEncoding'))
            if enc is None or enc.get('byteOrder')!='little': add('ERROR',p,'DataEncoding','little-endian specification default missing')
            for bad in ['converter=','generator=','sourceMember=']:
              if bad in bt: add('ERROR',p,'Legacy',bad+' remains')
            for e in br.iter():
              t=ln(e)
              if t in {'Field','FixedField','DerivedField'} and not e.get('dataType'): add('ERROR',p,'DataType',f'{t} {e.get("name")} missing dataType')
              if e.get('name')=='reserved' and t in {'Field','FixedField','DerivedField'}:
                if e.get('dataType')!='UInt8' or not e.get('length'): add('ERROR',p,'Reserved',ET.tostring(e,encoding='unicode'))

            ms=sr.find(q('MonitorSpecs')); cs=sr.find(q('ControlSpecs')); bm=br.find(q('Monitors')); bc=br.find(q('Controls'))
            sm={e.get('id') for e in list(ms) if e.get('id')} if ms is not None else set(); sc={e.get('id') for e in list(cs) if e.get('id')} if cs is not None else set()
            xm={e.get('semantic_id') for e in list(bm) if e.get('semantic_id')} if bm is not None else set(); xc={e.get('semantic_id') for e in list(bc) if e.get('semantic_id')} if bc is not None else set()
            if sm!=xm: add('ERROR',p,'MonitorID',f'Semantic-only={sorted(sm-xm)} Binding-only={sorted(xm-sm)}')
            if sc!=xc: add('ERROR',p,'ControlID',f'Semantic-only={sorted(sc-xc)} Binding-only={sorted(xc-sc)}')

            srep={e.get('bindRef'):e for e in sr.iter(q('Reply')) if e.get('bindRef')}; brep={e.get('semantic_id'):e for e in br.iter(q('Reply')) if e.get('semantic_id')}
            if set(srep)!=set(brep): add('ERROR',p,'ReplyRef',f'Semantic-only={sorted(set(srep)-set(brep))} Binding-only={sorted(set(brep)-set(srep))}')
            for rid,e in srep.items():
              if rid in brep and e.get('required')!=brep[rid].get('required'): add('ERROR',p,'ReplyRequired',f'{rid}: {e.get("required")} vs {brep[rid].get("required")}')

            sem_cdms={e.get('cdm') for e in sr.iter() if e.get('cdm')}
            for e in br.iter():
              t=ln(e); c=e.get('cdm')
              if t=='Map' and c not in sem_cdms: add('ERROR',p,'ValueMapCDM',c or '<none>')
              if t in {'Set','Bind'} and c not in sem_cdms: add('ERROR',p,'SentinelCDM',c or '<none>')
            for tag in ['ValueSetSpec','ValueSetProfile','ValueSetResult']:
              for vs in sr.iter(q(tag)):
                vals=vs.find(q('Values'))
                if vals is not None:
                  for v in vals.findall(q('Value')):
                    txt=(v.text or '').strip()
                    if re.fullmatch(r'(?:0x[0-9A-Fa-f]+|-?\d+)',txt): add('ERROR',p,'SemanticRawCode',f'{tag}:{vs.get("id") or vs.get("cdm")}={txt}')
            for vm in br.iter(q('ValueMap')):
              pairs=[(m.get('cdm'),m.get('value')) for m in vm.findall(q('Map'))]
              if len({x[0] for x in pairs})!=len(pairs) or len({x[1] for x in pairs})!=len(pairs): add('ERROR',p,'ValueMapDuplicate',str(pairs))

            for f in br.iter(q('Field')):
              if f.get('name')=='currentWaypointIndex' and f.find(q('Sentinel')) is not None:
                se=f.find(q('Sentinel')); no=f.find(q('Normal'))
                if se.get('value')!='0xFFFF' or no is None: add('ERROR',p,'Sentinel','currentWaypointIndex rule mismatch')

            by=defaultdict(list)
            for tag in ['MonitorBinding','ControlBinding','Reply']:
              for c in br.iter(q(tag)):
                ch=c.find(q('TCPChannel'))
                if ch is None: continue
                msg=ch.get('messageType')
                try: total=sum(size(x) for x in elems(c))
                except Exception as ex: add('ERROR',p,'WireSize',f'{tag}/{c.get("semantic_id")}/{msg}: {ex}'); continue
                sg=tuple(sig(x) for x in elems(c)); by[msg].append((c.get('semantic_id'),total,sg))
                if msg in body_sizes:
                  want=body_sizes[msg]+28
                  if total!=want: add('ERROR',p,'PacketSize',f'{msg}/{c.get("semantic_id")}: {total} != {want}')
                for x in elems(c):
                  if ln(x)=='FixedField' and x.get('name')=='packetLength':
                    if int(x.get('value'),0)!=total: add('ERROR',p,'PacketLength',f'{msg}/{c.get("semantic_id")}: fixed={x.get("value")} computed={total}')
            for msg,rows in by.items():
              if len({r[2] for r in rows})>1: add('ERROR',p,'MessageSignature',f'{msg}: {[r[0] for r in rows]}')

            cc=len(re.findall(r'<!--[\s\S]*?-->',st))+len(re.findall(r'<!--[\s\S]*?-->',bt))
            print('COMMENT_COUNT',p,cc)
            for stale in ['MissionTypeToCode','WaypointIndexToAvailable','WaypointIndexToIndexWhenAvailable']:
              if stale in st or stale in bt: add('WARN',p,'StaleComment',stale)

          print('=== AUDIT RESULTS ===')
          for x in issues: print(' | '.join(x))
          print('TOTAL',len(issues),'ERROR',sum(x[0]=='ERROR' for x in issues),'WARN',sum(x[0]=='WARN' for x in issues))
          if any(x[0]=='ERROR' for x in issues): raise SystemExit(2)
          PY
      - name: Install lxml
        run: python -m pip install --quiet lxml
      - name: XSD validation
        shell: bash
        run: |
          python - <<'PY'
          from lxml import etree
          pairs=[
            ('ProtocolXml/MDV/MdvPlatformSemantic.xml','ProtocolXml/XSD/CommonSpecSchema.xsd'),
            ('ProtocolXml/EMDW/EmdwPlatformSemantic.xml','ProtocolXml/XSD/CommonSpecSchema.xsd'),
            ('ProtocolXml/MDV/MdvTcpBinding.xml','ProtocolXml/XSD/CommonBindingSchema.xsd'),
            ('ProtocolXml/EMDW/EmdwTcpBinding.xml','ProtocolXml/XSD/CommonBindingSchema.xsd'),
            ('ProtocolXml/MDV/MdvSpecification.xml','ProtocolXml/XSD/VehicleSpecificationSchema.xsd'),
            ('ProtocolXml/EMDW/EmdwSpecification.xml','ProtocolXml/XSD/VehicleSpecificationSchema.xsd')]
          bad=[]
          for xml,xsd in pairs:
            try:
              schema=etree.XMLSchema(etree.parse(xsd)); schema.assertValid(etree.parse(xml)); print('XSD_PASS',xml)
            except Exception as e:
              bad.append((xml,str(e))); print('XSD_FAIL',xml,str(e))
          if bad: raise SystemExit(3)
          PY
