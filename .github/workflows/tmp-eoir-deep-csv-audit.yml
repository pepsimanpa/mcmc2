name: temporary EOIR deep CSV audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Apply EOIR source-confirmed deep audit fixes
        shell: python
        run: |
          from pathlib import Path

          sem=Path('ProtocolXml/USV/ElectroOptical/ElectroOpticalSemantic.xml')
          bind=Path('ProtocolXml/USV/ElectroOptical/ElectroOpticalBinding.xml')
          issues=Path('ProtocolXml/USV/ElectroOptical/ElectroOptical_OpenIssues.md')
          s=sem.read_text(encoding='utf-8')
          b=bind.read_text(encoding='utf-8')
          o=issues.read_text(encoding='utf-8')

          def rep(text, old, new, count, label):
              n=text.count(old)
              if n != count:
                  raise SystemExit(f'{label}: expected {count}, found {n}')
              return text.replace(old,new)

          # Remove stale pre-Boolean-schema note.
          b=rep(b,
              '  <!--DDS boolean은 현재 WireDataType에 Boolean이 없어 해당 필드에 임의 UInt8 dataType을 부여하지 않는다. OpenIssues 참조.-->',
              '  <!--원 CSCI primitive가 실제 boolean인 직접 DDS 필드는 공용 WireDataType Boolean으로 선언한다. Semantic Boolean이라도 원 wire가 octet/bit/sentinel이면 해당 물리 표현을 유지한다.-->',
              1,'stale Boolean note')

          # Source-confirmed health quartet for SWIR IBIT power/control fields.
          health_values='''<Values>\n                <Value name="Normal" cdm="Health.Normal"/>\n                <Value name="Degraded" cdm="Health.Degraded"/>\n                <Value name="Unavailable" cdm="Health.Unavailable"/>\n                <Value name="NoResponse" cdm="Health.NoResponse"/>\n              </Values>'''
          health_map='''<ValueMap>\n            <Map cdm="Health.Normal" value="0"/>\n            <Map cdm="Health.Degraded" value="1"/>\n            <Map cdm="Health.Unavailable" value="2"/>\n            <Map cdm="Health.NoResponse" value="3"/>\n          </ValueMap>'''
          for name,cdm in [
              ('statusPowerSwir','Health.EOIR.IBIT.SWIR.Power'),
              ('statusControlSwir','Health.EOIR.IBIT.SWIR.Control')]:
              s=rep(s,
                  f'            <Result name="{name}" cdm="{cdm}"/>',
                  f'''            <ValueSetResult name="{name}" cdm="{cdm}">\n              {health_values}\n            </ValueSetResult>''',
                  1,'semantic SWIR health '+name)
              b=rep(b,
                  f'        <Field name="{name}" cdm="{cdm}" dataType="UInt8"/>',
                  f'''        <Field name="{name}" cdm="{cdm}" dataType="UInt8">\n          {health_map}\n        </Field>''',
                  1,'binding SWIR health '+name)

          # Source-defined bit positions. Polarity is not stated, so expose each bit as Raw rather than Boolean.
          details={
            'statusInternalGimbal': ('Health.EOIR.IBIT.InternalGimbal', [
              ('internalAzimuthMotorDrive','InternalAzimuthMotorDrive.Raw',0),
              ('internalElevationMotorDrive','InternalElevationMotorDrive.Raw',1),
              ('internalAzimuthEncoderCommunication','InternalAzimuthEncoderCommunication.Raw',2),
              ('internalElevationEncoderCommunication','InternalElevationEncoderCommunication.Raw',3)]),
            'statusSensorAssembly1': ('Health.EOIR.IBIT.SensorAssembly1', [
              ('eoCameraPower','EOCameraPower.Raw',0),
              ('eoCameraControl','EOCameraControl.Raw',1),
              ('mwirCameraPower','MWIRCameraPower.Raw',2),
              ('mwirCameraControl','MWIRCameraControl.Raw',3),
              ('illuminatorPower','IlluminatorPower.Raw',4),
              ('illuminatorControl','IlluminatorControl.Raw',5),
              ('lrfPower','LRFPower.Raw',6),
              ('lrfControl','LRFControl.Raw',7)]),
            'statusSensorAssembly2': ('Health.EOIR.IBIT.SensorAssembly2', [
              ('imuCommunication','IMUCommunication.Raw',0),
              ('cameraControlBoardControl','CameraControlBoardControl.Raw',1),
              ('imageTrackingBoardControl','ImageTrackingBoardControl.Raw',2),
              ('wiperOperation','WiperOperation.Raw',3)]),
            'statusExternalGimbal': ('Health.EOIR.IBIT.ExternalGimbal', [
              ('externalAzimuthMotorDrive','ExternalAzimuthMotorDrive.Raw',0),
              ('externalElevationMotorDrive','ExternalElevationMotorDrive.Raw',1),
              ('externalAzimuthEncoderCommunication','ExternalAzimuthEncoderCommunication.Raw',2),
              ('externalElevationEncoderCommunication','ExternalElevationEncoderCommunication.Raw',3)]),
            'statusStabilizationControlBoard': ('Health.EOIR.IBIT.StabilizationControlBoard', [
              ('stabilizationControlBoardControl','Control.Raw',0)])
          }

          for field,(base,members) in details.items():
              old_sem=f'            <Result name="{field}" cdm="{base}.Raw"/>'
              body='\n'.join(f'              <Result name="{name}" cdm="{base}.{suffix}"/>' for name,suffix,_ in members)
              new_sem=f'''            <GroupResult name="{field}" cdm="{base}">\n{body}\n            </GroupResult>'''
              s=rep(s,old_sem,new_sem,1,'semantic packed '+field)

              old_bind=f'        <Field name="{field}" cdm="{base}.Raw" dataType="UInt8"/>'
              bits='\n'.join(f'          <BitMember name="{name}" cdm="{base}.{suffix}" offset="{off}"/>' for name,suffix,off in members)
              new_bind=f'''        <PackedField name="{field}" width="8" defaultValue="0">\n{bits}\n        </PackedField>'''
              b=rep(b,old_bind,new_bind,1,'binding packed '+field)

          old_note='      <!--statusInternalGimbal/statusSensorAssembly1/statusSensorAssembly2/statusExternalGimbal/statusStabilizationControlBoard는 원본 octet bit field를 raw 단위로 유지한다. Range의 0~N(bit)은 값 범위가 아니라 사용 비트 위치이며 BitField XSD 확장은 이번 설계에서 하지 않는다.-->'
          new_note='      <!--IBIT detail 5개 octet은 CSCI가 bit 위치와 점검 대상을 직접 명시하므로 PackedField/BitMember로 분해한다. 다만 각 bit의 0/1 정상/이상 polarity는 직접 정의되지 않아 bit별 Raw 의미로 유지한다.-->'
          b=rep(b,old_note,new_note,1,'IBIT source note')

          # Refresh audit document.
          anchor='- 공통 XSD 경로를 `../../XSD/...`로 정리하였다.\n'
          add='- 전자광학장치 CSCI 재심층 감사에서 `statusPowerSwir/statusControlSwir`의 4상태 코드를 직접 확인하여 Semantic ValueSetResult + Binding ValueMap으로 반영하였다.\n- IBIT detail 5개 octet은 CSCI에 명시된 bit 위치/점검 대상까지 PackedField/BitMember 및 Semantic GroupResult로 분해하되, 0/1 polarity는 근거가 없어 bit별 Raw로 유지하였다.\n- Boolean WireDataType 추가 전의 오래된 Binding 주석을 현재 공용 XSD 정책에 맞게 정리하였다.\n'
          if add not in o:
              o=rep(o,anchor,anchor+add,1,'audit summary')

          old_issue='''10. **IBIT 내부 raw bitfield 해석**\n   - `statusInternalGimbal`, `statusSensorAssembly1/2`, `statusExternalGimbal`, `statusStabilizationControlBoard`는 원본 bitfield 성격을 유지한다.\n   - 각 bit의 논리 의미가 확정된 원본이 확보되기 전에는 여러 Semantic Reply로 분해하지 않는다.'''
          new_issue='''10. **IBIT 내부 bit polarity — 부분 해결**\n   - 전자광학장치 CSCI 재심층 감사로 `statusInternalGimbal`, `statusSensorAssembly1/2`, `statusExternalGimbal`, `statusStabilizationControlBoard`의 bit 위치와 각 점검 대상은 직접 확인하였다. 따라서 Binding `PackedField/BitMember`와 Semantic `GroupResult`로 bit별 항목을 분해하였다.\n   - 다만 원문은 각 bit의 `0/1` 중 어느 값이 정상/이상인지 직접 정의하지 않는다. 따라서 `BooleanResult`/ValueMap으로 확대 해석하지 않고 각 bit를 Raw 의미로 유지한다.'''
          o=rep(o,old_issue,new_issue,1,'IBIT OpenIssue')

          status='- 직접 RCU 연동 범위의 원문 근거가 있는 Semantic/Binding 정합성 보강은 완료하였다.'
          status2='- 직접 RCU 연동 범위의 원문 근거가 있는 Semantic/Binding 정합성 보강과 전자광학장치 CSCI 재심층 감사까지 완료하였다.'
          o=rep(o,status,status2,1,'status line')

          sem.write_text(s,encoding='utf-8')
          bind.write_text(b,encoding='utf-8')
          issues.write_text(o,encoding='utf-8')

      - name: Validate EOIR and all USV XML
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=list(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          b=Path('ProtocolXml/USV/ElectroOptical/ElectroOpticalBinding.xml').read_text(encoding='utf-8')
          s=Path('ProtocolXml/USV/ElectroOptical/ElectroOpticalSemantic.xml').read_text(encoding='utf-8')
          for f in ['statusInternalGimbal','statusSensorAssembly1','statusSensorAssembly2','statusExternalGimbal','statusStabilizationControlBoard']:
              assert b.count(f'<PackedField name="{f}"') == 1
              assert s.count(f'<GroupResult name="{f}"') == 1
          for f in ['statusPowerSwir','statusControlSwir']:
              assert b.count(f'<Field name="{f}"') == 1
              assert s.count(f'<ValueSetResult name="{f}"') == 1
          assert 'DDS boolean은 현재 WireDataType에 Boolean이 없어' not in b
          assert 'converter=' not in b
          print(f'USV Semantic {len(sems)} PASS / Binding {len(binds)} PASS')
          print('EOIR DEEP CSV AUDIT ASSERTIONS PASS')
          PY
      - name: Commit EOIR deep audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/ElectroOptical/ElectroOpticalSemantic.xml ProtocolXml/USV/ElectroOptical/ElectroOpticalBinding.xml ProtocolXml/USV/ElectroOptical/ElectroOptical_OpenIssues.md
          git commit -m 'Deep-audit EOIR CSV health and IBIT mappings'
          git push origin HEAD:feature/usv-semantic-binding-audit
