name: Cleanup AUV Derived Mapping Format

on:
  push:
    branches: [feature/auv-declarative-binding-cleanup]
    paths: ['.github/workflows/cleanup-auv-derived-format.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-declarative-binding-cleanup
          fetch-depth: 0
      - name: Normalize formatting without changing comments
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re
          files=[Path('ProtocolXml/AUV/AuvPlatformRfBinding.xml'),Path('ProtocolXml/AUV/AuvRfCommBinding.xml')]
          schema=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          for p in files:
              s=p.read_text(encoding='utf-8')
              before=len(re.findall(r'<!--[\s\S]*?-->',s))
              # Remove accidental blank lines inside informationNumber SourceValueMap blocks only.
              s=re.sub(
                  r'(<DerivedField name="informationNumber"[^>]*>)\n\s*\n(\s*<SourceValueMap>)\n\s*\n(\s*<Map sourceValue="1" value="[1-3]"/>)\n\s*\n(\s*<Map sourceValue="2" value="[4-6]"/>)\n\s*\n(\s*</SourceValueMap>)\n\s*\n(\s*</DerivedField>)',
                  r'\1\n\2\n\3\n\4\n\5\n\6',s)
              s=s.replace('\n<Field name="checksum" dataType="UInt16"/>','\n                <Field name="checksum" dataType="UInt16"/>')
              p.write_text(s,encoding='utf-8',newline='')
              after=len(re.findall(r'<!--[\s\S]*?-->',s))
              if after!=before: raise SystemExit(f'comment count changed {p}: {before}->{after}')
              schema.assertValid(etree.parse(str(p)))
              if '\n<Field name="checksum" dataType="UInt16"/>' in s: raise SystemExit('checksum indentation remains '+str(p))
              print('PASS',p,'comments',before)
          PY
          git diff --check
      - name: Commit formatting cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/AUV/AuvPlatformRfBinding.xml ProtocolXml/AUV/AuvRfCommBinding.xml
          git commit -m 'Clean AUV declarative mapping formatting'
          git push origin HEAD:feature/auv-declarative-binding-cleanup
