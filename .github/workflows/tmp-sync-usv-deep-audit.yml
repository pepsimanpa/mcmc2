name: temporary USV deep audit sync
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Sync consolidated deep audit
        shell: python
        run: |
          from pathlib import Path
          p=Path('ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md')
          s=p.read_text(encoding='utf-8')
          marker='- 통합 감사: `ProtocolXml/Docs/USV_Semantic_Binding_Integrated_Audit_20260828.md`\n'
          add='- CSV 재심층 감사 최종 갱신: 2026-08-30\n'
          if add not in s:
              if marker not in s: raise SystemExit('header marker missing')
              s=s.replace(marker,marker+add,1)
          old='### 4.8 NavigationRadar\n\n공통 참조: `USV-COMMON-01`, `03`, `05`, `07`.\n\n장치 고유 TBD:\n1. Radar/AIS 탐지거리 제어 octet의 실제 거리/프리셋 값 체계.\n2. `radarMessageTransmitStatus`가 가리키는 실제 메시지/업무 의미.\n3. `AISContactType` 일부 Range/Unavailable 원본 표 이상값.'
          new='### 4.8 NavigationRadar\n\n공통 참조: `USV-COMMON-01`, `03`, `05`, `07`.\n\n장치 고유 TBD:\n1. Radar/AIS 탐지거리 제어 octet의 실제 거리/프리셋 값 체계.\n2. `radarMessageTransmitStatus`가 가리키는 실제 메시지/업무 의미.\n\n재심층 감사에서 `AISContactType`의 밀린 Range 셀은 동일 `공용 구조체.csv`의 `RadarAISFusionContactType` 동일 필드 교차근거로 해소하였다. 복원 근거가 없는 `shipLength/shipWidth`는 Range 미지정으로 유지한다.'
          if old not in s: raise SystemExit('NavigationRadar consolidated block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate consolidated sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md')
          s=p.read_text(encoding='utf-8')
          block=s.split('### 4.8 NavigationRadar',1)[1].split('### 4.9 NearContactDetection',1)[0]
          assert 'AISContactType` 일부 Range/Unavailable 원본 표 이상값' not in block
          assert 'RadarAISFusionContactType' in block
          assert 'CSV 재심층 감사 최종 갱신: 2026-08-30' in s
          print('CONSOLIDATED DEEP AUDIT SYNC PASS')
          PY
      - name: Commit consolidated sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md
          git commit -m 'Sync consolidated USV deep-audit results'
          git push origin HEAD:feature/usv-semantic-binding-audit
