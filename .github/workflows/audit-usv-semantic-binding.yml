name: Audit USV Semantic Binding

on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/audit-usv-semantic-binding.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0

      - name: Audit USV XML corpus
        run: |
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          from collections import Counter, defaultdict
          import re

          BASE=Path('ProtocolXml/USV')
          NS='http://lignex1.com/mcmc2/umsSchema'
          ns={'u':NS}
          sem_schema=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bind_schema=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          vehicle_schema=etree.XMLSchema(etree.parse('ProtocolXml/XSD/VehicleSpecificationSchema.xsd'))

          xmls=sorted(BASE.rglob('*.xml'))
          xsds=sorted(BASE.rglob('*.xsd'))
          print('USV XML COUNT', len(xmls))
          print('USV LOCAL XSD COUNT', len(xsds))
          for p in xsds: print('LOCAL_XSD', p)

          valid=[]; invalid=[]
          roots=Counter()
          for p in xmls:
              try:
                  t=etree.parse(str(p)); r=t.getroot(); local=etree.QName(r).localname; roots[local]+=1
                  if local in ('SensorSpec','PlatformSpec','PayloadSpec','CommSpec'):
                      sem_schema.assertValid(t)
                  elif local in ('SensorBinding','PlatformBinding','PayloadBinding','CommBinding'):
                      bind_schema.assertValid(t)
                  elif local=='VehicleSpec':
                      vehicle_schema.assertValid(t)
                  else:
                      raise ValueError('unknown root '+local)
                  valid.append(str(p))
              except Exception as e:
                  invalid.append((str(p),str(e).split('\n')[0]))
          print('ROOT COUNTS', dict(roots))
          print('XSD VALID', len(valid), 'INVALID', len(invalid))
          for p,e in invalid: print('XSD_INVALID', p, '::', e)

          spec=etree.parse(str(BASE/'UsvSpecification.xml')).getroot()
          refs=[]
          for ref in spec.xpath('.//*[local-name()="SensorSpecRef" or local-name()="PayloadSpecRef" or local-name()="PlatformSpecRef" or local-name()="CommSpecRef"]'):
              sid=ref.get('id'); name=ref.get('name');
              sp=ref.xpath('./u:SemanticPath/text()',namespaces=ns); bp=ref.xpath('./u:BindingPath/text()',namespaces=ns)
              refs.append((sid,name,sp[0] if sp else None,bp[0] if bp else None))
          print('SPEC REF COUNT',len(refs))
          for sid,name,sp,bp in refs:
              direct_s=(BASE/sp).exists() if sp else False
              direct_b=(BASE/bp).exists() if bp else False
              matches_s=list(BASE.rglob(sp)) if sp else []
              matches_b=list(BASE.rglob(bp)) if bp else []
              print('SPEC_REF',sid,'|',name,'|',sp,'direct',direct_s,'recursive',len(matches_s),'|',bp,'direct',direct_b,'recursive',len(matches_b))

          # Pair inventory per component directory.
          dirs=sorted([p for p in BASE.iterdir() if p.is_dir()])
          print('COMPONENT DIR COUNT',len(dirs))
          for d in dirs:
              sem=list(d.glob('*Semantic.xml')); bind=list(d.glob('*Binding.xml'))
              print('COMPONENT',d.name,'SEM',len(sem),'BIND',len(bind))

          def parse(p): return etree.parse(str(p))
          # Broad legacy/declarative smell counts.
          total_converter=total_bo=total_missing_dt=0
          for p in xmls:
              txt=p.read_text(encoding='utf-8')
              conv=len(re.findall(r'\bconverter="',txt))
              bo=len(re.findall(r'\bbyteOrder="',txt))
              if 'Binding.xml' in p.name:
                  t=parse(p)
                  miss=[]
                  for tag in ('Field','FixedField','DerivedField'):
                      for e in t.xpath(f'.//u:{tag}',namespaces=ns):
                          if e.get('dataType') is None: miss.append((tag,e.get('name')))
                  total_missing_dt += len(miss)
                  if conv or bo or miss:
                      print('LEGACY',p,'converter',conv,'byteOrder',bo,'missingDataType',len(miss))
                      if miss: print('  MISSING_DT',miss[:30])
              total_converter+=conv; total_bo+=bo
          print('TOTAL converter attrs',total_converter)
          print('TOTAL byteOrder attrs',total_bo)
          print('TOTAL missing dataType in binding Field/Fixed/Derived',total_missing_dt)

          # Control/Reply and Monitor alignment per paired component.
          for d in dirs:
              sems=list(d.glob('*Semantic.xml')); binds=list(d.glob('*Binding.xml'))
              if len(sems)!=1 or len(binds)!=1: continue
              try:
                  S=parse(sems[0]); B=parse(binds[0])
              except Exception: continue
              scontrols={e.get('id'):e for e in S.xpath('.//u:ControlSpec',namespaces=ns)}
              bcontrols={e.get('semantic_id'):e for e in B.xpath('.//u:ControlBinding',namespaces=ns)}
              smon={e.get('id') for e in S.xpath('.//u:MonitorSpecs/*[@id]',namespaces=ns)}
              bmon={e.get('semantic_id') for e in B.xpath('.//u:Monitors/*[@semantic_id]',namespaces=ns)}
              missing_b=set(scontrols)-set(bcontrols); extra_b=set(bcontrols)-set(scontrols)
              reply_bindrefs={r.get('bindRef') for r in S.xpath('.//u:ControlSpec/u:Reply[@bindRef]',namespaces=ns)}
              reply_ids={r.get('semantic_id') for r in B.xpath('.//u:Reply[@semantic_id]',namespaces=ns)}
              unresolved=reply_bindrefs-reply_ids
              print('ALIGN',d.name,'SC',len(scontrols),'BC',len(bcontrols),'missingB',sorted(missing_b),'extraB',sorted(extra_b),'replyUnresolved',sorted(unresolved))

          # Comments and suspicious TODO/TBD/inference markers.
          markers=Counter()
          for p in xmls:
              txt=p.read_text(encoding='utf-8')
              for key in ('TBD','TODO','확인 필요','미확정','가정','추정','잠정','임시'):
                  n=txt.count(key)
                  if n: markers[key]+=n
          print('UNCERTAINTY MARKERS',dict(markers))
          PY
          git rm .github/workflows/audit-usv-semantic-binding.yml

      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-shot USV audit workflow'
          git push origin HEAD:feature/usv-semantic-binding-audit
