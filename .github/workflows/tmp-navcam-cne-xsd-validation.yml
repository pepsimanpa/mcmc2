name: temporary NavigationCamera CNE XSD validation

on:
  push:
    branches:
      - feature/usv-semantic-binding-audit

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Install validator
        run: python -m pip install --quiet lxml
      - name: Validate audited XML
        shell: bash
        run: |
          python - <<'PY'
          from lxml import etree
          cases = [
              ('ProtocolXml/USV/NavigationCamera/NavigationCameraSemantic.xml', 'ProtocolXml/XSD/CommonSpecSchema.xsd'),
              ('ProtocolXml/USV/NavigationCamera/NavigationCameraBinding.xml', 'ProtocolXml/XSD/CommonBindingSchema.xsd'),
              ('ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationSemantic.xml', 'ProtocolXml/XSD/CommonSpecSchema.xsd'),
              ('ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationBinding.xml', 'ProtocolXml/XSD/CommonBindingSchema.xsd'),
              ('ProtocolXml/USV/ElectroOptical/ElectroOpticalSemantic.xml', 'ProtocolXml/XSD/CommonSpecSchema.xsd'),
              ('ProtocolXml/USV/ElectroOptical/ElectroOpticalBinding.xml', 'ProtocolXml/XSD/CommonBindingSchema.xsd'),
          ]
          cache = {}
          failed = False
          for xml_path, xsd_path in cases:
              schema = cache.setdefault(xsd_path, etree.XMLSchema(etree.parse(xsd_path)))
              doc = etree.parse(xml_path)
              ok = schema.validate(doc)
              print(('PASS' if ok else 'FAIL'), xml_path)
              if not ok:
                  failed = True
                  for err in schema.error_log:
                      print(err)
          if failed:
              raise SystemExit(1)
          PY
