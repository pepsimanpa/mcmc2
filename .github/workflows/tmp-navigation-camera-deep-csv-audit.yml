name: temporary NavigationCamera deep CSV audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Apply NavigationCamera source-confirmed deep fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          sem=Path('ProtocolXml/USV/NavigationCamera/NavigationCameraSemantic.xml')
          bind=Path('ProtocolXml/USV/NavigationCamera/NavigationCameraBinding.xml')
          issues=Path('ProtocolXml/USV/NavigationCamera/NavigationCamera_OpenIssues.md')
          s=sem.read_text(encoding='utf-8')
          b=bind.read_text(encoding='utf-8')
          o=issues.read_text(encoding='utf-8')

          def rep(text, old, new, count, label):
              n=text.count(old)
              if n != count:
                  raise SystemExit(f'{label}: expected {count}, found {n}')
              return text.replace(old,new)

          # CSCI directly defines bit positions/targets for these 8 detail octets.
          # Polarity is not stated, so bit semantics remain Raw.
          details={
            'statusCCDDetail': ('Health.NavigationCamera.IBIT.OverallDetail', [
              ('powerBoardAvailability','PowerBoardAvailability.Raw',0),
              ('inputPowerStatus','InputPowerStatus.Raw',1),
              ('eoProcessingBoardPower','EOProcessingBoardPower.Raw',2),
              ('irProcessingBoardPower','IRProcessingBoardPower.Raw',3),
              ('eoCameraStatus','EOCameraStatus.Raw',4),
              ('irCameraStatus','IRCameraStatus.Raw',5)]),
            'statusPowerBoardDetail': ('Health.NavigationCamera.IBIT.PowerBoardDetail', [
              ('inputPowerStatus','InputPowerStatus.Raw',0)]),
            'statusEOMuxingBoardDetail': ('Health.NavigationCamera.IBIT.EOMuxBoardDetail', [
              ('eoMuxBoardStatus','BoardStatus.Raw',0),
              ('cameraCommunication','CameraCommunication.Raw',1)]),
            'statusIRMuxingBoardDetail': ('Health.NavigationCamera.IBIT.IRMuxBoardDetail', [
              ('irMuxBoardStatus','BoardStatus.Raw',0),
              ('cameraCommunication','CameraCommunication.Raw',1)]),
            'statusEOProcessingBoardDetail': ('Health.NavigationCamera.IBIT.EOProcessingBoardDetail', [
              ('eoProcessingBoardStatus','BoardStatus.Raw',0),
              ('muxCommunication','MuxCommunication.Raw',1)]),
            'statusIRProcessingBoardDetail': ('Health.NavigationCamera.IBIT.IRProcessingBoardDetail', [
              ('irProcessingBoardStatus','BoardStatus.Raw',0),
              ('muxCommunication','MuxCommunication.Raw',1)]),
            'statusEO1Detail': ('Health.NavigationCamera.IBIT.EO.Camera1.Detail', [
              ('availability','Availability.Raw',0),
              ('sensorStatus','SensorStatus.Raw',1),
              ('ispStatus','ISPStatus.Raw',2),
              ('communicationStatus','CommunicationStatus.Raw',3)]),
            'statusIR1Detail': ('Health.NavigationCamera.IBIT.IR.Camera1.Detail', [
              ('availability','Availability.Raw',0),
              ('sensorStatus','SensorStatus.Raw',1),
              ('boardTemperatureStatus','BoardTemperatureStatus.Raw',2),
              ('shutterStatus','ShutterStatus.Raw',3)])
          }

          for field,(base,members) in details.items():
              oldb=f'<Field name="{field}" cdm="{base}.Raw" dataType="UInt8"/>'
              bits=''.join(f'<BitMember name="{name}" cdm="{base}.{suffix}" offset="{off}"/>' for name,suffix,off in members)
              newb=f'<PackedField name="{field}" width="8" defaultValue="0">{bits}</PackedField>'
              b=rep(b,oldb,newb,1,'binding '+field)

              olds=f'<Result name="{field}" cdm="{base}.Raw"/>'
              results=''.join(f'<Result name="{name}" cdm="{base}.{suffix}"/>' for name,suffix,_ in members)
              news=f'<GroupResult name="{field}" cdm="{base}">{results}</GroupResult>'
              s=rep(s,olds,news,1,'semantic '+field)

          old_comment='  <!--IBIT 상세 octet은 비트 위치는 있으나 0/1 polarity 또는 카메라 2~8 상세 의미가 불완전하여 Raw 결과로 유지한다.-->'
          new_comment='  <!--IBIT 상세 중 CSCI가 bit 위치/점검 대상을 직접 정의한 8개 octet은 bit별 Raw Result/PackedField로 분해한다. 각 bit polarity와 카메라 2~8 상세 의미는 원문 미정의이므로 추정하지 않는다.-->'
          s=rep(s,old_comment,new_comment,1,'semantic top detail comment')
          oldbcomment='        <!--상세 octet은 원문 비트 polarity 또는 카메라 2~8 설명이 불완전하여 raw로 유지한다.-->'
          newbcomment='        <!--CSCI에 bit 위치/점검 대상이 직접 정의된 8개 detail octet은 PackedField로 분해한다. 0/1 polarity 및 카메라 2~8 detail 의미는 미정의이므로 해당 부분은 Raw/TBD로 유지한다.-->'
          b=rep(b,oldbcomment,newbcomment,1,'binding detail comment')

          # Refresh OpenIssues: substatus mapping is source-confirmed by identical fields in IBIT.
          anchor='- 원문 근거가 있는 primitive 필드에 wire `dataType`을 반영하였다.\n'
          add='- 운항용카메라 CSCI 재심층 감사에서 PBIT/CBIT 하위 상태 필드와 동일 이름의 IBIT 필드가 `0=정상, 1=기능저하, 2=비가용, 3=미응답(기능저하 미사용)`을 직접 정의함을 교차확인하여 기존 0/2/3 매핑의 근거를 확정하였다.\n- CSCI가 bit 위치/점검 대상을 직접 정의한 IBIT detail 8개 octet(`statusCCDDetail`, 전원보드/MUX/영상처리보드 5개, EO1, IR1)을 `PackedField/BitMember` + Semantic bit별 Raw `GroupResult`로 분해하였다.\n'
          if add not in o:
              o=rep(o,anchor,anchor+add,1,'OpenIssue audit anchor')

          pat=r'## 3\. Remaining TBD\n.*?\n## 4\. 현재 상태'
          newsec='''## 3. Remaining TBD / Resolved — 미해결 6개\n\n1. **원격 전시 RTP IP/Port**\n   - CSCI에 송수신 IP/Port가 `todo`로 남아 있다.\n   - 현재 `RTPChannel`은 스트림 존재만 표현한다.\n\n2. **객체탐지 sequence 최대 길이**\n   - `imageObjectDetectionCnt`는 0~255이지만 `sequence<ImageObjectDetection2DType>` 자체의 명시적 최대 길이는 원문에 없다.\n   - 현재 Collection 최대 255는 count 필드 범위에 맞춘 정합성 가정이므로, 실제 IDL sequence bound 확인 전에는 source-confirmed 최대 길이로 간주하지 않는다.\n\n3. **[RESOLVED] PBIT/CBIT 하위 상태 code 적용 근거**\n   - PBIT/CBIT에서는 `statusCCD`만 `0=정상, 2=비가용, 3=미응답`이 직접 적혀 있고 나머지 하위 상태 행의 비고는 비어 있다.\n   - 그러나 동일 CSCI의 IBIT에서 동일한 `statusPowerBoard`, `statusEOMuxingBoard`, `statusIRMuxingBoard`, `statusEOProcessingBoard`, `statusIRProcessingBoard`, `statusEO`, `statusIR` 필드 각각에 `0=정상, 1=기능저하, 2=비가용, 3=미응답(기능저하 미사용)`이 직접 정의되어 있다.\n   - 동일 장치/동일 필드명 교차검증에 따라 현재 PBIT/CBIT Semantic/Binding의 `0/2/3` 매핑을 source-confirmed로 확정한다.\n\n4. **IBIT 상세 octet polarity — 부분 해결**\n   - CSCI가 bit 위치와 점검 대상을 직접 명시한 8개 detail octet은 Binding `PackedField/BitMember`와 Semantic bit별 Raw `GroupResult`로 분해하였다.\n   - 다만 각 bit의 `0/1` 중 어느 값이 정상/이상인지 직접 정의되지 않아 Boolean/ValueMap 의미는 부여하지 않는다.\n\n5. **카메라 2~8 상세 비트 설명**\n   - EO1/IR1은 Bit0~3의 점검 대상이 직접 정의되어 이번에 분해하였다.\n   - EO2~8/IR2~8은 Range `0~3(bit)`만 있고 개별 bit 설명이 비어 있으므로 EO1/IR1 구조를 복제하지 않고 UInt8 Raw로 유지한다.\n\n6. **PBIT/IBIT Result correlation**\n   - 요청에는 commandID가 있으나 전용 CCDPBIT/CCDIBIT 결과에는 commandID가 없다.\n   - CommandStatus ACK 이후 전용 결과와 요청을 연결하는 런타임 규칙은 Adapter/IDL 확인이 필요하다.\n\n7. **relativeAngle의 -PI~+PI 표기**\n   - 공용 구조체의 정확한 범위가 기호 `-PI~+PI`로 정의되어 있으나 Semantic XSD Range는 decimal만 허용한다.\n   - 근사 소수값을 계약값으로 만들지 않기 위해 Unit만 유지하고 Range는 주석으로 보존한다.\n\n## 4. 현재 상태'''
          o2,n=re.subn(pat,newsec,o,flags=re.S)
          if n!=1: raise SystemExit(f'OpenIssue section replace count {n}')
          o=o2.replace('- 원통 직접 연동 범위의 Semantic/Binding 정리는 완료하였다.','- 원통 직접 연동 범위의 Semantic/Binding 정리와 운항용카메라 CSCI 재심층 감사까지 완료하였다.')
          o=o.replace('- 남은 7건은 사용자 정책 선택사항이 아니라 추가 IDL/Adapter/원문 확인이 필요한 비차단 TBD이다.','- 미해결 6건은 사용자 정책 선택사항이 아니라 추가 IDL/Adapter/원문 확인이 필요한 비차단 TBD이다.')

          sem.write_text(s,encoding='utf-8')
          bind.write_text(b,encoding='utf-8')
          issues.write_text(o,encoding='utf-8')

      - name: Validate NavigationCamera and all USV XML
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=list(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          s=Path('ProtocolXml/USV/NavigationCamera/NavigationCameraSemantic.xml').read_text(encoding='utf-8')
          b=Path('ProtocolXml/USV/NavigationCamera/NavigationCameraBinding.xml').read_text(encoding='utf-8')
          detail_fields=['statusCCDDetail','statusPowerBoardDetail','statusEOMuxingBoardDetail','statusIRMuxingBoardDetail','statusEOProcessingBoardDetail','statusIRProcessingBoardDetail','statusEO1Detail','statusIR1Detail']
          for f in detail_fields:
              assert b.count(f'<PackedField name="{f}"') == 1, f
              assert s.count(f'<GroupResult name="{f}"') == 1, f
          for f in ['statusEO2Detail','statusEO8Detail','statusIR2Detail','statusIR8Detail']:
              assert b.count(f'<Field name="{f}"') == 1, f
          assert 'converter=' not in b
          print(f'USV Semantic {len(sems)} PASS / Binding {len(binds)} PASS')
          print('NAVIGATION CAMERA DEEP CSV ASSERTIONS PASS')
          PY
      - name: Commit NavigationCamera deep audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/NavigationCamera/NavigationCameraSemantic.xml ProtocolXml/USV/NavigationCamera/NavigationCameraBinding.xml ProtocolXml/USV/NavigationCamera/NavigationCamera_OpenIssues.md
          git commit -m 'Deep-audit NavigationCamera BIT mappings from CSCI'
          git push origin HEAD:feature/usv-semantic-binding-audit
