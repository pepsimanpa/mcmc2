name: temporary link XML design view
on:
  push:
    branches: [feature/xml-design-understanding]
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xml-design-understanding
      - name: Add design entry link
        shell: python
        run: |
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          marker='    <div class="source-actions">\n'
          link='    <a class="button ghost" href="design.html">XML 설계 보기</a>\n'
          if 'href="design.html"' not in s:
              if marker not in s:
                  raise SystemExit('source-actions marker not found')
              s=s.replace(marker, link+marker, 1)
              p.write_text(s,encoding='utf-8')
      - name: Validate design files
        run: |
          node --check web/design.js
          grep -q 'href="design.html"' web/index.html
          grep -q '장비 하나를 고르면' web/design.html
          grep -q '논리 의미 · Semantic' web/design.html
          grep -q '물리 구현 · Binding' web/design.html
      - name: Commit entry link
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/index.html
          git commit -m 'Link XML design understanding view'
          git push origin HEAD:feature/xml-design-understanding
