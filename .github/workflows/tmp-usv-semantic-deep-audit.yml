name: temporary deep audit USV semantic consistency
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - run: python -m pip install --quiet lxml
      - run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import collections,re
          U='http://lignex1.com/mcmc2/umsSchema'; N={'u':U}
          devs=['AutonomousNavigation','CentralControl','ElectroOptical','ElectroOpticalProcessor','IntegratedNavigation','Lidar','NavigationCamera','NavigationRadar','NearContactDetection','NetworkAbstraction','PlatformController','RemoteFireControl','SensorFusion','SideScanSonar']
          docs={}
          for d in devs:
              p=Path('ProtocolXml/USV')/d
              docs[d]=(etree.parse(str(p/f'{d}Semantic.xml')), etree.parse(str(p/f'{d}Binding.xml')))

          print('=== GENERIC HEALTH VALUE CDM COUNTS ===')
          cand=['Health.Normal','Health.Degraded','Health.Unavailable','Health.NoResponse','Health.Status.Normal','Health.Status.Degraded','Health.Status.Unavailable','Health.Status.NoResponse','OperationalState.Normal','OperationalState.Degraded','OperationalState.Unavailable','OperationalState.NoResponse']
          for c in cand:
              hits=[]
              for d,(s,b) in docs.items():
                  n=len(s.xpath(f'//u:Value[@cdm="{c}"]',namespaces=N))+len(b.xpath(f'//u:Map[@cdm="{c}"]',namespaces=N))
                  if n: hits.append((d,n))
              print(c,sum(n for _,n in hits),hits)

          print('\n=== SAME SEMANTIC ID -> CDM VARIANTS ===')
          idx=collections.defaultdict(lambda:collections.defaultdict(list))
          for d,(s,b) in docs.items():
              for x in s.xpath('//u:MonitorSpecs/*[@id]|//u:ControlSpecs/*[@id]',namespaces=N):
                  if x.get('cdm'): idx[x.get('id')][x.get('cdm')].append(d)
          for i,v in sorted(idx.items()):
              if len(v)>1 and sum(map(len,v.values()))>1: print(i,dict(v))

          print('\n=== VALUE MAP SEMANTIC COVERAGE ===')
          mismatches=[]; nosem=[]; nomap=[]
          for d,(s,b) in docs.items():
              sem=collections.defaultdict(list)
              for p in s.xpath('//u:ValueSetSpec|//u:ValueSetProfile|//u:ValueSetResult|//u:HealthStatusSetSpec',namespaces=N):
                  c=p.get('cdm'); vals={v.get('cdm') for v in p.xpath('./u:Values/u:Value',namespaces=N) if v.get('cdm')}
                  if c and vals: sem[c].append(vals)
              bind_nodes=collections.defaultdict(list)
              for x in b.xpath('//u:Field[@cdm]|//u:DerivedField[@cdm]|//u:BitMember[@cdm]',namespaces=N): bind_nodes[x.get('cdm')].append(x)
              for c,nodes in bind_nodes.items():
                  if c not in sem: continue
                  for x in nodes:
                      vm=x.find(f'{{{U}}}ValueMap')
                      if vm is None:
                          # Boolean SourceValueMap and non-enum direct fields can legitimately omit ValueMap; report only if semantic is explicit ValueSet.
                          sm=x.find(f'{{{U}}}SourceValueMap')
                          if sm is None: nomap.append((d,c,etree.QName(x).localname,x.get('name'),[sorted(v) for v in sem[c]]))
                          continue
                      maps={m.get('cdm') for m in vm.findall(f'{{{U}}}Map') if m.get('cdm')}
                      if not any(maps==vals for vals in sem[c]): mismatches.append((d,c,x.get('name'),sorted(maps),[sorted(v) for v in sem[c]]))
              for x in b.xpath('//u:Field[u:ValueMap]|//u:DerivedField[u:ValueMap]|//u:BitMember[u:ValueMap]',namespaces=N):
                  c=x.get('cdm')
                  if c and c not in sem: nosem.append((d,c,x.get('name'),[m.get('cdm') for m in x.xpath('./u:ValueMap/u:Map',namespaces=N)]))
          print('MISMATCH',len(mismatches)); [print('VM_MISMATCH',x) for x in mismatches]
          print('SEM_VALUESET_BINDING_NO_MAP',len(nomap)); [print('NO_MAP',x) for x in nomap]
          print('BINDING_MAP_NO_SEM_VALUESET',len(nosem)); [print('NO_SEM',x) for x in nosem]

          print('\n=== COMMON CONTROL FINAL MATRIX ===')
          for d,(s,b) in docs.items():
              rows=[]
              for c in s.xpath('//u:ControlSpec',namespaces=N):
                  cid=c.get('id',''); low=cid.lower()
                  if cid=='startIntegration' or cid=='restartSystem' or cid in ('startControlStationIntegration','startUsvIntegration') or (low.startswith('request') and ('pbit' in low or 'ibit' in low)):
                      target=c.find(f'{{{U}}}Target')
                      cb=b.xpath(f'//u:ControlBinding[@semantic_id="{cid}"]',namespaces=N)
                      dest=[]; topic=None; typ=None
                      if cb:
                          ch=cb[0].find(f'{{{U}}}DDSChannel'); topic=ch.get('topicName'); typ=ch.get('typeName')
                          for x in cb[0]:
                              if isinstance(x.tag,str) and etree.QName(x).localname in ('Field','FixedField','DerivedField') and 'destination' in x.get('name','').lower(): dest.append((etree.QName(x).localname,x.get('sourceField'),x.get('value')))
                      rows.append((cid,c.get('cdm'),target.get('cdm') if target is not None else None,topic,typ,dest))
              print(d,rows)

          print('\n=== COMMON RESULT REPLY CDMS ===')
          for d,(s,b) in docs.items():
              vals=[]
              for c in s.xpath('//u:ControlSpec',namespaces=N):
                  low=c.get('id','').lower()
                  if low.startswith('request') and ('pbit' in low or 'ibit' in low):
                      vals.append((c.get('id'),[(r.get('bindRef'),r.get('cdm'),r.get('required')) for r in c.xpath('./u:Reply',namespaces=N)]))
              print(d,vals)

          print('\n=== MISSING WIRE DATATYPE ===')
          for d,(s,b) in docs.items():
              miss=[]
              for x in b.xpath('//u:Field|//u:DerivedField|//u:FixedField',namespaces=N):
                  nm=x.get('name','')
                  if nm in ('usvHeader','destination') or nm.endswith('.usvHeader') or nm.endswith('.destination'): continue
                  if x.get('dataType') is None: miss.append((etree.QName(x).localname,nm,x.get('cdm')))
              print(d,len(miss),miss[:30])

          print('\n=== OPEN ISSUE THEMES ===')
          pats={
              'PBIT_IBIT_CORRELATION':r'PBIT/IBIT.*correlation|PBIT/IBIT Result correlation|PBIT/IBIT.*매칭|요청.*결과.*연결',
              'BOOLEAN_WIRE_TYPE':r'DDS boolean|Boolean wire|WireDataType.*Boolean|boolean.*WireDataType',
              'SOURCE_ROUTING':r'source routing|source-card|송신 카드|송신.*식별|fan-out',
              'COUNT_SEQUENCE':r'count.*sequence|sequence.*length|개수.*sequence|sequence.*개수',
              'TIME_ENCODING':r'time.*encoding|시간.*인코딩|epoch|UInt64 시간',
          }
          issues=[]
          for d in devs:
              p=Path('ProtocolXml/USV')/d/f'{d}_OpenIssues.md'
              if not p.exists(): continue
              text=p.read_text()
              for line in text.splitlines():
                  if re.match(r'^\s*\d+\.\s+\*\*',line): issues.append((d,line.strip()))
          print('TOTAL ISSUE HEADINGS',len(issues))
          for k,p in pats.items():
              hits=[x for x in issues if re.search(p,x[1],re.I)]
              print(k,len(hits),hits)

          print('\n=== TARGET PRESENCE ON STANDARD COMMON CONTROLS ===')
          for cid in ('startIntegration','restartSystem','requestPbit','requestIbit'):
              present=[]; absent=[]
              for d,(s,b) in docs.items():
                  x=s.xpath(f'//u:ControlSpec[@id="{cid}"]',namespaces=N)
                  if not x: continue
                  (present if x[0].find(f'{{{U}}}Target') is not None else absent).append(d)
              print(cid,'present',present,'absent',absent)
          PY