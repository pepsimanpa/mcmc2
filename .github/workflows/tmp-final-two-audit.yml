name: temporary final two USV audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - run: python -m pip install --quiet lxml
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re
          NS={'u':'http://lignex1.com/mcmc2/umsSchema'}
          devices=['NearContactDetection','AutonomousNavigation']
          for dev in devices:
            s=Path(f'ProtocolXml/USV/{dev}/{dev}Semantic.xml')
            b=Path(f'ProtocolXml/USV/{dev}/{dev}Binding.xml')
            st=s.read_text(); bt=b.read_text()
            sr=etree.parse(str(s)); br=etree.parse(str(b))
            ctr=sr.xpath('//u:ControlSpec',namespaces=NS)
            cb=br.xpath('//u:ControlBinding',namespaces=NS)
            sem_replies=sr.xpath('//u:ControlSpec/u:Reply',namespaces=NS)
            bind_replies=br.xpath('//u:ControlBinding/u:Reply',namespaces=NS)
            mons=sr.xpath('//u:MonitorSpecs/*',namespaces=NS)
            mb=br.xpath('//u:MonitorBinding',namespaces=NS)
            products=sr.xpath('//u:ProductStreamSpec',namespaces=NS)
            pb=br.xpath('//u:ProductBinding',namespaces=NS)
            raw=[]
            for v in sr.xpath('//u:Value',namespaces=NS):
              if v.text and re.fullmatch(r'\s*[-+]?\d+(?:\.\d+)?\s*',v.text): raw.append(v.text.strip())
            missing=[]
            for el in br.xpath('//u:Field|//u:FixedField|//u:DerivedField',namespaces=NS):
              name=el.get('name','')
              if name in ('usvHeader','destination') or name.endswith('.usvHeader'): continue
              if el.get('dataType') is None:
                missing.append((el.tag.split('}')[-1],name))
            print(f'=== {dev} ===')
            print('controls',len(ctr),len(cb),'replies',len(sem_replies),len(bind_replies),'monitors',len(mons),len(mb),'products',len(products),len(pb))
            print('converter',bt.count('converter='),'raw_semantic_enum',len(raw),'missing_dataType',len(missing),'comments',st.count('<!--')+bt.count('<!--'))
            print('missing first 80:',missing[:80])
            # ID sets
            print('control diff',set(x.get('id') for x in ctr)-set(x.get('semantic_id') for x in cb),set(x.get('semantic_id') for x in cb)-set(x.get('id') for x in ctr))
            print('reply diff',set(x.get('bindRef') for x in sem_replies)-set(x.get('semantic_id') for x in bind_replies),set(x.get('semantic_id') for x in bind_replies)-set(x.get('bindRef') for x in sem_replies))
          PY
