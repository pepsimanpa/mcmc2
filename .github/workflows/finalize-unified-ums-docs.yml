    paths: ['.github/workflows/finalize-unified-ums-docs.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0

      - name: Merge AUV decisions into unified rules and clean temporary files
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('ProtocolXml/Docs/UMS_Semantic_Binding_Design_Rules_20260826.md')
          s=p.read_text(encoding='utf-8')

          marker='## 16. 현재 남은 주요 TBD / 후속작업\n'
          if marker not in s:
              raise SystemExit('section 16 marker not found')

          auv='''## 16. AUV 확정 적용 사례 / 장치 고유 결정사항

이 절은 과거 `ProtocolXml/AUV/AuvDesignDecisions_20260818.md`의 AUV 고유 결정사항을 본 통합 문서로 흡수한 것이다. 공통 Semantic / Binding 규칙은 본 문서 앞 절을 따르며, 아래에는 AUV RF ICD 때문에 필요한 장치 고유 의미와 예외만 기록한다.

### 16.1 `startMission` INFORMATION 사용

- `MISSION_TRANS`는 실제 임무계획 전송이므로 INFORMATION2를 사용한다.
- `MISSION_START`는 이미 전송된 임무를 시작하는 기능이므로 INFORMATION3를 사용한다.
- 원문 설명상 INFORMATION1/2는 초기 RF 설정, 암호키 설정 또는 임무계획 전송 등에 사용하며, 일반적인 명령은 주로 INFORMATION3를 사용한다.
- `startMission` Semantic에 별도 MissionPlan Parameter를 만들지 않는다.

### 16.2 File List와 Data Request 분리

`File_List_Req`와 `Data_Req`는 서로 다른 기능으로 취급한다.

`requestFileList`:
- 현재 저장된 주행/센서 데이터의 File List를 요청한다.
- DATA_TYPE을 사용자 입력 Parameter로 요구하지 않는다.
- Reply는 AUV / SSS / OC / AC / FLS 파일 개수 정보를 반환한다.

`requestData`:
- DATA TYPE과 File_First / File_Final을 이용하여 실제 데이터 전송 범위를 지정한다.
- DATA TYPE은 독립 bit 선택으로 해석하며, 원문 근거 없이 정확히 하나만 선택하도록 제한하지 않는다.
- Semantic 입력은 `RecordedData.Selection.*` 및 `RecordedData.FileRange.*` 의미를 사용한다.

### 16.3 RF-3 물리 구조

RF-3는 다음 물리 구조를 사용한다.

- COUNT: 4 bytes
- ACK: 4 bytes
- Length: 2 bytes
- INFORMATION DATA: `Length` bytes
- 총 길이: `10 + Length`
- checksum 없음
- stop 없음

RF-3의 ACK 영역은 일반 Control Reply의 단순 성공/실패 ACK가 아니라 DATA TYPE 및 Start/End frame flag 영역이다.

확정 bit:
- bit11: AUV_DATA
- bit12: SSS_DATA
- bit13: OC_DATA
- bit14: AC_DATA
- bit15: FLS_DATA
- bit16: Start
- bit17: End

### 16.4 `requestData`와 SensorProduct

- `requestData`는 RF-1 데이터 전송 요청 Control이다.
- 실제 RF-3 파일 데이터는 Control Reply에 포함하지 않고 SensorProduct / ProductBinding으로 표현한다.
- `requestData` Semantic에 일반 RF-2/RF-3 Reply를 임의 추가하지 않는다.

### 16.5 `MissionPlan.OperationMode`

물리 코드 영역은 `1~8`이다.

현재 직접 의미가 확인된 값:
- `1 = 광역탐색모드`
- `2 = 정밀탐색모드`
- `3~8 = TBD`

따라서 Semantic/HMI에는 현재 의미가 확정된 1~2만 운용 선택값으로 노출한다. 3~8을 의미가 확인되지 않은 상태에서 유효 운용 입력으로 확정하지 않는다.

### 16.6 AUV 상태 bit 의미

AUV 주요 상태 bit의 논리 의미는 다음과 같다.

- `AUV_CHECK_RESULT` 계열: `0=PASS`, `1=FAIL`
- EOR: `0=미발생`, `1=발생`
- MODE: `0=비활성`, `1=활성`
- STAT_CODE bit0~4: `0=정상`, `1=비정상`
- STAT_CODE bit5/6: DATA_LOCK / SYNC_LOCK flag

Semantic에는 위 논리 상태를 표현하고, 실제 bit 위치와 raw 값은 Binding `PackedField / BitMember / ValueMap`에서 표현한다.

### 16.7 RF_CONF_MODE / RF_CONF_PWR

RF 설정 byte는 하나의 converter에 숨기지 않고 `PackedField / BitMember`로 표현한다.

RF_CONF_MODE:
- bit0: 1:1
- bit1: 1:2
- bit2: Time Slot 2
- bit3: Time Slot 4
- bit4~5: UHF Channel
- bit6~7: L-Band Channel

Semantic 선택 의미:
- 운용모드: 1:1 / 1:2
- Time Slot: 2 / 4
- UHF Channel: 1 / 2 / 3
- L-Band Channel: 1 / 2 / 3

RF_CONF_PWR:
- UHF Power: OFF / LOW / HIGH
- L-Band Power: OFF / LOW / HIGH

물리 bit 구조와 one-hot 관계는 Binding에서 명시하며, Semantic에는 raw bit 값을 노출하지 않는다.

### 16.8 AUV RF COMMAND bit

확정된 COMMAND bit:
- bit0: AUV_CHECK_Req
- bit1: MISSION_TRANS
- bit2: RC_MODE
- bit3: Status_Chk
- bit4: MISSION_START
- bit5: EMER_RETURN
- bit6: File_List_Req
- bit7: Data_Req
- bit8: MISSION_STOP
- bit9: Record_Del
- bit10: MTE_MODE
- bit15: FLASH
- bit16: PLC_Req
- bit24: RF_STATUS
- bit25: RF_CONFIG
- bit26: RF_CH_SCAN
- bit27: RF_GAIN
- bit28: KEY_CMD
- bit30: RF_SEND
- bit31: RF_EXEC

### 16.9 AUV_CHECK_RESULT_L bit

- bit0: reserved
- bit1: MSS_TEST
- bit2: CCS_TEST
- bit3: NS_TEST
- bit4: BS_TEST
- bit5: PRS_TEST
- bit6: MCS_TEST
- bit7: reserved

Reserved bit는 Semantic Result를 만들지 않는다.

### 16.10 EOR bit

- bit0: LEAK
- bit1: ROLL
- bit2: PITCH
- bit3: VEL
- bit4: COM
- bit5: PCD
- bit6: GPS
- bit7: RF/UCD
- bit8: Ceiling Depth
- bit9: BT_SOC
- bit10: BT_TEMP
- bit11: BT_CO
- bit12: BT_V
- bit13: MC
- bit14: DIS
- bit15: EOM

### 16.11 MODE bit

- bit0: PLC
- bit1: MS
- bit2: RC
- bit3: ALIGN
- bit4: MS_ST
- bit5: EMER
- bit6: FILE
- bit7: DATA
- bit8: MS_STOP
- bit9: REC_DEL
- bit10: RF_CONF
- bit11: EOR
- bit12~15: reserved

### 16.12 RF-2 ACK / RF_CMD_COMPLETE / INFORMATION Body

역할은 분리해서 해석한다.

- ACK: 어떤 원 명령에 대한 응답인지 식별
- RF_CMD_COMPLETE: RF통신장치 측 명령 처리 완료 확인
- INFORMATION Body: 해당 명령에서 정의된 실제 결과/상태

`RF_CMD_COMPLETE=1`은 AUV 본체의 실제 임무/동작 성공 또는 완료를 의미하지 않는다.

ACK + RF_CMD_COMPLETE + INFORMATION Body가 항상 동일 RF-2 Telegram에서 동시에 유효한지는 직접 근거가 없어 TBD로 유지한다.

### 16.13 AUV 적용 시 남아 있는 설계 확인사항

다음은 구현 작업이 아니라 Semantic / Binding 설계 범위에서 추가 근거가 필요하거나 전체 UMS 관점 확인이 필요한 항목이다.

- AUV 고유 CDM 후보의 전체 시스템 재사용 가능성 확인
- RF-2 ACK / RF_CMD_COMPLETE / INFORMATION Body 동시 유효성에 대한 추가 원문 확인
- 현재 AUV Binding의 legacy converter 표현을 공통 선언형 Binding 규칙으로 단계적으로 마이그레이션할지 검토

---

'''

          s=s.replace(marker, auv+'## 17. 현재 남은 주요 TBD / 후속작업\n',1)

          # Remove AUV-specific items from the global TODO if they are now captured above only when exact old phrasing exists.
          s=s.replace('- AUV / USV를 동일 선언형 Binding 규칙으로 마이그레이션할지 단계별 검토\n',
                      '- AUV / USV의 legacy Binding을 동일 선언형 규칙으로 단계적으로 마이그레이션할지 검토\n')

          p.write_text(s,encoding='utf-8',newline='')
          PY

          git rm ProtocolXml/AUV/AuvDesignDecisions_20260818.md
          git rm .github/workflows/scan-mdv-emdw-converters.yml
          git rm .github/workflows/finalize-unified-ums-docs.yml
          git diff --check

          # Verify only the unified design rule document remains as project design markdown under ProtocolXml.
          echo '--- markdown files under ProtocolXml ---'
          find ProtocolXml -name '*.md' -type f -print | sort
          echo '--- workflows ---'
          find .github/workflows -maxdepth 1 -type f -print 2>/dev/null | sort || true

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify AUV decisions into common UMS design rules'
          git push origin HEAD:feature/auv-reply-bit-binding
