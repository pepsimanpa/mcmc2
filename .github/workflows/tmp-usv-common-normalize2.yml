name: temporary apply integrated USV common normalization

on:
  push:
    branches: [feature/usv-semantic-binding-audit]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - run: python -m pip install --quiet lxml
      - name: Normalize and validate
        shell: bash
        run: |
          cat > /tmp/normalize.py <<'PY'
          from pathlib import Path
          from lxml import etree
          import re, subprocess

          URI='http://lignex1.com/mcmc2/umsSchema'; NS={'u':URI}
          devices=['AutonomousNavigation','CentralControl','ElectroOptical','ElectroOpticalProcessor','IntegratedNavigation','Lidar','NavigationCamera','NavigationRadar','NearContactDetection','NetworkAbstraction','PlatformController','RemoteFireControl','SensorFusion','SideScanSonar']
          pre='f17bc88321df55c13e3c46822ea2bfceae2ce8be'

          def set_attr(text, tag, keyattr, keyval, attr, value):
              pat=re.compile(rf'<{tag}\b(?=[^>]*\b{re.escape(keyattr)}=(?P<q>["\']){re.escape(keyval)}(?P=q))[^>]*>',re.S)
              m=pat.search(text)
              if not m: raise RuntimeError(f'cannot find {tag} {keyattr}={keyval}')
              old=m.group(0)
              ap=re.compile(rf'\b{re.escape(attr)}=["\'][^"\']*["\']')
              if ap.search(old): new=ap.sub(f'{attr}="{value}"',old,count=1)
              elif old.endswith('/>'): new=old[:-2]+f' {attr}="{value}"/>'
              else: new=old[:-1]+f' {attr}="{value}">'
              return text[:m.start()]+new+text[m.end():]

          def ensure_status_result(text,rid):
              p=re.compile(rf'<Reply\b(?=[^>]*\bbindRef=(["\']){re.escape(rid)}\1)[^>]*>',re.S); m=p.search(text)
              if not m: raise RuntimeError(f'missing semantic reply {rid}')
              tag=m.group(0); indent=text[text.rfind('\n',0,m.start())+1:m.start()]
              if tag.endswith('/>'):
                  return text[:m.start()]+tag[:-2]+'>'+f'\n{indent}  <Results><Result name="commandStatusReport.status" cdm="Control.Response.Status"/></Results>\n{indent}</Reply>'+text[m.end():]
              end=text.find('</Reply>',m.end()); block=text[m.start():end+8]
              if end<0: raise RuntimeError(f'unclosed reply {rid}')
              if 'cdm="Control.Response.Status"' in block or "cdm='Control.Response.Status'" in block: return text
              return text[:end]+f'\n{indent}  <Results><Result name="commandStatusReport.status" cdm="Control.Response.Status"/></Results>'+text[end:]

          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')); bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          changed=[]
          for dev in devices:
              d=Path('ProtocolXml/USV')/dev; sp=d/f'{dev}Semantic.xml'; bp=d/f'{dev}Binding.xml'
              sr=etree.parse(str(sp)); br=etree.parse(str(bp)); st=sp.read_text(); bt=bp.read_text(); os,ob=st,bt
              # common physical controls are ControlSpec entries; SetPoint/Trigger/etc are unaffected.
              common={c.get('id'):c for c in sr.xpath('//u:ControlSpec',namespaces=NS)}
              integration=[cid for cid in common if cid=='startIntegration' or cid in ('startControlStationIntegration','startUsvIntegration')]
              restart=[cid for cid in common if cid=='restartSystem']
              pbits=[cid for cid in common if cid.lower().startswith('request') and 'pbit' in cid.lower()]
              ibits=[cid for cid in common if cid.lower().startswith('request') and 'ibit' in cid.lower()]
              for cid in integration: st=set_attr(st,'ControlSpec','id',cid,'cdm','Control.Integration.Start')
              for cid in restart: st=set_attr(st,'ControlSpec','id',cid,'cdm','Control.System.Restart')
              for cid in pbits: st=set_attr(st,'ControlSpec','id',cid,'cdm','Request.Health.PBIT')
              for cid in ibits: st=set_attr(st,'ControlSpec','id',cid,'cdm','Request.Health.IBIT')

              ack=[]
              for r in br.xpath('//u:ControlBinding/u:Reply',namespaces=NS):
                  ch=r.find(f'{{{URI}}}DDSChannel')
                  if ch is not None and ch.get('typeName')=='CommandStatusReportType': ack.append(r.get('semantic_id'))
              sem_required={r.get('bindRef'):(r.get('required')=='true') for r in sr.xpath('//u:ControlSpecs/*/u:Reply',namespaces=NS)}
              p_results=[]; i_results=[]
              for cid,c in common.items():
                  for r in c.xpath('./u:Reply',namespaces=NS):
                      rid=r.get('bindRef')
                      if cid in pbits and rid not in ack: p_results.append(rid)
                      if cid in ibits and rid not in ack: i_results.append(rid)
              for rid in ack:
                  if sr.xpath(f'//u:Reply[@bindRef="{rid}"]',namespaces=NS):
                      st=set_attr(st,'Reply','bindRef',rid,'cdm','Command.ProcessingStatus.Response')
                      st=set_attr(st,'Reply','bindRef',rid,'required','true')
                      st=ensure_status_result(st,rid)
              for rid in p_results: st=set_attr(st,'Reply','bindRef',rid,'cdm','Request.Health.PBIT.Response')
              for rid in i_results: st=set_attr(st,'Reply','bindRef',rid,'cdm','Request.Health.IBIT.Response')
              for rid,req in sem_required.items():
                  if req and br.xpath(f'//u:Reply[@semantic_id="{rid}"]',namespaces=NS): bt=set_attr(bt,'Reply','semantic_id',rid,'required','true')
              if dev=='SideScanSonar':
                  st=re.sub(r'<Value\s+cdm="PowerSupplyState\.Off">\s*0\s*</Value>','<Value name="Off" cdm="PowerSupplyState.Off"/>',st)
                  st=re.sub(r'<Value\s+cdm="PowerSupplyState\.On">\s*1\s*</Value>','<Value name="On" cdm="PowerSupplyState.On"/>',st)
              if st!=os: sp.write_text(st); changed.append(str(sp))
              if bt!=ob: bp.write_text(bt); changed.append(str(bp))

          failed=False
          for dev in devices:
              d=Path('ProtocolXml/USV')/dev; sp=d/f'{dev}Semantic.xml'; bp=d/f'{dev}Binding.xml'; sr=etree.parse(str(sp)); br=etree.parse(str(bp))
              if not sx.validate(sr): failed=True; print('SEM XSD FAIL',dev,*sx.error_log,sep='\n')
              if not bx.validate(br): failed=True; print('BIND XSD FAIL',dev,*bx.error_log,sep='\n')
              if bp.read_text().count('converter='): failed=True; print('CONVERTER',dev)
              bad=[]
              for parent in sr.xpath('//u:ValueSetSpec|//u:ValueSetProfile|//u:ValueSetResult|//u:HealthStatusSetSpec',namespaces=NS):
                  for v in parent.xpath('./u:Values/u:Value',namespaces=NS):
                      if v.text and re.fullmatch(r'\s*[-+]?\d+(?:\.\d+)?\s*',v.text): bad.append((parent.get('id') or parent.get('cdm'),v.text.strip()))
              if bad: failed=True; print('RAW ENUM',dev,bad)
              # all semantic control subtypes under ControlSpecs participate in binding cross-reference.
              cs={x.get('id') for x in sr.xpath('//u:ControlSpecs/*[@id]',namespaces=NS)}; cb={x.get('semantic_id') for x in br.xpath('//u:ControlBinding',namespaces=NS)}
              rs={x.get('bindRef') for x in sr.xpath('//u:ControlSpecs/*/u:Reply',namespaces=NS)}; rb={x.get('semantic_id') for x in br.xpath('//u:ControlBinding/u:Reply',namespaces=NS)}
              if cs!=cb: failed=True; print('CONTROL DIFF',dev,cs^cb)
              if rs!=rb: failed=True; print('REPLY DIFF',dev,rs^rb)
              ms={x.get('id') for x in sr.xpath('//u:MonitorSpecs/*[@id]',namespaces=NS)}; mb={x.get('semantic_id') for x in br.xpath('//u:MonitorBinding',namespaces=NS)}
              ps={x.get('id') for x in sr.xpath('//u:ProductStreamSpec',namespaces=NS)}; pb={x.get('semantic_id') for x in br.xpath('//u:ProductBinding',namespaces=NS)}
              if ms!=mb: failed=True; print('MONITOR DIFF',dev,ms^mb)
              if ps!=pb: failed=True; print('PRODUCT DIFF',dev,ps^pb)
              for r in br.xpath('//u:ControlBinding/u:Reply',namespaces=NS):
                  ch=r.find(f'{{{URI}}}DDSChannel')
                  if ch is not None and ch.get('typeName')=='CommandStatusReportType':
                      rid=r.get('semantic_id'); s=sr.xpath(f'//u:Reply[@bindRef="{rid}"]',namespaces=NS)
                      if len(s)!=1 or s[0].get('cdm')!='Command.ProcessingStatus.Response' or s[0].get('required')!='true' or r.get('required')!='true' or not s[0].xpath('./u:Results/*[@cdm="Control.Response.Status"]',namespaces=NS):
                          failed=True; print('ACK CONTRACT',dev,rid)
              for c in sr.xpath('//u:ControlSpec',namespaces=NS):
                  cid=c.get('id',''); low=cid.lower(); exp=None
                  if cid=='startIntegration' or cid in ('startControlStationIntegration','startUsvIntegration'): exp='Control.Integration.Start'
                  elif cid=='restartSystem': exp='Control.System.Restart'
                  elif low.startswith('request') and 'pbit' in low: exp='Request.Health.PBIT'
                  elif low.startswith('request') and 'ibit' in low: exp='Request.Health.IBIT'
                  if exp and c.get('cdm')!=exp: failed=True; print('COMMON CDM',dev,cid,c.get('cdm'))
              for pf in br.xpath('//u:PackedField',namespaces=NS):
                  width=int(pf.get('width')); used=set()
                  for bm in pf.xpath('./u:BitMember',namespaces=NS):
                      off=int(bm.get('offset')); bw=int(bm.get('width','1')); bits=set(range(off,off+bw))
                      if off+bw>width: failed=True; print('PACK OOR',dev,pf.get('name'),bm.get('name'))
                      if used&bits: failed=True; print('PACK OVERLAP',dev,pf.get('name'),bm.get('name'))
                      used|=bits
              print(dev,'C',len(cs),'R',len(rs),'M',len(ms),'P',len(ps))
          # Text-only editing must preserve pre-existing comments exactly; only comments added elsewhere are acceptable.
          for dev in devices:
              for suffix in ('Semantic.xml','Binding.xml'):
                  p=Path('ProtocolXml/USV')/dev/f'{dev}{suffix}'
                  try: old=subprocess.check_output(['git','show',f'{pre}:{p.as_posix()}']).decode()
                  except subprocess.CalledProcessError: continue
                  oldc=re.findall(r'<!--.*?-->',old,re.S); newc=re.findall(r'<!--.*?-->',p.read_text(),re.S)
                  missing=[x for x in oldc if x not in newc]
                  if missing: failed=True; print('COMMENT LOST',dev,suffix,len(missing))
          print('CHANGED',len(changed)); [print(x) for x in changed]
          if failed: raise SystemExit(1)
          PY
          python /tmp/normalize.py
          git diff --check
      - name: Commit normalized XML
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProtocolXml/USV
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize common USV semantic control contracts"
          git push origin HEAD:feature/usv-semantic-binding-audit
