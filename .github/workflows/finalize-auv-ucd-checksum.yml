# one-shot trigger
name: Finalize AUV UCD Checksum Binding

on:
  push:
    branches: [feature/auv-declarative-binding-cleanup]
    paths: ['.github/workflows/finalize-auv-ucd-checksum.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-declarative-binding-cleanup
          fetch-depth: 0

      - name: Remove UCD checksum converters and validate
        run: |
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re

          ucd = Path('ProtocolXml/AUV/AuvPlatformUcdBinding.xml')
          doc = Path('ProtocolXml/Docs/UMS_Semantic_Binding_Design_Rules_20260826.md')

          s = ucd.read_text(encoding='utf-8')
          before_comments = len(re.findall(r'<!--[\s\S]*?-->', s))

          tx_old = '<DerivedField name="checksum" sourceField="System.Frame.CommandThroughInformation" dataType="UInt16" converter="ByteSumModulo65536LE"/>'
          tx_new = '<DerivedField name="checksum" sourceField="System.Frame.Checksum" dataType="UInt16"/>'
          rx_old = '<DerivedField name="checksum" sourceField="System.Frame.AckThroughInformation" dataType="UInt16" converter="ByteSumModulo65536LE"/>'
          rx_new = '<Field name="checksum" dataType="UInt16"/>'

          if s.count(tx_old) != 3:
              raise SystemExit(f'unexpected UCD-1 checksum converter count: {s.count(tx_old)}')
          if s.count(rx_old) != 3:
              raise SystemExit(f'unexpected UCD-2 checksum converter count: {s.count(rx_old)}')

          s = s.replace(tx_old, tx_new)
          s = s.replace(rx_old, rx_new)

          old_header = '- checksum은 RF와 동일하게 범위 내 각 Byte 합을 65536으로 나눈 나머지를 UInt16LE로 저장한다.\n    - UCD-1은 COMMAND부터 INFORMATION 끝까지, UCD-2는 ACK부터 INFORMATION 끝까지 계산한다.'
          new_header = '- checksum 계산식은 RF와 동일하게 범위 내 각 Byte 합을 65536으로 나눈 나머지이며 UInt16 little-endian으로 저장한다.\n    - UCD-1은 COMMAND부터 INFORMATION 끝까지, UCD-2는 ACK부터 INFORMATION 끝까지를 계산 범위로 사용한다.\n    - checksum 생성과 수신 checksum 검증은 OM/실행 계층 책임이며 Binding은 계산/검증을 수행하지 않는다.\n    - UCD-1 Binding은 OM/실행 계층이 준비한 System.Frame.Checksum을 UInt16으로 기록하고, UCD-2 Binding은 수신된 checksum을 일반 UInt16 Field로 표현한다.'
          if old_header not in s:
              raise SystemExit('UCD checksum header comment marker not found')
          s = s.replace(old_header, new_header, 1)

          s = s.replace('<!-- UCD-1 bytes 14..15: COMMAND와 INFORMATION에 대한 CHECKSUM. -->',
                        '<!-- UCD-1 bytes 14..15: COMMAND와 INFORMATION에 대한 CHECKSUM. 값 생성은 OM/실행 계층 책임이다. -->')
          s = s.replace('<!-- UCD-1 bytes 14..15: CHECKSUM. -->',
                        '<!-- UCD-1 bytes 14..15: CHECKSUM. 값 생성은 OM/실행 계층 책임이다. -->')
          s = s.replace('<!-- UCD-2 bytes 14..15: ACK와 INFORMATION에 대한 CHECKSUM. -->',
                        '<!-- UCD-2 bytes 14..15: ACK와 INFORMATION에 대한 CHECKSUM. 수신값 검증은 OM/실행 계층 책임이다. -->')
          s = s.replace('<!-- UCD-2 bytes 14..15: CHECKSUM. -->',
                        '<!-- UCD-2 bytes 14..15: CHECKSUM. 수신값 검증은 OM/실행 계층 책임이다. -->')

          ucd.write_text(s, encoding='utf-8', newline='')
          after_comments = len(re.findall(r'<!--[\s\S]*?-->', s))
          if before_comments != after_comments:
              raise SystemExit(f'UCD comment count changed: {before_comments}->{after_comments}')

          d = doc.read_text(encoding='utf-8')
          old = '''- `ByteSumModulo65536LE` 제거
  - RF-1 checksum 계산식 자체는 ICD 규칙을 유지한다: COUNT부터 INFORMATION 마지막 byte까지 unsigned byte 합의 modulo 65536.
  - checksum 계산은 RF framing 단계 책임이며 Binding은 준비된 `System.Frame.Checksum`을 `UInt16`로 기록한다.
  - RF-2 수신 checksum은 이미 일반 wire `Field UInt16`으로 표현한다.'''
          new = '''- `ByteSumModulo65536LE` 제거
  - RF-1 checksum 계산식 자체는 ICD 규칙을 유지한다: COUNT부터 INFORMATION 마지막 byte까지 unsigned byte 합의 modulo 65536.
  - UCD checksum 계산식도 기존 ICD 규칙을 유지한다: UCD-1은 COMMAND부터 INFORMATION 끝까지, UCD-2는 ACK부터 INFORMATION 끝까지를 계산 범위로 사용한다.
  - 송신 checksum 생성과 수신 checksum 검증은 OM/실행 계층 책임이며 Binding은 계산/검증을 수행하지 않는다.
  - RF-1/UCD-1 Binding은 준비된 `System.Frame.Checksum`을 `UInt16`로 기록한다.
  - RF-2/UCD-2 수신 checksum은 일반 wire `Field UInt16`으로 표현한다.'''
          if old not in d:
              raise SystemExit('design doc checksum section marker not found')
          d = d.replace(old, new, 1)
          doc.write_text(d, encoding='utf-8', newline='')

          schema = etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          bindings = [
              'ProtocolXml/AUV/AuvPlatformRfBinding.xml',
              'ProtocolXml/AUV/AuvPlatformUcdBinding.xml',
              'ProtocolXml/AUV/AuvRfCommBinding.xml',
              'ProtocolXml/MDV/MdvTcpBinding.xml',
              'ProtocolXml/EMDW/EmdwTcpBinding.xml',
          ]
          for f in bindings:
              schema.assertValid(etree.parse(f))
              print('PASS XSD', f)

          auv_text = ''.join(p.read_text(encoding='utf-8') for p in Path('ProtocolXml/AUV').glob('*Binding.xml'))
          if 'converter=' in auv_text:
              names = re.findall(r'converter="([^"]+)"', auv_text)
              raise SystemExit(f'AUV converters remain: {names}')
          print('AUV converter count: 0')
          print('UCD comments preserved:', before_comments)
          PY

          git diff --check
          git rm .github/workflows/finalize-auv-ucd-checksum.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize AUV UCD checksum binding responsibility'
          git push origin HEAD:feature/auv-declarative-binding-cleanup
