name: temporary XML design entry wiring
on:
  push:
    branches: [feature/xml-design-explorer]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/xml-design-explorer
      - name: Make design view the default web entry
        shell: python
        run: |
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text(encoding='utf-8')
          marker='  <script src="app.js" defer></script>'
          redirect='''  <script src="app.js" defer></script>\n  <script>\n    if (!location.hash && !new URLSearchParams(location.search).has('legacy')) location.replace('design.html');\n  </script>'''
          if 'location.replace(\'design.html\')' not in s:
              if marker not in s:
                  raise SystemExit('index marker missing')
              s=s.replace(marker,redirect,1)
              p.write_text(s,encoding='utf-8')
      - name: Validate design entry and parser
        run: |
          node --check web/design.js
          grep -q "location.replace('design.html')" web/index.html
          grep -q 'index.html#cdm' web/design.html
          grep -q 'index.html#hmi' web/design.html
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          xmls=list(Path('ProtocolXml').rglob('*.xml'))
          specs=[]
          for p in xmls:
              try:
                  root=ET.parse(p).getroot()
              except Exception:
                  continue
              if root.tag.split('}')[-1]=='VehicleSpec':
                  specs.append(p)
          assert specs, 'VehicleSpec XML not found'
          print('VehicleSpec files:',len(specs))
          print('XML DESIGN ENTRY CHECK PASS')
          PY
      - name: Commit index entry change
        run: |
          if git diff --quiet -- web/index.html; then
            echo 'No index change'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/index.html
          git commit -m 'Make XML design explorer the default web entry'
          git push origin HEAD:feature/xml-design-explorer
