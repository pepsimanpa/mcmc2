name: Temporary XML Semantic Binding Audit

on:
  push:
    branches: [feature/usv-semantic-binding-audit]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - run: python -m pip install lxml
      - name: Validate audited XML
        shell: bash
        run: |
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          import re, subprocess, sys
          NS={'u':'http://lignex1.com/mcmc2/umsSchema'}
          root=Path('ProtocolXml'); devs=['NavigationRadar','PlatformController','ElectroOptical']; fail=[]
          ss=etree.XMLSchema(etree.parse(str(root/'XSD/CommonSpecSchema.xsd')))
          bs=etree.XMLSchema(etree.parse(str(root/'XSD/CommonBindingSchema.xsd')))
          for d in devs:
            sp=root/f'USV/{d}/{d}Semantic.xml'; bp=root/f'USV/{d}/{d}Binding.xml'
            sd=etree.parse(str(sp)); bd=etree.parse(str(bp))
            for p,doc,sch in [(sp,sd,ss),(bp,bd,bs)]:
              ok=sch.validate(doc); print('XSD',p,'PASS' if ok else 'FAIL')
              if not ok:
                for e in sch.error_log: print(' XSDERR',e)
                fail.append(str(p))
            def aset(doc,x): return set(doc.xpath(x,namespaces=NS))
            checks=[
              ('Control',aset(sd,'//u:ControlSpec/@id'),aset(bd,'//u:ControlBinding/@semantic_id')),
              ('Reply',aset(sd,'//u:Reply/@bindRef'),aset(bd,'//u:ControlBinding/u:Reply/@semantic_id')),
              ('Monitor',aset(sd,'/u:*/*[local-name()="MonitorSpecs"]/*/@id'),aset(bd,'/u:*/*[local-name()="Monitors"]/u:MonitorBinding/@semantic_id')),
              ('Product',aset(sd,'/u:*/*[local-name()="SensorProductSpecs"]/*/@id'),aset(bd,'/u:*/*[local-name()="SensorProducts"]/u:ProductBinding/@semantic_id'))]
            for k,a,b in checks:
              print('XREF',d,k,'SEM',len(a),'BIND',len(b),'MISSING',sorted(a-b),'EXTRA',sorted(b-a))
              if a!=b: fail.append(f'{d}:{k}:xref')
            conv=bd.xpath('//@converter'); print('CONVERTER',d,len(conv),conv)
            if conv: fail.append(f'{d}:converter')
            nums=[]
            for v in sd.xpath('//u:Value',namespaces=NS):
              t=(v.text or '').strip()
              if re.fullmatch(r'[-+]?\d+(?:\.\d+)?',t): nums.append((v.get('cdm'),t))
            print('SEMANTIC_RAW_VALUES',d,nums)
            if nums: fail.append(f'{d}:semantic_raw')
            miss=[]
            for e in bd.xpath('//u:Field|//u:FixedField|//u:DerivedField',namespaces=NS):
              if e.get('dataType') is None and e.get('name') not in {'usvHeader','destination'}: miss.append(e.get('name'))
            print('MISSING_DATATYPE',d,len(miss),miss)
            old='69b7e645bbf5ab0d85b2c3a2f50972c20b93e7d7'
            for p in [sp,bp]:
              try:
                oldtxt=subprocess.check_output(['git','show',f'{old}:{p.as_posix()}'],text=True)
                newtxt=p.read_text()
                oc=[re.sub(r'\s+',' ',x.strip()) for x in re.findall(r'<!--(.*?)-->',oldtxt,re.S)]
                nc=[re.sub(r'\s+',' ',x.strip()) for x in re.findall(r'<!--(.*?)-->',newtxt,re.S)]
                removed=[x for x in oc if x not in nc]
                print('COMMENTS',p,'OLD',len(oc),'NEW',len(nc),'REMOVED',len(removed))
                for x in removed: print(' REMOVED_COMMENT',x[:500])
              except Exception as ex: print('COMMENT_AUDIT_ERROR',p,ex)
          print('FINAL_FAILURES',fail)
          if fail: sys.exit(1)
          PY
