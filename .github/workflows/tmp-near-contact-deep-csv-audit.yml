name: temporary NearContactDetection deep CSV audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Apply repeated SCDE IBIT mappings
        shell: python
        run: |
          from pathlib import Path

          sem=Path('ProtocolXml/USV/NearContactDetection/NearContactDetectionSemantic.xml')
          bind=Path('ProtocolXml/USV/NearContactDetection/NearContactDetectionBinding.xml')
          issues=Path('ProtocolXml/USV/NearContactDetection/NearContactDetection_OpenIssues.md')
          s=sem.read_text(encoding='utf-8')
          b=bind.read_text(encoding='utf-8')
          o=issues.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1, found {n}')
              return text.replace(old,new,1)

          # CSV uses generic '#' in the first repeated-device description, e.g.
          # '4D 이미지 레이더#', 'RGB 카메라(접촉물)#', 'RGB 카메라(서라운드뷰)#'.
          # Subsequent rows are blank due to spreadsheet/CSV merged-cell export; apply the generic bit contract.
          for i in range(2,10):
              field=f'fourDImageRadar{i}Status'
              base=f'Health.NearContactDetection.IBIT.FourDImageRadar{i}'
              old=f'<Field name="{field}" cdm="{base}.Raw" dataType="UInt8"/>'
              new=f'<PackedField name="{field}" width="8" defaultValue="0"><BitMember name="powerNormal" cdm="{base}.PowerNormal" offset="0" width="1"/><BitMember name="operationNormal" cdm="{base}.OperationNormal" offset="1" width="1"/></PackedField>'
              b=replace_once(b,old,new,'binding '+field)
              olds=f'<Result name="{field}" cdm="Health.NearContactDetection.IBIT.{field}.Raw"/>'
              news=f'<BooleanResult name="fourDImageRadar{i}PowerNormal" cdm="{base}.PowerNormal"/><BooleanResult name="fourDImageRadar{i}OperationNormal" cdm="{base}.OperationNormal"/>'
              s=replace_once(s,olds,news,'semantic '+field)

          for i in range(2,10):
              field=f'rgbCameraContact{i}Status'
              base=f'Health.NearContactDetection.IBIT.RGBCamera.Contact{i}'
              old=f'<Field name="{field}" cdm="{base}.Raw" dataType="UInt8"/>'
              new=f'<PackedField name="{field}" width="8" defaultValue="0"><BitMember name="powerNormal" cdm="{base}.PowerNormal" offset="0" width="1"/><BitMember name="operationNormal" cdm="{base}.OperationNormal" offset="1" width="1"/></PackedField>'
              b=replace_once(b,old,new,'binding '+field)
              olds=f'<Result name="{field}" cdm="Health.NearContactDetection.IBIT.{field}.Raw"/>'
              news=f'<BooleanResult name="rgbCameraContact{i}PowerNormal" cdm="{base}.PowerNormal"/><BooleanResult name="rgbCameraContact{i}OperationNormal" cdm="{base}.OperationNormal"/>'
              s=replace_once(s,olds,news,'semantic '+field)

          for i in range(2,7):
              field=f'rgbCameraSVM{i}Status'
              base=f'Health.NearContactDetection.IBIT.RGBCamera.SurroundView{i}'
              old=f'<Field name="{field}" cdm="{base}.Raw" dataType="UInt8"/>'
              new=f'<PackedField name="{field}" width="8" defaultValue="0"><BitMember name="powerNormal" cdm="{base}.PowerNormal" offset="0" width="1"/><BitMember name="operationNormal" cdm="{base}.OperationNormal" offset="1" width="1"/></PackedField>'
              b=replace_once(b,old,new,'binding '+field)
              olds=f'<Result name="{field}" cdm="Health.NearContactDetection.IBIT.{field}.Raw"/>'
              news=f'<BooleanResult name="rgbCameraSVM{i}PowerNormal" cdm="{base}.PowerNormal"/><BooleanResult name="rgbCameraSVM{i}OperationNormal" cdm="{base}.OperationNormal"/>'
              s=replace_once(s,olds,news,'semantic '+field)

          anchor='  <!--설계 결정: 공통 Control 목적지는 equipmentType=0x03, equipmentID=0x04로 장비가 유일하게 식별되므로 dstSubEquipmentID=0x00을 사용한다.-->'
          add='\n  <!--CSV 재심층 감사: SCDE IBIT 반복장치의 첫 비고가 장비번호 1이 아니라 `#` placeholder로 전원/동작 bit 공통 규칙을 정의하므로 Radar2~9, Contact2~9, SVM2~6에도 동일 bit0/bit1 계약을 적용한다.-->'
          if add.strip() not in s:
              s=replace_once(s,anchor,anchor+add,'semantic audit comment')

          old='- SCDE IBIT에서 원문에 bit 의미가 직접 명시된 PowerManaging, ECU1~3, T1Converter1~2, EthernetHub, 4D Radar1, RGB Contact1, RGB SVM1만 PackedField로 분해하였다.\n- 4D Radar2~9, RGB Contact2~9, RGB SVM2~6는 동일 구조를 추정하지 않고 UInt8 Raw로 유지하였다.'
          new='- SCDE IBIT의 PowerManaging, ECU1~3, T1Converter1~2, EthernetHub를 원문 bit 정의대로 PackedField로 분해하였다.\n- 반복 센서군은 CSV 첫 행 비고가 장비번호 `1`이 아니라 `#` placeholder(`4D 이미지 레이더#`, `RGB 카메라(접촉물)#`, `RGB 카메라(서라운드뷰)#`)로 전원/동작 상태 bit를 정의하고 이후 동일 센서 행의 비고가 비어 있는 병합셀 export 패턴임을 재확인하였다. 이에 Radar1~9, RGB Contact1~9, RGB SVM1~6 전체에 bit0=전원, bit1=동작, 0=비정상/1=정상 규칙을 동일하게 반영하였다.'
          o=replace_once(o,old,new,'issues audit summary')
          o=o.replace('## 3. Remaining TBD','## 3. Remaining TBD / Resolved — 미해결 4개')
          old3='3. **반복 장치 상세 bit 의미**: 4D Radar2~9, RGB Contact2~9, RGB SVM2~6는 원문에 개별 bit 설명이 없어 1번 장치 구조를 복제하지 않았다.'
          new3='3. **[RESOLVED] 반복 장치 상세 bit 의미**: 각 센서군 첫 행의 비고가 `4D 이미지 레이더#`, `RGB 카메라(접촉물)#`, `RGB 카메라(서라운드뷰)#`처럼 `#` placeholder로 작성되어 특정 1번 센서 전용이 아닌 반복 센서 공통 bit 계약임을 확인하였다. 이후 2~N 행의 비고 공란은 병합셀 CSV export 패턴으로 판단하며, Radar1~9 / Contact1~9 / SVM1~6 전체에 bit0=전원상태, bit1=동작상태, 0=비정상/1=정상 규칙을 적용하였다.'
          o=replace_once(o,old3,new3,'resolved issue3')
          o=o.replace('- 원통 직접 연동 범위의 Semantic/Binding 정리는 완료하였다.','- 원통 직접 연동 범위의 Semantic/Binding 정리와 근거리접촉물탐지장치 CSCI 재심층 감사까지 완료하였다.')
          o=o.replace('- 남은 5건은 사용자 정책 선택사항이 아니라 추가 ICD/Adapter/원문 확인이 필요한 비차단 TBD이다.','- 반복 센서 상세 bit 의미 1건을 CSV 공통 placeholder/병합셀 구조 근거로 해소하였다. 미해결 4건은 추가 ICD/Adapter/원문 확인이 필요한 비차단 TBD이다.')

          sem.write_text(s,encoding='utf-8')
          bind.write_text(b,encoding='utf-8')
          issues.write_text(o,encoding='utf-8')

      - name: Validate all USV XML and NearContact assertions
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=list(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          s=Path('ProtocolXml/USV/NearContactDetection/NearContactDetectionSemantic.xml').read_text(encoding='utf-8')
          b=Path('ProtocolXml/USV/NearContactDetection/NearContactDetectionBinding.xml').read_text(encoding='utf-8')
          o=Path('ProtocolXml/USV/NearContactDetection/NearContactDetection_OpenIssues.md').read_text(encoding='utf-8')
          for i in range(1,10):
              assert b.count(f'<PackedField name="fourDImageRadar{i}Status"') == 1
              assert s.count(f'name="fourDImageRadar{i}PowerNormal"') == 1
              assert s.count(f'name="fourDImageRadar{i}OperationNormal"') == 1
              assert b.count(f'<PackedField name="rgbCameraContact{i}Status"') == 1
          for i in range(1,7):
              assert b.count(f'<PackedField name="rgbCameraSVM{i}Status"') == 1
          assert '미해결 4개' in o
          assert '[RESOLVED] 반복 장치 상세 bit 의미' in o
          assert all('converter=' not in p.read_text(encoding='utf-8') for p in binds)
          print(f'USV Semantic {len(sems)} PASS / Binding {len(binds)} PASS')
          print('NEAR CONTACT DEEP CSV ASSERTIONS PASS')
          PY
      - name: Commit NearContact deep audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/NearContactDetection/NearContactDetectionSemantic.xml ProtocolXml/USV/NearContactDetection/NearContactDetectionBinding.xml ProtocolXml/USV/NearContactDetection/NearContactDetection_OpenIssues.md
          git commit -m 'Deep-audit NearContact repeated IBIT mappings'
          git push origin HEAD:feature/usv-semantic-binding-audit
