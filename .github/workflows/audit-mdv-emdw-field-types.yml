name: Audit MDV EMDW Field Types
on:
  push:
    branches: [feature/auv-reply-bit-binding]
    paths: ['.github/workflows/audit-mdv-emdw-field-types.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0
      - name: Fill reserved sizes and audit all field types
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          NS='http://lignex1.com/mcmc2/umsSchema'; q=lambda n:f'{{{NS}}}{n}'
          ET.register_namespace('',NS); ET.register_namespace('xsi','http://www.w3.org/2001/XMLSchema-instance')
          paths=['ProtocolXml/MDV/MdvTcpBinding.xml','ProtocolXml/EMDW/EmdwTcpBinding.xml']
          reserved_lengths={
            'T_MDV_MISSION_CTRL_CMD':5,'T_MDV_MODE_SET_CMD':5,'T_MDV_WAYPOINT':3,'T_MDV_MISSION_PLAN_INFO':3,
            'T_MDV_TARGET_INFO_CMD':2,'T_MDV_CTRL_RESP':5,'T_MDV_TRACKING_INFO':2,'T_MDV_STATUS_INFO':3,
            'T_EMDW_MISSION_CTRL_CMD':5,'T_EMDW_MODE_SET_CMD':5,'T_EMDW_WAYPOINT':3,'T_EMDW_MISSION_PLAN_INFO':3,
            'T_EMDW_TARGET_INFO_CMD':2,'T_EMDW_DISPOSAL_CMD':3,'T_EMDW_CTRL_RESP':5,'T_EMDW_POSITION_INFO':2,
            'T_EMDW_STATUS_INFO':3,'T_EMDW_DISPOSAL_STATUS_INFO':3,
          }
          for path in paths:
            tree=ET.parse(path); root=tree.getroot()
            # Build trusted type hints from already typed occurrences of the same physical message field.
            hints={}
            containers=list(root.iter(q('MonitorBinding')))+list(root.iter(q('ControlBinding')))+list(root.iter(q('Reply')))
            for c in containers:
              ch=c.find(q('TCPChannel')); msg=ch.get('messageType') if ch is not None else None
              if not msg: continue
              for e in c.iter():
                local=e.tag.rsplit('}',1)[-1]
                if local in {'Field','FixedField','DerivedField'} and e.get('name') and e.get('dataType'):
                  key=(msg,e.get('name')); val=(e.get('dataType'),e.get('length'),e.get('format'))
                  if key in hints and hints[key][0]!=val[0]: raise SystemExit(f'conflicting type hint {key}: {hints[key]} vs {val}')
                  hints[key]=val
            changed=0
            for c in containers:
              ch=c.find(q('TCPChannel')); msg=ch.get('messageType') if ch is not None else None
              if not msg: continue
              for e in c.iter():
                local=e.tag.rsplit('}',1)[-1]
                if local not in {'Field','FixedField','DerivedField'} or e.get('dataType'): continue
                name=e.get('name')
                if name=='reserved' and msg in reserved_lengths:
                  e.set('dataType','UInt8'); e.set('length',str(reserved_lengths[msg])); changed+=1; continue
                hint=hints.get((msg,name))
                if hint:
                  dt,ln,fmt=hint; e.set('dataType',dt)
                  if ln: e.set('length',ln)
                  if fmt: e.set('format',fmt)
                  changed+=1
            # waypoint nested reserved belongs to T_*_WAYPOINT although container channel is mission plan.
            for arr in root.iter(q('ArrayField')):
              if arr.get('name')!='waypointList': continue
              for e in arr.iter(q('FixedField')):
                if e.get('name')=='reserved' and not e.get('dataType'):
                  e.set('dataType','UInt8'); e.set('length','3'); changed+=1
            ET.indent(tree,space='    '); tree.write(path,encoding='utf-8',xml_declaration=True)
            print(path,'changed',changed)

          # Strict audit: every scalar physical field must now declare dataType.
          bad=[]
          for path in paths:
            root=ET.parse(path).getroot()
            for e in root.iter():
              local=e.tag.rsplit('}',1)[-1]
              if local in {'Field','FixedField','DerivedField'} and not e.get('dataType'):
                bad.append((path,local,e.get('name'),e.get('value'),e.get('cdm'),e.get('sourceField')))
            text=Path(path).read_text(encoding='utf-8')
            if 'converter=' in text: bad.append((path,'converter','LEFTOVER',None,None,None))
          if bad:
            print('AUDIT FAIL: untyped/legacy fields remain')
            for x in bad: print(x)
            raise SystemExit(1)
          print('AUDIT PASS: all MDV/EMDW Field, FixedField, DerivedField elements declare dataType; converter=0')
          PY
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/MDV/MdvTcpBinding.xml ProtocolXml/EMDW/EmdwTcpBinding.xml
          git commit -m 'Complete MDV EMDW field type declarations'
          git push origin HEAD:feature/auv-reply-bit-binding
