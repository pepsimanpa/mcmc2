name: temporary normalize USV health value maps and targets
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - run: python -m pip install --quiet lxml
      - name: Normalize integrated semantics
        shell: bash
        run: |
          cat > /tmp/normalize.py <<'PY'
          from pathlib import Path
          from lxml import etree
          import re, subprocess

          U='http://lignex1.com/mcmc2/umsSchema'; N={'u':U}
          devices=['AutonomousNavigation','CentralControl','ElectroOptical','ElectroOpticalProcessor','IntegratedNavigation','Lidar','NavigationCamera','NavigationRadar','NearContactDetection','NetworkAbstraction','PlatformController','RemoteFireControl','SensorFusion','SideScanSonar']
          base='f17bc88321df55c13e3c46822ea2bfceae2ce8be'
          quartet={'Normal':'Health.Normal','Degraded':'Health.Degraded','Unavailable':'Health.Unavailable','NoResponse':'Health.NoResponse'}
          accepted={
              'Health.Normal':'Normal','Health.Degraded':'Degraded','Health.Unavailable':'Unavailable','Health.NoResponse':'NoResponse',
              'Health.Status.Normal':'Normal','Health.Status.Degraded':'Degraded','Health.Status.Unavailable':'Unavailable','Health.Status.NoResponse':'NoResponse',
              'OperationalState.Normal':'Normal','OperationalState.Degraded':'Degraded','OperationalState.Unavailable':'Unavailable','OperationalState.NoResponse':'NoResponse',
          }

          def canonicalize_value_blocks(text):
              # Only exact 4-state logical sets are normalized. Mixed taxonomies such as Normal/Warning/Fault/Failure remain untouched.
              tags=('ValueSetSpec','ValueSetProfile','ValueSetResult','HealthStatusSetSpec')
              for tag in tags:
                  pat=re.compile(rf'<{tag}\b[^>]*>.*?</{tag}>',re.S)
                  def cb(m):
                      block=m.group(0)
                      vals=re.findall(r'<Value\b[^>]*\bcdm=["\']([^"\']+)["\'][^>]*?(?:/>|>.*?</Value>)',block,re.S)
                      logical=[accepted.get(v) for v in vals]
                      if len(vals)==4 and None not in logical and set(logical)==set(quartet):
                          for old,kind in accepted.items():
                              block=block.replace(f'cdm="{old}"',f'cdm="{quartet[kind]}"').replace(f"cdm='{old}'",f"cdm='{quartet[kind]}'")
                      return block
                  text=pat.sub(cb,text)
              return text

          def canonicalize_binding_maps(text):
              pat=re.compile(r'<ValueMap\b[^>]*>.*?</ValueMap>',re.S)
              def cb(m):
                  block=m.group(0)
                  vals=re.findall(r'<Map\b[^>]*\bcdm=["\']([^"\']+)["\']',block)
                  logical=[accepted.get(v) for v in vals]
                  if len(vals)==4 and None not in logical and set(logical)==set(quartet):
                      for old,kind in accepted.items():
                          block=block.replace(f'cdm="{old}"',f'cdm="{quartet[kind]}"').replace(f"cdm='{old}'",f"cdm='{quartet[kind]}'")
                  return block
              return pat.sub(cb,text)

          def ensure_target(text,cid,cdm='Platform.Identifier.Numeric'):
              # Edit only a ControlSpec block and only when Target is absent.
              pat=re.compile(rf'(<ControlSpec\b(?=[^>]*\bid=(["\']){re.escape(cid)}\2)[^>]*>)(.*?)(</ControlSpec>)',re.S)
              m=pat.search(text)
              if not m: raise RuntimeError(f'missing ControlSpec {cid}')
              if re.search(r'<Target\b',m.group(3)): return text
              line_start=text.rfind('\n',0,m.start())+1
              indent=re.match(r'[ \t]*',text[line_start:m.start()]).group(0)
              insertion=f'\n{indent}  <Target cdm="{cdm}"/>'
              new=m.group(1)+insertion+m.group(3)+m.group(4)
              return text[:m.start()]+new+text[m.end():]

          def ensure_field_map(text, *, cdm=None, name=None, mapping):
              look=[]
              if cdm: look.append(rf'(?=[^>]*\bcdm=(["\']){re.escape(cdm)}\1)')
              if name: look.append(rf'(?=[^>]*\bname=(["\']){re.escape(name)}\1)')
              pat=re.compile(r'<Field\b'+''.join(look)+r'[^>]*(?:/>|>.*?</Field>)',re.S)
              matches=list(pat.finditer(text))
              if len(matches)!=1:
                  raise RuntimeError(f'Field match count {len(matches)} cdm={cdm} name={name}')
              m=matches[0]; block=m.group(0)
              if '<ValueMap' in block: return text
              maps=''.join(f'<Map cdm="{mc}" value="{raw}"/>' for mc,raw in mapping)
              vm=f'<ValueMap>{maps}</ValueMap>'
              if block.endswith('/>'): new=block[:-2]+'>'+vm+'</Field>'
              else:
                  pos=block.rfind('</Field>'); new=block[:pos]+vm+block[pos:]
              return text[:m.start()]+new+text[m.end():]

          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')); bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          changed=[]
          for dev in devices:
              d=Path('ProtocolXml/USV')/dev; sp=d/f'{dev}Semantic.xml'; bp=d/f'{dev}Binding.xml'
              st=sp.read_text(); bt=bp.read_text(); os,ob=st,bt
              st=canonicalize_value_blocks(st); bt=canonicalize_binding_maps(bt)

              if dev in {'CentralControl','ElectroOptical','ElectroOpticalProcessor','NavigationRadar','PlatformController','SensorFusion'}:
                  for cid in ('startIntegration','restartSystem','requestPbit','requestIbit'):
                      st=ensure_target(st,cid)

              if dev=='PlatformController':
                  generic=['Health.CBIT.environmentSensorDeviceStatus','Health.CBIT.windSensorStatus','Health.CBIT.fireDetectorStatus','Health.CBIT.leakDetectorStatus','Health.CBIT.flowMeterStatus','Health.CBIT.stabilizerStatus','Health.CBIT.interceptorStatus','Health.CBIT.seaWaterAirConditionerStatus','Health.CBIT.towingDeviceStatus','Health.CBIT.spceStatus','Health.CBIT.vcuStatus','Health.CBIT.vcuTmpStatus']
                  hmap=[('Health.Normal','0'),('Health.Degraded','1'),('Health.Unavailable','2'),('Health.NoResponse','3')]
                  for c in generic: bt=ensure_field_map(bt,cdm=c,mapping=hmap)
                  bt=ensure_field_map(bt,cdm='Platform.Power.Source',mapping=[('Platform.Power.Source.Battery','0'),('Platform.Power.Source.PDU','1')])
                  bt=ensure_field_map(bt,cdm='Platform.Power.PDU.Source',mapping=[('Platform.Power.PDU.Source.Generator','0'),('Platform.Power.PDU.Source.Shore','1')])
                  bt=ensure_field_map(bt,cdm='Platform.Power.Battery.ChargeState',mapping=[('Platform.Power.Battery.Standby','0'),('Platform.Power.Battery.Charging','1'),('Platform.Power.Battery.Discharging','2')])
                  bt=ensure_field_map(bt,cdm='Platform.Power.Battery.Level',mapping=[(f'Platform.Power.Battery.Level.{i}',str(i)) for i in range(6)])
                  bt=ensure_field_map(bt,cdm='Platform.Power.Battery.FaultStatus',mapping=[('Health.Status.Normal','0'),('Health.Status.Warning','1'),('Health.Status.Fault','2'),('Health.Status.Failure','3')])

              if dev=='SideScanSonar':
                  for c in ['ElectricalState.Power.TowedSonarArray','ElectricalState.Power.USBL','ElectricalState.Power.Winch','ElectricalState.Power.RecoveryUnit','ElectricalState.Power.Camera']:
                      bt=ensure_field_map(bt,cdm=c,mapping=[('PowerSupplyState.Off','0'),('PowerSupplyState.On','1')])

              if st!=os: sp.write_text(st); changed.append(str(sp))
              if bt!=ob: bp.write_text(bt); changed.append(str(bp))

          # Full validation + integrated invariants.
          failed=False; vm_mismatch=[]; no_map=[]
          for dev in devices:
              d=Path('ProtocolXml/USV')/dev; sp=d/f'{dev}Semantic.xml'; bp=d/f'{dev}Binding.xml'; s=etree.parse(str(sp)); b=etree.parse(str(bp))
              if not sx.validate(s): failed=True; print('SEM XSD FAIL',dev,*sx.error_log,sep='\n')
              if not bx.validate(b): failed=True; print('BIND XSD FAIL',dev,*bx.error_log,sep='\n')
              if bp.read_text().count('converter='): failed=True; print('CONVERTER',dev)
              cs={x.get('id') for x in s.xpath('//u:ControlSpecs/*[@id]',namespaces=N)}; cb={x.get('semantic_id') for x in b.xpath('//u:ControlBinding',namespaces=N)}
              rs={x.get('bindRef') for x in s.xpath('//u:ControlSpecs/*/u:Reply',namespaces=N)}; rb={x.get('semantic_id') for x in b.xpath('//u:ControlBinding/u:Reply',namespaces=N)}
              ms={x.get('id') for x in s.xpath('//u:MonitorSpecs/*[@id]',namespaces=N)}; mb={x.get('semantic_id') for x in b.xpath('//u:MonitorBinding',namespaces=N)}
              ps={x.get('id') for x in s.xpath('//u:ProductStreamSpec',namespaces=N)}; pb={x.get('semantic_id') for x in b.xpath('//u:ProductBinding',namespaces=N)}
              for label,a,c in [('CONTROL',cs,cb),('REPLY',rs,rb),('MONITOR',ms,mb),('PRODUCT',ps,pb)]:
                  if a!=c: failed=True; print(label+' DIFF',dev,a^c)
              bad=[]
              for p in s.xpath('//u:ValueSetSpec|//u:ValueSetProfile|//u:ValueSetResult|//u:HealthStatusSetSpec',namespaces=N):
                  for v in p.xpath('./u:Values/u:Value',namespaces=N):
                      if v.text and re.fullmatch(r'\s*[-+]?\d+(?:\.\d+)?\s*',v.text): bad.append((p.get('id') or p.get('cdm'),v.text.strip()))
              if bad: failed=True; print('RAW LOGICAL ENUM',dev,bad)
              # common controls: concept + Target
              for c in s.xpath('//u:ControlSpec',namespaces=N):
                  cid=c.get('id',''); low=cid.lower(); exp=None; target_expected=False
                  if cid=='startIntegration': exp='Control.Integration.Start'; target_expected=True
                  elif cid=='restartSystem': exp='Control.System.Restart'; target_expected=True
                  elif cid=='requestPbit': exp='Request.Health.PBIT'; target_expected=True
                  elif cid=='requestIbit': exp='Request.Health.IBIT'; target_expected=True
                  elif cid in ('startControlStationIntegration','startUsvIntegration'): exp='Control.Integration.Start'
                  elif low.startswith('request') and 'pbit' in low: exp='Request.Health.PBIT'
                  elif low.startswith('request') and 'ibit' in low: exp='Request.Health.IBIT'
                  if exp and c.get('cdm')!=exp: failed=True; print('COMMON CDM',dev,cid,c.get('cdm'))
                  if target_expected:
                      t=c.find(f'{{{U}}}Target')
                      if t is None or t.get('cdm')!='Platform.Identifier.Numeric': failed=True; print('COMMON TARGET',dev,cid)
              # exact generic quartet is canonical only
              for p in s.xpath('//u:ValueSetSpec|//u:ValueSetProfile|//u:ValueSetResult|//u:HealthStatusSetSpec',namespaces=N):
                  vals={v.get('cdm') for v in p.xpath('./u:Values/u:Value',namespaces=N) if v.get('cdm')}
                  logical={accepted.get(v) for v in vals}
                  if len(vals)==4 and None not in logical and logical==set(quartet) and vals!=set(quartet.values()): failed=True; print('HEALTH NOT CANONICAL',dev,p.get('cdm'),vals)
              # ValueSet ↔ Binding ValueMap coverage
              sem={}
              for p in s.xpath('//u:ValueSetSpec|//u:ValueSetProfile|//u:ValueSetResult|//u:HealthStatusSetSpec',namespaces=N):
                  c=p.get('cdm'); vals={v.get('cdm') for v in p.xpath('./u:Values/u:Value',namespaces=N) if v.get('cdm')}
                  if c and vals: sem.setdefault(c,[]).append(vals)
              for x in b.xpath('//u:Field[@cdm]|//u:DerivedField[@cdm]|//u:BitMember[@cdm]',namespaces=N):
                  c=x.get('cdm')
                  if c not in sem: continue
                  vm=x.find(f'{{{U}}}ValueMap'); sm=x.find(f'{{{U}}}SourceValueMap')
                  if vm is None:
                      if sm is None: no_map.append((dev,c,x.get('name')))
                  else:
                      maps={m.get('cdm') for m in vm.findall(f'{{{U}}}Map') if m.get('cdm')}
                      if not any(maps==v for v in sem[c]): vm_mismatch.append((dev,c,x.get('name'),maps,sem[c]))
              # PackedField integrity
              for pf in b.xpath('//u:PackedField',namespaces=N):
                  width=int(pf.get('width')); used=set()
                  for bm in pf.xpath('./u:BitMember',namespaces=N):
                      off=int(bm.get('offset')); bw=int(bm.get('width','1')); bits=set(range(off,off+bw))
                      if off+bw>width: failed=True; print('PACK OOR',dev,pf.get('name'),bm.get('name'))
                      if used&bits: failed=True; print('PACK OVERLAP',dev,pf.get('name'),bm.get('name'))
                      used|=bits
          if vm_mismatch: failed=True; print('VM MISMATCH',len(vm_mismatch)); [print(x) for x in vm_mismatch]
          if no_map: failed=True; print('VALUESET WITHOUT MAP',len(no_map)); [print(x) for x in no_map]

          # Existing comments before integrated phase must remain present verbatim.
          for dev in devices:
              for suffix in ('Semantic.xml','Binding.xml'):
                  p=Path('ProtocolXml/USV')/dev/f'{dev}{suffix}'
                  old=subprocess.check_output(['git','show',f'{base}:{p.as_posix()}']).decode()
                  missing=[x for x in re.findall(r'<!--.*?-->',old,re.S) if x not in p.read_text()]
                  if missing: failed=True; print('COMMENT LOST',dev,suffix,len(missing))
          print('CHANGED',len(changed)); [print(x) for x in changed]
          if failed: raise SystemExit(1)
          PY
          python /tmp/normalize.py
          git diff --check
      - name: Commit integrated normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProtocolXml/USV
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize USV health CDMs value maps and common targets"
          git push origin HEAD:feature/usv-semantic-binding-audit
