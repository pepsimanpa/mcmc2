name: Finalize SSS Source Enums V2

on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/finalize-sss-source-enums-v2.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - name: Apply source-confirmed enum and result mappings
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re
          base=Path('ProtocolXml/USV/SideScanSonar'); sem=base/'SideScanSonarSemantic.xml'; bind=base/'SideScanSonarBinding.xml'; issues=base/'SideScanSonar_OpenIssues.md'
          s=sem.read_text(encoding='utf-8'); b=bind.read_text(encoding='utf-8')
          old_sc=re.findall(r'<!--[\s\S]*?-->',s); old_bc=re.findall(r'<!--[\s\S]*?-->',b)
          sonar_cfg=[('TowedSideScanSonar','SideScanSonar.SonarType.TowedSideScanSonar','0'),('TowedGapFiller','SideScanSonar.SonarType.TowedGapFiller','1'),('HullMountedSideScanSonar','SideScanSonar.SonarType.HullMountedSideScanSonar','2')]
          sonar_start=[('Towed','SideScanSonar.SonarType.Towed','0'),('HullMounted','SideScanSonar.SonarType.HullMounted','1')]
          target_device=[('SideScanSonar','SideScanSonar.Subsystem.SideScanSonar','1'),('USBL','SideScanSonar.Subsystem.USBL','2'),('Winch','SideScanSonar.Subsystem.Winch','3'),('Camera','SideScanSonar.Subsystem.Camera','4'),('HullMountedSonar','SideScanSonar.Subsystem.HullMountedSonar','5')]
          mcs=[(f'Level{i+1}',f'Communication.MCS.Level.Level{i+1}',str(i)) for i in range(8)]
          launch_report=[('StopState','LaunchRecovery.Response.StopState','0'),('LaunchCompleted','LaunchRecovery.Response.LaunchCompleted','1'),('RecoveryCompleted','LaunchRecovery.Response.RecoveryCompleted','2')]
          def vsp(cdm,vals,ind):
              z=[f'{ind}<ValueSetProfile cdm="{cdm}">',f'{ind}  <Values>']+[f'{ind}    <Value name="{n}" cdm="{k}"/>' for n,k,_ in vals]+[f'{ind}  </Values>',f'{ind}</ValueSetProfile>']; return '\n'.join(z)
          def rq(text,cid,cdm,mn,mx,vals):
              p=re.compile(r'(<ControlSpec\b[^>]*\bid="'+re.escape(cid)+r'"[^>]*>[\s\S]*?</ControlSpec>)'); m=p.search(text)
              if not m: raise SystemExit(f'no ControlSpec {cid}')
              block=m.group(1); q=re.compile(r'(?m)^(\s*)<QuantityProfile cdm="'+re.escape(cdm)+r'">\s*\n\s*<Range min="'+mn+r'" max="'+mx+r'"/>\s*\n\s*<Resolution>1</Resolution>\s*\n\s*</QuantityProfile>'); mm=list(q.finditer(block))
              if len(mm)!=1: raise SystemExit(f'{cid}:{cdm} count={len(mm)}')
              x=mm[0]; block=block[:x.start()]+vsp(cdm,vals,x.group(1))+block[x.end():]; return text[:m.start(1)]+block+text[m.end(1):]
          for args in [('configureOperatingParameters','SideScanSonar.SonarType','0','2',sonar_cfg),('start','SideScanSonar.SonarType','0','1',sonar_start),('stop','SideScanSonar.SonarType','0','1',sonar_start),('powerOnOff','SideScanSonar.Subsystem','1','5',target_device),('setCommunicationLevel','Communication.MCS.Level','0','7',mcs)]: s=rq(s,*args)
          freq_line='        <Profile cdm="Ping.CarrierFrequency"/>'; freq_comment='<!-- CSCI 적용조건: StatusConfigType frequency는 예인형 SSS(sonarType=0)에 대해 100/600 kHz만 명시된다. GapFiller는 별도 range 설정이 없고 예인형 SSS range와 동기화된다. 선체부착형 frequency 적용값은 원문에서 확정되지 않아 TBD. -->'; freq_note=freq_line+'\n        '+freq_comment
          if freq_comment not in s:
              if s.count(freq_line)!=1: raise SystemExit('frequency profile mismatch')
              s=s.replace(freq_line,freq_note,1)
          def vsr(name,cdm,vals,ind):
              z=[f'{ind}<ValueSetResult name="{name}" cdm="{cdm}">',f'{ind}  <Values>']+[f'{ind}    <Value name="{n}" cdm="{k}"/>' for n,k,_ in vals]+[f'{ind}  </Values>',f'{ind}</ValueSetResult>']; return '\n'.join(z)
          old='            <Result name="videoQualityType" cdm="Communication.Level.Response.videoQualityType"/>'
          if s.count(old)!=1: raise SystemExit('video result mismatch')
          s=s.replace(old,vsr('videoQualityType','Communication.Level.Response.videoQualityType',mcs,'            '),1)
          old='            <Result name="launch" cdm="LaunchRecovery.Response.launch"/>'
          if s.count(old)!=3: raise SystemExit('launch result mismatch')
          s=s.replace(old,vsr('launch','LaunchRecovery.Response.launch',launch_report,'            '))
          def afm(text,cid,field,vals,rid=None):
              cp=re.compile(r'(<ControlBinding\b[^>]*\bsemantic_id="'+re.escape(cid)+r'"[^>]*>[\s\S]*?</ControlBinding>)'); cm=cp.search(text)
              if not cm: raise SystemExit(f'no binding {cid}')
              block=cm.group(1)
              if rid:
                  rp=re.compile(r'(<Reply\b[^>]*\bsemantic_id="'+re.escape(rid)+r'"[^>]*>[\s\S]*?</Reply>)'); rm=rp.search(block)
                  if not rm: raise SystemExit(f'no reply {rid}')
                  target=rm.group(1); baseoff=rm.start(1)
              else:
                  # command payload only: exclude nested Reply blocks
                  first_reply=block.find('<Reply '); target=block if first_reply<0 else block[:first_reply]; baseoff=0
              fp=re.compile(r'(?m)^(\s*)<Field name="'+re.escape(field)+r'"([^>]*)/>$'); fm=list(fp.finditer(target))
              if len(fm)!=1: raise SystemExit(f'{cid}:{rid}:{field} count={len(fm)}')
              f=fm[0]; ind,attrs=f.group(1),f.group(2); rows='\n'.join(ind+'    '+f'<Map cdm="{k}" value="{v}"/>' for _,k,v in vals); rep=f'{ind}<Field name="{field}"{attrs}>\n{ind}  <ValueMap>\n{rows}\n{ind}  </ValueMap>\n{ind}</Field>'; a=baseoff+f.start(); z=baseoff+f.end(); block=block[:a]+rep+block[z:]; return text[:cm.start(1)]+block+text[cm.end(1):]
          b=afm(b,'configureOperatingParameters','sonarType',sonar_cfg); b=afm(b,'start','sonarType',sonar_start); b=afm(b,'stop','sonarType',sonar_start); b=afm(b,'powerOnOff','targetDevice',target_device); b=afm(b,'setCommunicationLevel','videoQualityType',mcs); b=afm(b,'setCommunicationLevel','videoQualityType',mcs,'setCommunicationLevelResult')
          for cid,rid in [('stopTowfish','stopTowfishResult'),('launchTowfish','launchTowfishResult'),('recoveryTowfish','recoveryTowfishResult')]: b=afm(b,cid,'launch',launch_report,rid)
          sem.write_text(s,encoding='utf-8',newline=''); bind.write_text(b,encoding='utf-8',newline='')
          new_sc=re.findall(r'<!--[\s\S]*?-->',s); new_bc=re.findall(r'<!--[\s\S]*?-->',b)
          for c in old_sc:
              if c not in new_sc: raise SystemExit('semantic comment lost')
          if len(new_sc)!=len(old_sc)+1 or freq_comment not in new_sc: raise SystemExit('unexpected semantic comments')
          if new_bc!=old_bc: raise SystemExit('binding comments changed')
          etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')).assertValid(etree.parse(str(sem))); etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd')).assertValid(etree.parse(str(bind)))
          ns={'u':'http://lignex1.com/mcmc2/umsSchema'}; S=etree.parse(str(sem)); B=etree.parse(str(bind))
          controls=S.xpath('.//u:ControlSpec|.//u:SetPointSpec',namespaces=ns); bcontrols=B.xpath('.//u:ControlBinding|.//u:ControlBindingDDS',namespaces=ns); replies=S.xpath('.//u:Reply',namespaces=ns); breplies=B.xpath('.//u:Reply',namespaces=ns)
          if len(controls)!=38 or len(bcontrols)!=38 or len(replies)!=47 or len(breplies)!=47: raise SystemExit(f'count mismatch controls {len(controls)}/{len(bcontrols)} replies {len(replies)}/{len(breplies)}')
          if {x.get('id') for x in controls}!={x.get('semantic_id') for x in bcontrols}: raise SystemExit('control IDs mismatch')
          if {x.get('bindRef') for x in replies}!={x.get('semantic_id') for x in breplies}: raise SystemExit('reply IDs mismatch')
          remaining=[]
          for q in S.xpath('.//u:QuantityProfile',namespaces=ns):
              r=q.find('{http://lignex1.com/mcmc2/umsSchema}Range')
              if r is not None and (r.get('min'),r.get('max')) in {('0','1'),('0','2')}: remaining.append((q.get('cdm'),r.get('min'),r.get('max')))
          missing=[]
          for tag in ('Field','FixedField','DerivedField'):
              for e in B.xpath('.//u:'+tag,namespaces=ns):
                  if e.get('dataType') is None: missing.append((tag,e.get('name')))
          bad=[x for x in missing if x[1] not in {'usvHeader','destination'}]
          if bad: raise SystemExit(f'missing primitive datatype {bad[:10]}')
          if int(B.xpath('count(.//*[@converter])',namespaces=ns))!=0: raise SystemExit('converter remains')
          sp_sem=S.xpath('.//u:SensorProductSpecs/*',namespaces=ns); sp_bind=B.xpath('.//u:SensorProducts/u:ProductBinding',namespaces=ns)
          print('CONTROL_REPLY',len(controls),len(replies)); print('VALUEMAPS',int(B.xpath('count(.//u:ValueMap)',namespaces=ns))); print('REMAINING_ENUM_LIKE',remaining); print('MISSING_COMPOSITE',len(missing)); print('PRODUCTS',len(sp_sem),len(sp_bind),[(x.get('id'),x.get('cdm')) for x in sp_sem]); print('COMMENTS',len(old_sc),len(new_sc),len(old_bc),len(new_bc))
          doc=issues.read_text(encoding='utf-8'); marker='## Final parameter / source audit'
          if marker not in doc:
              doc+='''\n\n## Final parameter / source audit\n\n- `StatusConfigType.sonarType`: `0=예인형 SSS`, `1=예인형 GapFiller`, `2=선체부착형 SSS`를 Semantic 논리 선택 + Binding ValueMap으로 반영한다.\n- `StartControlType.sonarType`: 별도 코드 체계 `0=예인형`, `1=선체부착형`을 사용한다. 동일 필드명이어도 메시지별 wire code를 Binding에서 구분한다.\n- `PlatformPowerControlType.targetDevice`: `1=SSS`, `2=USBL`, `3=WINCH`, `4=CAMERA`, `5=HMS`로 반영한다.\n- `CommunicationLevelCommandType/ReportType.videoQualityType`: 모두 `0~7=MCS Level1~Level8`로 정의되어 제어/결과를 ValueSet으로 표현한다. Report가 요청값을 단순 echo한다고 추가 가정하지 않는다.\n- `LaunchReportType.launch`: 결과 의미 `0=정지상태`, `1=진수완료`, `2=회수완료`로 반영하며, `AutoLaunchControlType.launch` 명령의 `0=정지/1=진수/2=회수`와 구분한다.\n- `StatusConfigType.frequency`: 예인형 SSS(`sonarType=0`)에 대해 100/600 kHz만 원문에 명시된다. 현재 CommonSpecSchema에 제어용 `QuantityValueSetProfile`이 없어 `Profile`을 유지하고 XML 주석으로 제한을 보존한다. 선체부착형 frequency 허용값은 TBD이다.\n- GapFiller는 별도 range 설정이 없고 예인형 SSS range와 동기화된다. 현재 평면 Parameter 모델에서 조건부 적용은 직접 표현하지 않고 후속 스키마/OM 검토로 남긴다.\n- `ReceiveProcessing.TVG.Mode(0~1)`, `ReceiveProcessing.SoftwareGain.Mode(0~2)`, `ReceiveProcessing.LowPassFilter.Mode(0~1)`은 정확한 논리 명칭을 이번 근거에서 확정하지 못해 QuantityProfile을 임시 유지한다.\n- `LanchAndRecoveryBackStopReportType.slideBackStop`, PBIT Total, IBIT Total/detail의 raw 의미는 기존 TBD를 유지한다.\n- 새 SonarType/Subsystem/MCS/LaunchReport 하위 CDM 경로는 연결용 임시 키이며 최종 USV CDM 감사에서 명칭/계층을 재검토한다.\n'''; issues.write_text(doc,encoding='utf-8',newline='')
          PY
          git diff --check
          git rm .github/workflows/finalize-sss-source-enums.yml .github/workflows/finalize-sss-source-enums-v2.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize source-confirmed SSS parameter mappings'
          git push origin HEAD:feature/usv-semantic-binding-audit
