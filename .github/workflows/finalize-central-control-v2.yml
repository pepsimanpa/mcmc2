name: Finalize CentralControl V2

on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/finalize-central-control-v2.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0

      - name: Run corrected CentralControl finalization
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          import re
          wf=Path('.github/workflows/finalize-central-control.yml').read_text(encoding='utf-8')
          m=re.search(r"python - <<'PY'\n(?P<code>[\s\S]*?)\n          PY\n          git diff --check",wf)
          if not m:
              raise SystemExit('cannot extract original CentralControl python block')
          code=m.group('code')
          # YAML block indentation is 10 spaces; remove it before exec.
          lines=code.splitlines()
          code='\n'.join((ln[10:] if ln.startswith('          ') else ln) for ln in lines)
          old="""def one(text, old, new, label):
    n=text.count(old)
    if n!=1: raise SystemExit(f'{label}: expected 1 got {n}')
    return text.replace(old,new,1)"""
          new="""def one(text, old, new, label):
    n=text.count(old)
    if label == 'CBIT monitor health binding':
        if n!=2: raise SystemExit(f'{label}: expected 2 before scoped first replacement got {n}')
        return text.replace(old,new,1)
    if n!=1: raise SystemExit(f'{label}: expected 1 got {n}')
    return text.replace(old,new,1)"""
          if old not in code:
              raise SystemExit('one() helper patch anchor not found')
          code=code.replace(old,new,1)
          exec(compile(code,'central_control_finalize.py','exec'),{})
          PY
          git diff --check
          git rm .github/workflows/finalize-central-control.yml .github/workflows/finalize-central-control-v2.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize CentralControl semantic binding audit'
          git push origin HEAD:feature/usv-semantic-binding-audit
