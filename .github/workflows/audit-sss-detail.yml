name: Audit SSS Detail
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/audit-sss-detail.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - name: Audit SSS details
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re, hashlib, xml.etree.ElementTree as ET
          base=Path('ProtocolXml/USV/SideScanSonar')
          sem=base/'SideScanSonarSemantic.xml'; bind=base/'SideScanSonarBinding.xml'
          txt=bind.read_text(encoding='utf-8')
          conv=Counter(re.findall(r'converter="([^"]+)"',txt))
          print('CONVERTERS',sum(conv.values()),dict(conv))
          for f in ['CommonSpecSchema.xsd','CommonBindingSchema.xsd']:
              local=(base/f).read_bytes(); root=(Path('ProtocolXml/XSD')/f).read_bytes()
              print('SCHEMA',f,'same',local==root,'local_sha',hashlib.sha256(local).hexdigest()[:16],'root_sha',hashlib.sha256(root).hexdigest()[:16],'local_len',len(local),'root_len',len(root))
          ns={'u':'http://lignex1.com/mcmc2/umsSchema'}
          S=ET.parse(sem).getroot(); B=ET.parse(bind).getroot()
          specs=[]
          for tag in ['ControlSpec','SetPointSpec','DiscreteControlSpec','SequenceControlSpec']:
              specs += [(e.get('id'),tag) for e in S.findall('.//u:'+tag,ns)]
          binds=[e.get('semantic_id') for e in B.findall('.//u:ControlBinding',ns)]
          print('SEM_CONTROL_TYPES',Counter(t for _,t in specs),'total',len(specs))
          print('BIND_CONTROLS',len(binds),'missing',sorted(set(i for i,_ in specs)-set(binds)),'extra',sorted(set(binds)-set(i for i,_ in specs)))
          smon=[]
          ms=S.find('u:MonitorSpecs',ns)
          if ms is not None:
              smon=[e.get('id') for e in list(ms) if e.get('id')]
          bmon=[e.get('semantic_id') for e in B.findall('.//u:Monitors/*',ns)]
          print('MONITORS',len(smon),len(bmon),'missing',sorted(set(smon)-set(bmon)),'extra',sorted(set(bmon)-set(smon)))
          srefs=[e.get('bindRef') for e in S.findall('.//u:Reply',ns) if e.get('bindRef')]
          bids=[e.get('semantic_id') for e in B.findall('.//u:Reply',ns)]
          print('REPLIES',len(srefs),len(bids),'unresolved',sorted(set(srefs)-set(bids)),'extra',sorted(set(bids)-set(srefs)))
          # primitives without datatype, by element kind
          miss=[]
          for tag in ['Field','FixedField','DerivedField']:
              for e in B.findall('.//u:'+tag,ns):
                  if e.get('dataType') is None: miss.append((tag,e.get('name')))
          print('MISSING_DATATYPE',len(miss),Counter(t for t,_ in miss))
          # semantic numeric-coded value sets and quantity profiles likely enums
          numeric_values=[]
          for e in S.findall('.//u:ValueSetSpec',ns)+S.findall('.//u:ValueSetProfile',ns):
              vals=e.findall('./u:Values/u:Value',ns)
              if vals and all(((v.text or '').strip().lstrip('-').isdigit()) for v in vals):
                  numeric_values.append((e.get('id') or e.get('cdm'),[(v.text or '').strip() for v in vals]))
          print('NUMERIC_VALUESETS',len(numeric_values),numeric_values)
          # Comments/counts
          for p in [sem,bind]: print('COMMENTS',p.name,len(re.findall(r'<!--[\s\S]*?-->',p.read_text(encoding='utf-8'))))
          PY
      - name: Remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-sss-detail.yml
          git commit -m 'Remove one-shot SSS detailed audit workflow'
          git push origin HEAD:feature/usv-semantic-binding-audit
