name: temporary integrated navigation audit

on:
  push:
    branches:
      - feature/usv-semantic-binding-audit

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Write audited IntegratedNavigation files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          files = {
            'ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationSemantic.xml': '''''',
            'ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationBinding.xml': '''''',
            'ProtocolXml/USV/IntegratedNavigation/IntegratedNavigation_OpenIssues.md': '''''',
          }
          for path, payload in files.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationSemantic.xml ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationBinding.xml ProtocolXml/USV/IntegratedNavigation/IntegratedNavigation_OpenIssues.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit IntegratedNavigation semantic binding against source CSCI"
          git push origin HEAD:feature/usv-semantic-binding-audit
