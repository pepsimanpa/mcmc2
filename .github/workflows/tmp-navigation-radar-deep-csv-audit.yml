name: temporary NavigationRadar deep CSV audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Apply NavigationRadar AIS range refinements
        shell: python
        run: |
          from pathlib import Path
          sem=Path('ProtocolXml/USV/NavigationRadar/NavigationRadarSemantic.xml')
          issues=Path('ProtocolXml/USV/NavigationRadar/NavigationRadar_OpenIssues.md')
          s=sem.read_text(encoding='utf-8')
          o=issues.read_text(encoding='utf-8')

          def rep(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1, found {n}')
              return text.replace(old,new,1)

          s=rep(s,
            '      <!--TBD: 공용 구조체 AISContactType의 Range 열은 일부 값의 정합성이 불명확하여 Semantic에는 타입/단위/명확한 특성만 반영하고 수치 Range를 임의 보정하지 않는다.-->',
            '      <!--CSV 재심층 감사: AISContactType의 Range 열 일부는 행이 밀려 섞인 값으로 확인되었다. 동일 공용 구조체의 RadarAISFusionContactType에서 같은 필드명/자료형/단위가 다시 정의된 경우에만 교차확인 Range를 적용하고, 대응 근거가 없는 shipLength/shipWidth 등은 Range를 비워 둔다.-->',
            'AIS audit comment')

          repl={
          '          <QuantitySpec id="contactID" name="접촉물 식별번호" cdm="Contact.Identifier"/>':
          '          <QuantitySpec id="contactID" name="접촉물 식별번호" cdm="Contact.Identifier">\n            <Range min="20000"/>\n          </QuantitySpec>',
          '          <QuantitySpec id="latitude" name="위도" cdm="Contact.Position.Latitude">\n            <Unit>deg</Unit>\n          </QuantitySpec>':
          '          <QuantitySpec id="latitude" name="위도" cdm="Contact.Position.Latitude">\n            <Unit>deg</Unit>\n            <Range min="-90" max="90"/>\n          </QuantitySpec>',
          '          <QuantitySpec id="longitude" name="경도" cdm="Contact.Position.Longitude">\n            <Unit>deg</Unit>\n          </QuantitySpec>':
          '          <QuantitySpec id="longitude" name="경도" cdm="Contact.Position.Longitude">\n            <Unit>deg</Unit>\n            <Range min="-180" max="180"/>\n          </QuantitySpec>',
          '          <QuantitySpec id="course" name="침로" cdm="Contact.Course">\n            <Unit>deg</Unit>\n          </QuantitySpec>':
          '          <QuantitySpec id="course" name="침로" cdm="Contact.Course">\n            <Unit>deg</Unit>\n            <Range min="0" max="360"/>\n          </QuantitySpec>',
          '          <QuantitySpec id="speed" name="속력" cdm="Contact.Speed">\n            <Unit>kts</Unit>\n          </QuantitySpec>':
          '          <QuantitySpec id="speed" name="속력" cdm="Contact.Speed">\n            <Unit>kts</Unit>\n            <Range min="0" max="45"/>\n          </QuantitySpec>',
          '          <QuantitySpec id="detectionRange" name="거리" cdm="Contact.Range">\n            <Unit>m</Unit>\n          </QuantitySpec>':
          '          <QuantitySpec id="detectionRange" name="거리" cdm="Contact.Range">\n            <Unit>m</Unit>\n            <Range min="0" max="12000"/>\n          </QuantitySpec>',
          '          <QuantitySpec id="collisionRisk" name="충돌위험도" cdm="Contact.CollisionRisk">\n            <Unit>%</Unit>\n          </QuantitySpec>':
          '          <QuantitySpec id="collisionRisk" name="충돌위험도" cdm="Contact.CollisionRisk">\n            <Unit>%</Unit>\n            <Range min="1" max="100"/>\n          </QuantitySpec>',
          '          <QuantitySpec id="heading" name="선수방위각" cdm="Contact.Heading">\n            <Unit>deg</Unit>\n            <Resolution>0.1</Resolution>\n          </QuantitySpec>':
          '          <QuantitySpec id="heading" name="선수방위각" cdm="Contact.Heading">\n            <Unit>deg</Unit>\n            <Range min="0" max="360"/>\n            <Resolution>0.1</Resolution>\n          </QuantitySpec>',
          '          <QuantitySpec id="rateOfTurn" name="선박 회전속도" cdm="Contact.RateOfTurn">\n            <Unit>deg/min</Unit>\n          </QuantitySpec>':
          '          <QuantitySpec id="rateOfTurn" name="선박 회전속도" cdm="Contact.RateOfTurn">\n            <Unit>deg/min</Unit>\n            <Range min="-90" max="90"/>\n          </QuantitySpec>',
          '          <QuantitySpec id="shipType" name="선박종류" cdm="Contact.AIS.ShipType"/>':
          '          <QuantitySpec id="shipType" name="선박종류" cdm="Contact.AIS.ShipType">\n            <Range min="0" max="255"/>\n          </QuantitySpec>'
          }
          # Only replace matches inside AIS block; duplicated latitude/course etc exist in Radar block.
          pre, rest=s.split('    <GroupSpec id="aisContacts"',1)
          ais, post=rest.split('    <GroupSpec id="radarStatus"',1)
          for old,new in repl.items():
              ais=rep(ais,old,new,'AIS '+old.split('id="',1)[1].split('"',1)[0])
          s=pre+'    <GroupSpec id="aisContacts"'+ais+'    <GroupSpec id="radarStatus"'+post

          old='''7. **AISContactType 일부 원본 표 이상값**
   - 일부 Range/Unavailable 셀이 인접 필드 값과 섞인 것으로 보이며 의미가 명확하지 않다.
   - 특히 위치/회전율 등의 비정상 표기는 원작자/IDL 근거 전까지 임의 수정하지 않는다.'''
          new='''7. **[RESOLVED] AISContactType 일부 원본 표 이상값**
   - 공용 구조체의 `AISContactType` Range 열은 `longitude=10000~`, `course=0~1`, `speed=0~12000`, `shipName=-180~180`, `shipType=0~360`, `shipLength=0~45`처럼 인접 의미와 맞지 않는 값이 연속되어 행/셀 정렬이 밀린 export 결함으로 판단된다.
   - 동일 `공용 구조체.csv`의 `RadarAISFusionContactType`에 동일 필드명/자료형/단위가 재정의되어 있어 `latitude=-90~90`, `longitude=-180~180`, `course=0~360`, `speed=0~45`, `detectionRange=0~12000`, `collisionRisk=1~100`, `shipType=0~255`를 교차확인하였다. AIS 자체 행에서 독립적으로 명확한 `contactID>=20000`, `heading=0~360`, `rateOfTurn=-90~90`도 반영하였다.
   - `shipLength/shipWidth`처럼 교차 구조에도 Range가 없는 항목은 임의 범위를 만들지 않고 Unit/Unavailable 의미만 유지한다. 이 기준으로 표 이상값 이슈를 종료한다.'''
          o=rep(o,old,new,'OpenIssue 7')
          o=o.replace('## 3. Remaining TBD','## 3. Remaining TBD / Resolved — 미해결 6개',1)
          o=o.replace('- 원문 직접 근거가 있는 Semantic/Binding 정합성 보강은 완료하였다.','- 원문 직접 근거가 있는 Semantic/Binding 정합성 보강과 항해레이더/공용구조체 CSV 재심층 감사까지 완료하였다.')
          o=o.replace('- 남은 항목은 사용자가 임의로 정책을 선택할 사항이 아니라 추가 CSCI/IDL/Adapter 근거가 필요한 비차단 TBD이다.','- AISContactType 표 정렬 이상 1건은 동일 공용 구조체의 RadarAISFusionContactType 교차근거로 해소하였다. 미해결 6건은 추가 CSCI/IDL/Adapter 근거가 필요한 비차단 TBD이다.')
          sem.write_text(s,encoding='utf-8')
          issues.write_text(o,encoding='utf-8')

      - name: Validate all USV XML and NavigationRadar assertions
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=list(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          s=Path('ProtocolXml/USV/NavigationRadar/NavigationRadarSemantic.xml').read_text(encoding='utf-8')
          o=Path('ProtocolXml/USV/NavigationRadar/NavigationRadar_OpenIssues.md').read_text(encoding='utf-8')
          ais=s.split('<GroupSpec id="aisContacts"',1)[1].split('<GroupSpec id="radarStatus"',1)[0]
          for x in ['<Range min="-90" max="90"/>','<Range min="-180" max="180"/>','<Range min="0" max="360"/>','<Range min="0" max="45"/>','<Range min="0" max="12000"/>','<Range min="1" max="100"/>','<Range min="0" max="255"/>']:
              assert x in ais
          assert '[RESOLVED] AISContactType 일부 원본 표 이상값' in o
          assert '미해결 6개' in o
          assert all('converter=' not in p.read_text(encoding='utf-8') for p in binds)
          print(f'USV Semantic {len(sems)} PASS / Binding {len(binds)} PASS')
          print('NAVIGATION RADAR DEEP CSV ASSERTIONS PASS')
          PY
      - name: Commit NavigationRadar deep audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/NavigationRadar/NavigationRadarSemantic.xml ProtocolXml/USV/NavigationRadar/NavigationRadar_OpenIssues.md
          git commit -m 'Deep-audit NavigationRadar AIS ranges'
          git push origin HEAD:feature/usv-semantic-binding-audit
