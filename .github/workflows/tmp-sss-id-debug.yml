name: temporary SideScan ID debug
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - run: python -m pip install --quiet lxml
      - run: |
          python - <<'PY'
          from lxml import etree
          U='http://lignex1.com/mcmc2/umsSchema'; N={'u':U}
          s=etree.parse('ProtocolXml/USV/SideScanSonar/SideScanSonarSemantic.xml')
          b=etree.parse('ProtocolXml/USV/SideScanSonar/SideScanSonarBinding.xml')
          cs=[x.get('id') for x in s.xpath('//u:ControlSpec',namespaces=N)]
          cb=[x.get('semantic_id') for x in b.xpath('//u:ControlBinding',namespaces=N)]
          rs=[x.get('bindRef') for x in s.xpath('//u:ControlSpec/u:Reply',namespaces=N)]
          rb=[x.get('semantic_id') for x in b.xpath('//u:ControlBinding/u:Reply',namespaces=N)]
          print('C semantic',repr(cs)); print('C binding',repr(cb)); print('C diff',set(cs)^set(cb))
          print('R diff',set(rs)^set(rb))
          PY