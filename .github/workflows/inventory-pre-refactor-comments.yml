name: Restore Valid Pre-refactor XML Comments
on:
  push:
    branches: [feature/auv-reply-bit-binding]
    paths: ['.github/workflows/inventory-pre-refactor-comments.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0
      - name: Restore source-backed comments
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base='86db0296dce6dbaee1e3f9f47ec5b2752d2b871b'
          files=['ProtocolXml/MDV/MdvPlatformSemantic.xml','ProtocolXml/MDV/MdvTcpBinding.xml','ProtocolXml/EMDW/EmdwPlatformSemantic.xml','ProtocolXml/EMDW/EmdwTcpBinding.xml']
          stale=['Binding FixedField/Converter','converter=','DerivedSemantic','WaypointIndexToAvailable','WaypointIndexToIndexWhenAvailable','result=0은 요청 검증 완료','명령 수락']
          def norm(c):
            c=c.replace('실제 선택값은 Binding FixedField/Converter에서 결정하고 HMI Parameter로 노출하지 않는다.','실제 wire 선택값은 Binding FixedField/ValueMap에서 결정하고 HMI에는 논리 의미만 노출한다.')
            c=c.replace('실제 0/1 및 reasonCode 숫자값은 Binding에서 매핑한다.','실제 0/1 및 reasonCode 숫자값은 Binding ValueMap에서 매핑한다.')
            c=c.replace('enum 선택값은 FixedField로 결정한다.','고정 명령 enum은 FixedField로 결정하고 의미형 선택값은 ValueMap으로 매핑한다.')
            c=c.replace('선택 enum은 FixedField로 결정한다.','고정 명령 enum은 FixedField로 결정하고 의미형 선택값은 ValueMap으로 매핑한다.')
            return c
          def valid(c): return not any(x in c for x in stale)
          def restore_top(old,cur):
            m=re.match(r'(<\?xml[^>]+>\s*)<!--([\s\S]*?)-->',old)
            if not m or re.match(r'(<\?xml[^>]+>\s*)<!--',cur): return cur,0
            lines=[norm(x) for x in m.group(2).strip().splitlines()]
            lines=[x for x in lines if valid(x)]
            comment='<!--\n'+'\n'.join(lines)+'\n-->\n'
            cm=re.match(r'(<\?xml[^>]+>\s*)',cur)
            return cur[:cm.end()]+comment+cur[cm.end():],1
          def blocks(text): return list(re.finditer(r'<(MonitorBinding|ControlBinding|Reply)\b[^>]*semantic_id="([^"]+)"[^>]*>[\s\S]*?</\1>',text))
          def restore_binding(old,cur):
            obs=blocks(old); cbs=blocks(cur); counts={}; cmap={}
            for m in cbs:
              k=(m.group(1),m.group(2)); i=counts.get(k,0); counts[k]=i+1; cmap[(k,i)]=m
            counts={}; patches=[]; n=0; skipped=0
            for om in obs:
              k=(om.group(1),om.group(2)); i=counts.get(k,0); counts[k]=i+1; cm=cmap.get((k,i))
              if not cm: continue
              ob=om.group(0); cb=cm.group(0)
              for x in re.finditer(r'<!--([\s\S]*?)-->',ob):
                c=norm(x.group(1).strip())
                if not valid(c): skipped+=1; continue
                if c in cb: continue
                a=re.search(r'<(TCPChannel|Field|FixedField|DerivedField|PackedField|ArrayField)\b([^>]*)>',ob[x.end():])
                if not a: continue
                tag,attrs=a.group(1),a.group(2); nm=re.search(r'\bname="([^"]+)"',attrs); mm=re.search(r'\bmessageType="([^"]+)"',attrs)
                if nm: pat=re.compile(r'(?m)^(\s*)<'+tag+r'\b(?=[^>]*\bname="'+re.escape(nm.group(1))+r'")[^>]*>')
                elif mm: pat=re.compile(r'(?m)^(\s*)<'+tag+r'\b(?=[^>]*\bmessageType="'+re.escape(mm.group(1))+r'")[^>]*>')
                else: continue
                am=pat.search(cb)
                if not am: continue
                ind=am.group(1); com='<!-- '+c.replace('\n','\n'+ind+'     ')+' -->'
                cb=cb[:am.start()]+ind+com+'\n'+cb[am.start():]; n+=1
              patches.append((cm.start(),cm.end(),cb))
            for s,e,r in reversed(patches): cur=cur[:s]+r+cur[e:]
            return cur,n,skipped
          def restore_semantic(old,cur):
            n=skipped=0
            first=re.match(r'(<\?xml[^>]+>\s*)(<!--[\s\S]*?-->\s*)?',old); start=first.end() if first else 0
            for x in re.finditer(r'<!--([\s\S]*?)-->',old[start:]):
              c=norm(x.group(1).strip())
              if not valid(c): skipped+=1; continue
              if c in cur: continue
              a=re.search(r'<([A-Za-z0-9]+)\b[^>]*\bid="([^"]+)"[^>]*>',old[start+x.end():])
              if not a: continue
              tag,idv=a.group(1),a.group(2); pat=re.compile(r'(?m)^(\s*)<'+tag+r'\b(?=[^>]*\bid="'+re.escape(idv)+r'")[^>]*>'); am=pat.search(cur)
              if not am: continue
              ind=am.group(1); com='<!-- '+c.replace('\n','\n'+ind+'     ')+' -->'; cur=cur[:am.start()]+ind+com+'\n'+cur[am.start():]; n+=1
            return cur,n,skipped
          for path in files:
            old=subprocess.check_output(['git','show',f'{base}:{path}'],text=True); p=Path(path); cur=p.read_text(encoding='utf-8')
            cur,t=restore_top(old,cur)
            if path.endswith('Binding.xml'): cur,n,s=restore_binding(old,cur)
            else: cur,n,s=restore_semantic(old,cur)
            p.write_text(cur,encoding='utf-8',newline=''); ET.parse(path)
            print(path,'restored',t+n,'stale_skipped',s,'comments',len(re.findall(r'<!--[\s\S]*?-->',cur)))
          PY
      - name: Validate
        run: |
          git diff --check
          ! grep -R 'converter=' ProtocolXml/MDV/MdvTcpBinding.xml ProtocolXml/EMDW/EmdwTcpBinding.xml
          ! grep -R 'generator=' ProtocolXml/MDV ProtocolXml/EMDW
          ! grep -R 'sourceMember=' ProtocolXml/MDV ProtocolXml/EMDW
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/MDV/MdvPlatformSemantic.xml ProtocolXml/MDV/MdvTcpBinding.xml ProtocolXml/EMDW/EmdwPlatformSemantic.xml ProtocolXml/EMDW/EmdwTcpBinding.xml
          git commit -m 'Restore valid MDV EMDW XML comments'
          git push origin HEAD:feature/auv-reply-bit-binding
