name: temporary apply final two USV audits
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - run: python -m pip install --quiet lxml
      - name: Apply source audit
        shell: bash
        run: |
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path
          from lxml import etree
          import re

          URI='http://lignex1.com/mcmc2/umsSchema'
          Q=lambda n:f'{{{URI}}}{n}'
          NS={'u':URI}

          def parse(path):
              return etree.parse(str(path), etree.XMLParser(remove_blank_text=False, remove_comments=False))
          def write(tree,path):
              tree.write(str(path), encoding='UTF-8', xml_declaration=True, pretty_print=False)
          def set_schema(root, xsd):
              root.set('{http://www.w3.org/2001/XMLSchema-instance}schemaLocation', f'{URI} ../../XSD/{xsd}')
          def logical_name(cdm):
              if not cdm: return 'Value'
              return cdm.split('.')[-1].replace('_','') or 'Value'
          def clear_numeric_values(tree):
              for v in tree.xpath('//u:Value',namespaces=NS):
                  if v.text and re.fullmatch(r'\s*[-+]?\d+(?:\.\d+)?\s*',v.text):
                      if v.get('name') is None: v.set('name', logical_name(v.get('cdm')))
                      v.text=None
          def value(parent,name,cdm):
              e=etree.SubElement(parent,Q('Value')); e.set('name',name); e.set('cdm',cdm); return e
          def valueset_result(parent,name,cdm,vals):
              e=etree.SubElement(parent,Q('ValueSetResult')); e.set('name',name); e.set('cdm',cdm)
              vs=etree.SubElement(e,Q('Values'))
              for n,c in vals: value(vs,n,c)
              return e
          def add_ack_results(reply):
              if reply.find(Q('Results')) is not None: return
              rs=etree.SubElement(reply,Q('Results')); r=etree.SubElement(rs,Q('Result'))
              r.set('name','commandStatusReport.status'); r.set('cdm','Control.Response.Status')
          def vm(el,maps):
              old=el.find(Q('ValueMap'))
              if old is not None: el.remove(old)
              m=etree.Element(Q('ValueMap'))
              for c,v in maps:
                  x=etree.SubElement(m,Q('Map')); x.set('cdm',c); x.set('value',str(v))
              el.insert(0,m)
          def replace_with_packed(field,width,members):
              parent=field.getparent(); idx=parent.index(field)
              p=etree.Element(Q('PackedField')); p.set('name',field.get('name')); p.set('width',str(width)); p.set('defaultValue','0')
              for name,cdm,offset,maps in members:
                  b=etree.SubElement(p,Q('BitMember')); b.set('name',name); b.set('cdm',cdm); b.set('offset',str(offset)); b.set('width','1')
                  if maps: vm(b,maps)
              p.tail=field.tail; parent.remove(field); parent.insert(idx,p); return p
          HEALTH=[('Normal','Health.Normal'),('Degraded','Health.Degraded'),('Unavailable','Health.Unavailable'),('NoResponse','Health.NoResponse')]
          HEALTH_VM=[(c,i) for i,(n,c) in enumerate(HEALTH)]

          # ---------- NearContactDetection ----------
          sd=Path('ProtocolXml/USV/NearContactDetection/NearContactDetectionSemantic.xml')
          bd=Path('ProtocolXml/USV/NearContactDetection/NearContactDetectionBinding.xml')
          st=parse(sd); bt=parse(bd); set_schema(st.getroot(),'CommonSpecSchema.xsd'); set_schema(bt.getroot(),'CommonBindingSchema.xsd')
          clear_numeric_values(st)
          # normalize status value display names
          for v in st.xpath('//u:ValueSetSpec/u:Values/u:Value',namespaces=NS):
              c=v.get('cdm'); v.set('name',logical_name(c))
          # Semantic reply results
          for r in st.xpath('//u:ControlSpec/u:Reply',namespaces=NS):
              ref=r.get('bindRef','')
              if ref.endswith('Ack'): add_ack_results(r)
          for ref, name, cdm in [('requestPbitScdeResult','scdeStatus','Health.NearContactDetection.Overall'),('requestPbitLidarResult','lidarStatus','Health.NearContactDetection.Lidar.Overall')]:
              r=st.xpath(f'//u:Reply[@bindRef="{ref}"]',namespaces=NS)[0]
              if r.find(Q('Results')) is None:
                  rs=etree.SubElement(r,Q('Results')); valueset_result(rs,name,cdm,HEALTH)
              r.set('required','true')
          r=st.xpath('//u:Reply[@bindRef="requestIbitScdeResult"]',namespaces=NS)[0]
          if r.find(Q('Results')) is None:
              rs=etree.SubElement(r,Q('Results')); g=etree.SubElement(rs,Q('GroupResult')); g.set('name','scdeIbit'); g.set('cdm','Health.IBIT.NearContactDetection')
              valueset_result(g,'scdeStatus','Health.NearContactDetection.Overall',HEALTH)
              explicit=['ecuComputing1ModuleStatus','ecuComputing2ModuleStatus','ecuComputing3ModuleStatus','t1Converter1ModuleStatus','t1Converter2ModuleStatus','ethernetHubStatus','fourDImageRadar1Status','rgbCameraContact1Status','rgbCameraSVM1Status']
              b=etree.SubElement(g,Q('BooleanResult')); b.set('name','powerManagingModulePowerNormal'); b.set('cdm','Health.NearContactDetection.IBIT.PowerManagingModule.PowerNormal')
              for n in explicit:
                  stem={'fourDImageRadar1Status':'FourDImageRadar1','rgbCameraContact1Status':'RGBCamera.Contact1','rgbCameraSVM1Status':'RGBCamera.SurroundView1'}.get(n,n.replace('ModuleStatus','').replace('Status',''))
                  for suffix in ['PowerNormal','OperationNormal']:
                      b=etree.SubElement(g,Q('BooleanResult')); b.set('name',n.replace('Status','')+suffix); b.set('cdm',f'Health.NearContactDetection.IBIT.{stem}.{suffix}')
              raw=['fourDImageRadar'+str(i)+'Status' for i in range(2,10)]+['rgbCameraContact'+str(i)+'Status' for i in range(2,10)]+['rgbCameraSVM'+str(i)+'Status' for i in range(2,7)]
              for n in raw:
                  x=etree.SubElement(g,Q('Result')); x.set('name',n); x.set('cdm','Health.NearContactDetection.IBIT.'+n+'.Raw')
          r.set('required','true')
          r=st.xpath('//u:Reply[@bindRef="requestIbitLidarResult"]',namespaces=NS)[0]
          if r.find(Q('Results')) is None:
              rs=etree.SubElement(r,Q('Results')); g=etree.SubElement(rs,Q('GroupResult')); g.set('name','lidarIbit'); g.set('cdm','Health.IBIT.NearContactDetection.Lidar')
              cat=['OverTemperature','UnderTemperature','InternalCommunication','ShotLimiting','InternalFirmware','EthernetLinkBad','UDPTransmission','Startup','InputVoltage','UDPConnect','InternalFault','WarmupIssue','MotorControl','Config','IOConnection']
              level=['Normal','Notice','Warning','Error']; action=['NoAction','Shutdown','Restart']
              for i in (1,2):
                  sg=etree.SubElement(g,Q('GroupResult')); sg.set('name',f'lidar{i}'); sg.set('cdm',f'Health.NearContactDetection.Lidar{i}.IBIT')
                  valueset_result(sg,'status',f'Health.NearContactDetection.Lidar{i}.Overall',HEALTH)
                  for n in cat:
                      x=etree.SubElement(sg,Q('BooleanResult')); x.set('name','category'+n); x.set('cdm',f'Health.NearContactDetection.Lidar{i}.IBIT.Category.{n}')
                  for n in level:
                      x=etree.SubElement(sg,Q('BooleanResult')); x.set('name','level'+n); x.set('cdm',f'Health.NearContactDetection.Lidar{i}.IBIT.Level.{n}')
                  for n in action:
                      x=etree.SubElement(sg,Q('BooleanResult')); x.set('name','action'+n); x.set('cdm',f'Health.NearContactDetection.Lidar{i}.IBIT.SensorAction.{n}')
                  x=etree.SubElement(sg,Q('QuantityResult')); x.set('name','mappingID'); x.set('cdm',f'Health.NearContactDetection.Lidar{i}.IBIT.MappingID')
          r.set('required','true')

          # Binding common cleanup
          for e in bt.xpath('//*[@converter]',namespaces=NS):
              cv=e.get('converter')
              if cv=='UInt16': e.set('dataType','UInt16')
              e.attrib.pop('converter',None)
          for cb in bt.xpath('//u:ControlBinding',namespaces=NS):
              fixed=[x for x in cb if etree.QName(x).localname=='FixedField' and x.get('name','').startswith('destination.')]
              if fixed:
                  idx=min(cb.index(x) for x in fixed)
                  for x in fixed: cb.remove(x)
                  d=etree.Element(Q('DerivedField')); d.set('name','destination'); d.set('sourceField','System.Target.NearContactDetection'); cb.insert(idx,d)
          # status mappings/types everywhere
          for e in bt.xpath('//u:Field',namespaces=NS):
              n=e.get('name',''); c=e.get('cdm','')
              if n in ('scdeStatus','lidarStatus','lidar1Status','lidar2Status') or c in ('Health.NearContactDetection.Overall','Health.NearContactDetection.Lidar.Overall','Health.NearContactDetection.Lidar1.Overall','Health.NearContactDetection.Lidar2.Overall'):
                  e.set('dataType','UInt8'); vm(e,HEALTH_VM)
              if n.startswith('commandStatusReport.'):
                  e.set('dataType','UInt8')
              elif n=='commandID': e.set('dataType','UInt16')
              elif n.endswith('ID') and n.startswith('lidar'): e.set('dataType','UInt32')
              elif any(k in n for k in ['ModuleStatus','fourDImageRadar','rgbCameraContact','rgbCameraSVM']) and e.get('dataType') is None: e.set('dataType','UInt8')
              elif any(k in n for k in ['Category']) and e.get('dataType') is None: e.set('dataType','UInt16')
              elif any(k in n for k in ['Level','SensorAction']) and e.get('dataType') is None: e.set('dataType','UInt8')
          for e in bt.xpath('//u:DerivedField[@name="commandID"]',namespaces=NS): e.set('dataType','UInt16')
          # Explicit SCDE bitfields
          rep=bt.xpath('//u:Reply[@semantic_id="requestIbitScdeResult"]',namespaces=NS)[0]
          f={x.get('name'):x for x in rep if etree.QName(x).localname=='Field'}
          if 'powerManagingModuleStatus' in f:
              replace_with_packed(f['powerManagingModuleStatus'],8,[('powerNormal','Health.NearContactDetection.IBIT.PowerManagingModule.PowerNormal',0,None)])
          explicit=['ecuComputing1ModuleStatus','ecuComputing2ModuleStatus','ecuComputing3ModuleStatus','t1Converter1ModuleStatus','t1Converter2ModuleStatus','ethernetHubStatus','fourDImageRadar1Status','rgbCameraContact1Status','rgbCameraSVM1Status']
          for n in explicit:
              x=rep.xpath(f'./u:Field[@name="{n}"]',namespaces=NS)
              if not x: continue
              stem={'fourDImageRadar1Status':'FourDImageRadar1','rgbCameraContact1Status':'RGBCamera.Contact1','rgbCameraSVM1Status':'RGBCamera.SurroundView1'}.get(n,n.replace('ModuleStatus','').replace('Status',''))
              replace_with_packed(x[0],8,[('powerNormal',f'Health.NearContactDetection.IBIT.{stem}.PowerNormal',0,None),('operationNormal',f'Health.NearContactDetection.IBIT.{stem}.OperationNormal',1,None)])
          # Lidar packed fields
          rep=bt.xpath('//u:Reply[@semantic_id="requestIbitLidarResult"]',namespaces=NS)[0]
          cat=['OverTemperature','UnderTemperature','InternalCommunication','ShotLimiting','InternalFirmware','EthernetLinkBad','UDPTransmission','Startup','InputVoltage','UDPConnect','InternalFault','WarmupIssue','MotorControl','Config','IOConnection']
          for i in (1,2):
              for fieldname,width,names,prefix in [(f'lidar{i}Category',16,cat,'Category'),(f'lidar{i}Level',8,['Normal','Notice','Warning','Error'],'Level'),(f'lidar{i}SensorAction',8,['NoAction','Shutdown','Restart'],'SensorAction')]:
                  x=rep.xpath(f'./u:Field[@name="{fieldname}"]',namespaces=NS)
                  if x:
                      members=[(n,f'Health.NearContactDetection.Lidar{i}.IBIT.{prefix}.{n}',off,None) for off,n in enumerate(names)]
                      replace_with_packed(x[0],width,members)
          write(st,sd); write(bt,bd)

          # ---------- AutonomousNavigation ----------
          sd=Path('ProtocolXml/USV/AutonomousNavigation/AutonomousNavigationSemantic.xml')
          bd=Path('ProtocolXml/USV/AutonomousNavigation/AutonomousNavigationBinding.xml')
          st=parse(sd); bt=parse(bd); set_schema(st.getroot(),'CommonSpecSchema.xsd'); set_schema(bt.getroot(),'CommonBindingSchema.xsd')
          clear_numeric_values(st)
          # Remove source-unsupported achieved-state and docking-unit assumptions.
          for ident in ('headingAchieved','hoverRadiusAchieved','targetTrackingAchieved'):
              x=st.xpath(f'//u:ValueSetSpec[@id="{ident}"]',namespaces=NS)
              if x:
                  old=x[0]; new=etree.Element(Q('QuantitySpec'))
                  for k,v in old.attrib.items(): new.set(k,v)
                  new.tail=old.tail; old.getparent().replace(old,new)
          x=st.xpath('//u:GroupSpec[@id="autonomousDockingExecutionStatus"]/u:QuantitySpec[@id="distanceRemaining"]/u:Unit',namespaces=NS)
          if x: x[0].getparent().remove(x[0])
          # Convert known end-action enum profiles to logical ValueSetProfiles.
          for old in list(st.xpath('//u:QuantityProfile[@cdm="Autonomy.Mission.Record.EndAction"]',namespaces=NS)):
              new=etree.Element(Q('ValueSetProfile')); new.set('cdm',old.get('cdm')); vs=etree.SubElement(new,Q('Values'))
              value(vs,'Drift','Autonomy.Mission.Record.EndAction.Drift'); value(vs,'WeatherVaning','Autonomy.Mission.Record.EndAction.WeatherVaning'); new.tail=old.tail; old.getparent().replace(old,new)
          for old in list(st.xpath('//u:QuantityProfile[@cdm="Autonomy.Return.EndAction"]',namespaces=NS)):
              new=etree.Element(Q('ValueSetProfile')); new.set('cdm',old.get('cdm')); vs=etree.SubElement(new,Q('Values'))
              value(vs,'Drift','Autonomy.Return.EndAction.Drift'); value(vs,'HoldPosition','Autonomy.Return.EndAction.HoldPosition'); value(vs,'Signal','Autonomy.Return.EndAction.Signal'); new.tail=old.tail; old.getparent().replace(old,new)
          # Update stale top comments rather than deleting them.
          for c in st.xpath('//comment()'):
              t=c.text or ''
              if 'headingAcheived/hoverRadiusAcheived/targetTrackingAcheived' in t: c.text='TBD: headingAcheived/hoverRadiusAcheived/targetTrackingAcheived는 octet이지만 원문에 값 의미가 없어 Semantic 논리 enum을 임의 정의하지 않는다.'
              if 'AutonomousDocking distanceRemaining은 동일 의미' in t: c.text='TBD: AutonomousDocking distanceRemaining은 원문 Unit이 미기재이므로 동일 이름의 다른 메시지를 근거로 단위를 추정하지 않는다.'
              if 'missionStateID wire 1~8' in t: c.text='설계 결정: missionStateID wire 1~8은 Binding ValueMap으로 공통 Mission.Type 논리값에 연결한다. PBIT operationalStatus의 Range 0~1은 비고/CBIT/IBIT와 충돌하므로 비고의 0~3 정의를 따른다.'
          # remove now-stale inline comments
          for c in list(st.xpath('//comment()')):
              t=c.text or ''
              if ('headingAchieved/hoverRadiusAchieved 0/1 의미' in t or 'targetTrackingAchieved 0/1 의미' in t or '원문 AutonomousDocking distanceRemaining의 Unit은 미기재이나' in t):
                  c.getparent().remove(c)
          # Semantic replies
          for r in st.xpath('//u:ControlSpec/u:Reply',namespaces=NS):
              ref=r.get('bindRef','')
              if ref.endswith('Ack') and 'RecordAck' not in ref: add_ack_results(r)
              if 'RecordAck' in ref and r.find(Q('Results')) is None:
                  rs=etree.SubElement(r,Q('Results')); g=etree.SubElement(rs,Q('GroupResult')); g.set('name','recordEcho'); g.set('cdm',r.get('cdm','Autonomy.Mission.Record.Echo'))
          r=st.xpath('//u:Reply[@bindRef="requestPbitResult"]',namespaces=NS)[0]
          if r.find(Q('Results')) is None:
              rs=etree.SubElement(r,Q('Results')); valueset_result(rs,'operationalStatus','Health.PBIT.AutonomousNavigation.Status',HEALTH)
          r.set('required','true')
          r=st.xpath('//u:Reply[@bindRef="requestIbitResult"]',namespaces=NS)[0]
          if r.find(Q('Results')) is None:
              rs=etree.SubElement(r,Q('Results')); g=etree.SubElement(rs,Q('GroupResult')); g.set('name','anuIbit'); g.set('cdm','Health.IBIT.AutonomousNavigation')
              valueset_result(g,'operationalIBITStatus','Health.IBIT.AutonomousNavigation.Status',HEALTH)
              q=etree.SubElement(g,Q('QuantityResult')); q.set('name','cpuTemperature'); q.set('cdm','Health.IBIT.CPU.Temperature'); etree.SubElement(q,Q('Unit')).text='degC'; rg=etree.SubElement(q,Q('Range')); rg.set('min','20'); rg.set('max','100')
              q=etree.SubElement(g,Q('QuantityResult')); q.set('name','cpuLoad'); q.set('cdm','Health.IBIT.CPU.Load'); etree.SubElement(q,Q('Unit')).text='%'; rg=etree.SubElement(q,Q('Range')); rg.set('min','0'); rg.set('max','100')
          r.set('required','true')
          # Binding converter cleanup and prepared destination
          for e in bt.xpath('//*[@converter]',namespaces=NS):
              cv=e.get('converter')
              if cv=='UInt16': e.set('dataType','UInt16')
              elif cv=='Subtract1':
                  e.set('dataType','UInt8'); vm(e,[(f'Autonomy.Mission.Type.{n}',i) for i,n in enumerate(['Waypoint','GlobalHover','TargetTracking','PointAndGo','AutonomousNavigation','SurfaceReconnaissance','UnderwaterReconnaissance','AutonomousDocking'],1)])
              elif cv=='Scale0.01': e.set('dataType','UInt16'); e.set('scale','100')
              e.attrib.pop('converter',None)
          for cb in bt.xpath('//u:ControlBinding[@semantic_id="startIntegration" or @semantic_id="restartSystem" or @semantic_id="requestPbit" or @semantic_id="requestIbit"]',namespaces=NS):
              fixed=[x for x in cb if etree.QName(x).localname=='FixedField' and x.get('name','').startswith('destination.')]
              if fixed:
                  idx=min(cb.index(x) for x in fixed)
                  for x in fixed: cb.remove(x)
                  d=etree.Element(Q('DerivedField')); d.set('name','destination'); d.set('sourceField','System.Target.AutonomousNavigation'); cb.insert(idx,d)
          # Primitive types using source/common-struct evidence.
          def dtype_for(e):
              n=e.get('name',''); c=e.get('cdm','')
              if n.startswith('commandStatusReport.'): return 'UInt8'
              if n=='commandID': return 'UInt16'
              if n in ('taskID','missionStateID','isMissionEnd','isPossible','globalHoverState','headingAcheived','hoverRadiusAcheived','targetTrackingAcheived','operationalCBITStatus','operationalStatus','operationalIBITStatus','collisionAvoidanceFail','alertFuel'): return 'UInt8'
              if n.endswith('repeatNumber') or n=='repeatNumber': return 'UInt8'
              if any(n.endswith(x) for x in ['missionID','totalWaypoint','waypointID','waypointRemaining']): return 'UInt8'
              if n.endswith('arrivalTime') or n in ('timeHoverAcheived','timeHoverCompleted','alertTime') or n.endswith('.endTime'): return 'UInt64'
              if n.endswith('missionType') or n=='missionType': return 'UInt8'
              if n.endswith('targetTrackingID'): return 'UInt32'
              if n.endswith('rangeToTarget'): return 'UInt32'
              if n.endswith('offsetFromTarget'): return 'Int32'
              if n.endswith('searchingRange'): return 'UInt16'
              if n.endswith('timeLimit'): return 'UInt32'
              if n.endswith('endAction'):
                  return 'UInt8'
              if n=='action': return 'UInt32'
              if n=='missionActionCommand': return 'UInt8'
              if n.endswith('restrictedAreaID'): return 'UInt32'
              if n.endswith('pointIndex') or n=='pointIndex':
                  cb=e
                  while cb is not None and etree.QName(cb).localname not in ('ControlBinding','MonitorBinding','Reply','Element'): cb=cb.getparent()
                  # Return route and StartMission are UInt8; common mission / restricted data index is UInt32 unless named return point.
                  if 'returnToBasePointDataSequence' in ''.join(a.get('name','') for a in e.iterancestors() if hasattr(a,'get')): return 'UInt8'
                  control=e.xpath('ancestor::u:ControlBinding[1]/@semantic_id',namespaces=NS)
                  if control and control[0] in ('startMission','resumeMission','abortMission'): return 'UInt8'
                  if 'RoutePoint.Index' in c: return 'UInt8'
                  return 'UInt32'
              if n.endswith('totalPointNum') or n=='totalPointNum': return 'UInt32'
              if n.endswith('lateralErrorTolerance'):
                  control=e.xpath('ancestor::u:ControlBinding[1]/@semantic_id',namespaces=NS)
                  if control and control[0]=='recordWaypointMission': return 'UInt32'
                  return 'Float64'
              if n in ('fuelQuantityRemain','fuelQuantityPercent'): return 'Float32'
              if n.endswith('cpuTemperature') or n.endswith('cpuLoad'): return 'Float64'
              # all position/motion/tolerance/report distances are doubles in source, except desiredVelocity for emergency return
              if any(k in n.lower() for k in ['latitude','longitude','distance','velocity','crosstrackerror','cumulativedistance','heading','radius','yawangle','goalerrortolerance','goalerror']):
                  control=e.xpath('ancestor::u:ControlBinding[1]/@semantic_id',namespaces=NS)
                  if n=='desiredVelocity' and control and control[0]=='setEmergencyReturnRoute': return 'UInt32'
                  return 'Float64'
              if c=='Autonomy.Mission.Type': return 'UInt8'
              if c.endswith('.Possible') or c.endswith('.MissionState') or c.endswith('.State') or c.endswith('.PositionAchieved') or c.endswith('.SpeedAchieved'): return 'UInt8'
              return None
          for e in bt.xpath('//u:Field|//u:FixedField|//u:DerivedField',namespaces=NS):
              if e.get('name') in ('usvHeader','destination'): continue
              if e.get('dataType') is None:
                  d=dtype_for(e)
                  if d: e.set('dataType',d)
          # ValueMaps for known logical enums.
          mission_names=['Waypoint','GlobalHover','TargetTracking','PointAndGo','AutonomousNavigation','SurfaceReconnaissance','UnderwaterReconnaissance','AutonomousDocking']
          for e in bt.xpath('//u:Field',namespaces=NS):
              n=e.get('name',''); c=e.get('cdm','')
              if n=='taskID': vm(e,[('Platform.OperationMode.LocalManual',0),('Platform.OperationMode.RemoteManual',1),('Platform.OperationMode.Autonomous',2)]); e.set('dataType','UInt8')
              elif n=='missionStateID': vm(e,[(f'Autonomy.Mission.Type.{x}',i) for i,x in enumerate(mission_names,1)]); e.set('dataType','UInt8')
              elif c=='Autonomy.Mission.Type': vm(e,[(f'Autonomy.Mission.Type.{x}',i) for i,x in enumerate(mission_names)]); e.set('dataType','UInt8')
              elif c.endswith('PositionAchieved') or c.endswith('SpeedAchieved'):
                  vm(e,[('Condition.NotAchieved',0),('Condition.Achieved',1)]); e.set('dataType','UInt8')
              elif n=='globalHoverState': vm(e,[('Autonomy.GlobalHover.State.Preparing',0),('Autonomy.GlobalHover.State.Started',1),('Autonomy.GlobalHover.State.Completed',2)]); e.set('dataType','UInt8')
              elif n=='isMissionEnd':
                  vm(e,[('Mission.Execution.Executing',0),('Mission.Execution.Ended',1),('Mission.Execution.Standby',2)]); e.set('dataType','UInt8')
              elif n=='isPossible':
                  vm(e,[('Mission.Availability.Possible',0),('Mission.Availability.Impossible',1)]); e.set('dataType','UInt8')
              elif c in ('Health.CBIT.AutonomousNavigation.Status','Health.PBIT.AutonomousNavigation.Status','Health.IBIT.AutonomousNavigation.Status'):
                  vm(e,HEALTH_VM); e.set('dataType','UInt8')
              elif c=='Autonomy.CollisionAvoidance.Status': vm(e,[('Autonomy.CollisionAvoidance.Possible',0),('Autonomy.CollisionAvoidance.Impossible',1)]); e.set('dataType','UInt8')
              elif c=='Platform.Fuel.Alert': vm(e,[('Platform.Fuel.Alert.Low',0),('Platform.Fuel.Alert.Critical',1)]); e.set('dataType','UInt8')
              elif c=='Autonomy.Mission.Record.EndAction': vm(e,[('Autonomy.Mission.Record.EndAction.Drift',0),('Autonomy.Mission.Record.EndAction.WeatherVaning',1)]); e.set('dataType','UInt8')
              elif c=='Autonomy.Return.EndAction': vm(e,[('Autonomy.Return.EndAction.Drift',0),('Autonomy.Return.EndAction.HoldPosition',1),('Autonomy.Return.EndAction.Signal',2)]); e.set('dataType','UInt32')
          # Update stale binding comments.
          for c in bt.xpath('//comment()'):
              t=c.text or ''
              if 'Subtract1 converter' in t: c.text='missionStateID wire 1~8은 Binding ValueMap으로 Semantic Mission.Type에 직접 매핑한다. taskID 물리 필드명은 유지하되 Semantic 의미는 Platform.OperationMode로 매핑한다.'
              if 'Scale0.01:' in t: c.text='searchingRange는 Semantic[m] × 100을 UInt16 wire raw로 송신하고 수신 시 raw/100으로 해석한다. timeLimit의 단위는 원문 추가 확인 대상이다.'
              if 'distanceRemaining 원문 Unit은 - 이지만' in t: c.text='AutonomousDocking distanceRemaining 원문 Unit은 미기재이므로 Binding은 Float64 wire 값만 선언하고 Semantic 단위를 추정하지 않는다.'
          write(st,sd); write(bt,bd)

          # ---------- OpenIssues ----------
          Path('ProtocolXml/USV/NearContactDetection/NearContactDetection_OpenIssues.md').write_text('''# NearContactDetection Semantic/Binding 감사 및 Open Issues\n\n## 1. 범위\n\n- 대상 경계: 원격통제장치(RCU) ↔ 근거리접촉물탐지장치(SCDE).\n- 근거리접촉물탐지장치는 RCU와 직접 연동된다. RCU 직접 대상은 서라운드뷰 RTP, SCDE/Lidar CBIT·PBIT·IBIT, CommandStatus ACK 및 공통 Integration/Restart/PBIT/IBIT Control이다.\n- ContactReport/WaveReport와 라이다 정보처리 CSC 전용 RTP는 RCU 직접 접점이 아니므로 제외한다.\n\n## 2. 이번 감사에서 확정/반영\n\n- 공용 Control destination은 `System.Target.NearContactDetection`으로 준비하고 물리 식별자는 SurfaceDetection 0x03 / NearContactDetection 0x04 / subEquipment 0x00을 사용한다.\n- SCDE/Lidar 상태 0=Normal, 1=Degraded, 2=Unavailable, 3=NoResponse를 Semantic 논리값 + Binding ValueMap으로 분리하였다.\n- SCDE IBIT에서 원문에 bit 의미가 직접 명시된 PowerManaging, ECU1~3, T1Converter1~2, EthernetHub, 4D Radar1, RGB Contact1, RGB SVM1만 PackedField로 분해하였다.\n- 4D Radar2~9, RGB Contact2~9, RGB SVM2~6는 동일 구조를 추정하지 않고 UInt8 Raw로 유지하였다.\n- Lidar IBIT category(UInt16), level(UInt8), sensorAction(UInt8)은 원문 bit 위치를 PackedField로 선언하고 mapping ID는 UInt32로 반영하였다.\n- PBIT/IBIT는 CommandStatus 처리 ACK와 SCDE/Lidar 실제 결과 Reply를 분리하였다.\n- 기존 header/commandID converter를 제거하고 공통 XSD 경로를 정리하였다.\n\n## 3. Remaining TBD\n\n1. **공통 PBIT/IBIT 요청의 SCDE/Lidar 결과 fan-out 규칙**: 하나의 RCU 요청 후 SCDE 결과와 내부 Lidar 결과가 모두 오는 운용 규칙 및 source routing을 Adapter에서 재확인할 필요가 있다.\n2. **PBIT/IBIT Result correlation**: 전용 결과 메시지에 commandID가 없어 처리 ACK 이후 요청과 결과의 런타임 연결 규칙 확인이 필요하다.\n3. **반복 장치 상세 bit 의미**: 4D Radar2~9, RGB Contact2~9, RGB SVM2~6는 원문에 개별 bit 설명이 없어 1번 장치 구조를 복제하지 않았다.\n4. **Lidar level/action flag 조합 규칙**: bit 위치는 명확하지만 Level 및 SensorAction의 다중 bit 동시 설정 가능 여부/우선순위는 원문에 없다.\n5. **서라운드뷰 RTP IP/Port**: 스트림 존재와 RCU 목적지는 확인되나 구체 IP/Port 설정은 별도 ICD/설정 근거가 필요하다.\n\n## 4. 현재 상태\n\n- 원통 직접 연동 범위의 Semantic/Binding 정리는 완료하였다.\n- 남은 5건은 사용자 정책 선택사항이 아니라 추가 ICD/Adapter/원문 확인이 필요한 비차단 TBD이다.\n''',encoding='utf-8')
          Path('ProtocolXml/USV/AutonomousNavigation/AutonomousNavigation_OpenIssues.md').write_text('''# AutonomousNavigation Semantic/Binding 감사 및 Open Issues\n\n## 1. 범위\n\n- 대상 경계: 원격통제장치(RCU) ↔ 자율운항장치(ANU).\n- RCU 직접 대상인 임무수행 상태, 레코드 ACK, PBIT/CBIT/IBIT, 충돌회피 불가, 연료경고, 전체 임무경로점 및 17개 Control을 포함한다.\n- ANU→선체제어장치 `USVControlType`은 RCU 직접 접점이 아니므로 제외한다.\n\n## 2. 이번 감사에서 확정/반영\n\n- 공용 Control destination은 `System.Target.AutonomousNavigation`으로 준비하며 공용 식별자는 AutonomousControl 0x02 / AutoNavControlCard 0x01이다.\n- Semantic의 raw 숫자 enum을 제거하고 운용모드, 임무종류, 임무상태, 수행가능여부, BIT, 충돌회피, 연료경고, EndAction을 논리값으로 정의하였다.\n- `missionStateID` wire 1~8은 converter 없이 Binding ValueMap으로 8개 Mission.Type 논리값에 연결하였다.\n- 레코드 명령/ACK의 공용 구조체 primitive type을 반영하고 CommandStatus ACK와 RecordCommand echo Reply를 분리 유지하였다.\n- Underwater `searchingRange`는 UInt16 raw와 Semantic meter 간 `scale=100`으로 선언하여 `Scale0.01` converter를 제거하였다.\n- PBIT/IBIT는 처리 ACK와 전용 결과 Reply를 분리하고 ProcessorIBIT 온도/CPU Load 결과를 반영하였다.\n- 원문에 값 의미가 없는 `headingAcheived`, `hoverRadiusAcheived`, `targetTrackingAcheived`는 임의 0/1 enum 가정을 제거하였다.\n- AutonomousDocking `distanceRemaining`은 원문 Unit 미기재이므로 기존 m 추정을 제거하였다.\n\n## 3. Remaining TBD\n\n1. **RecordCommand Size 불일치**: RCU/ANU CSCI의 Size 열과 동일 타입의 공용 구조체 실제 필드/sequence가 일치하지 않는다. 현재 공용 구조체를 우선한다.\n2. **PBIT/IBIT Result correlation**: 전용 ANUPBIT/ANUIBIT 결과에 commandID가 없어 처리 ACK 이후 매칭 규칙 확인이 필요하다.\n3. **Achieved 상태 code**: GlobalHover `headingAcheived`/`hoverRadiusAcheived`, TargetTracking `targetTrackingAcheived`는 octet이지만 raw 값 의미가 원문에 없다.\n4. **GlobalHover 시간 의미/인코딩**: timeHoverAcheived/timeHoverCompleted의 절대시각·지속시간 의미와 UInt64 인코딩 기준이 불명확하다.\n5. **상태 거리/각도 Unit**: distancePointRemaining, errorYawAngle, distanceTargetRemaining의 Unit이 원문에 없다.\n6. **AutonomousDocking distance Unit**: 동일 이름의 다른 상태 메시지와 달리 원문 Unit이 미기재되어 단위를 추정하지 않았다.\n7. **Fuel 필드 Unit/시간 인코딩**: fuelQuantityRemain, fuelQuantityPercent의 명시적 Unit과 alertTime UInt64 인코딩 규칙 확인이 필요하다.\n8. **Underwater timeLimit Unit**: 시간 제한이라는 의미와 범위는 있으나 wire Unit이 원문에 명확히 기재되지 않았다.\n9. **TargetTracking range 1~49**: 0은 충돌회피만 수행, 50~2000은 이격거리 유지로 정의되지만 1~49의 의미는 없다.\n10. **targetTrackingID X.Y 식별 체계**: `0xX.Y.0001~0xX.Y.FFFE`의 X/Y 의미는 원문에 정의되지 않았다.\n11. **RestrictArea 형상 규칙**: 두 좌표점만 제공되며 이를 사각형/다각형으로 구성하는 규칙이 없다.\n12. **EmergencyReturn action=3**: Range에는 포함되지만 0~2만 의미가 정의되어 3은 Semantic에서 제외하였다.\n13. **Record echo correlation**: 전용 RecordCommandAckReport는 commandID가 없어 CommandStatus ACK와 echo의 런타임 상관관계 확인이 필요하다.\n14. **Aided record/time conventions**: 레코드의 endTime/arrivalTime 등 UInt64 시간값의 공통 epoch/format이 원문에 없다.\n\n## 4. 현재 상태\n\n- RCU 직접 연동 범위의 Semantic/Binding 구조 정리는 완료하였다.\n- 남은 14건은 사용자 정책 선택사항이 아니라 추가 CSCI/IDL/Adapter 근거가 필요한 비차단 TBD이다.\n''',encoding='utf-8')

          # ---------- validation ----------
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')); bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          for dev in ('NearContactDetection','AutonomousNavigation'):
              sp=f'ProtocolXml/USV/{dev}/{dev}Semantic.xml'; bp=f'ProtocolXml/USV/{dev}/{dev}Binding.xml'
              for path,schema in ((sp,sx),(bp,bx)):
                  doc=etree.parse(path)
                  if not schema.validate(doc):
                      print('FAIL',path); print(schema.error_log); raise SystemExit(1)
                  print('PASS',path)
              s=Path(sp).read_text(); b=Path(bp).read_text()
              if 'converter=' in b: raise SystemExit(f'converter remains: {dev}')
              tr=etree.parse(sp); br=etree.parse(bp)
              raw=[v.text for v in tr.xpath('//u:Value',namespaces=NS) if v.text and re.fullmatch(r'\s*[-+]?\d+(?:\.\d+)?\s*',v.text)]
              if raw: raise SystemExit(f'raw semantic enum remains {dev}: {raw[:10]}')
              cs={x.get('id') for x in tr.xpath('//u:ControlSpec',namespaces=NS)}; cb={x.get('semantic_id') for x in br.xpath('//u:ControlBinding',namespaces=NS)}
              if cs!=cb: raise SystemExit(f'control mismatch {dev}: {cs^cb}')
              sr={x.get('bindRef') for x in tr.xpath('//u:ControlSpec/u:Reply',namespaces=NS)}; rr={x.get('semantic_id') for x in br.xpath('//u:ControlBinding/u:Reply',namespaces=NS)}
              if sr!=rr: raise SystemExit(f'reply mismatch {dev}: {sr^rr}')
              print(dev,'controls',len(cs),'replies',len(sr),'converter',b.count('converter='),'rawenum',len(raw),'comments',s.count('<!--')+b.count('<!--'))
          PY
          python /tmp/apply.py
      - name: Commit audited files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProtocolXml/USV/NearContactDetection ProtocolXml/USV/AutonomousNavigation
          git diff --cached --check
          git commit -m "Audit final RCU-connected USV semantic bindings"
          git push origin HEAD:feature/usv-semantic-binding-audit
