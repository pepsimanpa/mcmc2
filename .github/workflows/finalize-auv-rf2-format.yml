name: Finalize AUV RF2 Format
on:
  push:
    branches: [feature/auv-declarative-binding-cleanup]
    paths: ['.github/workflows/finalize-auv-rf2-format.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-declarative-binding-cleanup
          fetch-depth: 0
      - name: Fix checksum indentation and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          for f in ['ProtocolXml/AUV/AuvPlatformRfBinding.xml','ProtocolXml/AUV/AuvRfCommBinding.xml']:
              p=Path(f); s=p.read_text(encoding='utf-8')
              s=s.replace('\n<Field name="checksum" dataType="UInt16"/>','\n                <Field name="checksum" dataType="UInt16"/>')
              p.write_text(s,encoding='utf-8',newline='')
              etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd')).assertValid(etree.parse(f))
              print('PASS',f)
          PY
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/AUV/AuvPlatformRfBinding.xml ProtocolXml/AUV/AuvRfCommBinding.xml
          git rm .github/workflows/finalize-auv-rf2-format.yml
          git commit -m 'Finalize AUV RF-2 reply formatting'
          git push origin HEAD:feature/auv-declarative-binding-cleanup
# trigger
