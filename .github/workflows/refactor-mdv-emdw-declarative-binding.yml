name: Refactor MDV EMDW Declarative Binding

on:
  push:
    branches:
      - feature/auv-reply-bit-binding
    paths:
      - '.github/workflows/refactor-mdv-emdw-declarative-binding.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0

      - name: Refactor MDV and EMDW to declarative Binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          NS='http://lignex1.com/mcmc2/umsSchema'; ET.register_namespace('',NS); ET.register_namespace('xsi','http://www.w3.org/2001/XMLSchema-instance'); q=lambda n:f'{{{NS}}}{n}'

          p=Path('ProtocolXml/XSD/CommonSpecSchema.xsd'); s=p.read_text(encoding='utf-8')
          old='''            <xs:extension base="xs:string">\n                <xs:attribute name="cdm" type="CdmRefType" use="optional" />\n            </xs:extension>'''; new='''            <xs:extension base="xs:string">\n                <xs:attribute name="name" type="xs:string" use="optional" />\n                <xs:attribute name="cdm" type="CdmRefType" use="optional" />\n            </xs:extension>'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='')

          p=Path('ProtocolXml/XSD/VehicleSpecificationSchema.xsd'); s=p.read_text(encoding='utf-8')
          if 'name="DataEncoding"' not in s:
              s=s.replace('<xs:element name="Identification" type="IdentificationType" minOccurs="1" />','<xs:element name="Identification" type="IdentificationType" minOccurs="1" />\n            <xs:element name="DataEncoding" type="DataEncodingType" minOccurs="0" />',1)
              marker='    <xs:complexType name="IdentificationType">'; addition='''    <xs:simpleType name="VehicleByteOrderType">\n        <xs:restriction base="xs:string"><xs:enumeration value="little"/><xs:enumeration value="big"/></xs:restriction>\n    </xs:simpleType>\n    <xs:complexType name="DataEncodingType"><xs:attribute name="byteOrder" type="VehicleByteOrderType" use="required"/></xs:complexType>\n\n'''
              s=s.replace(marker,addition+marker,1)
          p.write_text(s,encoding='utf-8',newline='')

          for spec in ['ProtocolXml/MDV/MdvSpecification.xml','ProtocolXml/EMDW/EmdwSpecification.xml']:
              p=Path(spec); s=p.read_text(encoding='utf-8')
              if '<DataEncoding ' not in s: s=s.replace('    </Identification>','    </Identification>\n    <DataEncoding byteOrder="little"/>',1)
              p.write_text(s,encoding='utf-8',newline='')

          maps_by_platform={}
          for platform,path in [('MDV','ProtocolXml/MDV/MdvPlatformSemantic.xml'),('EMDW','ProtocolXml/EMDW/EmdwPlatformSemantic.xml')]:
              tree=ET.parse(path); root=tree.getroot(); maps={}
              for vs in root.iter(q('ValueSetSpec')):
                  vals=vs.find(q('Values')); parent=vs.get('cdm'); pairs=[]
                  if vals is None or not parent: continue
                  for v in vals.findall(q('Value')):
                      raw=(v.text or '').strip(); leaf=v.get('cdm')
                      if leaf and re.fullmatch(r'(?:0x[0-9A-Fa-f]+|-?\d+)',raw):
                          pairs.append((leaf,raw)); v.set('name',v.get('name') or leaf.split('.')[-1]); v.text=None
                  if pairs: maps[parent]=pairs
              maps_by_platform[platform]=maps; ET.indent(tree,space='    '); tree.write(path,encoding='utf-8',xml_declaration=True)

          mission_type=[('Mission.Type.Move','0'),('Mission.Type.Search','1'),('Mission.Type.Identification','2')]
          waypoint_action=[('MissionPlan.Waypoint.Action.Pass','0'),('MissionPlan.Waypoint.Action.Wait','1')]
          emergency_reason=[('Platform.EmergencyStop.Reason.OperatorCommand','0'),('Platform.EmergencyStop.Reason.SystemDecision','1'),('Platform.EmergencyStop.Reason.CommunicationFailure','2'),('Platform.EmergencyStop.Reason.Fault','3'),('Platform.EmergencyStop.Reason.Other','4')]
          command_result=[('Command.Result.Success','0'),('Command.Result.Failure','1')]
          mdv_reason=[('Command.Result.Reason.None','0'),('Command.Result.Reason.InvalidRequest','1'),('Command.Result.Reason.InvalidMissionPlan','2'),('Command.Result.Reason.ModeChangeUnavailable','3'),('Command.Result.Reason.ModeMismatch','4'),('Command.Result.Reason.PlatformDisconnected','5'),('Command.Result.Reason.AbnormalOperationState','6'),('Command.Result.Reason.Other','7')]
          emdw_reason=[('Command.Result.Reason.None','0'),('Command.Result.Reason.InvalidRequest','1'),('Command.Result.Reason.InvalidMissionPlan','2'),('Command.Result.Reason.ModeChangeUnavailable','3'),('Command.Result.Reason.ModeMismatch','4'),('Command.Result.Reason.PlatformDisconnected','5'),('Command.Result.Reason.AbnormalOperationState','6'),('Command.Result.Reason.DisposalConditionNotMet','7'),('Command.Result.Reason.Other','8')]
          simple={'UInt16LE':('UInt16',None,None,None),'UInt32LE':('UInt32',None,None,None),'Float32LE':('Float32',None,None,None),'UInt16Scale10ToDecimalLE':('UInt16','10',None,None),'DecimalToUInt16Scale10LE':('UInt16','10',None,None),'UInt32Scale10ToDecimalLE':('UInt32','10',None,None),'DecimalToUInt32Scale10LE':('UInt32','10',None,None),'Int32Scale10000000ToDecimalLE':('Int32','10000000',None,None),'DecimalToInt32Scale10000000LE':('Int32','10000000',None,None),'UInt8Array16':('UInt8',None,'16','uuid'),'UuidToUInt8Array16':('UInt8',None,'16','uuid'),'ArrayLengthUInt16':('UInt16',None,None,None),'IncrementingUInt32LE':('UInt32',None,None,None)}
          times={'YearToUInt16LE':('UInt16','System.Time.Year'),'MonthToUInt8':('UInt8','System.Time.Month'),'DateToUInt8':('UInt8','System.Time.Date'),'HourToUInt8':('UInt8','System.Time.Hour'),'MinuteToUInt8':('UInt8','System.Time.Minute'),'SecondToUInt8':('UInt8','System.Time.Second'),'MillisecondToUInt16LE':('UInt16','System.Time.Millisecond')}
          enums={'MissionTypeToCode':mission_type,'MissionWaypointActionToCode':waypoint_action,'EmergencyStopReasonToCode':emergency_reason,'CommandResultCodeToState':command_result,'UInt16LEToMdvCommandReasonState':mdv_reason,'UInt16LEToEmdwCommandReasonState':emdw_reason}
          common={'preamble':'UInt32','sourceDeviceId':'UInt16','destinationDeviceId':'UInt16','headerSourceDeviceId':'UInt16','headerDestinationDeviceId':'UInt16','infoCode':'UInt16','packetLength':'UInt32','systemTimeYear':'UInt16','systemTimeMonth':'UInt8','systemTimeDate':'UInt8','systemTimeHour':'UInt8','systemTimeMinute':'UInt8','systemTimeSecond':'UInt8','systemTimeMillisecond':'UInt16','headerReserved':'UInt8','tail':'UInt32'}
          fixed={**common,'missionCtrlCmd':'UInt8','operationMode':'UInt8','emergencyStopType':'UInt8','disposalCmd':'UInt8','emergencyStopReason':'UInt8'}
          def vmap(el,pairs):
              vm=el.find(q('ValueMap'))
              if vm is None:
                  vm=ET.Element(q('ValueMap')); el.insert(0,vm)
                  for c,v in pairs: m=ET.SubElement(vm,q('Map')); m.set('cdm',c); m.set('value',v)
          for platform,path in [('MDV','ProtocolXml/MDV/MdvTcpBinding.xml'),('EMDW','ProtocolXml/EMDW/EmdwTcpBinding.xml')]:
              tree=ET.parse(path); root=tree.getroot(); sm=maps_by_platform[platform]; unknown=[]
              for el in root.iter():
                  local=el.tag.rsplit('}',1)[-1]
                  if local not in {'Field','DerivedField','FixedField','BitMember','PackedField'}: continue
                  if local=='Field' and el.get('name')=='currentWaypointIndex' and any(d.get('converter') in {'WaypointIndexToAvailable','WaypointIndexToIndexWhenAvailable'} for d in el.findall(q('DerivedSemantic'))):
                      for child in list(el): el.remove(child)
                      el.attrib.pop('converter',None); el.attrib.pop('cdm',None); el.set('dataType','UInt16')
                      se=ET.SubElement(el,q('Sentinel')); se.set('value','0xFFFF'); st=ET.SubElement(se,q('Set')); st.set('cdm','MissionPlan.CurrentWaypoint.Available'); st.set('value','false')
                      no=ET.SubElement(el,q('Normal')); st=ET.SubElement(no,q('Set')); st.set('cdm','MissionPlan.CurrentWaypoint.Available'); st.set('value','true'); bd=ET.SubElement(no,q('Bind')); bd.set('cdm','MissionPlan.CurrentWaypointIndex'); continue
                  conv=el.get('converter')
                  if conv:
                      if conv in simple:
                          dt,sc,ln,fmt=simple[conv]; el.set('dataType',dt)
                          if sc: el.set('scale',sc)
                          if ln: el.set('length',ln)
                          if fmt: el.set('format',fmt)
                          del el.attrib['converter']
                      elif conv in times and local=='DerivedField':
                          dt,src=times[conv]; el.set('dataType',dt); el.set('sourceField',src); del el.attrib['converter']
                      elif conv in enums:
                          el.set('dataType','UInt16' if 'ReasonState' in conv else 'UInt8'); vmap(el,enums[conv]); del el.attrib['converter']
                      else: unknown.append((el.get('name'),conv,local))
                  cdm=el.get('cdm')
                  if local=='Field' and cdm in sm:
                      vmap(el,sm[cdm]); el.set('dataType',el.get('dataType') or ('UInt16' if cdm=='Platform.Status.ReasonCode' else 'UInt8'))
                  name=el.get('name')
                  if local=='Field' and name in common and not el.get('dataType'): el.set('dataType',common[name])
                  if local=='FixedField' and name in fixed and not el.get('dataType'): el.set('dataType',fixed[name])
              if unknown: raise SystemExit(f'{platform} unsupported converters: {unknown}')
              left=[e.get('converter') for e in root.iter() if e.get('converter')]
              if left: raise SystemExit(f'{platform} converter leftovers: {left}')
              ET.indent(tree,space='    '); tree.write(path,encoding='utf-8',xml_declaration=True)

          for path in ['ProtocolXml/XSD/CommonBindingSchema.xsd','ProtocolXml/XSD/CommonSpecSchema.xsd','ProtocolXml/XSD/VehicleSpecificationSchema.xsd','ProtocolXml/MDV/MdvSpecification.xml','ProtocolXml/EMDW/EmdwSpecification.xml','ProtocolXml/MDV/MdvPlatformSemantic.xml','ProtocolXml/EMDW/EmdwPlatformSemantic.xml','ProtocolXml/MDV/MdvTcpBinding.xml','ProtocolXml/EMDW/EmdwTcpBinding.xml']:
              ET.parse(path); print('XML OK',path)
          for path in ['ProtocolXml/MDV/MdvTcpBinding.xml','ProtocolXml/EMDW/EmdwTcpBinding.xml']:
              if 'converter=' in Path(path).read_text(encoding='utf-8'): raise SystemExit(f'converter remains {path}')
          print('MDV/EMDW converter-free refactor passed')
          PY

      - name: Diff safety checks
        shell: bash
        run: |
          git diff --check
          ! grep -R 'converter=' ProtocolXml/MDV/MdvTcpBinding.xml ProtocolXml/EMDW/EmdwTcpBinding.xml
          ! grep -R 'generator=' ProtocolXml/MDV ProtocolXml/EMDW
          ! grep -R 'sourceMember=' ProtocolXml/MDV ProtocolXml/EMDW
          echo 'converter count MDV:' $(grep -o 'converter=' ProtocolXml/MDV/MdvTcpBinding.xml | wc -l)
          echo 'converter count EMDW:' $(grep -o 'converter=' ProtocolXml/EMDW/EmdwTcpBinding.xml | wc -l)

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/XSD/CommonSpecSchema.xsd ProtocolXml/XSD/VehicleSpecificationSchema.xsd ProtocolXml/MDV/MdvSpecification.xml ProtocolXml/EMDW/EmdwSpecification.xml ProtocolXml/MDV/MdvPlatformSemantic.xml ProtocolXml/EMDW/EmdwPlatformSemantic.xml ProtocolXml/MDV/MdvTcpBinding.xml ProtocolXml/EMDW/EmdwTcpBinding.xml
          git commit -m 'Refactor MDV EMDW bindings without converters'
          git push origin HEAD:feature/auv-reply-bit-binding
