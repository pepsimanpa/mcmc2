    branches:
      - feature/auv-reply-bit-binding
    paths:
      - '.github/workflows/refactor-mdv-emdw-declarative-binding.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0
      - name: Verify trigger
        run: echo "Declarative refactor workflow trigger verified"
