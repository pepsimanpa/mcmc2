name: Update Waypoint Availability Docs

on:
  push:
    branches:
      - feature/auv-reply-bit-binding
    paths:
      - '.github/workflows/update-waypoint-docs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0

      - name: Update docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          rules = Path('ProtocolXml/Docs/SemanticBindingRules_20260818.md')
          t = rules.read_text(encoding='utf-8')
          old = '- Reply의 실제 Telegram 및 결과 Field/Bit\n- expectedValue / expectedMask 등 수신 식별 조건'
          new = '- Reply의 실제 Telegram 및 결과 Field/Bit\n- 하나의 물리 Field가 sentinel/state code 등으로 복수의 논리 의미를 포함하면 `Field` 하위 `DerivedSemantic`으로 여러 Semantic CDM을 파생한다. 이때 wire Field 자체를 중복 선언하지 않는다.\n- expectedValue / expectedMask 등 수신 식별 조건'
          if t.count(old) != 1:
              raise SystemExit(f'SemanticBindingRules match={t.count(old)}')
          rules.write_text(t.replace(old,new), encoding='utf-8', newline='')

          doc = Path('ProtocolXml/Docs/MdvEmdwDesignDecisions_20260825.md')
          t = doc.read_text(encoding='utf-8')
          pattern = re.compile(r'## 7\. Current Waypoint Index\n\n\*\*Status: RESOLVED / BINDING APPLIED\*\*\n.*?`65535`를 정상 Semantic Quantity 값으로 재도입하지 않는다\.', re.S)
          new7 = '''## 7. Current Waypoint Index / Availability

**Status: RESOLVED / APPLIED**

정상 경유점 인덱스 범위:
- `0~65534`
- 0-based index

특수 wire 값:
- `0xFFFF` = 현재 추종 경유점 없음

Semantic은 물리 sentinel 값을 직접 노출하지 않고 다음 두 항목으로 표현한다.
- `currentWaypointAvailable` / `MissionPlan.CurrentWaypoint.Available`: 현재 추종 경유점 존재 여부
- `currentWaypointIndex` / `MissionPlan.CurrentWaypointIndex`: 현재 추종 경유점 인덱스 (`0~65534`)

Binding은 단일 물리 `currentWaypointIndex` Field를 중복 선언하지 않고 `DerivedSemantic`으로 두 의미를 파생한다.
- raw `0~65534` → `currentWaypointAvailable=true`, `currentWaypointIndex=raw`
- raw `0xFFFF` → `currentWaypointAvailable=false`, `currentWaypointIndex`는 의미값 없음'''
          t, n = pattern.subn(new7, t)
          if n != 1:
              raise SystemExit(f'Decision section7 match={n}')

          old_conv = '''### `UInt16LECurrentWaypointIndexOrNone`
- raw `0~65534` → 동일 0-based 현재 Waypoint index
- raw `0xFFFF` → 현재 추종 경유점 없음

MDV/EMDW Mission Progress Binding에 적용하였다.'''
          new_conv = '''### `WaypointIndexToAvailable` / `WaypointIndexToIndexWhenAvailable`
`Field converter="UInt16LE"`로 raw 값을 decode한 뒤 동일 물리값에서 두 Semantic 값을 파생한다.
- `WaypointIndexToAvailable`: `0~65534 → true`, `0xFFFF → false`
- `WaypointIndexToIndexWhenAvailable`: `0~65534 → 동일 index`, `0xFFFF → 의미값 없음`

MDV/EMDW Mission Progress Binding에 적용하였다.'''
          if t.count(old_conv) != 1:
              raise SystemExit(f'Decision converter match={t.count(old_conv)}')
          t = t.replace(old_conv, new_conv)

          marker = '- currentWaypointIndex 정상 범위 `0~65534` 적용\n'
          if t.count(marker) != 1:
              raise SystemExit(f'Implementation marker match={t.count(marker)}')
          t = t.replace(marker, marker + '- `currentWaypointAvailable` Boolean 상태 및 단일 wire Field → 복수 `DerivedSemantic` 매핑 적용\n', 1)
          doc.write_text(t, encoding='utf-8', newline='')
          PY

      - name: Commit docs
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/Docs/SemanticBindingRules_20260818.md ProtocolXml/Docs/MdvEmdwDesignDecisions_20260825.md
          git commit -m 'Document current waypoint availability mapping'
          git push origin HEAD:feature/auv-reply-bit-binding
