name: temporary final two validation
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - run: python -m pip install --quiet lxml
      - name: Validate final device XMLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re, subprocess
          URI='http://lignex1.com/mcmc2/umsSchema'; NS={'u':URI}
          base='846d47a60025b6f4bde4bc37f61b7a2493f850fd'
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          failed=False
          for dev in ('NearContactDetection','AutonomousNavigation'):
              sp=Path(f'ProtocolXml/USV/{dev}/{dev}Semantic.xml'); bp=Path(f'ProtocolXml/USV/{dev}/{dev}Binding.xml')
              sr=etree.parse(str(sp)); br=etree.parse(str(bp))
              print('\n===',dev,'===')
              for p,doc,schema in ((sp,sr,sx),(bp,br,bx)):
                  ok=schema.validate(doc); print('XSD', 'PASS' if ok else 'FAIL', p)
                  if not ok:
                      failed=True
                      for e in schema.error_log: print(e)
              controls={x.get('id') for x in sr.xpath('//u:ControlSpec',namespaces=NS)}
              cb={x.get('semantic_id') for x in br.xpath('//u:ControlBinding',namespaces=NS)}
              replies={x.get('bindRef') for x in sr.xpath('//u:ControlSpec/u:Reply',namespaces=NS)}
              rb={x.get('semantic_id') for x in br.xpath('//u:ControlBinding/u:Reply',namespaces=NS)}
              monitors={x.get('id') for x in sr.xpath('//u:MonitorSpecs/*',namespaces=NS)}
              mb={x.get('semantic_id') for x in br.xpath('//u:MonitorBinding',namespaces=NS)}
              products={x.get('id') for x in sr.xpath('//u:ProductStreamSpec',namespaces=NS)}
              pb={x.get('semantic_id') for x in br.xpath('//u:ProductBinding',namespaces=NS)}
              print('counts controls',len(controls),len(cb),'replies',len(replies),len(rb),'monitors',len(monitors),len(mb),'products',len(products),len(pb))
              print('control diff',controls^cb); print('reply diff',replies^rb); print('monitor diff',monitors^mb); print('product diff',products^pb)
              if controls!=cb or replies!=rb or monitors!=mb or products!=pb: failed=True
              bt=bp.read_text(); st=sp.read_text()
              raw=[v.text.strip() for v in sr.xpath('//u:Value',namespaces=NS) if v.text and re.fullmatch(r'\s*[-+]?\d+(?:\.\d+)?\s*',v.text)]
              print('converter',bt.count('converter='),'raw_semantic_enum',len(raw))
              if bt.count('converter=') or raw: failed=True
              missing=[]
              for e in br.xpath('//u:Field|//u:FixedField|//u:DerivedField',namespaces=NS):
                  n=e.get('name','')
                  if n in ('usvHeader','destination') or n.endswith('.usvHeader'): continue
                  if e.get('dataType') is None:
                      missing.append((etree.QName(e).localname,n,e.get('cdm')))
              print('missing_dataType',len(missing))
              for x in missing: print('MISSING',x)
              # Comment preservation comparison against pre-task base.
              curr=[]
              for p in (sp,bp):
                  doc=etree.parse(str(p)); curr += [' '.join((c.text or '').split()) for c in doc.xpath('//comment()')]
              old=[]
              for p in (sp,bp):
                  out=subprocess.check_output(['git','show',f'{base}:{p.as_posix()}'])
                  doc=etree.fromstring(out,parser=etree.XMLParser(remove_comments=False))
                  old += [' '.join((c.text or '').split()) for c in doc.xpath('//comment()')]
              removed=[x for x in old if x not in curr]
              added=[x for x in curr if x not in old]
              print('comments old/current',len(old),len(curr),'removed',len(removed),'added',len(added))
              for x in removed: print('REMOVED_COMMENT:',x)
              for x in added: print('ADDED_COMMENT:',x)
          if failed: raise SystemExit(1)
          PY
