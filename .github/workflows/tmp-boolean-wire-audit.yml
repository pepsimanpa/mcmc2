name: temporary Boolean wire audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Audit Boolean semantic to direct binding fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns='http://lignex1.com/mcmc2/umsSchema'
          q=lambda x:f'{{{ns}}}{x}'
          roots=['ProtocolXml/USV','ProtocolXml/AUV','ProtocolXml/MDV','ProtocolXml/EMDW']
          for root in roots:
              print('\n###', root)
              for sp in Path(root).rglob('*Semantic.xml'):
                  try: sroot=ET.parse(sp).getroot()
                  except Exception: continue
                  bools={e.get('cdm'):e.get('id') for e in sroot.iter(q('BooleanSpec')) if e.get('cdm')}
                  bools.update({e.get('cdm'):'(profile)' for e in sroot.iter(q('BooleanProfile')) if e.get('cdm')})
                  if not bools: continue
                  print('SEM', sp, 'boolean_cdms=', len(bools))
                  for bp in sp.parent.glob('*Binding.xml'):
                      broot=ET.parse(bp).getroot()
                      direct=[]; typed=[]
                      for tag in ('Field','FixedField','DerivedField'):
                          for e in broot.iter(q(tag)):
                              c=e.get('cdm'); sf=e.get('sourceField')
                              if c in bools or sf in bools:
                                  item=(tag,e.get('name'),c,sf,e.get('dataType'))
                                  (typed if e.get('dataType') else direct).append(item)
                      if direct or typed:
                          print(' BIND', bp)
                          for x in direct: print('  MISSING', x)
                          for x in typed: print('  TYPED', x)
          PY
