name: Refine AUV Declarative Types
on:
  push:
    branches: [feature/auv-declarative-binding-cleanup]
    paths: ['.github/workflows/refine-auv-declarative-types.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-declarative-binding-cleanup
      - name: Apply declarative RF configuration and direct wire types
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sem=Path('ProtocolXml/AUV/AuvRfCommSemantic.xml')
          s=sem.read_text(encoding='utf-8')
          old='''                <Profile cdm="Communication.RF.Configuration.OperationMode"/>\n                <Profile cdm="Communication.RF.Configuration.TimeSlot"/>\n                <Profile cdm="Communication.RF.Configuration.UHF.Channel"/>\n                <Profile cdm="Communication.RF.Configuration.LBand.Channel"/>\n                <Profile cdm="Communication.RF.Configuration.UHF.Power"/>\n                <Profile cdm="Communication.RF.Configuration.LBand.Power"/>'''
          new='''                <ValueSetProfile cdm="Communication.RF.Configuration.OperationMode">\n                    <Values><Value name="1:1" cdm="Communication.RF.Configuration.OperationMode.OneToOne"/><Value name="1:2" cdm="Communication.RF.Configuration.OperationMode.OneToTwo"/></Values>\n                </ValueSetProfile>\n                <ValueSetProfile cdm="Communication.RF.Configuration.TimeSlot">\n                    <Values><Value name="Time Slot 2" cdm="Communication.RF.Configuration.TimeSlot.Two"/><Value name="Time Slot 4" cdm="Communication.RF.Configuration.TimeSlot.Four"/></Values>\n                </ValueSetProfile>\n                <ValueSetProfile cdm="Communication.RF.Configuration.UHF.Channel">\n                    <Values><Value name="UHF CH 1" cdm="Communication.RF.Configuration.UHF.Channel.Channel1"/><Value name="UHF CH 2" cdm="Communication.RF.Configuration.UHF.Channel.Channel2"/><Value name="UHF CH 3" cdm="Communication.RF.Configuration.UHF.Channel.Channel3"/></Values>\n                </ValueSetProfile>\n                <ValueSetProfile cdm="Communication.RF.Configuration.LBand.Channel">\n                    <Values><Value name="L-Band CH 1" cdm="Communication.RF.Configuration.LBand.Channel.Channel1"/><Value name="L-Band CH 2" cdm="Communication.RF.Configuration.LBand.Channel.Channel2"/><Value name="L-Band CH 3" cdm="Communication.RF.Configuration.LBand.Channel.Channel3"/></Values>\n                </ValueSetProfile>\n                <ValueSetProfile cdm="Communication.RF.Configuration.UHF.Power">\n                    <Values><Value name="OFF" cdm="Communication.RF.Configuration.UHF.Power.Off"/><Value name="LOW" cdm="Communication.RF.Configuration.UHF.Power.Low"/><Value name="HIGH" cdm="Communication.RF.Configuration.UHF.Power.High"/></Values>\n                </ValueSetProfile>\n                <ValueSetProfile cdm="Communication.RF.Configuration.LBand.Power">\n                    <Values><Value name="OFF" cdm="Communication.RF.Configuration.LBand.Power.Off"/><Value name="LOW" cdm="Communication.RF.Configuration.LBand.Power.Low"/><Value name="HIGH" cdm="Communication.RF.Configuration.LBand.Power.High"/></Values>\n                </ValueSetProfile>'''
          if old not in s: raise SystemExit('configureRf Profile block not found')
          s=s.replace(old,new,1)

          result_map={
            'RF 운용모드':('Communication.RF.Configuration.OperationMode',[('1:1','Communication.RF.Configuration.OperationMode.OneToOne'),('1:2','Communication.RF.Configuration.OperationMode.OneToTwo')]),
            'RF Time Slot':('Communication.RF.Configuration.TimeSlot',[('Time Slot 2','Communication.RF.Configuration.TimeSlot.Two'),('Time Slot 4','Communication.RF.Configuration.TimeSlot.Four')]),
            'UHF 채널':('Communication.RF.Configuration.UHF.Channel',[('UHF CH 1','Communication.RF.Configuration.UHF.Channel.Channel1'),('UHF CH 2','Communication.RF.Configuration.UHF.Channel.Channel2'),('UHF CH 3','Communication.RF.Configuration.UHF.Channel.Channel3')]),
            'L-Band 채널':('Communication.RF.Configuration.LBand.Channel',[('L-Band CH 1','Communication.RF.Configuration.LBand.Channel.Channel1'),('L-Band CH 2','Communication.RF.Configuration.LBand.Channel.Channel2'),('L-Band CH 3','Communication.RF.Configuration.LBand.Channel.Channel3')]),
            'UHF 출력':('Communication.RF.Configuration.UHF.Power',[('OFF','Communication.RF.Configuration.UHF.Power.Off'),('LOW','Communication.RF.Configuration.UHF.Power.Low'),('HIGH','Communication.RF.Configuration.UHF.Power.High')]),
            'L-Band 출력':('Communication.RF.Configuration.LBand.Power',[('OFF','Communication.RF.Configuration.LBand.Power.Off'),('LOW','Communication.RF.Configuration.LBand.Power.Low'),('HIGH','Communication.RF.Configuration.LBand.Power.High')]),
          }
          for name,(cdm,vals) in result_map.items():
              old=f'<Result name="{name}" cdm="{cdm}"/>'
              vv=''.join(f'<Value name="{n}" cdm="{v}"/>' for n,v in vals)
              new=f'<ValueSetResult name="{name}" cdm="{cdm}"><Values>{vv}</Values></ValueSetResult>'
              if old not in s: raise SystemExit('Result not found: '+name)
              s=s.replace(old,new,1)
          sem.write_text(s,encoding='utf-8',newline='')

          mode='''<PackedField name="rfConfMode" width="8">\n                <BitMember name="operationMode" cdm="Communication.RF.Configuration.OperationMode" offset="0" width="2">\n                    <ValueMap><Map cdm="Communication.RF.Configuration.OperationMode.OneToOne" value="1"/><Map cdm="Communication.RF.Configuration.OperationMode.OneToTwo" value="2"/></ValueMap>\n                </BitMember>\n                <BitMember name="timeSlot" cdm="Communication.RF.Configuration.TimeSlot" offset="2" width="2">\n                    <ValueMap><Map cdm="Communication.RF.Configuration.TimeSlot.Two" value="1"/><Map cdm="Communication.RF.Configuration.TimeSlot.Four" value="2"/></ValueMap>\n                </BitMember>\n                <BitMember name="uhfChannel" cdm="Communication.RF.Configuration.UHF.Channel" offset="4" width="2">\n                    <ValueMap><Map cdm="Communication.RF.Configuration.UHF.Channel.Channel1" value="1"/><Map cdm="Communication.RF.Configuration.UHF.Channel.Channel2" value="2"/><Map cdm="Communication.RF.Configuration.UHF.Channel.Channel3" value="3"/></ValueMap>\n                </BitMember>\n                <BitMember name="lBandChannel" cdm="Communication.RF.Configuration.LBand.Channel" offset="6" width="2">\n                    <ValueMap><Map cdm="Communication.RF.Configuration.LBand.Channel.Channel1" value="1"/><Map cdm="Communication.RF.Configuration.LBand.Channel.Channel2" value="2"/><Map cdm="Communication.RF.Configuration.LBand.Channel.Channel3" value="3"/></ValueMap>\n                </BitMember>\n            </PackedField>'''
          power='''<PackedField name="rfConfPower" width="8">\n                <BitMember name="uhfPower" cdm="Communication.RF.Configuration.UHF.Power" offset="0" width="3">\n                    <ValueMap><Map cdm="Communication.RF.Configuration.UHF.Power.Off" value="1"/><Map cdm="Communication.RF.Configuration.UHF.Power.Low" value="2"/><Map cdm="Communication.RF.Configuration.UHF.Power.High" value="4"/></ValueMap>\n                </BitMember>\n                <BitMember name="lBandPower" cdm="Communication.RF.Configuration.LBand.Power" offset="4" width="3">\n                    <ValueMap><Map cdm="Communication.RF.Configuration.LBand.Power.Off" value="1"/><Map cdm="Communication.RF.Configuration.LBand.Power.Low" value="2"/><Map cdm="Communication.RF.Configuration.LBand.Power.High" value="4"/></ValueMap>\n                </BitMember>\n            </PackedField>'''

          b=Path('ProtocolXml/AUV/AuvRfCommBinding.xml')
          s=b.read_text(encoding='utf-8')
          old_mode='''<DerivedField name="rfConfMode"\n                          sourceField="Communication.RF.Configuration.OperationMode,Communication.RF.Configuration.TimeSlot,Communication.RF.Configuration.UHF.Channel,Communication.RF.Configuration.LBand.Channel"\n                          converter="PackRfConfMode"/>'''
          old_power='''<DerivedField name="rfConfPower"\n                          sourceField="Communication.RF.Configuration.UHF.Power,Communication.RF.Configuration.LBand.Power"\n                          converter="PackRfConfPower"/>'''
          if old_mode not in s or old_power not in s: raise SystemExit('RF conf pack blocks missing')
          s=s.replace(old_mode,mode,1).replace(old_power,power,1)
          if s.count('<Field name="rfConfMode" converter="UnpackRfConfMode"/>') != 2: raise SystemExit('unexpected rfConfMode unpack count')
          if s.count('<Field name="rfConfPower" converter="UnpackRfConfPower"/>') != 2: raise SystemExit('unexpected rfConfPower unpack count')
          s=s.replace('<Field name="rfConfMode" converter="UnpackRfConfMode"/>',mode,2)
          s=s.replace('<Field name="rfConfPower" converter="UnpackRfConfPower"/>',power,2)
          b.write_text(s,encoding='utf-8',newline='')

          # Direct wire converters are represented declaratively using AuvSpecification DataEncoding.
          files=[Path('ProtocolXml/AUV/AuvPlatformRfBinding.xml'),Path('ProtocolXml/AUV/AuvPlatformUcdBinding.xml'),Path('ProtocolXml/AUV/AuvRfCommBinding.xml')]
          direct={'UInt16LE':'UInt16','UInt32LE':'UInt32','Float32LE':'Float32','Int8':'Int8','IncrementingUInt32LE':'UInt32'}
          for p in files:
              s=p.read_text(encoding='utf-8')
              for conv,dt in direct.items():
                  s=s.replace(f' converter="{conv}"',f' dataType="{dt}"')
              s=s.replace(' byteOrder="little"','')
              p.write_text(s,encoding='utf-8',newline='')

          # Add explicit direct physical types/lengths that are fixed by the ICD.
          rf=Path('ProtocolXml/AUV/AuvPlatformRfBinding.xml'); s=rf.read_text(encoding='utf-8')
          repl={
            '<FixedField name="startByte" value="0x7E7E7E7E"/>':'<FixedField name="startByte" value="0x7E7E7E7E" dataType="UInt32"/>',
            '<FixedField name="stopByte" value="0x8181"/>':'<FixedField name="stopByte" value="0x8181" dataType="UInt16"/>',
            '<Field name="auvId" cdm="Platform.Identifier.Numeric"/>':'<Field name="auvId" cdm="Platform.Identifier.Numeric" dataType="UInt8"/>',
            '<FixedField name="remoteSpeed" value="0"/>':'<FixedField name="remoteSpeed" value="0" dataType="UInt8"/>',
            '<FixedField name="remoteDirection" value="0"/>':'<FixedField name="remoteDirection" value="0" dataType="Int8"/>',
            '<FixedField name="dataType" value="0"/>':'<FixedField name="dataType" value="0" dataType="UInt8"/>',
            '<FixedField name="brightness" value="0"/>':'<FixedField name="brightness" value="0" dataType="UInt8"/>',
            '<FixedField name="reserveInformation3" value="0"/>':'<FixedField name="reserveInformation3" value="0" dataType="UInt8" length="8"/>',
            '<Field name="velocity" cdm="MissionPlan.Speed"/>':'<Field name="velocity" cdm="MissionPlan.Speed" dataType="UInt8"/>',
            '<Field name="depth" cdm="MissionPlan.Depth"/>':'<Field name="depth" cdm="MissionPlan.Depth" dataType="UInt8"/>',
            '<FixedField name="reserveInformation2" value="0"/>':'<FixedField name="reserveInformation2" value="0" dataType="UInt8"/>',
            '<Field name="alignInterval" cdm="MissionPlan.AlignmentInterval"/>':'<Field name="alignInterval" cdm="MissionPlan.AlignmentInterval" dataType="UInt8"/>',
            '<FixedField name="custom1" value="0"/>':'<FixedField name="custom1" value="0" dataType="UInt8"/>',
            '<FixedField name="custom2" value="0"/>':'<FixedField name="custom2" value="0" dataType="UInt8"/>',
            '<Field name="batteryPercent" cdm="Platform.Energy.Battery.RemainingPercent"/>':'<Field name="batteryPercent" cdm="Platform.Energy.Battery.RemainingPercent" dataType="UInt8"/>',
            '<Field name="waypointCount" cdm="MissionPlan.WaypointCount"/>':'<Field name="waypointCount" cdm="MissionPlan.WaypointCount" dataType="UInt8"/>',
            '<Field name="informationBody"/>':'<Field name="informationBody" dataType="UInt8" length="62"/>',
          }
          for a,c in repl.items(): s=s.replace(a,c)
          s=s.replace('converter="TargetAuvToInformation1"','dataType="UInt8" converter="TargetAuvToInformation1"')
          s=s.replace('converter="TargetAuvToInformation2"','dataType="UInt8" converter="TargetAuvToInformation2"')
          s=s.replace('converter="TargetAuvToInformation3"','dataType="UInt8" converter="TargetAuvToInformation3"')
          s=s.replace('converter="ArrayLengthUInt8"','dataType="UInt8" converter="ArrayLengthUInt8"')
          s=s.replace('converter="ByteSumModulo65536LE"','dataType="UInt16" converter="ByteSumModulo65536LE"')
          rf.write_text(s,encoding='utf-8',newline='')

          uc=Path('ProtocolXml/AUV/AuvPlatformUcdBinding.xml'); s=uc.read_text(encoding='utf-8')
          s=s.replace('<FixedField name="startByte" value="0x7E7E"/>','<FixedField name="startByte" value="0x7E7E" dataType="UInt16"/>')
          s=s.replace('<FixedField name="reserve1" value="0"/>','<FixedField name="reserve1" value="0" dataType="UInt8"/>')
          s=s.replace('<FixedField name="reserve2" value="0"/>','<FixedField name="reserve2" value="0" dataType="UInt8"/>')
          s=s.replace('converter="ByteSumModulo65536LE"','dataType="UInt16" converter="ByteSumModulo65536LE"')
          uc.write_text(s,encoding='utf-8',newline='')

          rc=Path('ProtocolXml/AUV/AuvRfCommBinding.xml'); s=rc.read_text(encoding='utf-8')
          s=s.replace('<FixedField name="startByte" value="0x7E7E7E7E"/>','<FixedField name="startByte" value="0x7E7E7E7E" dataType="UInt32"/>')
          s=s.replace('<FixedField name="stopByte" value="0x8181"/>','<FixedField name="stopByte" value="0x8181" dataType="UInt16"/>')
          s=s.replace('<FixedField name="reserveInformation1" value="0"/>','<FixedField name="reserveInformation1" value="0" dataType="UInt8" length="2"/>')
          s=s.replace('<FixedField name="edmBattery" value="0"/>','<FixedField name="edmBattery" value="0" dataType="UInt8"/>')
          s=s.replace('<FixedField name="channelScan" value="0"/>','<FixedField name="channelScan" value="0" dataType="UInt8" length="6"/>')
          s=s.replace('<FixedField name="packetErrorRate" value="0"/>','<FixedField name="packetErrorRate" value="0" dataType="UInt8" length="2"/>')
          s=s.replace('<FixedField name="statusCode" value="0"/>','<FixedField name="statusCode" value="0" dataType="UInt8"/>')
          s=s.replace('<FixedField name="reserveInformation1Tail" value="0"/>','<FixedField name="reserveInformation1Tail" value="0" dataType="UInt8" length="11"/>')
          s=s.replace('converter="TargetAuvToInformation1"','dataType="UInt8" converter="TargetAuvToInformation1"')
          s=s.replace('converter="ByteSumModulo65536LE"','dataType="UInt16" converter="ByteSumModulo65536LE"')
          for name in ['uhfChannel1SignalDb','uhfChannel2SignalDb','uhfChannel3SignalDb','lBandChannel1SignalDb','lBandChannel2SignalDb','lBandChannel3SignalDb']:
              s=s.replace(f'<Field name="{name}" ',f'<Field name="{name}" dataType="Int8" ')
          for name in ['uhfPacketErrorRate','lBandPacketErrorRate','edmBatteryPercent']:
              s=s.replace(f'<Field name="{name}" ',f'<Field name="{name}" dataType="UInt8" ')
          rc.write_text(s,encoding='utf-8',newline='')
          PY
          git diff --check
      - name: Validate
        run: |
          python -m pip install --quiet lxml
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          pairs=[
            ('ProtocolXml/AUV/AuvPlatformSemantic.xml','ProtocolXml/XSD/CommonSpecSchema.xsd'),
            ('ProtocolXml/AUV/AuvPlatformRfBinding.xml','ProtocolXml/XSD/CommonBindingSchema.xsd'),
            ('ProtocolXml/AUV/AuvPlatformUcdBinding.xml','ProtocolXml/XSD/CommonBindingSchema.xsd'),
            ('ProtocolXml/AUV/AuvRfCommSemantic.xml','ProtocolXml/XSD/CommonSpecSchema.xsd'),
            ('ProtocolXml/AUV/AuvRfCommBinding.xml','ProtocolXml/XSD/CommonBindingSchema.xsd'),
            ('ProtocolXml/AUV/AuvSpecification.xml','ProtocolXml/XSD/VehicleSpecificationSchema.xsd')]
          for xml,xsd in pairs:
              etree.XMLSchema(etree.parse(xsd)).assertValid(etree.parse(xml)); print('XSD PASS',xml)
          text='\n'.join(Path(p).read_text(encoding='utf-8') for p in ['ProtocolXml/AUV/AuvPlatformRfBinding.xml','ProtocolXml/AUV/AuvPlatformUcdBinding.xml','ProtocolXml/AUV/AuvRfCommBinding.xml'])
          for x in ['converter="UInt16LE"','converter="UInt32LE"','converter="Float32LE"','converter="Int8"','converter="IncrementingUInt32LE"','PackRfConfMode','PackRfConfPower','UnpackRfConfMode','UnpackRfConfPower','byteOrder="little"']:
              assert x not in text, x
          assert '<PackedField name="rfConfMode" width="8">' in Path('ProtocolXml/AUV/AuvRfCommBinding.xml').read_text(encoding='utf-8')
          assert '<ValueSetProfile cdm="Communication.RF.Configuration.OperationMode">' in Path('ProtocolXml/AUV/AuvRfCommSemantic.xml').read_text(encoding='utf-8')
          print('DECLARATIVE DIRECT TYPES PASS')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-auv-declarative-types.yml
          git add -A
          git commit -m 'Refine AUV declarative RF mappings'
          git push origin HEAD:feature/auv-declarative-binding-cleanup
