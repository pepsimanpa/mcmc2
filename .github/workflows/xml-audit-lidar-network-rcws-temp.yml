name: Temporary Lidar Network RCWS XML Audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/xml-audit-lidar-network-rcws-temp.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install lxml
      - name: Audit XML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re
          NS={'u':'http://lignex1.com/mcmc2/umsSchema'}
          for d in ['Lidar','NetworkAbstraction','RemoteFireControl']:
            s=Path(f'ProtocolXml/USV/{d}/{d}Semantic.xml')
            b=Path(f'ProtocolXml/USV/{d}/{d}Binding.xml')
            sd=etree.parse(str(s)); bd=etree.parse(str(b))
            conv=bd.xpath('//@converter')
            nums=[]
            for v in sd.xpath('//u:Value',namespaces=NS):
              t=(v.text or '').strip()
              if re.fullmatch(r'[-+]?\d+(?:\.\d+)?',t): nums.append((v.getparent().getparent().get('id'),v.get('cdm'),t))
            miss=[]
            for x in bd.xpath('//u:Field|//u:FixedField|//u:DerivedField',namespaces=NS):
              if x.get('dataType') is None:
                miss.append((x.tag.split('}')[-1],x.get('name'),x.get('cdm'),x.get('converter')))
            controls=sd.xpath('//u:ControlSpec/@id',namespaces=NS)
            bindings=bd.xpath('//u:ControlBinding/@semantic_id',namespaces=NS)
            replies=sd.xpath('//u:Reply/@bindRef',namespaces=NS)
            breplies=bd.xpath('//u:ControlBinding/u:Reply/@semantic_id',namespaces=NS)
            monitors=sd.xpath('/u:*/*[local-name()="MonitorSpecs"]/*/@id',namespaces=NS)
            bmon=bd.xpath('/u:*/*[local-name()="Monitors"]/u:MonitorBinding/@semantic_id',namespaces=NS)
            products=sd.xpath('/u:*/*[local-name()="SensorProductSpecs"]/*/@id',namespaces=NS)
            bprod=bd.xpath('/u:*/*[local-name()="SensorProducts"]/u:ProductBinding/@semantic_id',namespaces=NS)
            print('\n===',d,'===')
            print('CONTROLS',len(controls),controls)
            print('BINDINGS',len(bindings),bindings)
            print('REPLIES',len(replies),replies)
            print('BREPLIES',len(breplies),breplies)
            print('MONITORS',len(monitors),monitors)
            print('BMON',len(bmon),bmon)
            print('PRODUCTS',len(products),products,'BPROD',bprod)
            print('CONVERTERS',len(conv),sorted(set(conv)))
            print('RAW_NUM_VALUES',len(nums))
            print('RAW_NUM_SAMPLE',nums[:30])
            print('MISSING_DATATYPE',len(miss))
            print('MISSING_SAMPLE',miss[:80])
          PY
