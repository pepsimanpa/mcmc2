name: Review MDV EMDW Consistency

on:
  push:
    branches: [feature/auv-reply-bit-binding]
    paths: ['.github/workflows/review-mdv-emdw-consistency.yml']

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0

      - name: Update unified design rules comment policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ProtocolXml/Docs/UMS_Semantic_Binding_Design_Rules_20260826.md')
          s=p.read_text(encoding='utf-8')
          old='''### 14.1 주석/서식 보존 우선

기존 XML 주석은 단순 장식이 아니라 다음 정보를 포함할 수 있다.
- 원 ICD 해석 근거
- 설계 이유
- 특수값 설명
- 송수신 주의사항
- TBD

따라서 자동 수정 과정에서 기존 주석을 임의 삭제하지 않는다.
'''
          new='''### 14.1 주석/서식 보존 우선

기존 XML 주석은 단순 장식이 아니라 다음 정보를 포함할 수 있다.
- 원 ICD 해석 근거
- 설계 이유
- 특수값 설명
- 송수신 주의사항
- Adapter/OM 검증 조건
- TBD / 미확정 원문 사항

따라서 **Semantic / Binding / Specification XML 수정·리팩터링 시 기존의 유효한 주석은 원칙적으로 보존한다.**

주석 처리 기준:
- 현재 설계와 의미가 동일한 주석: 그대로 유지
- XML 구조만 변경된 주석: 삭제하지 않고 현재 구조(`dataType / scale / ValueMap / Sentinel` 등)에 맞춰 문구 갱신
- 원 ICD의 미확정 사항, 패킷 구조, 검증 조건, 설계 근거를 설명하는 주석: 반드시 유지
- 폐기된 설계(`converter`, `generator`, `sourceMember`, 과거 DerivedSemantic 방식 등)를 전제로 하는 주석: 현재 확정 구조에 맞게 수정하거나 더 이상 유효하지 않을 때만 제거
- 원문보다 강한 추론이나 폐기된 해석을 담은 주석: 그대로 복원하지 않음

주석 삭제는 기능 변경의 부수효과로 허용하지 않으며, 삭제가 필요한 경우 그 내용이 현재 규칙과 실제로 충돌하는지 먼저 확인한다.
'''
          if old not in s: raise SystemExit('14.1 block not found')
          s=s.replace(old,new,1)
          old2='''### 14.4 현재 MDV / EMDW 주석 복구 필요

2026-08-26 선언형 Binding 리팩터링 과정에서 `ElementTree` 전체 재직렬화로 MDV / EMDW XML의 기존 주석 일부가 유실되었다.

이는 의도된 설계 변경이 아니며 **복구 대상**이다.

복구 원칙:
- 리팩터링 직전 XML의 주석을 기준으로 한다.
- 현재 `dataType / scale / ValueMap / Sentinel / converter=0` 구조는 유지한다.
- 기존 주석만 현재 대응 메시지/필드 위치에 복원한다.
- 이미 의미가 변경되어 잘못된 과거 주석은 그대로 복원하지 않고 현재 확정 규칙에 맞게 수정한다.
'''
          new2='''### 14.4 MDV / EMDW 주석 복구 상태

2026-08-26 선언형 Binding 리팩터링 과정에서 `ElementTree` 전체 재직렬화로 MDV / EMDW XML의 기존 주석 일부가 유실되었으나, 이는 의도된 설계 변경이 아니므로 리팩터링 직전 XML을 기준으로 복구하였다.

**Status: RESOLVED / RESTORED**

복구 결과:
- `MdvPlatformSemantic.xml`: 2개
- `MdvTcpBinding.xml`: 75개
- `EmdwPlatformSemantic.xml`: 2개
- `EmdwTcpBinding.xml`: 82개
- 총 161개 주석 복구
- 복구 commit: `b65b55d` (`Restore valid MDV EMDW XML comments`)

복구 시 현재 `dataType / scale / ValueMap / Sentinel / converter=0` 구조는 유지하였다. 현재 설계와 충돌하는 과거 converter/DerivedSemantic 기반 표현이나 원문보다 강한 과거 해석은 그대로 되살리지 않고 현재 확정 규칙에 맞게 갱신하였다.
'''
          if old2 not in s: raise SystemExit('14.4 block not found')
          s=s.replace(old2,new2,1)
          s=s.replace('- MDV / EMDW 리팩터링 이전 주석 복구\n','')
          p.write_text(s,encoding='utf-8',newline='')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/Docs/UMS_Semantic_Binding_Design_Rules_20260826.md
          git commit -m 'Clarify XML comment preservation rules'
          git push origin HEAD:feature/auv-reply-bit-binding

      - name: Run structural consistency audit
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from collections import defaultdict

          NS='http://lignex1.com/mcmc2/umsSchema'
          q=lambda n:f'{{{NS}}}{n}'
          TYPE_SIZE={'UInt8':1,'Int8':1,'UInt16':2,'Int16':2,'UInt32':4,'Int32':4,'UInt64':8,'Int64':8,'Float32':4,'Float64':8}

          platforms={
            'MDV':{
              'semantic':'ProtocolXml/MDV/MdvPlatformSemantic.xml',
              'binding':'ProtocolXml/MDV/MdvTcpBinding.xml',
              'spec':'ProtocolXml/MDV/MdvSpecification.xml',
              'expected_body':{
                'T_MDV_MISSION_CTRL_CMD':28,'T_MDV_MODE_SET_CMD':24,'T_MDV_MISSION_PLAN_INFO':348,
                'T_MDV_EMERGENCY_STOP_CMD':20,'T_MDV_TARGET_INFO_CMD':16,'T_MDV_CTRL_RESP':28,
                'T_MDV_TRACKING_INFO':52,'T_MDV_STATUS_INFO':12,'T_MDV_MISSION_PROGRESS_INFO':24,
                'T_HEARTBEAT':8,
              }
            },
            'EMDW':{
              'semantic':'ProtocolXml/EMDW/EmdwPlatformSemantic.xml',
              'binding':'ProtocolXml/EMDW/EmdwTcpBinding.xml',
              'spec':'ProtocolXml/EMDW/EmdwSpecification.xml',
              'expected_body':{
                'T_EMDW_MISSION_CTRL_CMD':28,'T_EMDW_MODE_SET_CMD':24,'T_EMDW_MISSION_PLAN_INFO':348,
                'T_EMDW_EMERGENCY_STOP_CMD':20,'T_EMDW_TARGET_INFO_CMD':16,'T_EMDW_DISPOSAL_CMD':28,
                'T_EMDW_CTRL_RESP':28,'T_EMDW_POSITION_INFO':16,'T_EMDW_STATUS_INFO':12,
                'T_EMDW_MISSION_PROGRESS_INFO':24,'T_EMDW_DISPOSAL_STATUS_INFO':12,'T_HEARTBEAT':8,
              }
            }
          }

          issues=[]
          notes=[]
          def issue(level,platform,kind,msg): issues.append((level,platform,kind,msg))

          def local(e): return e.tag.rsplit('}',1)[-1]
          def field_size(e):
            tag=local(e)
            if tag in {'Field','FixedField','DerivedField'}:
              dt=e.get('dataType')
              if not dt or dt not in TYPE_SIZE: raise ValueError(f'{tag} {e.get("name")} missing/unknown dataType={dt}')
              return TYPE_SIZE[dt]*int(e.get('length','1'))
            if tag=='PackedField':
              w=int(e.get('width','0'))
              if w%8: raise ValueError(f'PackedField {e.get("name")} width {w} is not byte-aligned')
              return w//8
            if tag=='ArrayField':
              mx=e.get('maxOccurs')
              if not mx or not mx.isdigit(): raise ValueError(f'ArrayField {e.get("name")} maxOccurs is not fixed numeric: {mx}')
              elem=e.find(q('Element'))
              if elem is None: raise ValueError(f'ArrayField {e.get("name")} missing Element')
              return int(mx)*sum(field_size(c) for c in list(elem) if local(c) in {'Field','FixedField','DerivedField','PackedField','ArrayField'})
            return 0

          def wire_children(container):
            return [c for c in list(container) if local(c) in {'Field','FixedField','DerivedField','PackedField','ArrayField'}]

          def signature(e):
            tag=local(e)
            if tag in {'Field','FixedField','DerivedField'}:
              return (e.get('name'),e.get('dataType'),e.get('length','1'))
            if tag=='PackedField': return (e.get('name'),f'Packed{e.get("width")}', '1')
            if tag=='ArrayField':
              elem=e.find(q('Element'))
              kids=tuple(signature(c) for c in list(elem) if local(c) in {'Field','FixedField','DerivedField','PackedField','ArrayField'})
              return (e.get('name'),'Array',e.get('maxOccurs'),kids)

          for platform,cfg in platforms.items():
            # Well-formed parse
            sr=ET.parse(cfg['semantic']).getroot(); br=ET.parse(cfg['binding']).getroot(); vr=ET.parse(cfg['spec']).getroot()
            sem_text=Path(cfg['semantic']).read_text(encoding='utf-8'); bind_text=Path(cfg['binding']).read_text(encoding='utf-8')

            # Specification DataEncoding
            enc=vr.find(q('DataEncoding'))
            if enc is None or enc.get('byteOrder')!='little': issue('ERROR',platform,'DataEncoding','Specification little-endian DataEncoding missing/mismatch')

            # Legacy declarative violations
            for token in ['converter=','generator=','sourceMember=']:
              if token in bind_text: issue('ERROR',platform,'LegacyBinding',f'legacy token remains: {token}')

            # Every scalar field typed, length valid
            for e in br.iter():
              if local(e) in {'Field','FixedField','DerivedField'}:
                if not e.get('dataType'): issue('ERROR',platform,'DataType',f'{local(e)} {e.get("name")} missing dataType')
                if e.get('length') and int(e.get('length')) < 1: issue('ERROR',platform,'Length',f'{e.get("name")} invalid length')
              if e.get('name')=='reserved' and local(e) in {'Field','FixedField','DerivedField'}:
                if e.get('dataType')!='UInt8' or not e.get('length'):
                  issue('ERROR',platform,'Reserved',f'reserved missing UInt8/length: {ET.tostring(e,encoding="unicode")}')

            # Semantic IDs vs Binding semantic IDs
            ms=sr.find(q('MonitorSpecs')); cs=sr.find(q('ControlSpecs'))
            sem_mon={c.get('id') for c in list(ms) if c.get('id')} if ms is not None else set()
            sem_ctl={c.get('id') for c in list(cs) if c.get('id')} if cs is not None else set()
            bm=br.find(q('Monitors')); bc=br.find(q('Controls'))
            bind_mon={c.get('semantic_id') for c in list(bm) if c.get('semantic_id')} if bm is not None else set()
            bind_ctl={c.get('semantic_id') for c in list(bc) if c.get('semantic_id')} if bc is not None else set()
            if sem_mon!=bind_mon:
              issue('ERROR',platform,'MonitorID',f'Semantic-only={sorted(sem_mon-bind_mon)} Binding-only={sorted(bind_mon-sem_mon)}')
            if sem_ctl!=bind_ctl:
              issue('ERROR',platform,'ControlID',f'Semantic-only={sorted(sem_ctl-bind_ctl)} Binding-only={sorted(bind_ctl-sem_ctl)}')

            # Reply bindRef cross refs and required consistency
            sem_replies={r.get('bindRef'):r for r in sr.iter(q('Reply')) if r.get('bindRef')}
            bind_replies={r.get('semantic_id'):r for r in br.iter(q('Reply')) if r.get('semantic_id')}
            if set(sem_replies)!=set(bind_replies):
              issue('ERROR',platform,'ReplyRef',f'Semantic-only={sorted(set(sem_replies)-set(bind_replies))} Binding-only={sorted(set(bind_replies)-set(sem_replies))}')
            for rid,r in sem_replies.items():
              if rid in bind_replies and r.get('required')!=bind_replies[rid].get('required'):
                issue('ERROR',platform,'ReplyRequired',f'{rid}: Semantic={r.get("required")} Binding={bind_replies[rid].get("required")}')

            # All Binding CDMs/ValueMap/Sentinel CDMs should be known in Semantic (excluding sourceField-only generated data)
            sem_cdms={e.get('cdm') for e in sr.iter() if e.get('cdm')}
            for e in br.iter():
              c=e.get('cdm')
              if c and c not in sem_cdms: issue('WARN',platform,'CDM',f'Binding cdm not present in Semantic: {c} on {local(e)} {e.get("name")}')
              if local(e)=='Map':
                c=e.get('cdm')
                if c not in sem_cdms: issue('ERROR',platform,'ValueMapCDM',f'Map cdm absent from Semantic: {c}')
              if local(e) in {'Set','Bind'}:
                c=e.get('cdm')
                if c not in sem_cdms: issue('ERROR',platform,'SentinelCDM',f'{local(e)} cdm absent from Semantic: {c}')

            # Semantic enum/result must not contain raw numeric text
            for tag in ['ValueSetSpec','ValueSetProfile','ValueSetResult']:
              for vs in sr.iter(q(tag)):
                vals=vs.find(q('Values'))
                if vals is None: continue
                for v in vals.findall(q('Value')):
                  t=(v.text or '').strip()
                  if re.fullmatch(r'(?:0x[0-9A-Fa-f]+|-?\d+)',t): issue('ERROR',platform,'SemanticRawCode',f'{tag} {vs.get("id") or vs.get("cdm")} contains raw code {t}')

            # ValueMap duplicate code/cdm
            for vm in br.iter(q('ValueMap')):
              pairs=[(m.get('cdm'),m.get('value')) for m in vm.findall(q('Map'))]
              cdms=[x[0] for x in pairs]; vals=[x[1] for x in pairs]
              if len(cdms)!=len(set(cdms)): issue('ERROR',platform,'ValueMapDuplicate',f'duplicate cdm {pairs}')
              if len(vals)!=len(set(vals)): issue('ERROR',platform,'ValueMapDuplicate',f'duplicate raw value {pairs}')

            # Sentinel exactly the confirmed currentWaypoint rule where used
            for f in br.iter(q('Field')):
              if f.get('name')=='currentWaypointIndex' and f.find(q('Sentinel')) is not None:
                s=f.find(q('Sentinel')); n=f.find(q('Normal'))
                if s.get('value')!='0xFFFF' or n is None: issue('ERROR',platform,'Sentinel','currentWaypointIndex sentinel/normal mismatch')

            # Message structure / byte size / packetLength
            containers=[]
            for tag in ['MonitorBinding','ControlBinding','Reply']:
              for c in br.iter(q(tag)):
                ch=c.find(q('TCPChannel'))
                if ch is not None: containers.append((tag,c,ch.get('messageType')))
            bymsg=defaultdict(list)
            for tag,c,msg in containers:
              try: total=sum(field_size(e) for e in wire_children(c))
              except Exception as ex:
                issue('ERROR',platform,'WireSize',f'{tag} {c.get("semantic_id")} {msg}: {ex}'); continue
              sig=tuple(signature(e) for e in wire_children(c))
              bymsg[msg].append((tag,c.get('semantic_id'),total,sig,c))
              expbody=cfg['expected_body'].get(msg)
              if expbody is not None:
                expected_total=expbody+28
                if total!=expected_total: issue('ERROR',platform,'PacketSize',f'{msg}/{tag}/{c.get("semantic_id")}: computed={total}, expected={expected_total} (body {expbody}+header/tail 28)')
              # Fixed packetLength value if sender has it
              for e in wire_children(c):
                if e.get('name')=='packetLength' and local(e)=='FixedField':
                  if int(e.get('value'),0)!=total: issue('ERROR',platform,'PacketLengthField',f'{msg}/{c.get("semantic_id")}: fixed={e.get("value")} computed={total}')
            for msg,arr in bymsg.items():
              sigs={x[3] for x in arr}
              if len(sigs)>1:
                # For same message physical sequence/type must remain identical even if values/CDMs differ.
                issue('ERROR',platform,'MessageSignature',f'{msg} has {len(sigs)} distinct wire signatures across {[x[1] for x in arr]}')

            # Comments should exist and stale converter-specific named comments should not return
            comment_count=len(re.findall(r'<!--[\s\S]*?-->',sem_text))+len(re.findall(r'<!--[\s\S]*?-->',bind_text))
            notes.append((platform,'CommentCount',comment_count))
            for stale in ['MissionTypeToCode','WaypointIndexToAvailable','WaypointIndexToIndexWhenAvailable','DerivedSemantic']:
              if stale in sem_text or stale in bind_text: issue('WARN',platform,'StaleComment',f'stale term remains: {stale}')

          print('\n===== CONSISTENCY AUDIT =====')
          for n in notes: print('NOTE',*n)
          if not issues:
            print('PASS: no issues')
          else:
            for x in issues: print(*x,sep=' | ')
            print('TOTAL',len(issues),'ERROR',sum(1 for x in issues if x[0]=='ERROR'),'WARN',sum(1 for x in issues if x[0]=='WARN'))
          # Structural ERROR fails the workflow; WARN remains reviewable.
          if any(x[0]=='ERROR' for x in issues): raise SystemExit(2)
          PY

      - name: XSD validation
        run: |
          python -m pip install --quiet lxml
          python - <<'PY'
          from lxml import etree
          pairs=[
            ('ProtocolXml/MDV/MdvPlatformSemantic.xml','ProtocolXml/XSD/CommonSpecSchema.xsd'),
            ('ProtocolXml/EMDW/EmdwPlatformSemantic.xml','ProtocolXml/XSD/CommonSpecSchema.xsd'),
            ('ProtocolXml/MDV/MdvTcpBinding.xml','ProtocolXml/XSD/CommonBindingSchema.xsd'),
            ('ProtocolXml/EMDW/EmdwTcpBinding.xml','ProtocolXml/XSD/CommonBindingSchema.xsd'),
            ('ProtocolXml/MDV/MdvSpecification.xml','ProtocolXml/XSD/VehicleSpecificationSchema.xsd'),
            ('ProtocolXml/EMDW/EmdwSpecification.xml','ProtocolXml/XSD/VehicleSpecificationSchema.xsd'),
          ]
          failed=False
          for xml,xsd in pairs:
            try:
              schema=etree.XMLSchema(etree.parse(xsd)); doc=etree.parse(xml); schema.assertValid(doc)
              print('XSD PASS',xml)
            except Exception as e:
              failed=True; print('XSD FAIL',xml,'=>',e)
          if failed: raise SystemExit(3)
          PY
