name: Finalize SSS Source Enums

on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/finalize-sss-source-enums.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0

      - name: Apply source-confirmed enum and result mappings
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re

          base = Path('ProtocolXml/USV/SideScanSonar')
          sem = base / 'SideScanSonarSemantic.xml'
          bind = base / 'SideScanSonarBinding.xml'
          issues = base / 'SideScanSonar_OpenIssues.md'
          s = sem.read_text(encoding='utf-8')
          b = bind.read_text(encoding='utf-8')
          old_sc = re.findall(r'<!--[\s\S]*?-->', s)
          old_bc = re.findall(r'<!--[\s\S]*?-->', b)

          # Logical values. CDM paths are provisional linkage keys only; final CDM naming is deferred.
          sonar_cfg = [
              ('TowedSideScanSonar','SideScanSonar.SonarType.TowedSideScanSonar','0'),
              ('TowedGapFiller','SideScanSonar.SonarType.TowedGapFiller','1'),
              ('HullMountedSideScanSonar','SideScanSonar.SonarType.HullMountedSideScanSonar','2'),
          ]
          sonar_start = [
              ('Towed','SideScanSonar.SonarType.Towed','0'),
              ('HullMounted','SideScanSonar.SonarType.HullMounted','1'),
          ]
          target_device = [
              ('SideScanSonar','SideScanSonar.Subsystem.SideScanSonar','1'),
              ('USBL','SideScanSonar.Subsystem.USBL','2'),
              ('Winch','SideScanSonar.Subsystem.Winch','3'),
              ('Camera','SideScanSonar.Subsystem.Camera','4'),
              ('HullMountedSonar','SideScanSonar.Subsystem.HullMountedSonar','5'),
          ]
          mcs = [(f'Level{i+1}', f'Communication.MCS.Level.Level{i+1}', str(i)) for i in range(8)]
          launch_report = [
              ('StopState','LaunchRecovery.Response.StopState','0'),
              ('LaunchCompleted','LaunchRecovery.Response.LaunchCompleted','1'),
              ('RecoveryCompleted','LaunchRecovery.Response.RecoveryCompleted','2'),
          ]

          def valueset_profile(cdm, vals, indent='        '):
              lines=[f'{indent}<ValueSetProfile cdm="{cdm}">', f'{indent}  <Values>']
              for name,key,_ in vals:
                  lines.append(f'{indent}    <Value name="{name}" cdm="{key}"/>')
              lines += [f'{indent}  </Values>', f'{indent}</ValueSetProfile>']
              return '\n'.join(lines)

          def replace_qprofile_in_control(text, control_id, cdm, minv, maxv, vals, expected=1):
              block_pat=re.compile(r'(<ControlSpec\b[^>]*\bid="'+re.escape(control_id)+r'"[^>]*>[\s\S]*?</ControlSpec>)')
              m=block_pat.search(text)
              if not m: raise SystemExit(f'ControlSpec {control_id} not found')
              block=m.group(1)
              qp=re.compile(r'(?m)^(\s*)<QuantityProfile cdm="'+re.escape(cdm)+r'">\s*\n\s*<Range min="'+re.escape(minv)+r'" max="'+re.escape(maxv)+r'"/>\s*\n\s*<Resolution>1</Resolution>\s*\n\s*</QuantityProfile>')
              mm=list(qp.finditer(block))
              if len(mm)!=expected: raise SystemExit(f'{control_id}:{cdm} qprofile count={len(mm)}')
              for q in reversed(mm):
                  rep=valueset_profile(cdm,vals,q.group(1))
                  block=block[:q.start()]+rep+block[q.end():]
              return text[:m.start(1)]+block+text[m.end(1):]

          s=replace_qprofile_in_control(s,'configureOperatingParameters','SideScanSonar.SonarType','0','2',sonar_cfg)
          s=replace_qprofile_in_control(s,'start','SideScanSonar.SonarType','0','1',sonar_start)
          s=replace_qprofile_in_control(s,'stop','SideScanSonar.SonarType','0','1',sonar_start)
          s=replace_qprofile_in_control(s,'powerOnOff','SideScanSonar.Subsystem','1','5',target_device)
          s=replace_qprofile_in_control(s,'setCommunicationLevel','Communication.MCS.Level','0','7',mcs)

          # Add source applicability note next to the generic frequency profile without inventing unsupported conditional schema.
          freq_line='        <Profile cdm="Ping.CarrierFrequency"/>'
          freq_note='''        <Profile cdm="Ping.CarrierFrequency"/>\n        <!-- CSCI 적용조건: StatusConfigType frequency는 예인형 SSS(sonarType=0)에 대해 100/600 kHz만 명시된다. GapFiller는 별도 range 설정이 없고 예인형 SSS range와 동기화된다. 선체부착형 frequency 적용값은 원문에서 확정되지 않아 TBD. -->'''
          if freq_note not in s:
              if s.count(freq_line)!=1: raise SystemExit(f'frequency Profile count={s.count(freq_line)}')
              s=s.replace(freq_line,freq_note,1)

          def valueset_result(name, cdm, vals, indent):
              lines=[f'{indent}<ValueSetResult name="{name}" cdm="{cdm}">',f'{indent}  <Values>']
              for n,k,_ in vals: lines.append(f'{indent}    <Value name="{n}" cdm="{k}"/>')
              lines += [f'{indent}  </Values>',f'{indent}</ValueSetResult>']
              return '\n'.join(lines)

          # Communication result: same source-defined 0..7 MCS level set in Command and Report.
          old='            <Result name="videoQualityType" cdm="Communication.Level.Response.videoQualityType"/>'
          new=valueset_result('videoQualityType','Communication.Level.Response.videoQualityType',mcs,'            ')
          if s.count(old)!=1: raise SystemExit(f'videoQualityType Result count={s.count(old)}')
          s=s.replace(old,new,1)

          # LaunchReportType result: report semantics are 0=stop state, 1=launch completed, 2=recovery completed.
          old='            <Result name="launch" cdm="LaunchRecovery.Response.launch"/>'
          if s.count(old)!=3: raise SystemExit(f'launch Result count={s.count(old)}')
          new=valueset_result('launch','LaunchRecovery.Response.launch',launch_report,'            ')
          s=s.replace(old,new)

          # Context-specific Binding Field ValueMaps.
          def add_field_map_in_control(text, cid, field, vals, in_reply=None):
              cp=re.compile(r'(<ControlBinding\b[^>]*\bsemantic_id="'+re.escape(cid)+r'"[^>]*>[\s\S]*?</ControlBinding>)')
              cm=cp.search(text)
              if not cm: raise SystemExit(f'ControlBinding {cid} not found')
              block=cm.group(1)
              target=block
              offset=0
              if in_reply:
                  rp=re.compile(r'(<Reply\b[^>]*\bsemantic_id="'+re.escape(in_reply)+r'"[^>]*>[\s\S]*?</Reply>)')
                  rm=rp.search(block)
                  if not rm: raise SystemExit(f'{cid}:{in_reply} reply not found')
                  target=rm.group(1); offset=rm.start(1)
              fp=re.compile(r'(?m)^(\s*)<Field name="'+re.escape(field)+r'"([^>]*)/>$')
              fm=list(fp.finditer(target))
              if len(fm)!=1: raise SystemExit(f'{cid}:{in_reply}:{field} field count={len(fm)}')
              f=fm[0]; ind,attrs=f.group(1),f.group(2)
              rows='\n'.join(ind+'    '+f'<Map cdm="{k}" value="{raw}"/>' for _,k,raw in vals)
              rep=f'{ind}<Field name="{field}"{attrs}>\n{ind}  <ValueMap>\n{rows}\n{ind}  </ValueMap>\n{ind}</Field>'
              abs_start=offset+f.start(); abs_end=offset+f.end()
              block=block[:abs_start]+rep+block[abs_end:]
              return text[:cm.start(1)]+block+text[cm.end(1):]

          b=add_field_map_in_control(b,'configureOperatingParameters','sonarType',sonar_cfg)
          b=add_field_map_in_control(b,'start','sonarType',sonar_start)
          b=add_field_map_in_control(b,'stop','sonarType',sonar_start)
          b=add_field_map_in_control(b,'powerOnOff','targetDevice',target_device)
          b=add_field_map_in_control(b,'setCommunicationLevel','videoQualityType',mcs)
          b=add_field_map_in_control(b,'setCommunicationLevel','videoQualityType',mcs,'setCommunicationLevelResult')
          for cid,rid in [('stopTowfish','stopTowfishResult'),('launchTowfish','launchTowfishResult'),('recoveryTowfish','recoveryTowfishResult')]:
              b=add_field_map_in_control(b,cid,'launch',launch_report,rid)

          sem.write_text(s,encoding='utf-8',newline='')
          bind.write_text(b,encoding='utf-8',newline='')

          # Preserve every pre-existing XML comment byte-for-byte and only allow the one new applicability comment.
          new_sc=re.findall(r'<!--[\s\S]*?-->',s)
          if [x for x in new_sc if x not in old_sc] != [re.search(r'<!--[\s\S]*?-->',freq_note).group(0)]:
              raise SystemExit('unexpected Semantic comment addition')
          for c in old_sc:
              if c not in new_sc: raise SystemExit('existing Semantic comment lost')
          if re.findall(r'<!--[\s\S]*?-->',b)!=old_bc:
              raise SystemExit('Binding comments changed/lost')

          # Validate against central common XSD.
          etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')).assertValid(etree.parse(str(sem)))
          etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd')).assertValid(etree.parse(str(bind)))

          ns={'u':'http://lignex1.com/mcmc2/umsSchema'}
          S=etree.parse(str(sem)); B=etree.parse(str(bind))
          controls=S.xpath('.//u:ControlSpec|.//u:SetPointSpec',namespaces=ns)
          bcontrols=B.xpath('.//u:ControlBinding|.//u:ControlBindingDDS',namespaces=ns)
          replies=S.xpath('.//u:Reply',namespaces=ns); breplies=B.xpath('.//u:Reply',namespaces=ns)
          if len(controls)!=len(bcontrols): raise SystemExit(f'control count mismatch {len(controls)}/{len(bcontrols)}')
          if len(replies)!=len(breplies): raise SystemExit(f'reply count mismatch {len(replies)}/{len(breplies)}')
          sem_ids={x.get('id') for x in controls}; bind_ids={x.get('semantic_id') for x in bcontrols}
          if sem_ids!=bind_ids: raise SystemExit(f'control id mismatch semantic-only={sem_ids-bind_ids} binding-only={bind_ids-sem_ids}')
          sem_r={x.get('bindRef') for x in replies}; bind_r={x.get('semantic_id') for x in breplies}
          if sem_r!=bind_r: raise SystemExit(f'reply id mismatch semantic-only={sem_r-bind_r} binding-only={bind_r-sem_r}')

          # Remaining enum-like QuantityProfiles are intentionally deferred unless exact label meanings are source-confirmed.
          remaining=[]
          for q in S.xpath('.//u:QuantityProfile',namespaces=ns):
              r=q.find('{http://lignex1.com/mcmc2/umsSchema}Range')
              if r is not None and r.get('min') is not None and r.get('max') is not None:
                  mn,mx=r.get('min'),r.get('max')
                  if (mn,mx) in {('0','1'),('0','2')}:
                      remaining.append((q.get('cdm'),mn,mx))

          # Primitive type completeness: only composite usvHeader/destination may lack dataType.
          missing=[]
          for tag in ('Field','FixedField','DerivedField'):
              for e in B.xpath('.//u:'+tag,namespaces=ns):
                  if e.get('dataType') is None:
                      missing.append((tag,e.get('name')))
          bad=[x for x in missing if x[1] not in {'usvHeader','destination'}]
          if bad: raise SystemExit(f'primitive dataType missing: {bad[:20]} total={len(bad)}')
          if B.xpath('count(.//*[@converter])',namespaces=ns)!=0:
              raise SystemExit('converter remains in SSS Binding')

          # Sensor product audit: retain current five product bindings and report any match/payload concerns for final review.
          sp_sem=S.xpath('.//u:SensorProductSpecs/*',namespaces=ns)
          sp_bind=B.xpath('.//u:SensorProducts/u:ProductBinding',namespaces=ns)
          print('CONTROL_COUNT',len(controls))
          print('REPLY_COUNT',len(replies))
          print('VALUE_MAP_COUNT',int(B.xpath('count(.//u:ValueMap)',namespaces=ns)))
          print('REMAINING_ENUM_LIKE_QPROFILE',remaining)
          print('MISSING_DATATYPE_COMPOSITE_ONLY',len(missing))
          print('SENSOR_PRODUCTS',len(sp_sem),len(sp_bind),[(x.get('id'),x.get('cdm')) for x in sp_sem])
          print('COMMENTS',len(old_sc),'->',len(new_sc),len(old_bc),'->',len(re.findall(r'<!--[\s\S]*?-->',b)))

          doc=issues.read_text(encoding='utf-8')
          marker='## Final parameter / source audit'
          if marker not in doc:
              doc += '''\n\n## Final parameter / source audit\n\n- `StatusConfigType.sonarType`는 원문에 따라 `0=예인형 SSS`, `1=예인형 GapFiller`, `2=선체부착형 SSS`로 확정하고 Semantic 논리 선택 + Binding ValueMap으로 이동한다.\n- `StartControlType.sonarType`는 별도 코드 체계를 사용하며 `0=예인형`, `1=선체부착형`으로 확정한다. 같은 `sonarType` 이름이라도 메시지 문맥별 wire code가 다르므로 Binding에서 각각 매핑한다.\n- `PlatformPowerControlType.targetDevice`는 `1=SSS`, `2=USBL`, `3=WINCH`, `4=CAMERA`, `5=HMS`로 확정하고 ValueMap으로 이동한다.\n- `CommunicationLevelCommandType/ReportType.videoQualityType`는 모두 `0~7 = MCS Level1~Level8`로 정의되어 있어 제어/결과 모두 ValueSet으로 표현한다. 동일 필드/코드이지만 Report가 요청값을 단순 echo한다고 추가 가정하지 않는다.\n- `LaunchReportType.launch`는 결과 메시지 의미를 기준으로 `0=정지상태`, `1=진수완료`, `2=회수완료`로 표현한다. `AutoLaunchControlType.launch`의 `0=정지/1=진수/2=회수` 명령 의미와 구분한다.\n- `StatusConfigType.frequency`는 예인형 SSS(`sonarType=0`)에서 100/600 kHz만 원문에 명시되어 있다. 현재 CommonSpecSchema에는 제어용 `QuantityValueSetProfile`이 없으므로 `Profile`을 유지하고 XML 주석으로 값/적용조건을 보존한다. 선체부착형 frequency 허용값은 TBD이다.\n- GapFiller는 별도 range 설정이 없고 예인형 SSS range와 동기화되는 원문 제약을 보존한다. 현재 Semantic의 평면 Parameter 구조에서 조건부 적용을 직접 표현하지 않으며 후속 스키마/OM 규칙 검토 대상으로 둔다.\n- `ReceiveProcessing.TVG.Mode(0~1)`, `ReceiveProcessing.SoftwareGain.Mode(0~2)`, `ReceiveProcessing.LowPassFilter.Mode(0~1)`은 enum 형태이지만 원문에서 각 숫자의 정확한 논리 명칭을 이번 근거에서 확정하지 못했으므로 QuantityProfile을 임시 유지한다.\n- `LanchAndRecoveryBackStopReportType.slideBackStop`, PBIT Total, IBIT Total/detail의 raw 값 의미는 기존 TBD를 유지한다.\n- 이번에 추가한 SonarType/Subsystem/MCS/LaunchReport 세부 CDM 경로는 Semantic-Binding 연결용 임시 키이며 최종 USV CDM 감사에서 명칭/계층을 재검토한다.\n'''
              issues.write_text(doc,encoding='utf-8',newline='')
          PY
          git diff --check
          git rm .github/workflows/finalize-sss-source-enums.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize source-confirmed SSS parameter mappings'
          git push origin HEAD:feature/usv-semantic-binding-audit
