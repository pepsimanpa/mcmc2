name: temporary AutonomousNavigation deep CSV audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Apply ANU RCU common CSV grounded refinements
        shell: python
        run: |
          from pathlib import Path

          sem=Path('ProtocolXml/USV/AutonomousNavigation/AutonomousNavigationSemantic.xml')
          issues=Path('ProtocolXml/USV/AutonomousNavigation/AutonomousNavigation_OpenIssues.md')
          s=sem.read_text(encoding='utf-8')
          o=issues.read_text(encoding='utf-8')

          def rep(text, old, new, count, label):
              n=text.count(old)
              if n != count:
                  raise SystemExit(f'{label}: expected {count}, found {n}')
              return text.replace(old,new)

          old='''        <QuantityProfile cdm="Autonomy.Mission.Record.TimeLimit">\n          <Unit>s</Unit>\n          <Range min="0" max="14400"/>\n          <Resolution>1</Resolution>\n        </QuantityProfile>'''
          new='''        <QuantityProfile cdm="Autonomy.Mission.Record.TimeLimit">\n          <Range min="0" max="14400"/>\n          <Resolution>1</Resolution>\n        </QuantityProfile>'''
          s=rep(s,old,new,1,'timeLimit semantic unit')
          s=rep(s,
              '<!--searchingRange wire raw 3750~15000은 Semantic 37.5~150.0 m(0.01 m resolution)로 해석한다. timeLimit은 seconds로 정의한다.-->',
              '<!--searchingRange wire raw 3750~15000은 원문 비고의 20M/150M 운용범위를 근거로 Semantic 37.5~150.0 m(0.01 m resolution)로 해석한다. timeLimit은 0~14400 범위만 확정되며 공용 구조체 Unit 열이 `-`이므로 단위를 추정하지 않는다.-->',
              1,'timeLimit comment')

          anchor='- AutonomousDocking `distanceRemaining`은 원문 Unit 미기재이므로 기존 m 추정을 제거하였다.\n'
          add='''- 자율운항장치 CSCI + 원격통제장치 CSCI + 공용 구조체를 재심층 교차감사하였다. `timeHoverAcheived`는 원문 비고에서 "실제 처음 달성된 절대 시간"으로 직접 확인되었고, `timeHoverCompleted`는 필드 설명 "유지 시간"과 비고 "완료될 것으로 추정되는 절대 시간"이 충돌함을 재확인하였다.\n- `fuelQuantityPercent`는 ANU CSCI에서 0~100 범위와 잔여연료 비율 의미를 직접 확인했지만 Unit 열은 비어 있으며, `alertTime`은 "년, 월, 일, 시, 분, 초"라고만 기재되어 UInt64 패킹/epoch은 확인되지 않았다.\n- 공용 구조체 `UnderwaterMissionPlanRecordCommand.timeLimit`은 UInt32 계열(`unsigned long`) / Range 0~14400까지는 확정되지만 Unit 열이 `-`이므로 기존 Semantic의 `s` 단위 추정을 제거하였다.\n- AutonomousDocking `distanceRemaining`의 Unit 열도 실제로 `-`임을 재확인하여 단위를 미지정으로 유지한다. Achieved 3개 code, TargetTracking 1~49, targetTrackingID X.Y, RestrictArea 형상, EmergencyReturn action=3은 관련 CSV 전체에서도 추가 정의를 찾지 못했다.\n'''
          if add not in o:
              o=rep(o,anchor,anchor+add,1,'audit summary anchor')

          o=rep(o,
              '4. **GlobalHover 시간 의미/인코딩**: timeHoverAcheived/timeHoverCompleted의 절대시각·지속시간 의미와 UInt64 인코딩 기준이 불명확하다.',
              '4. **GlobalHover 시간 의미/인코딩 — 부분 해결**: `timeHoverAcheived`는 ANU CSCI 비고에서 "실제 처음 달성된 절대 시간"으로 직접 확인된다. 반면 `timeHoverCompleted`는 필드 설명이 "유지 시간"이고 비고는 "완료될 것으로 추정되는 절대 시간 → 앞으로 계속 그 자리에서 유지해야 될 시간"으로 서로 충돌한다. 두 필드 모두 UInt64의 실제 epoch/packing 규칙은 별도 정의가 없어 후자는 의미와 인코딩을 계속 TBD로 유지한다.',
              1,'issue4')
          o=rep(o,
              '7. **Fuel 필드 Unit/시간 인코딩**: fuelQuantityRemain, fuelQuantityPercent의 명시적 Unit과 alertTime UInt64 인코딩 규칙 확인이 필요하다.',
              '7. **Fuel 필드 Unit/시간 인코딩 — 부분 해결**: `fuelQuantityPercent`는 ANU CSCI에서 의미가 "잔여연료 비율"이고 Range 0~100으로 직접 확인되지만 Unit 열은 비어 있어 `%` 단위를 계약값으로 추가하지 않는다. `fuelQuantityRemain` 역시 Unit 미기재다. `alertTime`은 UInt64이고 비고에 "년, 월, 일, 시, 분, 초"만 있어 달력시각 성격은 확인되지만 실제 bit packing/epoch/format은 여전히 TBD이다.',
              1,'issue7')
          o=rep(o,
              '8. **Underwater timeLimit Unit**: 시간 제한이라는 의미와 범위는 있으나 wire Unit이 원문에 명확히 기재되지 않았다.',
              '8. **Underwater timeLimit Unit**: 공용 구조체에서 `timeLimit`은 `unsigned long`, Range 0~14400, 설명 "제한시간"까지는 직접 확인되지만 Unit 열은 `-`이다. 따라서 기존 Semantic의 `s` 단위는 원문보다 앞선 추정으로 확인되어 제거했으며, 실제 시간 단위는 계속 TBD이다.',
              1,'issue8')

          o=o.replace('- RCU 직접 연동 범위의 Semantic/Binding 구조 정리는 완료하였다.',
                      '- RCU 직접 연동 범위의 Semantic/Binding 구조 정리와 ANU/RCU/공용구조체 CSV 재심층 교차감사까지 완료하였다.')
          o=o.replace('- 남은 14건은 사용자 정책 선택사항이 아니라 추가 CSCI/IDL/Adapter 근거가 필요한 비차단 TBD이다.',
                      '- 재심층 감사 후에도 미해결 이슈 수는 14건이며, 일부는 근거 범위를 좁히고 잘못 추정된 `timeLimit` 단위를 철회하였다. 남은 내용은 추가 IDL/Adapter/운용 규칙 근거가 필요한 비차단 TBD이다.')

          sem.write_text(s,encoding='utf-8')
          issues.write_text(o,encoding='utf-8')

      - name: Validate all USV XML and ANU assertions
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=list(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          s=Path('ProtocolXml/USV/AutonomousNavigation/AutonomousNavigationSemantic.xml').read_text(encoding='utf-8')
          o=Path('ProtocolXml/USV/AutonomousNavigation/AutonomousNavigation_OpenIssues.md').read_text(encoding='utf-8')
          block=s.split('<QuantityProfile cdm="Autonomy.Mission.Record.TimeLimit">',1)[1].split('</QuantityProfile>',1)[0]
          assert '<Unit>' not in block
          assert '<Range min="0" max="14400"/>' in block
          assert 'timeLimit은 seconds로 정의한다' not in s
          assert 'GlobalHover 시간 의미/인코딩 — 부분 해결' in o
          assert 'Fuel 필드 Unit/시간 인코딩 — 부분 해결' in o
          assert '미해결 이슈 수는 14건' in o
          assert all('converter=' not in p.read_text(encoding='utf-8') for p in binds)
          print(f'USV Semantic {len(sems)} PASS / Binding {len(binds)} PASS')
          print('AUTONOMOUS NAVIGATION DEEP CSV ASSERTIONS PASS')
          PY
      - name: Commit ANU deep audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/AutonomousNavigation/AutonomousNavigationSemantic.xml ProtocolXml/USV/AutonomousNavigation/AutonomousNavigation_OpenIssues.md
          git commit -m 'Deep-audit AutonomousNavigation CSV ambiguities'
          git push origin HEAD:feature/usv-semantic-binding-audit
