name: temporary final USV classification
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Apply final classification
        run: python .github/tmp_final_usv_classification.py
      - name: Validate all USV XML and final classification
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=list(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          s=Path('ProtocolXml/USV/SideScanSonar/SideScanSonarSemantic.xml').read_text(encoding='utf-8')
          b=Path('ProtocolXml/USV/SideScanSonar/SideScanSonarBinding.xml').read_text(encoding='utf-8')
          o=Path('ProtocolXml/USV/SideScanSonar/SideScanSonar_OpenIssues.md').read_text(encoding='utf-8')
          m=Path('ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md').read_text(encoding='utf-8')
          assert 'ValueSetProfile cdm="ReceiveProcessing.SoftwareGain.Mode"' in s
          assert 'ValueSetProfile cdm="ReceiveProcessing.LowPassFilter.Mode"' in s
          assert 'ReceiveProcessing.SoftwareGain.Mode.AutoGain" value="0"' in b
          assert 'ReceiveProcessing.SoftwareGain.Mode.RawGain" value="2"' in b
          assert 'ReceiveProcessing.LowPassFilter.Mode.Disabled" value="0"' in b
          assert 'ReceiveProcessing.LowPassFilter.Mode.Enabled" value="1"' in b
          assert 'QuantityProfile TBD를 유지한다' not in o
          side=m.split('### 4.14 SideScanSonar',1)[1].split('---',1)[0]
          assert 'SoftwareGain Mode(0~2), LowPassFilter Mode(0~1)의 논리값 의미' not in side
          assert '현재 보유 CSV로 추가 해결 가능한 항목' in m
          assert '- **0건**.' in m
          assert '## 6. 최종 merge / runtime readiness 판단' in m
          assert '## 7. 최종 결론' in m
          assert all('converter=' not in p.read_text(encoding='utf-8') for p in binds)
          print(f'USV Semantic {len(sems)} PASS / Binding {len(binds)} PASS')
          print('FINAL USV CLASSIFICATION PASS')
          PY
      - name: Commit final classification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/SideScanSonar/SideScanSonarSemantic.xml ProtocolXml/USV/SideScanSonar/SideScanSonarBinding.xml ProtocolXml/USV/SideScanSonar/SideScanSonar_OpenIssues.md ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md
          git commit -m 'Finalize USV source audit classification'
          git push origin HEAD:feature/usv-semantic-binding-audit
