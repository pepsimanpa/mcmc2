name: Enrich SSS Reply Results

on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/enrich-sss-reply-results.yml']

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0

      - name: Add source-grounded reply results
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re

          base = Path('ProtocolXml/USV/SideScanSonar')
          sem = base / 'SideScanSonarSemantic.xml'
          bind = base / 'SideScanSonarBinding.xml'
          issues = base / 'SideScanSonar_OpenIssues.md'
          s = sem.read_text(encoding='utf-8')
          b = bind.read_text(encoding='utf-8')
          old_comments = re.findall(r'<!--[\s\S]*?-->', s)

          ns = {'u':'http://lignex1.com/mcmc2/umsSchema'}
          B = etree.parse(str(bind))

          # Collect Binding Reply payload fields. usvHeader and ACK correlation/routing metadata
          # are transport/adapter concerns and are not promoted as Semantic Results.
          reply_fields = {}
          for r in B.xpath('.//u:Reply', namespaces=ns):
              sid = r.get('semantic_id')
              vals=[]
              for f in r.xpath('./u:Field', namespaces=ns):
                  name=f.get('name')
                  cdm=f.get('cdm')
                  if name == 'usvHeader':
                      continue
                  if sid.endswith('Ack') and name in {
                      'commandStatusReport.dstEquipmentType',
                      'commandStatusReport.dstEquipmentID',
                      'commandID'
                  }:
                      continue
                  if cdm:
                      vals.append((name,cdm))
              reply_fields[sid]=vals

          # Expected SSS shape: 38 CommandStatus ACK + 9 domain result reports.
          ack_ids=sorted([k for k in reply_fields if k.endswith('Ack')])
          result_ids=sorted([k for k in reply_fields if not k.endswith('Ack')])
          if len(ack_ids) != 38:
              raise SystemExit(f'ACK count changed: {len(ack_ids)}')
          expected_results={
              'requestPbitResult','requestIbitResult',
              'stopSlideBackStopResult','engageSlideBackStopResult','returnSlideBackStopResult',
              'setCommunicationLevelResult',
              'stopTowfishResult','launchTowfishResult','recoveryTowfishResult'
          }
          if set(result_ids) != expected_results:
              raise SystemExit(f'Unexpected result replies: {result_ids}')

          # ACK must expose exactly the command processing status as a semantic result.
          for sid in ack_ids:
              vals=reply_fields[sid]
              if vals != [('commandStatusReport.status','Control.Response.Status')]:
                  raise SystemExit(f'{sid} ACK payload unexpected: {vals}')

          # Build Semantic Results without inventing raw-value interpretations.
          def result_xml(sid, indent):
              vals=reply_fields[sid]
              child=indent+'    '
              item=child+'  '
              lines=[indent+'<Results>']
              if sid in {'requestPbitResult','requestIbitResult'}:
                  label='PBIT 점검 결과' if sid=='requestPbitResult' else 'IBIT 점검 결과'
                  lines.append(child+f'<GroupResult name="{label}">')
                  for name,cdm in vals:
                      lines.append(item+f'<Result name="{name}" cdm="{cdm}"/>')
                  lines.append(child+'</GroupResult>')
              else:
                  for name,cdm in vals:
                      lines.append(child+f'<Result name="{name}" cdm="{cdm}"/>')
              lines.append(indent+'</Results>')
              return '\n'.join(lines)

          # Replace only self-closing Reply tags. Preserve all pre-existing comments/text formatting.
          all_ids=ack_ids+result_ids
          for sid in all_ids:
              pat=re.compile(r'(?m)^(\s*)<Reply\b([^>]*\bbindRef="'+re.escape(sid)+r'"[^>]*)/>$')
              mm=list(pat.finditer(s))
              if len(mm)!=1:
                  raise SystemExit(f'Semantic Reply {sid} count={len(mm)}')
              m=mm[0]
              indent=m.group(1)
              attrs=m.group(2)
              rx=result_xml(sid, indent+'  ')
              repl=f'{indent}<Reply{attrs}>\n{rx}\n{indent}</Reply>'
              s=s[:m.start()]+repl+s[m.end():]

          sem.write_text(s, encoding='utf-8', newline='')

          # Existing comments must remain exactly intact.
          if re.findall(r'<!--[\s\S]*?-->', s) != old_comments:
              raise SystemExit('Semantic comments changed/lost')

          # Validate Semantic and Binding against common XSD.
          etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')).assertValid(etree.parse(str(sem)))
          etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd')).assertValid(etree.parse(str(bind)))

          S=etree.parse(str(sem))
          replies=S.xpath('.//u:Reply',namespaces=ns)
          with_results=[r for r in replies if r.xpath('./u:Results',namespaces=ns)]
          if len(replies)!=47 or len(with_results)!=47:
              raise SystemExit(f'Reply Results coverage {len(with_results)}/{len(replies)}')
          for sid in ('requestPbitResult','requestIbitResult'):
              rr=S.xpath(f'.//u:Reply[@bindRef="{sid}"]',namespaces=ns)[0]
              groups=rr.xpath('./u:Results/u:GroupResult',namespaces=ns)
              if len(groups)!=1:
                  raise SystemExit(f'{sid} must remain one Reply with one GroupResult')

          doc=issues.read_text(encoding='utf-8')
          marker='## Reply semantic result contract'
          if marker not in doc:
              doc += '''\n\n## Reply semantic result contract\n\n- PBIT와 IBIT은 각각 하나의 점검 결과 DDS 메시지이며, Semantic에서도 각각 `requestPbitResult`, `requestIbitResult` 한 개의 Reply를 유지한다. 메시지 내부 결과 필드는 하나의 `GroupResult` 아래 표현한다.\n- 38개 `CommandStatusReportType` ACK는 라우팅/상관관계 필드가 아니라 `commandStatusReport.status`만 Semantic Result로 노출한다. `dstEquipmentType`, `dstEquipmentID`, `commandID`는 Binding/Adapter 메타데이터로 유지한다.\n- `CommandStatusReport.status`의 원문 값(Executing/Pending/Failed/Reject/Canceled)은 확정되어 있으나, 세부 상태 CDM 명칭은 최종 CDM 감사까지 새로 만들지 않는다. 따라서 현재 Semantic은 `Control.Response.Status` 결과 존재만 선언한다.\n- `TSAPBITReportType`, `TSAIBITReportType` 내부 필드는 현재 Binding에 이미 존재하는 CDM을 그대로 Semantic Result에 재사용하며, Total 상태코드 및 IBIT detail bit의 raw 의미는 추가 추론하지 않는다.\n- `LaunchReportType`, `LanchAndRecoveryBackStopReportType`, `CommunicationLevelReportType`도 하나의 결과 Report Reply를 유지하고 실제 payload 필드를 Semantic Result로 노출한다. raw 0/1/2 등의 의미 매핑은 원문 재확인 전까지 보류한다.\n- commandID가 없는 결과 Report의 요청-결과 correlation 방식은 기존 TBD를 유지한다.\n'''
              issues.write_text(doc,encoding='utf-8',newline='')

          print('REPLIES',len(replies))
          print('REPLIES_WITH_RESULTS',len(with_results))
          print('ACKS',len(ack_ids),'DOMAIN_RESULTS',len(result_ids))
          print('PBIT_FIELDS',len(reply_fields['requestPbitResult']))
          print('IBIT_FIELDS',len(reply_fields['requestIbitResult']))
          print('SEMANTIC_COMMENTS',len(old_comments))
          PY
          git diff --check
          git rm .github/workflows/enrich-sss-reply-results.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose SSS reply payloads in Semantic results'
          git push origin HEAD:feature/usv-semantic-binding-audit
