name: Apply Current Waypoint Availability Model

on:
  push:
    branches:
      - feature/auv-reply-bit-binding
    paths:
      - '.github/workflows/apply-current-waypoint-availability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0

      - name: Apply exact model patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='')

          rep(
              'ProtocolXml/XSD/CommonBindingSchema.xsd',
              '''    <xs:complexType name="FieldType">\n        <xs:attribute name="name" type="xs:string" use="required"/>\n        <xs:attribute name="cdm" type="xs:string"/>\n        <xs:attribute name="inputUnit" type="xs:string"/>\n        <xs:attribute name="outputUnit" type="xs:string"/>\n        <xs:attribute name="converter" type="xs:string"/>\n    </xs:complexType>''',
              '''    <!-- 하나의 물리 Field가 복수의 논리 의미를 포함할 때 DerivedSemantic으로 파생한다. -->\n    <xs:complexType name="DerivedSemanticType">\n        <xs:attribute name="cdm" type="xs:string" use="required"/>\n        <xs:attribute name="converter" type="xs:string" use="required"/>\n    </xs:complexType>\n\n    <xs:complexType name="FieldType">\n        <xs:sequence>\n            <xs:element name="DerivedSemantic" type="DerivedSemanticType" minOccurs="0" maxOccurs="unbounded"/>\n        </xs:sequence>\n        <xs:attribute name="name" type="xs:string" use="required"/>\n        <xs:attribute name="cdm" type="xs:string"/>\n        <xs:attribute name="inputUnit" type="xs:string"/>\n        <xs:attribute name="outputUnit" type="xs:string"/>\n        <xs:attribute name="converter" type="xs:string"/>\n    </xs:complexType>'''
          )

          old_sem = '<QuantitySpec id="currentWaypointIndex" name="현재 경유점 인덱스" cdm="MissionPlan.CurrentWaypointIndex"><Range min="0" max="65534"/><Resolution>1</Resolution></QuantitySpec><!-- raw 0xFFFF는 현재 추종 경유점 없음으로 Binding/Adapter에서 해석하며 정상 인덱스 범위에 포함하지 않는다. -->'
          new_sem = '<BooleanSpec id="currentWaypointAvailable" name="현재 추종 경유점 존재 여부" cdm="MissionPlan.CurrentWaypoint.Available"/><QuantitySpec id="currentWaypointIndex" name="현재 경유점 인덱스" cdm="MissionPlan.CurrentWaypointIndex"><Range min="0" max="65534"/><Resolution>1</Resolution></QuantitySpec><!-- currentWaypointAvailable=false일 때 currentWaypointIndex는 의미값 없음. raw 0xFFFF 매핑은 Binding에서 처리한다. -->'
          rep('ProtocolXml/MDV/MdvPlatformSemantic.xml', old_sem, new_sem)
          rep('ProtocolXml/EMDW/EmdwPlatformSemantic.xml', old_sem, new_sem)

          old_binding = '            <Field name="currentWaypointIndex" cdm="MissionPlan.CurrentWaypointIndex" converter="UInt16LECurrentWaypointIndexOrNone"/>'
          new_binding = '''            <Field name="currentWaypointIndex" converter="UInt16LE">\n                <DerivedSemantic cdm="MissionPlan.CurrentWaypoint.Available" converter="WaypointIndexToAvailable"/>\n                <DerivedSemantic cdm="MissionPlan.CurrentWaypointIndex" converter="WaypointIndexToIndexWhenAvailable"/>\n            </Field>'''
          rep('ProtocolXml/MDV/MdvTcpBinding.xml', old_binding, new_binding)
          rep('ProtocolXml/EMDW/EmdwTcpBinding.xml', old_binding, new_binding)
          PY

      - name: Validate XML and mapping
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {'u':'http://lignex1.com/mcmc2/umsSchema','xs':'http://www.w3.org/2001/XMLSchema'}
          paths = [
            'ProtocolXml/XSD/CommonBindingSchema.xsd',
            'ProtocolXml/MDV/MdvPlatformSemantic.xml',
            'ProtocolXml/EMDW/EmdwPlatformSemantic.xml',
            'ProtocolXml/MDV/MdvTcpBinding.xml',
            'ProtocolXml/EMDW/EmdwTcpBinding.xml'
          ]
          roots = {p: ET.parse(p).getroot() for p in paths}
          assert roots[paths[0]].find("xs:complexType[@name='DerivedSemanticType']",ns) is not None
          for plat,prefix in [('MDV','Mdv'),('EMDW','Emdw')]:
              sem = roots[f'ProtocolXml/{plat}/{prefix}PlatformSemantic.xml']
              bind = roots[f'ProtocolXml/{plat}/{prefix}TcpBinding.xml']
              group = sem.find(".//u:GroupSpec[@id='missionExecutionStatus']",ns)
              available = group.find("u:BooleanSpec[@id='currentWaypointAvailable']",ns)
              index = group.find("u:QuantitySpec[@id='currentWaypointIndex']",ns)
              assert available is not None and available.get('cdm') == 'MissionPlan.CurrentWaypoint.Available'
              assert index is not None and index.find('u:Range',ns).get('max') == '65534'
              mon = bind.find(".//u:MonitorBinding[@semantic_id='missionExecutionStatus']",ns)
              fields = [x for x in mon.findall('u:Field',ns) if x.get('name') == 'currentWaypointIndex']
              assert len(fields) == 1
              field = fields[0]
              assert field.get('converter') == 'UInt16LE' and field.get('cdm') is None
              derived = {(x.get('cdm'),x.get('converter')) for x in field.findall('u:DerivedSemantic',ns)}
              assert derived == {
                  ('MissionPlan.CurrentWaypoint.Available','WaypointIndexToAvailable'),
                  ('MissionPlan.CurrentWaypointIndex','WaypointIndexToIndexWhenAvailable')
              }
          print('Current waypoint availability model OK')
          PY
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/XSD/CommonBindingSchema.xsd ProtocolXml/MDV/MdvPlatformSemantic.xml ProtocolXml/EMDW/EmdwPlatformSemantic.xml ProtocolXml/MDV/MdvTcpBinding.xml ProtocolXml/EMDW/EmdwTcpBinding.xml
          git commit -m 'Model current waypoint availability explicitly'
          git push origin HEAD:feature/auv-reply-bit-binding
