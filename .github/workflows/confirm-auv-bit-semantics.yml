name: Confirm AUV Bit Semantics

on:
  push:
    branches: [feature/auv-declarative-binding-cleanup]
    paths: ['.github/workflows/confirm-auv-bit-semantics.yml']

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-declarative-binding-cleanup
          fetch-depth: 0

      - name: Confirm project bit semantics and validate
        run: |
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re

          rf = Path('ProtocolXml/AUV/AuvRfCommBinding.xml')
          doc = Path('ProtocolXml/Docs/UMS_Semantic_Binding_Design_Rules_20260826.md')

          before = len(re.findall(r'<!--[\s\S]*?-->', rf.read_text(encoding='utf-8')))
          s = rf.read_text(encoding='utf-8')
          old = '                                    원문 표 자체에는 0/1 결과 의미가 직접 기재되지 않았으나 AUV_CHECK_RESULT 계열과 동일한 자체점검 규칙(0=PASS, 1=FAIL)을 적용한다.'
          new = '                                    원문 표 자체에는 0/1 결과 의미가 직접 기재되지 않았으나 프로젝트 확정 규칙으로 자체점검 계열은 0=PASS, 1=FAIL을 적용한다.'
          if s.count(old) != 1:
              raise SystemExit(f'pre-launch semantics marker count={s.count(old)}')
          s = s.replace(old, new, 1)
          rf.write_text(s, encoding='utf-8', newline='')

          d = doc.read_text(encoding='utf-8')
          anchor = '- UCD-2의 IMU_LAT/IMU_LONG은 물리 필드로 유지하되 `emergencyReturnReply`의 Semantic 결과 채택 여부는 응답 의미/CDM 재검토 시 확정한다.\n'
          addition = anchor + '- 프로젝트 bit 해석 규칙을 확정한다: 점검 계열은 `0=PASS, 1=FAIL`, 이상/이벤트 계열은 `0=정상·미발생, 1=이상·발생`, MODE/LOCK 등 상태 flag는 `0=비활성, 1=활성`으로 해석한다.\n- RF Pre-Launch Check 6개 항목도 위 점검 규칙에 따라 `0=PASS, 1=FAIL`로 확정한다.\n- STAT_code bit0~4는 `0=정상, 1=비정상`; DATA_LOCK/SYNC_LOCK은 정상/비정상 판정이 아니라 `0=비활성, 1=활성` flag로 유지한다.\n'
          if anchor not in d:
              raise SystemExit('issue15 anchor not found')
          if '프로젝트 bit 해석 규칙을 확정한다' not in d:
              d = d.replace(anchor, addition, 1)
          doc.write_text(d, encoding='utf-8', newline='')

          after = len(re.findall(r'<!--[\s\S]*?-->', rf.read_text(encoding='utf-8')))
          if after != before:
              raise SystemExit(f'comment count changed: {before}->{after}')

          binding_schema = etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          for f in [
              'ProtocolXml/AUV/AuvPlatformRfBinding.xml',
              'ProtocolXml/AUV/AuvPlatformUcdBinding.xml',
              'ProtocolXml/AUV/AuvRfCommBinding.xml',
          ]:
              binding_schema.assertValid(etree.parse(f))
              print('PASS', f)

          # Assert the confirmed rules remain present in current files.
          platform = Path('ProtocolXml/AUV/AuvPlatformRfBinding.xml').read_text(encoding='utf-8')
          ucd = Path('ProtocolXml/AUV/AuvPlatformUcdBinding.xml').read_text(encoding='utf-8')
          comm = rf.read_text(encoding='utf-8')
          assert '0=PASS, 1=FAIL' in platform
          assert 'EOR bit는 0=미발생, 1=해당 비상종료 조건 발생' in platform
          assert 'MODE bit는 0=비활성, 1=활성' in platform
          assert 'AUV_CHECK_RESULT_L 점검 bit는 원문 근거에 따라 0=PASS, 1=FAIL' in ucd
          assert 'STAT_code bit0~4는 0=정상, 1=비정상' in comm
          assert '프로젝트 확정 규칙으로 자체점검 계열은 0=PASS, 1=FAIL' in comm
          print('BIT SEMANTICS CONFIRMED')
          PY
          git diff --check
          git rm .github/workflows/confirm-auv-bit-semantics.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Confirm AUV bit interpretation rules'
          git push origin HEAD:feature/auv-declarative-binding-cleanup
