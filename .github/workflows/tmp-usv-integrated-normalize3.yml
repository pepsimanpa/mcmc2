name: temporary final USV CDM target ValueMap normalization
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - run: python -m pip install --quiet lxml
      - name: Apply and validate
        shell: bash
        run: |
          cat > /tmp/normalize.py <<'PY'
          from pathlib import Path
          from lxml import etree
          import re, subprocess
          U='http://lignex1.com/mcmc2/umsSchema'; N={'u':U}
          devices=['AutonomousNavigation','CentralControl','ElectroOptical','ElectroOpticalProcessor','IntegratedNavigation','Lidar','NavigationCamera','NavigationRadar','NearContactDetection','NetworkAbstraction','PlatformController','RemoteFireControl','SensorFusion','SideScanSonar']
          base='f17bc88321df55c13e3c46822ea2bfceae2ce8be'
          quartet={'Normal':'Health.Normal','Degraded':'Health.Degraded','Unavailable':'Health.Unavailable','NoResponse':'Health.NoResponse'}
          accepted={'Health.Normal':'Normal','Health.Degraded':'Degraded','Health.Unavailable':'Unavailable','Health.NoResponse':'NoResponse','Health.Status.Normal':'Normal','Health.Status.Degraded':'Degraded','Health.Status.Unavailable':'Unavailable','Health.Status.NoResponse':'NoResponse','OperationalState.Normal':'Normal','OperationalState.Degraded':'Degraded','OperationalState.Unavailable':'Unavailable','OperationalState.NoResponse':'NoResponse'}

          def canonicalize_sem(text):
              for tag in ('ValueSetSpec','ValueSetProfile','ValueSetResult','HealthStatusSetSpec'):
                  pat=re.compile(rf'<{tag}\b[^>]*>.*?</{tag}>',re.S)
                  def f(m):
                      b=m.group(0); vals=re.findall(r'<Value\b[^>]*\bcdm="([^"]+)"',b); kinds=[accepted.get(x) for x in vals]
                      if len(vals)==4 and None not in kinds and set(kinds)==set(quartet):
                          for old,k in accepted.items(): b=b.replace(f'cdm="{old}"',f'cdm="{quartet[k]}"')
                      return b
                  text=pat.sub(f,text)
              return text

          def canonicalize_maps(text):
              pat=re.compile(r'<ValueMap\b[^>]*>.*?</ValueMap>',re.S)
              def f(m):
                  b=m.group(0); vals=re.findall(r'<Map\b[^>]*\bcdm="([^"]+)"',b); kinds=[accepted.get(x) for x in vals]
                  if len(vals)==4 and None not in kinds and set(kinds)==set(quartet):
                      for old,k in accepted.items(): b=b.replace(f'cdm="{old}"',f'cdm="{quartet[k]}"')
                  return b
              return pat.sub(f,text)

          def ensure_target(text,cid):
              p=re.compile(rf'(<ControlSpec\b(?=[^>]*\bid="{re.escape(cid)}")[^>]*>)(.*?)(</ControlSpec>)',re.S); m=p.search(text)
              if not m: raise RuntimeError('missing control '+cid)
              if '<Target ' in m.group(2): return text
              ls=text.rfind('\n',0,m.start())+1; indent=re.match(r'[ \t]*',text[ls:m.start()]).group(0)
              new=m.group(1)+f'\n{indent}  <Target cdm="Platform.Identifier.Numeric"/>'+m.group(2)+m.group(3)
              return text[:m.start()]+new+text[m.end():]

          def expand_selfclosing_field(text, cdm, mapping):
              p=re.compile(rf'<Field\b(?=[^>]*\bcdm="{re.escape(cdm)}")[^>]*/>')
              ms=list(p.finditer(text))
              if len(ms)!=1: raise RuntimeError(f'self-closing Field count {len(ms)} for {cdm}')
              m=ms[0]; old=m.group(0); maps=''.join(f'<Map cdm="{x}" value="{v}"/>' for x,v in mapping)
              new=old[:-2]+f'><ValueMap>{maps}</ValueMap></Field>'
              return text[:m.start()]+new+text[m.end():]

          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')); bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          changed=[]
          for dev in devices:
              d=Path('ProtocolXml/USV')/dev; sp=d/f'{dev}Semantic.xml'; bp=d/f'{dev}Binding.xml'; st=sp.read_text(); bt=bp.read_text(); os,ob=st,bt
              st=canonicalize_sem(st); bt=canonicalize_maps(bt)
              if dev in {'CentralControl','ElectroOptical','ElectroOpticalProcessor','NavigationRadar','PlatformController','SensorFusion'}:
                  for cid in ('startIntegration','restartSystem','requestPbit','requestIbit'): st=ensure_target(st,cid)
              if dev=='PlatformController':
                  h=[('Health.Normal','0'),('Health.Degraded','1'),('Health.Unavailable','2'),('Health.NoResponse','3')]
                  for c in ['Health.CBIT.environmentSensorDeviceStatus','Health.CBIT.windSensorStatus','Health.CBIT.fireDetectorStatus','Health.CBIT.leakDetectorStatus','Health.CBIT.flowMeterStatus','Health.CBIT.stabilizerStatus','Health.CBIT.interceptorStatus','Health.CBIT.seaWaterAirConditionerStatus','Health.CBIT.towingDeviceStatus','Health.CBIT.spceStatus','Health.CBIT.vcuStatus','Health.CBIT.vcuTmpStatus']:
                      bt=expand_selfclosing_field(bt,c,h)
                  bt=expand_selfclosing_field(bt,'Platform.Power.Source',[('Platform.Power.Source.Battery','0'),('Platform.Power.Source.PDU','1')])
                  bt=expand_selfclosing_field(bt,'Platform.Power.PDU.Source',[('Platform.Power.PDU.Source.Generator','0'),('Platform.Power.PDU.Source.Shore','1')])
                  bt=expand_selfclosing_field(bt,'Platform.Power.Battery.ChargeState',[('Platform.Power.Battery.Standby','0'),('Platform.Power.Battery.Charging','1'),('Platform.Power.Battery.Discharging','2')])
                  bt=expand_selfclosing_field(bt,'Platform.Power.Battery.Level',[(f'Platform.Power.Battery.Level.{i}',str(i)) for i in range(6)])
                  bt=expand_selfclosing_field(bt,'Platform.Power.Battery.FaultStatus',[('Health.Status.Normal','0'),('Health.Status.Warning','1'),('Health.Status.Fault','2'),('Health.Status.Failure','3')])
              if dev=='SideScanSonar':
                  for c in ['ElectricalState.Power.TowedSonarArray','ElectricalState.Power.USBL','ElectricalState.Power.Winch','ElectricalState.Power.RecoveryUnit','ElectricalState.Power.Camera']:
                      bt=expand_selfclosing_field(bt,c,[('PowerSupplyState.Off','0'),('PowerSupplyState.On','1')])
              if st!=os: sp.write_text(st); changed.append(str(sp))
              if bt!=ob: bp.write_text(bt); changed.append(str(bp))

          # validate all integrated contracts
          failed=False; vm_mismatch=[]; no_map=[]
          for dev in devices:
              d=Path('ProtocolXml/USV')/dev; sp=d/f'{dev}Semantic.xml'; bp=d/f'{dev}Binding.xml'; s=etree.parse(str(sp)); b=etree.parse(str(bp))
              if not sx.validate(s): failed=True; print('SEM FAIL',dev,*sx.error_log,sep='\n')
              if not bx.validate(b): failed=True; print('BIND FAIL',dev,*bx.error_log,sep='\n')
              if bp.read_text().count('converter='): failed=True; print('CONVERTER',dev)
              cs={x.get('id') for x in s.xpath('//u:ControlSpecs/*[@id]',namespaces=N)}; cb={x.get('semantic_id') for x in b.xpath('//u:ControlBinding',namespaces=N)}
              rs={x.get('bindRef') for x in s.xpath('//u:ControlSpecs/*/u:Reply',namespaces=N)}; rb={x.get('semantic_id') for x in b.xpath('//u:ControlBinding/u:Reply',namespaces=N)}
              ms={x.get('id') for x in s.xpath('//u:MonitorSpecs/*[@id]',namespaces=N)}; mb={x.get('semantic_id') for x in b.xpath('//u:MonitorBinding',namespaces=N)}
              ps={x.get('id') for x in s.xpath('//u:ProductStreamSpec',namespaces=N)}; pb={x.get('semantic_id') for x in b.xpath('//u:ProductBinding',namespaces=N)}
              for lab,a,z in [('C',cs,cb),('R',rs,rb),('M',ms,mb),('P',ps,pb)]:
                  if a!=z: failed=True; print(lab+' DIFF',dev,a^z)
              for c in s.xpath('//u:ControlSpec',namespaces=N):
                  cid=c.get('id',''); low=cid.lower(); exp=None
                  if cid=='startIntegration': exp='Control.Integration.Start'
                  elif cid=='restartSystem': exp='Control.System.Restart'
                  elif cid=='requestPbit': exp='Request.Health.PBIT'
                  elif cid=='requestIbit': exp='Request.Health.IBIT'
                  elif cid in ('startControlStationIntegration','startUsvIntegration'): exp='Control.Integration.Start'
                  elif low.startswith('request') and 'pbit' in low: exp='Request.Health.PBIT'
                  elif low.startswith('request') and 'ibit' in low: exp='Request.Health.IBIT'
                  if exp and c.get('cdm')!=exp: failed=True; print('COMMON CDM',dev,cid,c.get('cdm'))
                  if cid in ('startIntegration','restartSystem','requestPbit','requestIbit'):
                      t=c.find(f'{{{U}}}Target')
                      if t is None or t.get('cdm')!='Platform.Identifier.Numeric': failed=True; print('TARGET',dev,cid)
              bad=[]
              for p in s.xpath('//u:ValueSetSpec|//u:ValueSetProfile|//u:ValueSetResult|//u:HealthStatusSetSpec',namespaces=N):
                  vals={v.get('cdm') for v in p.xpath('./u:Values/u:Value',namespaces=N) if v.get('cdm')}
                  kinds={accepted.get(v) for v in vals}
                  if len(vals)==4 and None not in kinds and kinds==set(quartet) and vals!=set(quartet.values()): failed=True; print('HEALTH FAMILY',dev,p.get('cdm'),vals)
                  for v in p.xpath('./u:Values/u:Value',namespaces=N):
                      if v.text and re.fullmatch(r'\s*[-+]?\d+(?:\.\d+)?\s*',v.text): bad.append((p.get('id') or p.get('cdm'),v.text.strip()))
              if bad: failed=True; print('RAW ENUM',dev,bad)
              sem={}
              for p in s.xpath('//u:ValueSetSpec|//u:ValueSetProfile|//u:ValueSetResult|//u:HealthStatusSetSpec',namespaces=N):
                  c=p.get('cdm'); vals={v.get('cdm') for v in p.xpath('./u:Values/u:Value',namespaces=N) if v.get('cdm')}
                  if c and vals: sem.setdefault(c,[]).append(vals)
              for x in b.xpath('//u:Field[@cdm]|//u:DerivedField[@cdm]|//u:BitMember[@cdm]',namespaces=N):
                  c=x.get('cdm')
                  if c not in sem: continue
                  vm=x.find(f'{{{U}}}ValueMap'); sm=x.find(f'{{{U}}}SourceValueMap')
                  if vm is None:
                      if sm is None: no_map.append((dev,c,x.get('name')))
                  else:
                      maps={m.get('cdm') for m in vm.findall(f'{{{U}}}Map') if m.get('cdm')}
                      if not any(maps==v for v in sem[c]): vm_mismatch.append((dev,c,x.get('name'),maps,sem[c]))
              for pf in b.xpath('//u:PackedField',namespaces=N):
                  width=int(pf.get('width')); used=set()
                  for bm in pf.xpath('./u:BitMember',namespaces=N):
                      off=int(bm.get('offset')); bw=int(bm.get('width','1')); bits=set(range(off,off+bw))
                      if off+bw>width or used&bits: failed=True; print('PACK ERROR',dev,pf.get('name'),bm.get('name'))
                      used|=bits
          if no_map: failed=True; print('NO MAP',len(no_map),no_map)
          if vm_mismatch: failed=True; print('VM MISMATCH',len(vm_mismatch),vm_mismatch)
          # preserve pre-integrated comments
          for dev in devices:
              for suf in ('Semantic.xml','Binding.xml'):
                  p=Path('ProtocolXml/USV')/dev/f'{dev}{suf}'; old=subprocess.check_output(['git','show',f'{base}:{p.as_posix()}']).decode(); cur=p.read_text()
                  lost=[x for x in re.findall(r'<!--.*?-->',old,re.S) if x not in cur]
                  if lost: failed=True; print('COMMENT LOST',dev,suf,len(lost))
          print('CHANGED',len(changed)); [print(x) for x in changed]
          if failed: raise SystemExit(1)
          PY
          python /tmp/normalize.py
          git diff --check
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProtocolXml/USV
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize USV common CDM ValueMap and target consistency"
          git push origin HEAD:feature/usv-semantic-binding-audit
