name: temporary NearContactDetection uploaded CSV reaudit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Refresh NearContactDetection audit notes
        shell: python
        run: |
          from pathlib import Path

          bind=Path('ProtocolXml/USV/NearContactDetection/NearContactDetectionBinding.xml')
          issues=Path('ProtocolXml/USV/NearContactDetection/NearContactDetection_OpenIssues.md')
          b=bind.read_text(encoding='utf-8')
          o=issues.read_text(encoding='utf-8')

          old='''        <!--SCDE IBIT의 장치별 상세 octet은 원문 bit-packed 값을 raw로 유지하며 임의의 bit extractor를 적용하지 않는다.-->
        <!--powerManagingModuleStatus: Bit0=보드장비 전원 상태, Bit1~7 reserved.-->
        <!--ecuComputing1~3ModuleStatus, t1Converter1~2ModuleStatus, ethernetHubStatus: Bit1=동작 상태, Bit0=전원 상태, Bit2~7 reserved.-->
        <!--fourDImageRadar1Status: Bit1=동작 상태, Bit0=전원 상태, Bit2~7 reserved. 2~9번 필드는 원문에 개별 비트 설명이 없어 동일 구조를 임의 확정하지 않는다.-->
        <!--rgbCameraContact1Status: Bit1=동작 상태, Bit0=전원 상태, Bit2~7 reserved. 2~9번은 원문에 개별 비트 설명이 없어 동일 구조를 임의 확정하지 않는다.-->
        <!--rgbCameraSVM1Status: Bit1=동작 상태, Bit0=전원 상태, Bit2~7 reserved. 2~6번은 원문에 개별 비트 설명이 없어 동일 구조를 임의 확정하지 않는다.-->
'''
          new='''        <!--SCDE IBIT 상세 octet은 CSCI의 bit 정의를 PackedField로 가시화한다. 전원/동작 bit는 원문에 0=비정상, 1=정상이 직접 정의되어 Semantic BooleanResult에 연결한다.-->
        <!--powerManagingModuleStatus: Bit0=전원 상태, Bit1~7 reserved. ECU1~3/T1 Converter1~2/Ethernet Hub: Bit0=전원, Bit1=동작, Bit2~7 reserved.-->
        <!--반복 센서군은 첫 비고의 `4D 이미지 레이더#`, `RGB 카메라(접촉물)#`, `RGB 카메라(서라운드뷰)#` 표기가 특정 1번이 아닌 공통 placeholder이며 이후 행 공란은 병합셀 CSV export 패턴이다. 따라서 Radar1~9, Contact1~9, SVM1~6 전체에 Bit0=전원, Bit1=동작 규칙을 적용한다.-->
'''
          if b.count(old) != 1:
              raise SystemExit(f'SCDE stale comment block count={b.count(old)}')
          b=b.replace(old,new,1)

          old2='''        <!--라이다 IBIT의 category/level/sensorAction은 원문 bit-packed 값을 raw로 유지한다.-->
        <!--lidar#Category: Bit14 IO_CONNECTION, 13 CONFIG, 12 MOTOR_CONTROL, 11 WARMUP_ISSUE, 10 INTERNAL_FAULT, 9 UDP_CONNECT, 8 INPUT_VOLTAGE, 7 STARTUP, 6 UDP_TRANSMISSION, 5 ETHERNET_LINK_BAD, 4 INTERNAL_FW, 3 SHOT_LIMITING, 2 INTERNAL_COMM, 1 UNDERTEMP, 0 OVERTEMP; Bit15 reserved.-->
        <!--lidar#Level: Bit3 Error, Bit2 Warning, Bit1 Notice, Bit0 Normal; Bit4~7 reserved.-->
        <!--lidar#SensorAction: Bit2 RESTART, Bit1 SHUTDOWN, Bit0 No Action; Bit3~7 reserved.-->
'''
          new2='''        <!--라이다 IBIT의 category/level/sensorAction은 원문 bit 위치를 PackedField로 분해한다. 각 bit의 동시 설정 가능 여부/우선순위는 원문에 없으므로 별도 운용 규칙을 만들지 않는다.-->
        <!--lidar#Category: Bit14 IO_CONNECTION, 13 CONFIG, 12 MOTOR_CONTROL, 11 WARMUP_ISSUE, 10 INTERNAL_FAULT, 9 UDP_CONNECT, 8 INPUT_VOLTAGE, 7 STARTUP, 6 UDP_TRANSMISSION, 5 ETHERNET_LINK_BAD, 4 INTERNAL_FW, 3 SHOT_LIMITING, 2 INTERNAL_COMM, 1 UNDERTEMP, 0 OVERTEMP; Bit15 reserved.-->
        <!--lidar#Level: Bit3 Error, Bit2 Warning, Bit1 Notice, Bit0 Normal; Bit4~7 reserved. lidar#SensorAction: Bit2 RESTART, Bit1 SHUTDOWN, Bit0 No Action; Bit3~7 reserved.-->
'''
          if b.count(old2) != 1:
              raise SystemExit(f'Lidar stale comment block count={b.count(old2)}')
          b=b.replace(old2,new2,1)

          anchor='- Lidar IBIT category(UInt16), level(UInt8), sensorAction(UInt8)은 원문 bit 위치를 PackedField로 선언하고 mapping ID는 UInt32로 반영하였다.\n'
          add='''- 2026-08-28 재업로드된 `근거리접촉물탐지장치 CSCI.csv`를 전체 재검증하였다. SCDE 반복 센서의 `#` placeholder와 0=비정상/1=정상 규칙, Lidar1/2 Category·Level·SensorAction bit 위치, SCDE/Lidar CBIT·PBIT·IBIT 상태코드 0~3을 재확인하였다.\n- 같은 업로드본에서 PBIT/IBIT 요청 1회에 SCDE/Lidar 결과가 모두 발생한다는 fan-out 규칙, 결과 commandID correlation, Lidar level/action 다중 bit 우선순위, 서라운드뷰 RTP 실제 IP/Port는 추가 정의를 찾지 못했다. 따라서 미해결 4건은 그대로 유지한다.\n- Binding에 남아 있던 "반복 센서 2~N은 미확정" 및 "Lidar bit-packed 값을 raw 유지"라는 과거 주석은 실제 PackedField 구현/해결 상태와 충돌하여 현재 근거에 맞게 동기화하였다.\n'''
          if add not in o:
              if anchor not in o: raise SystemExit('issues anchor not found')
              o=o.replace(anchor,anchor+add,1)

          old_status='''- 원통 직접 연동 범위의 Semantic/Binding 정리와 근거리접촉물탐지장치 CSCI 재심층 감사까지 완료하였다.
- 반복 센서 상세 bit 의미 1건을 CSV 공통 placeholder/병합셀 구조 근거로 해소하였다. 미해결 4건은 추가 ICD/Adapter/원문 확인이 필요한 비차단 TBD이다.'''
          new_status='''- 원통 직접 연동 범위의 Semantic/Binding 정리와 재업로드된 근거리접촉물탐지장치 CSCI 전체 재검증까지 완료하였다.
- 반복 센서 상세 bit 의미는 CSV 공통 placeholder/병합셀 구조 근거로 해소되어 있으며, Binding의 과거 주석도 현 구현과 동기화하였다.
- 재업로드본에서도 추가로 닫을 수 있는 항목은 확인되지 않았다. 미해결 4건은 추가 ICD/Adapter/운용 설정 근거가 필요한 비차단 TBD이다.'''
          if old_status not in o: raise SystemExit('status block not found')
          o=o.replace(old_status,new_status,1)

          bind.write_text(b,encoding='utf-8')
          issues.write_text(o,encoding='utf-8')

      - name: Validate all USV XML and assertions
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=list(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          b=Path('ProtocolXml/USV/NearContactDetection/NearContactDetectionBinding.xml').read_text(encoding='utf-8')
          o=Path('ProtocolXml/USV/NearContactDetection/NearContactDetection_OpenIssues.md').read_text(encoding='utf-8')
          assert '2~9번 필드는 원문에 개별 비트 설명이 없어' not in b
          assert 'category/level/sensorAction은 원문 bit-packed 값을 raw로 유지' not in b
          assert 'Radar1~9, Contact1~9, SVM1~6 전체' in b
          assert '미해결 4건' in o
          assert '재업로드된 `근거리접촉물탐지장치 CSCI.csv`' in o
          assert all('converter=' not in p.read_text(encoding='utf-8') for p in binds)
          print(f'USV Semantic {len(sems)} PASS / Binding {len(binds)} PASS')
          print('NEAR CONTACT DETECTION UPLOADED CSV REAUDIT PASS')
          PY
      - name: Commit NearContactDetection reaudit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/NearContactDetection/NearContactDetectionBinding.xml ProtocolXml/USV/NearContactDetection/NearContactDetection_OpenIssues.md
          git commit -m 'Reaudit NearContactDetection against uploaded CSCI'
          git push origin HEAD:feature/usv-semantic-binding-audit
