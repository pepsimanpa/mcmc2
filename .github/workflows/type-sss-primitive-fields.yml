name: Type SSS Primitive Fields

on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/type-sss-primitive-fields.yml']

permissions:
  contents: write

jobs:
  type-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - name: Apply source-confirmed primitive types
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re

          bind = Path('ProtocolXml/USV/SideScanSonar/SideScanSonarBinding.xml')
          issues = Path('ProtocolXml/USV/SideScanSonar/SideScanSonar_OpenIssues.md')
          text = bind.read_text(encoding='utf-8')
          old_comments = re.findall(r'<!--[\s\S]*?-->', text)

          groups = {
            'UInt8': '''cameraPowerStatus gain gfGain gfTvgMode hullMountedSonarDetail hullMountedSonarTotalCBIT hullMountedSonarTotalIBIT hullMountedSonarTotalPBIT launch launchAndRecoveryFunctionDetail launchAndRecoveryLinkDetail launchAndRecoveryOverCurrentDetail launchAndRecoveryPowerDetail launchAndRecoveryTotalCBIT launchAndRecoveryTotalIBIT launchAndRecoveryTotalPBIT launchLimitSwitchStatus operationStatus operationalModeTSA pad1 recoveryLimitSwitchStatus recoveryUnitPowerStatus sideScanSonarType slideBackStop slideMotorBrakeStatus sonarImagingHealthDetail sonarImagingProcessingEquipmentDetail sonarImagingProcessingEquipmentTotalCBIT sonarImagingProcessingEquipmentTotalIBIT sonarImagingProcessingEquipmentTotalPBIT sonarSignalProcessingEquipmentDetail sonarSignalProcessingEquipmentTotalCBIT sonarSignalProcessingEquipmentTotalIBIT sonarSignalProcessingEquipmentTotalPBIT sssGain sssTvgMode towedSonarArrayDetail towedSonarArrayPowerStatus towedSonarArrayTotalCBIT towedSonarArrayTotalIBIT towedSonarArrayTotalPBIT towedSonarAssemblyTotalCBIT towedSonarAssemblyTotalIBIT towedSonarAssemblyTotalPBIT tvgMode ultraShortBaseLineMode ultraShortBaseLineMotorBrakeStatus ultraShortBaseLinePowerStatus videoQualityType winchMotorBrakeStatus winchPowerStatus targetDevice powerOn sonarType pulseType swGainMode autoGain tvgA tvgB tvgC rawGain lowPassFilterMode lowPassFilterLevel screenChangeMode separation emergencyStop start mode commandStatusReport.dstEquipmentType commandStatusReport.dstEquipmentID commandStatusReport.status'''.split(),
            'UInt16': '''commandID data dataCount dataPORT dataSTBD gfPulseType gfPulseWidth gfRange gfTvgAttenCoeff gfTvgDistCoeff range sssPulseType sssPulseWidth sssRange sssTvgAttenCoeff sssTvgDistCoeff transducerFreq tvgAttenCoeff tvgDistCoeff frequency pulseWidth'''.split(),
            'Float32': '''cableDeployLength cableDeploySpeed cableLength cableTension hmMux3v3Voltage hmMux5vVoltage hmMuxAdcIn1Temp hmMuxAdcIn2Temp hmTx12vVoltage hmTx5vVoltage hmTxCapVoltage hmTxSupplyVoltage powerCardTemp recoveryUnitCurrent sbcBoardTemp slidePosition spcPower5vVoltage spcPowerSysCurrentVoltage spcPowerSysVoltage spcPowerTemp1 spcPowerTemp2 spcPowerTwfCurrentFault spcPowerTwfCurrentVoltage spcPowerTwfVoltage tdcDemux3v3Voltage tdcDemux5vVoltage tdcDemuxTemp1 tdcDemuxTemp2 tlc12vCurrentVoltage tlc12vVoltage tlc5vCurrentVoltage tlc5vVoltage tlcN12vCurrentRefVoltage tlcN12vVoltage tlcN5vCurrentVoltage tlcN5vVoltage towAltitude towDepth towHeading towPitch towRoll towedSonarArrayAltitude towedSonarArrayDepth towedSonarArrayHeading towedSonarArrayPitch towedSonarArrayRoll tpcPower12vCurrentVoltage tpcPower12vVoltage tpcPowerTpuCurrentVoltage tpcPowerTpuVoltage tsadMux12vVoltage tsadMux3v3Voltage tsadMux5vVoltage tsadMuxOcxTemp tsadMuxPcmTemp tsadTx12vVoltage tsadTxHfPortRms tsadTxHfStbdRms tsadTxLfPortRms tsadTxLfStbdRms tsadTxPortCapVoltage tsadTxStbdCapVoltage tsadTxSupplyVoltage ultraShortBaseLineVerticalCurrent ultraShortBaseLineVerticalPosition winchCurrent targetDepth lengthCommandWinch motorSpeed slideDeploy winchDeploy'''.split(),
            'Float64': '''attitudePitch attitudeRoll attitudeYaw courseYaw groundSpeed positionLatitude positionLongitude positionMSLAltitude towLatitude towLongitude'''.split(),
          }
          type_map = {}
          for typ, names in groups.items():
              for name in names:
                  if name in type_map and type_map[name] != typ:
                      raise SystemExit(f'conflicting static type map for {name}')
                  type_map[name] = typ

          applied = {k: 0 for k in groups}
          pattern = re.compile(r'<(Field|FixedField|DerivedField)\b([^>]*\bname="([^"]+)"[^>]*)/>')
          def repl(m):
              whole = m.group(0)
              name = m.group(3)
              typ = type_map.get(name)
              if not typ or 'dataType=' in whole:
                  return whole
              applied[typ] += 1
              return whole[:-2] + f' dataType="{typ}"/>'
          new = pattern.sub(repl, text)
          bind.write_text(new, encoding='utf-8', newline='')

          new_comments = re.findall(r'<!--[\s\S]*?-->', new)
          if old_comments != new_comments:
              raise SystemExit('existing XML comments changed or lost')
          if sum(applied.values()) == 0:
              raise SystemExit('no primitive dataType was applied')

          schema = etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          schema.assertValid(etree.parse(str(bind)))

          root = etree.parse(str(bind)).getroot()
          ns = {'u':'http://lignex1.com/mcmc2/umsSchema'}
          remaining=[]
          for tag in ['Field','FixedField','DerivedField']:
              for e in root.xpath(f'.//u:{tag}', namespaces=ns):
                  if e.get('dataType') is None:
                      remaining.append((tag,e.get('name')))
          print('APPLIED', applied, 'TOTAL', sum(applied.values()))
          print('REMAINING_UNTYPED', len(remaining))
          print('REMAINING_NAMES', sorted(set(n for _,n in remaining)))

          marker='## Primitive dataType migration'
          doc=issues.read_text(encoding='utf-8')
          if marker not in doc:
              doc += '''\n\n## Primitive dataType migration\n\n- `예인형수중탐색장치 CSCI.csv`, `원격통제장치 CSCI.csv`, `공용 규칙.csv`, `공용 구조체.csv`에서 자료형이 직접 확인되는 primitive 필드만 Binding `dataType`으로 반영한다.\n- IDL 매핑 기준: `octet/unsigned char -> UInt8`, `short -> Int16`, `unsigned short -> UInt16`, `long -> Int32`, `unsigned long -> UInt32`, `float -> Float32`, `double -> Float64`.\n- `USVMessageBase`, `DestinationType` 등 composite 구조체에는 primitive `dataType`을 억지로 부여하지 않는다.\n- 동일 이름이라도 메시지별 타입이 달라질 수 있는 필드는 DDS `typeName` 문맥으로 재확인한다. 특히 원신호의 `pulseType`과 제어 `StatusConfigType.pulseType`처럼 이름 재사용이 있는 경우 현재 Binding에 실제 사용되는 메시지 정의를 우선한다.\n- `boolean`, 배열, 문자열/char, 사용자 정의 구조체처럼 현재 `WireDataType`으로 직접 표현하기 애매한 항목은 후속 검토로 남긴다.\n'''
              issues.write_text(doc, encoding='utf-8', newline='')
          PY
          git diff --check
          git rm .github/workflows/type-sss-primitive-fields.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add source-confirmed SSS primitive wire types'
          git push origin HEAD:feature/usv-semantic-binding-audit
