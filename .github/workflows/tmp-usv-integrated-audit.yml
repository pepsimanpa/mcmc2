name: temporary USV integrated semantic binding audit

on:
  push:
    branches: [feature/usv-semantic-binding-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - run: python -m pip install --quiet lxml
      - name: Audit all USV devices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re, collections, json

          URI='http://lignex1.com/mcmc2/umsSchema'
          NS={'u':URI}
          devices=[
            'AutonomousNavigation','CentralControl','ElectroOptical','ElectroOpticalProcessor',
            'IntegratedNavigation','Lidar','NavigationCamera','NavigationRadar','NearContactDetection',
            'NetworkAbstraction','PlatformController','RemoteFireControl','SensorFusion','SideScanSonar'
          ]
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          common_ids=['startIntegration','restartSystem','requestPbit','requestIbit']
          aliases={
            'startIntegration': re.compile(r'(start.*integration|integration.*start)',re.I),
            'restartSystem': re.compile(r'(restart.*system|system.*restart|reboot)',re.I),
            'requestPbit': re.compile(r'pbit',re.I),
            'requestIbit': re.compile(r'ibit',re.I),
          }

          print('=== DEVICE SUMMARY ===')
          docs={}
          cdm_index=collections.defaultdict(list)
          common_rows=[]
          all_issues=[]
          failed=False

          def local(e): return etree.QName(e).localname
          def children_by(node,name): return [x for x in node if isinstance(x.tag,str) and local(x)==name]
          def first_child(node,name):
              for x in node:
                  if isinstance(x.tag,str) and local(x)==name: return x
              return None

          for dev in devices:
              d=Path('ProtocolXml/USV')/dev
              sp=d/f'{dev}Semantic.xml'; bp=d/f'{dev}Binding.xml'; op=d/f'{dev}_OpenIssues.md'
              if not sp.exists() or not bp.exists():
                  print('MISSING FILE',dev); failed=True; continue
              sr=etree.parse(str(sp)); br=etree.parse(str(bp)); docs[dev]=(sr,br)
              sv=sx.validate(sr); bv=bx.validate(br)
              ctrls=sr.xpath('//u:ControlSpec',namespaces=NS)
              replies=sr.xpath('//u:ControlSpec/u:Reply',namespaces=NS)
              mons=sr.xpath('//u:MonitorSpecs/*',namespaces=NS)
              prods=sr.xpath('//u:ProductStreamSpec',namespaces=NS)
              conv=bp.read_text().count('converter=')
              raw=[v.text.strip() for v in sr.xpath('//u:Value',namespaces=NS) if v.text and re.fullmatch(r'\s*[-+]?\d+(?:\.\d+)?\s*',v.text)]
              missing=[]
              for e in br.xpath('//u:Field|//u:FixedField|//u:DerivedField',namespaces=NS):
                  n=e.get('name','')
                  if n in ('usvHeader','destination') or n.endswith('.usvHeader') or n.endswith('.destination'): continue
                  if e.get('dataType') is None: missing.append(n)
              print(f'{dev}: XSD={sv and bv} C={len(ctrls)} R={len(replies)} M={len(mons)} P={len(prods)} converter={conv} rawEnum={len(raw)} missingType={len(missing)}')
              if not sv:
                  for x in sx.error_log: print('  SEM XSD',x)
              if not bv:
                  for x in bx.error_log: print('  BIND XSD',x)
              if not sv or not bv or conv or raw: failed=True
              for e in sr.xpath('//*[@cdm]',namespaces=NS):
                  cdm_index[e.get('cdm')].append((dev,local(e),e.get('id') or e.get('name') or e.get('bindRef')))
              if op.exists():
                  txt=op.read_text()
                  for line in txt.splitlines():
                      if re.match(r'^\d+\. \*\*',line.strip()): all_issues.append((dev,line.strip()))

              # Identify common controls by exact ID first, then aliases.
              for canonical in common_ids:
                  matches=[c for c in ctrls if c.get('id')==canonical]
                  if not matches:
                      matches=[c for c in ctrls if aliases[canonical].search(c.get('id',''))]
                  if len(matches)!=1:
                      common_rows.append((dev,canonical,'MISSING_OR_AMBIG',len(matches)))
                      continue
                  c=matches[0]; cid=c.get('id'); cdm=c.get('cdm'); name=c.get('name')
                  target=first_child(c,'Target'); target_cdm=target.get('cdm') if target is not None else None
                  semreps=[]
                  for r in children_by(c,'Reply'):
                      semreps.append((r.get('bindRef'),r.get('cdm'),r.get('required')))
                  bmatches=br.xpath(f'//u:ControlBinding[@semantic_id="{cid}"]',namespaces=NS)
                  if len(bmatches)!=1:
                      common_rows.append((dev,canonical,cid,cdm,name,target_cdm,semreps,'BIND_MISSING',len(bmatches)))
                      continue
                  cb=bmatches[0]
                  ch=first_child(cb,'DDSChannel')
                  topic=ch.get('topicName') if ch is not None else None; typ=ch.get('typeName') if ch is not None else None
                  dest=[]; cmd=[]
                  for x in cb:
                      if not isinstance(x.tag,str): continue
                      if local(x) not in ('Field','DerivedField','FixedField'): continue
                      n=x.get('name','')
                      if 'destination' in n.lower() or n.lower().startswith('dst'):
                          dest.append((local(x),n,x.get('sourceField'),x.get('value'),x.get('dataType')))
                      if n=='commandID' or n.endswith('.commandID'):
                          cmd.append((local(x),n,x.get('sourceField'),x.get('dataType')))
                  breps=[]
                  for r in children_by(cb,'Reply'):
                      rch=first_child(r,'DDSChannel')
                      fields=[]
                      for f in r:
                          if isinstance(f.tag,str) and local(f) in ('Field','DerivedField','FixedField'):
                              fields.append((f.get('name'),f.get('cdm'),f.get('dataType')))
                      breps.append((r.get('semantic_id'),r.get('required'),rch.get('topicName') if rch is not None else None,rch.get('typeName') if rch is not None else None,fields))
                  common_rows.append((dev,canonical,cid,cdm,name,target_cdm,semreps,topic,typ,dest,cmd,breps))

          print('\n=== COMMON CONTROL MATRIX ===')
          for row in common_rows: print('COMMON',json.dumps(row,ensure_ascii=False))

          print('\n=== COMMON CONTROL CONSISTENCY ===')
          for canonical in common_ids:
              rows=[r for r in common_rows if len(r)>2 and r[1]==canonical and len(r)>8]
              print('\n--',canonical,'--')
              fields={
                'semantic_id': collections.defaultdict(list),
                'cdm': collections.defaultdict(list),
                'target_cdm': collections.defaultdict(list),
                'topic/type': collections.defaultdict(list),
              }
              for r in rows:
                  dev,_,cid,cdm,name,target,semreps,topic,typ,dest,cmd,breps=r
                  fields['semantic_id'][cid].append(dev); fields['cdm'][cdm].append(dev); fields['target_cdm'][target].append(dev); fields['topic/type'][(topic,typ)].append(dev)
              for k,v in fields.items(): print(k,dict(v))

          # Same semantic_id across devices should generally use same semantic CDM for common concepts.
          print('\n=== CROSS-DEVICE SEMANTIC-ID CDM VARIANTS ===')
          by_id=collections.defaultdict(lambda: collections.defaultdict(list))
          for dev,(sr,br) in docs.items():
              for e in sr.xpath('//u:ControlSpec|//u:MonitorSpecs/*',namespaces=NS):
                  eid=e.get('id'); cdm=e.get('cdm')
                  if eid and cdm: by_id[eid][cdm].append(dev)
          for eid,variants in sorted(by_id.items()):
              if len(variants)>1 and sum(len(x) for x in variants.values())>1:
                  print('CDM_VARIANT',eid,dict(variants))

          print('\n=== ACK SHAPE AUDIT ===')
          for dev,(sr,br) in docs.items():
              for cb in br.xpath('//u:ControlBinding',namespaces=NS):
                  cid=cb.get('semantic_id')
                  for r in cb.xpath('./u:Reply',namespaces=NS):
                      ch=r.find(f'{{{URI}}}DDSChannel')
                      typ=ch.get('typeName') if ch is not None else ''
                      if typ=='CommandStatusReportType':
                          names=[f.get('name') for f in r if isinstance(f.tag,str) and local(f) in ('Field','DerivedField','FixedField')]
                          req=['usvHeader','commandStatusReport.status','commandID']
                          miss=[x for x in req if x not in names]
                          print('ACK',dev,cid,r.get('semantic_id'),'required='+str(r.get('required')),'missing='+str(miss),'fields='+str(names))

          print('\n=== DESTINATION AUDIT ===')
          for dev,(sr,br) in docs.items():
              vals=[]
              for cb in br.xpath('//u:ControlBinding',namespaces=NS):
                  cid=cb.get('semantic_id')
                  ds=[]
                  for x in cb:
                      if isinstance(x.tag,str) and local(x) in ('DerivedField','FixedField','Field') and 'destination' in x.get('name','').lower():
                          ds.append((local(x),x.get('name'),x.get('sourceField'),x.get('value')))
                  if ds: vals.append((cid,ds))
              print('DEST',dev,json.dumps(vals,ensure_ascii=False))

          print('\n=== PACKED FIELD AUDIT ===')
          for dev,(sr,br) in docs.items():
              for pf in br.xpath('//u:PackedField',namespaces=NS):
                  width=int(pf.get('width'))
                  used=[]; overlaps=[]; oor=[]
                  for bm in pf.xpath('./u:BitMember',namespaces=NS):
                      off=int(bm.get('offset')); bw=int(bm.get('width','1'))
                      if off+bw>width: oor.append((bm.get('name'),off,bw))
                      for b in range(off,off+bw):
                          if b in used: overlaps.append((bm.get('name'),b))
                          used.append(b)
                  print('PACKED',dev,pf.get('name'),'width',width,'members',len(pf.xpath('./u:BitMember',namespaces=NS)),'overlap',overlaps,'oor',oor)
                  if overlaps or oor: failed=True

          print('\n=== OPEN ISSUE DUPLICATE THEMES ===')
          themes={
            'PBIT_IBIT_CORRELATION': re.compile(r'PBIT/IBIT.*correlation|correlation.*PBIT/IBIT|PBIT/IBIT Result correlation',re.I),
            'BOOLEAN_WIRE_TYPE': re.compile(r'boolean.*WireDataType|DDS boolean|Boolean wire',re.I),
            'SOURCE_ROUTING': re.compile(r'source routing|송신.*식별|source-card|송신 카드',re.I),
            'COUNT_SEQUENCE': re.compile(r'count.*sequence|sequence.*length|개수.*sequence|sequence.*개수',re.I),
          }
          for t,pat in themes.items():
              hits=[(d,l) for d,l in all_issues if pat.search(l)]
              print(t,len(hits),hits)

          if failed:
              raise SystemExit(1)
          PY
