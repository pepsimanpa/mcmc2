name: Migrate AUV Derived Converters

on:
  push:
    branches: [feature/auv-declarative-binding-cleanup]
    paths: ['.github/workflows/migrate-auv-derived-converters.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-declarative-binding-cleanup
          fetch-depth: 0

      - name: Replace AUV derived converters with declarative mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          schema = Path('ProtocolXml/XSD/CommonBindingSchema.xsd')
          platform = Path('ProtocolXml/AUV/AuvPlatformRfBinding.xml')
          comm = Path('ProtocolXml/AUV/AuvRfCommBinding.xml')
          semantic = Path('ProtocolXml/AUV/AuvPlatformSemantic.xml')
          doc = Path('ProtocolXml/Docs/UMS_Semantic_Binding_Design_Rules_20260826.md')

          comment_files=[platform,comm,semantic]
          before_comments={p:len(re.findall(r'<!--[\s\S]*?-->',p.read_text(encoding='utf-8'))) for p in comment_files}

          # 1) Common declarative source-value mapping: prepared scalar source value -> wire raw value.
          s=schema.read_text(encoding='utf-8')
          anchor='''    <xs:complexType name="ValueMapType">\n        <xs:sequence>\n            <xs:element name="Map" type="ValueMapEntryType" minOccurs="1" maxOccurs="unbounded"/>\n        </xs:sequence>\n    </xs:complexType>\n'''
          addition=anchor+'''\n    <!-- Declarative mapping from a prepared sourceField scalar value to a wire value. -->\n    <xs:complexType name="SourceValueMapEntryType">\n        <xs:attribute name="sourceValue" type="xs:string" use="required"/>\n        <xs:attribute name="value" type="xs:string" use="required"/>\n    </xs:complexType>\n\n    <xs:complexType name="SourceValueMapType">\n        <xs:sequence>\n            <xs:element name="Map" type="SourceValueMapEntryType" minOccurs="1" maxOccurs="unbounded"/>\n        </xs:sequence>\n    </xs:complexType>\n'''
          if 'name="SourceValueMapType"' not in s:
              if anchor not in s: raise SystemExit('ValueMapType anchor not found')
              s=s.replace(anchor,addition,1)
          old='''    <xs:complexType name="DerivedFieldType">\n        <xs:sequence>\n            <xs:element name="ValueMap" type="ValueMapType" minOccurs="0"/>\n        </xs:sequence>'''
          new='''    <xs:complexType name="DerivedFieldType">\n        <xs:sequence>\n            <xs:element name="ValueMap" type="ValueMapType" minOccurs="0"/>\n            <xs:element name="SourceValueMap" type="SourceValueMapType" minOccurs="0"/>\n        </xs:sequence>'''
          if old not in s and 'name="SourceValueMap" type="SourceValueMapType"' not in s:
              raise SystemExit('DerivedFieldType anchor not found')
          s=s.replace(old,new,1)
          schema.write_text(s,encoding='utf-8',newline='')

          def migrate_binding(p):
              s=p.read_text(encoding='utf-8')

              # Platform.Identifier.Numeric is intentionally defined for this AUV RF design as target 1 or 2.
              # INFO1: 1->1, 2->4 / INFO2: 1->2, 2->5 / INFO3: 1->3, 2->6.
              pat=re.compile(r'(?P<indent>\s*)<DerivedField name="informationNumber" sourceField="Platform.Identifier.Numeric" dataType="UInt8" converter="TargetAuvToInformation([123])"/>')
              def repl(m):
                  i=int(m.group(2)); ind=m.group('indent')
                  return (f'{ind}<DerivedField name="informationNumber" sourceField="Platform.Identifier.Numeric" dataType="UInt8">\n'
                          f'{ind}    <SourceValueMap>\n'
                          f'{ind}        <Map sourceValue="1" value="{i}"/>\n'
                          f'{ind}        <Map sourceValue="2" value="{i+3}"/>\n'
                          f'{ind}    </SourceValueMap>\n'
                          f'{ind}</DerivedField>')
              s,n=pat.subn(repl,s)
              print(p,'INFO_NUM mappings',n)

              # RF-1 transmit checksum: framing stage prepares the calculated checksum value;
              # Binding only places the prepared UInt16 on the wire.
              s,n2=re.subn(
                  r'<DerivedField name="checksum" sourceField="System\.Frame\.CountThroughInformation" dataType="UInt16" converter="ByteSumModulo65536LE"/>',
                  '<DerivedField name="checksum" sourceField="System.Frame.Checksum" dataType="UInt16"/>',
                  s)
              print(p,'RF1 checksum converter removals',n2)

              # Mission waypoint count is a prepared logical derivative of MissionPlan.Waypoints,
              # not a Binding-side array-length computation.
              s,n3=re.subn(
                  r'<DerivedField name="waypointCount" cdm="MissionPlan\.WaypointCount" sourceField="waypoints" dataType="UInt8" converter="ArrayLengthUInt8"/>',
                  '<DerivedField name="waypointCount" cdm="MissionPlan.WaypointCount" sourceField="MissionPlan.WaypointCount" dataType="UInt8"/>',
                  s)
              print(p,'waypoint count converter removals',n3)

              # Keep source comments, only update statements invalidated by this migration.
              s=s.replace(
                  '- INFO_NUM converter와 실제 AUV 대상 선택 방식은 adapter 구현 확인이 필요하다.',
                  '- INFO_NUM은 Platform.Identifier.Numeric=1/2를 입력으로 하며 SourceValueMap으로 INFORMATION1/2/3의 1~6 값을 선언한다.')
              p.write_text(s,encoding='utf-8',newline='')

          migrate_binding(platform)
          migrate_binding(comm)

          # Semantic: waypointCount remains hidden/derived, not an extra user/HMI parameter.
          s=semantic.read_text(encoding='utf-8')
          needle='''            ALIGN_INTERVAL의 단위와 범위, Custom1/Custom2의 의미는 정의되지 않았다.\n        -->'''
          replacement='''            ALIGN_INTERVAL의 단위와 범위, Custom1/Custom2의 의미는 정의되지 않았다.\n            WAYPOINT count는 사용자 입력 Parameter로 중복 노출하지 않고 Waypoints collection 길이에서 파생되는 전송 지원 값으로 취급한다.\n        -->'''
          if needle not in s: raise SystemExit('mission semantic comment anchor not found')
          s=s.replace(needle,replacement,1)
          semantic.write_text(s,encoding='utf-8',newline='')

          # Unified record: document the resolved declarative mapping and framing responsibility.
          s=doc.read_text(encoding='utf-8')
          marker='''## 확정된 별도 bit 규칙\n'''
          section='''## Issue 14. AUV 파생 converter 정리\n\n**Status: RESOLVED**\n\nAUV RF Binding의 다음 계산성 converter를 선언형/책임분리 구조로 정리한다.\n\n- `TargetAuvToInformation1/2/3` 제거\n  - `Platform.Identifier.Numeric`은 AUV 대상 `1` 또는 `2`가 입력된다고 전제한다.\n  - `DerivedField/SourceValueMap`으로 INFO_NUM을 선언한다.\n  - INFORMATION1: `1→1`, `2→4`\n  - INFORMATION2: `1→2`, `2→5`\n  - INFORMATION3: `1→3`, `2→6`\n- `ArrayLengthUInt8` 제거\n  - `MissionPlan.WaypointCount`는 `MissionPlan.Waypoints` collection 길이에서 파생되어 준비되는 값이다.\n  - Semantic/HMI에 별도 중복 입력 Parameter로 노출하지 않는다.\n  - Binding은 준비된 `MissionPlan.WaypointCount`를 `UInt8`로 기록한다.\n- `ByteSumModulo65536LE` 제거\n  - RF-1 checksum 계산식 자체는 ICD 규칙을 유지한다: COUNT부터 INFORMATION 마지막 byte까지 unsigned byte 합의 modulo 65536.\n  - checksum 계산은 RF framing 단계 책임이며 Binding은 준비된 `System.Frame.Checksum`을 `UInt16`로 기록한다.\n  - RF-2 수신 checksum은 이미 일반 wire `Field UInt16`으로 표현한다.\n\n공통 XSD에는 의미 enum의 `ValueMap`과 구분하여, 준비된 scalar source 값에서 wire 값으로의 선언형 매핑을 위한 `SourceValueMap`을 추가한다. 계산 함수명이나 특정 구현 함수는 Binding에 두지 않는다.\n\n'''
          if '## Issue 14. AUV 파생 converter 정리' not in s:
              if marker not in s: raise SystemExit('doc marker not found')
              s=s.replace(marker,section+marker,1)
          s=s.replace('- `requestData` Semantic에는 일반 RF-2/RF-3 Reply를 두지 않는다.\n- Binding에 존재하는 `requestDataReply`는 제거 대상이다.',
                      '- `requestData` Semantic에는 일반 RF-2/RF-3 Reply를 두지 않는다.\n- Binding의 기존 `requestDataReply`는 제거 완료하였다.')
          doc.write_text(s,encoding='utf-8',newline='')

          for p in comment_files:
              after=len(re.findall(r'<!--[\s\S]*?-->',p.read_text(encoding='utf-8')))
              if after < before_comments[p]:
                  raise SystemExit(f'comment loss {p}: {before_comments[p]} -> {after}')
              print('comments',p,before_comments[p],'->',after)
          PY
          git diff --check

      - name: Validate AUV and shared binding schema
        run: |
          python -m pip install --quiet lxml
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          import re

          schema_path='ProtocolXml/XSD/CommonBindingSchema.xsd'
          schema_doc=etree.parse(schema_path)
          schema=etree.XMLSchema(schema_doc)
          print('XSD COMPILE PASS',schema_path)

          bindings=[
            'ProtocolXml/AUV/AuvPlatformRfBinding.xml',
            'ProtocolXml/AUV/AuvPlatformUcdBinding.xml',
            'ProtocolXml/AUV/AuvRfCommBinding.xml',
            'ProtocolXml/MDV/MdvTcpBinding.xml',
            'ProtocolXml/EMDW/EmdwTcpBinding.xml',
          ]
          for f in bindings:
              schema.assertValid(etree.parse(f))
              print('XSD PASS',f)

          platform=Path('ProtocolXml/AUV/AuvPlatformRfBinding.xml').read_text(encoding='utf-8')
          comm=Path('ProtocolXml/AUV/AuvRfCommBinding.xml').read_text(encoding='utf-8')
          combined=platform+'\n'+comm
          for token in ['TargetAuvToInformation1','TargetAuvToInformation2','TargetAuvToInformation3','ByteSumModulo65536LE','ArrayLengthUInt8']:
              n=combined.count(token)
              print(token,n)
              if n: raise SystemExit(f'legacy converter remains: {token} x{n}')

          # Exact declarative INFO_NUM maps must be present for every INFORMATION class used.
          rootdocs=[etree.parse('ProtocolXml/AUV/AuvPlatformRfBinding.xml'),etree.parse('ProtocolXml/AUV/AuvRfCommBinding.xml')]
          map_pairs=set()
          map_count=0
          for d in rootdocs:
              for x in d.xpath('//*[local-name()="DerivedField" and @name="informationNumber"]'):
                  sm=x.xpath('./*[local-name()="SourceValueMap"]/*[local-name()="Map"]')
                  pairs=tuple((m.get('sourceValue'),m.get('value')) for m in sm)
                  if len(pairs)!=2: raise SystemExit('INFO_NUM SourceValueMap must have two entries')
                  map_pairs.add(pairs); map_count+=1
          print('INFO_NUM SourceValueMap fields',map_count,'patterns',sorted(map_pairs))
          required={(('1','1'),('2','4')),(('1','2'),('2','5')),(('1','3'),('2','6'))}
          if not required.issubset(map_pairs): raise SystemExit('missing one or more INFO_NUM mapping patterns')

          if 'sourceField="MissionPlan.WaypointCount"' not in platform:
              raise SystemExit('prepared MissionPlan.WaypointCount source missing')
          if 'sourceField="System.Frame.Checksum"' not in combined:
              raise SystemExit('prepared System.Frame.Checksum source missing')
          PY

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/XSD/CommonBindingSchema.xsd \
                  ProtocolXml/AUV/AuvPlatformRfBinding.xml \
                  ProtocolXml/AUV/AuvRfCommBinding.xml \
                  ProtocolXml/AUV/AuvPlatformSemantic.xml \
                  ProtocolXml/Docs/UMS_Semantic_Binding_Design_Rules_20260826.md
          git commit -m 'Migrate AUV derived converters to declarative mappings'
          git push origin HEAD:feature/auv-declarative-binding-cleanup
