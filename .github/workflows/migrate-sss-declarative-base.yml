name: Migrate SSS Declarative Base

on:
  push:
    branches:
      - feature/usv-semantic-binding-audit
    paths:
      - .github/workflows/migrate-sss-declarative-base.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          SEM='ProtocolXml/USV/SideScanSonar/SideScanSonarSemantic.xml'
          BIND='ProtocolXml/USV/SideScanSonar/SideScanSonarBinding.xml'
          python -m pip install --quiet lxml
          python -c 'import re,pathlib; p=pathlib.Path("'"$SEM"'"); print("\n".join(re.findall(r"<!--[\s\S]*?-->",p.read_text(encoding="utf-8"))))' > /tmp/sem-comments.before
          python -c 'import re,pathlib; p=pathlib.Path("'"$BIND"'"); print("\n".join(re.findall(r"<!--[\s\S]*?-->",p.read_text(encoding="utf-8"))))' > /tmp/bind-comments.before
          perl -0pi -e 's#\./CommonSpecSchema\.xsd#../../XSD/CommonSpecSchema.xsd#' "$SEM"
          perl -0pi -e 's#\./CommonBindingSchema\.xsd#../../XSD/CommonBindingSchema.xsd#' "$BIND"
          test "$(grep -o 'converter="BuildUSVMessageBase"' "$BIND" | wc -l)" -eq 38
          test "$(grep -o 'converter="UInt16"' "$BIND" | wc -l)" -eq 38
          test "$(grep -o 'converter="BuildDestinationType"' "$BIND" | wc -l)" -eq 4
          perl -0pi -e 's/ converter="BuildUSVMessageBase"//g; s/ converter="BuildDestinationType"//g; s/ converter="UInt16"/ dataType="UInt16"/g' "$BIND"
          test "$(grep -o 'converter="' "$BIND" | wc -l)" -eq 0
          test "$(grep '<DerivedField name="commandID"' "$BIND" | wc -l)" -eq 38
          test "$(grep '<DerivedField name="commandID"' "$BIND" | grep -c 'dataType="UInt16"')" -eq 38
          test "$(grep '<DerivedField name="usvHeader"' "$BIND" | wc -l)" -eq 38
          test "$(grep '<DerivedField name="destination"' "$BIND" | wc -l)" -eq 4
          python -c 'import re,pathlib; p=pathlib.Path("'"$SEM"'"); print("\n".join(re.findall(r"<!--[\s\S]*?-->",p.read_text(encoding="utf-8"))))' > /tmp/sem-comments.after
          python -c 'import re,pathlib; p=pathlib.Path("'"$BIND"'"); print("\n".join(re.findall(r"<!--[\s\S]*?-->",p.read_text(encoding="utf-8"))))' > /tmp/bind-comments.after
          cmp /tmp/sem-comments.before /tmp/sem-comments.after
          cmp /tmp/bind-comments.before /tmp/bind-comments.after
          python -c 'from lxml import etree; s=etree.XMLSchema(etree.parse("ProtocolXml/XSD/CommonSpecSchema.xsd")); s.assertValid(etree.parse("ProtocolXml/USV/SideScanSonar/SideScanSonarSemantic.xml")); print("PASS CommonSpecSchema")'
          python -c 'from lxml import etree; s=etree.XMLSchema(etree.parse("ProtocolXml/XSD/CommonBindingSchema.xsd")); s.assertValid(etree.parse("ProtocolXml/USV/SideScanSonar/SideScanSonarBinding.xml")); print("PASS CommonBindingSchema")'
          echo "Generated commandID: $(grep -o 'sourceField="System.Generated.CommandSequence"' "$BIND" | wc -l)"
          echo "Inherited commandID: $(grep -o 'sourceField="System.Communication.LastReceivedCommandID"' "$BIND" | wc -l)"
          git diff --check
          git rm .github/workflows/migrate-sss-declarative-base.yml
      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate SSS binding base to declarative rules'
          git push origin HEAD:feature/usv-semantic-binding-audit
