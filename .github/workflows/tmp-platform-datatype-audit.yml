          print('RESOLVED_TYPES',dict(collections.Counter(x[2] for x in resolvable)))
          print('--- MISMATCHES ---')
          for x in mismatches: print('|'.join(str(v) for v in x))
          print('--- UNRESOLVED ---')
          for x in unresolved: print('|'.join(str(v) for v in x))
