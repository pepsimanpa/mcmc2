name: temporary PlatformController final audit
on:
  push:
    branches:
      - feature/usv-semantic-binding-audit
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Update docs
        run: python .github/tmp_finalize_platform_audit.py
      - name: Validate XML
        run: |
          python -m pip install -q lxml
          python -c "from lxml import etree; from pathlib import Path; sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')); bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd')); sem=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml')); bind=list(Path('ProtocolXml/USV').glob('*/*Binding.xml')); [sx.assertValid(etree.parse(str(p))) for p in sem]; [bx.assertValid(etree.parse(str(p))) for p in bind]; print('XSD PASS',len(sem),len(bind))"
          if grep -R 'converter=' ProtocolXml/USV --include='*Binding.xml'; then exit 1; else echo 'converter 0'; fi
          if grep -q 'dataType="Boolean"' ProtocolXml/USV/PlatformController/PlatformControllerBinding.xml; then echo 'unexpected Platform Boolean'; exit 1; else echo 'Platform Boolean 0'; fi
          python -c "from lxml import etree; p='ProtocolXml/USV/PlatformController/PlatformControllerBinding.xml'; r=etree.parse(p).getroot(); allowed={'usvHeader','destination','vcuProcessorIBIT','vcuTmpProcessorIBIT'}; m=[e.get('name') for e in r.iter() if etree.QName(e).localname in {'Field','FixedField','DerivedField'} and not e.get('dataType') and e.get('name','') not in allowed]; print('Platform non-composite untyped',len(m),m); assert not m"
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/PlatformController/PlatformController_OpenIssues.md ProtocolXml/Docs/USV_Semantic_Binding_Integrated_Audit_20260828.md
          if git diff --cached --quiet; then echo 'No documentation changes'; exit 0; fi
          git commit -m 'Finalize PlatformController source datatype audit'
          git push origin HEAD:feature/usv-semantic-binding-audit
