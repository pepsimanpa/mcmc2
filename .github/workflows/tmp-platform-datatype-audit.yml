name: temporary PlatformController datatype migration
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Apply CSCI-confirmed primitive datatypes
        shell: python
        run: |
          import re
          p='ProtocolXml/USV/PlatformController/PlatformControllerBinding.xml'
          text=open(p,encoding='utf-8').read()

          def expected(ctx, n):
              # Composite/system fields are not primitive WireDataType targets.
              if n in {'usvHeader','destination','vcuProcessorIBIT','vcuTmpProcessorIBIT'}:
                  return None

              if ctx in {'PropulsionCBITReportType','PropulsionPBITReportType','AccessoriesCBITReportType','AccessoriesPBITReportType','SubsystemCBITReportType','SubsystemPBITReportType','SPCECBITReportType','SPCEPBITReportType'}:
                  return 'UInt8'
              if ctx=='ElectricalCBITReportType':
                  return 'Int64' if n=='powerStatus' else 'UInt8'
              if ctx=='ElectricalPBITReportType':
                  return 'UInt64' if n=='powerStatus' else 'UInt8'

              if ctx=='EngineIBITReportType':
                  if n=='engineStatus' or n.endswith(('EngineLoad','EngineTorque','TransGear')): return 'UInt8'
                  if n.endswith('TotalEngineHours'): return 'UInt64'
                  if n.endswith('AlternatorPotential') or n.endswith('FuelRate'): return 'Int16'
                  return 'UInt16'
              if ctx=='WaterJetIBITReportType': return 'UInt8'
              if ctx=='BowThrusterIBITReportType':
                  return 'UInt16' if n in {'bowThrusterTemperature','bowThrusterMotorOperationTime'} else 'UInt8'
              if ctx=='PowerIBITReportType':
                  if n=='pduStatus': return 'UInt8'
                  if n=='powerStatus': return 'UInt64'
                  return 'UInt16'
              if ctx=='BatteryIBITReportType': return 'UInt8'
              if ctx=='GeneratorIBITReportType':
                  if n.endswith('OperatingHours'): return 'UInt32'
                  if n.endswith(('GeneratorAPhaseACFrequency','SystemBatteryVoltage')): return 'UInt16'
                  if n.endswith(('GeneratorAPhaseRealPower','GeneratorAPhaseReactivePower')): return 'Int32'
                  return 'UInt8'
              if ctx in {'EnvironmentIBITReportType','WindSensorIBITReportType','FireDetectorIBITReportType','LeakDetectorIBITReportType','FlowMeterIBITReportType','SeaWaterConditionerIBITReportType','TowingDeviceIBITReportType'}:
                  return 'UInt8'
              if ctx=='StabilizerIBITReportType':
                  if n in {'boatRollAngle','seakeeperAngle'}: return 'Int16'
                  if n in {'flywheelSpeed','enclosure'}: return 'UInt16'
                  return 'UInt8'
              if ctx=='InterceptorIBITReportType':
                  return 'Float32' if n=='targetLIST' else 'UInt8'
              if ctx=='SPCEIBITReportType': return 'UInt8'

              if ctx=='PropulsionHeartBeatReportType':
                  if n.endswith('AlternatorPotential') or n=='fuelRemain': return 'Int16'
                  if n.endswith('CurrentSteering'): return 'Float32'
                  return 'UInt16'
              if ctx=='ENVHeartBeatReportType':
                  if n in {'cctvStateMask','environmentWarning'} or n.startswith('fireSensor') or n.startswith('autoExtinguisher'): return 'UInt8'
                  if n.startswith('flowMeter'): return 'UInt16'
                  if n.startswith('leakSensor'): return 'Float32'
              if ctx=='PowerHeartBeatReportType':
                  if n in {'portONStatus','starboardONStatus'}: return 'UInt64'
                  if n in {'pduTemp','powerSourceStatus','pduSourceStatus','batteryChargeStatus','batteryLevel','batteryFaultStatus'}: return 'UInt8'
                  return 'UInt16'
              if ctx=='DistressReportType' and n in {'latitude','longitude','altitude'}: return 'Float64'
              if ctx=='WindReportType': return 'Float64'
              if ctx=='SeaWaterConditionerStatusReportType': return 'Float32'
              return None

          out=[]; ctx=None; changes=[]
          for line in text.splitlines(True):
              ch=re.search(r'<DDSChannel\b[^>]*\btypeName="([^"]+)"',line)
              if ch: ctx=ch.group(1)
              # Only the opening Field/FixedField/DerivedField tag is modified.
              fm=re.search(r'<(Field|FixedField|DerivedField)\b[^>]*>',line)
              if fm:
                  full=fm.group(0)
                  nm=re.search(r'\bname="([^"]+)"',full)
                  if nm:
                      name=nm.group(1); leaf=name.split('.')[-1]
                      want=expected(ctx,leaf)
                      if want:
                          dm=re.search(r'\bdataType="([^"]+)"',full)
                          old=dm.group(1) if dm else None
                          if old!=want:
                              if dm:
                                  new=re.sub(r'\bdataType="[^"]+"',f'dataType="{want}"',full,count=1)
                              elif full.endswith('/>'):
                                  new=full[:-2]+f' dataType="{want}"/>'
                              else:
                                  new=full[:-1]+f' dataType="{want}">'
                              line=line[:fm.start()]+new+line[fm.end():]
                              changes.append((ctx,name,old,want))
              out.append(line)
          open(p,'w',encoding='utf-8',newline='').write(''.join(out))
          print('CHANGES',len(changes))
          print('BOOLEAN_TO_UINT8',sum(1 for x in changes if x[2]=='Boolean' and x[3]=='UInt8'))

          import xml.etree.ElementTree as ET
          ns='{http://lignex1.com/mcmc2/umsSchema}'
          root=ET.parse(p).getroot()
          booleans=[]; unresolved=[]
          allowed_untyped={'usvHeader','destination','vcuProcessorIBIT','vcuTmpProcessorIBIT'}
          for el in root.iter():
              tag=el.tag.split('}')[-1]
              if tag not in {'Field','FixedField','DerivedField'}: continue
              name=el.get('name','')
              if el.get('dataType')=='Boolean': booleans.append(name)
              if not el.get('dataType') and name not in allowed_untyped:
                  unresolved.append(name)
          print('PLATFORM_BOOLEAN_COUNT',len(booleans),booleans)
          print('UNTYPED_NONCOMPOSITE',len(unresolved),unresolved)
          if booleans: raise SystemExit('PlatformController CSCI has no primitive boolean fields')
          if unresolved: raise SystemExit('non-composite Field remains without dataType')
      - name: XSD validate
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from lxml import etree
          schema=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          doc=etree.parse('ProtocolXml/USV/PlatformController/PlatformControllerBinding.xml')
          schema.assertValid(doc)
          print('XSD PASS')
          PY
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/PlatformController/PlatformControllerBinding.xml
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Resolve PlatformController primitive datatypes from CSCI'
          git push origin HEAD:feature/usv-semantic-binding-audit
