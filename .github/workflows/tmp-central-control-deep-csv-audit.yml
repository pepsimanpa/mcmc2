name: temporary CentralControl deep CSV audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Refresh CentralControl CSV audit notes
        shell: python
        run: |
          from pathlib import Path
          p=Path('ProtocolXml/USV/CentralControl/CentralControl_OpenIssues.md')
          s=p.read_text(encoding='utf-8')
          old='''7. **`ControlCommandReportType` 원본 `#REF!`**\n   - `controlCommand` 필드와 값 의미(0=USV, 1=고정형, 2=이동형, 3=출입항, 4=정비용 노트북)는 식별 가능하다.\n   - 주변 source/type 셀의 `#REF!`는 원본 결함으로 남는다.'''
          new='''7. **[RESOLVED] `ControlCommandReportType` 원본 `#REF!`**\n   - field 행의 Topic/Type 위치에는 `#REF!`가 남아 있지만, 동일 메시지 블록의 DDS 헤더 행에 Topic `RUSV::C2::MCE::ControlCommandReportType`이 직접 기재되어 있고 Type은 CSV 줄바꿈으로 분리된 `ControlComman` + `dReportType`을 이어 `ControlCommandReportType`으로 식별할 수 있다.\n   - `controlCommand` 필드도 `octet`이며 0=USV, 1=고정형, 2=이동형, 3=출입항, 4=정비용 노트북이 직접 정의되어 있다. 현재 Binding의 Topic/Type/ValueMap은 이 근거와 일치하므로 `#REF!`는 인터페이스 미확정이 아니라 CSV export/셀 참조 결함으로 종료한다.'''
          if old not in s: raise SystemExit('target issue text not found')
          s=s.replace(old,new)
          s=s.replace('## 3. 중앙통제 고유 Remaining TBD — 8개','## 3. 중앙통제 고유 Remaining TBD / Resolved — 미해결 7개')
          s=s.replace('- 남은 8개 항목은 설계자가 임의 결정할 사항이 아니라 추가 원문/IDL/구현 근거가 필요한 비차단 TBD이다.','- 중앙통제 CSCI 재심층 감사로 `ControlCommandReportType #REF!`는 CSV export 결함으로 해소하였다. 미해결 7개 항목은 설계자가 임의 결정할 사항이 아니라 추가 원문/IDL/구현 근거가 필요한 비차단 TBD이다.')
          anchor='- 기존 `MonitorBindingDDS/ControlBindingDDS/Channel` → 공통 `MonitorBinding/ControlBinding/DDSChannel`, CommandStatus 처리상태, OperationMode 0~7 독립 Control, Authority command 0~4 독립 Control, Wireless Preset PackedField, VHF/Volume/Squelch/영상분배 구조는 원문 재대조 후 그대로 유지한다.\n'
          add='- 중앙통제 CSCI 재심층 감사에서 `ControlCommandReportType` field 행의 `#REF!`는 동일 메시지 DDS 헤더 행의 Topic/Type과 직접 정의된 `controlCommand` payload로 복원 가능함을 확인하여 인터페이스 TBD에서 제외하였다.\n'
          if add not in s:
              if anchor not in s: raise SystemExit('anchor not found')
              s=s.replace(anchor,anchor+add)
          p.write_text(s,encoding='utf-8')
      - name: Validate CentralControl XML still passes
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sx.assertValid(etree.parse('ProtocolXml/USV/CentralControl/CentralControlSemantic.xml'))
          bx.assertValid(etree.parse('ProtocolXml/USV/CentralControl/CentralControlBinding.xml'))
          o=Path('ProtocolXml/USV/CentralControl/CentralControl_OpenIssues.md').read_text(encoding='utf-8')
          assert '미해결 7개' in o
          assert '[RESOLVED] `ControlCommandReportType` 원본 `#REF!`' in o
          print('CENTRAL CONTROL DEEP CSV AUDIT PASS')
          PY
      - name: Commit CentralControl audit note
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/CentralControl/CentralControl_OpenIssues.md
          git commit -m 'Resolve CentralControl CSV REF artifact issue'
          git push origin HEAD:feature/usv-semantic-binding-audit
