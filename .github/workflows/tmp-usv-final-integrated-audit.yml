name: temporary USV final integrated audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Update final integrated audit documents
        shell: python
        run: |
          from pathlib import Path

          integrated=Path('ProtocolXml/Docs/USV_Semantic_Binding_Integrated_Audit_20260828.md')
          sss=Path('ProtocolXml/USV/SideScanSonar/SideScanSonar_OpenIssues.md')
          handoff=Path('ProtocolXml/Docs/MCMC2_Semantic_Binding_HANDOFF_20260828.md')

          i=integrated.read_text(encoding='utf-8')
          x=sss.read_text(encoding='utf-8')
          h=handoff.read_text(encoding='utf-8')

          # Latest machine-audit count after deep CSV audits.
          if '14개 장치 Binding 전체의 `PackedField`는 총 **65개**이다.' not in i:
              raise SystemExit('old PackedField count not found')
          i=i.replace('14개 장치 Binding 전체의 `PackedField`는 총 **65개**이다.',
                      '14개 장치 Binding 전체의 `PackedField`는 총 **111개**이다. 최근 EOIR/운항용카메라/근거리접촉물/RCWS/SSS 재심층 감사에서 source-confirmed bitfield를 추가 분해한 결과를 반영한 최신 수치다.',1)

          # Replace stale common-issue summary with the final master classification.
          start=i.index('## 14. 공통 OpenIssue 통합 ID')
          end=i.index('---\n\n## 15. 장치별 최종 구조 검증 결과', start)
          sec14='''## 14. 공통 OpenIssue 최종 통합\n\n장치별 `*_OpenIssues.md`의 세부 근거는 유지하고, 반복되는 근본원인은 다음 master 문서에서 최종 통합 관리한다.\n\n`ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md`\n\nActive common master issue는 총 **10개**다.\n\n- `USV-COMMON-01`: PBIT/IBIT 비동기 Result correlation\n- `USV-COMMON-03`: Result source routing / one-request multi-result fan-out\n- `USV-COMMON-05`: count 필드 ↔ sequence 실제 길이 일치/오류 처리\n- `USV-COMMON-06`: `-PI~+PI` 같은 symbolic Range의 CommonSpecSchema 표현\n- `USV-COMMON-07`: 공용 CIPE `cipeOperationalStatus` producer/subset 의미\n- `USV-COMMON-08`: nested structure dotted-path Adapter 접근 계약\n- `USV-COMMON-09`: PBIT/IBIT 외 비동기 Result/ACK correlation\n- `USV-COMMON-10`: RTP endpoint / 물리 채널 배치값\n- `USV-COMMON-11`: CSCI 물리 오탈자와 실제 DDS IDL 철자 확인\n- `USV-COMMON-12`: 수치 sentinel/invalid 결과의 Semantic 노출 정책\n\nResolved common master issue는 다음 2개다.\n\n- `USV-COMMON-02`: DDS Boolean wire type — **RESOLVED**\n- `USV-COMMON-04`: primitive wire `dataType` 부족 — **RESOLVED**\n\n실제 runtime 통합 전에는 `01/03/08/09`를 우선 확정해야 한다. 나머지는 source/IDL, 배치 설정 또는 공통 XSD/모델 개선 항목이며 현재 Semantic/Binding XML의 merge blocker는 아니다.\n\n장치별 고유 이슈와 각 공통 ID의 적용 장치는 consolidated master 문서를 기준으로 한다.\n\n'''
          i=i[:start]+sec14+i[end:]

          old_table='''| 장치 | Control | Reply | Monitor | Product | XSD | ID 참조 | converter | Semantic raw enum |\n|---|---:|---:|---:|---:|---|---|---:|---:|\n| AutonomousNavigation | 17 | 26 | 10 | 0 | PASS | PASS | 0 | 0 |\n| CentralControl | 24 | 26 | 3 | 0 | PASS | PASS | 0 | 0 |\n| ElectroOptical | 20 | 22 | 4 | 2 | PASS | PASS | 0 | 0 |\n| ElectroOpticalProcessor | 5 | 7 | 2 | 0 | PASS | PASS | 0 | 0 |\n| IntegratedNavigation | 5 | 6 | 2 | 0 | PASS | PASS | 0 | 0 |\n| Lidar | 4 | 6 | 2 | 0 | PASS | PASS | 0 | 0 |\n| NavigationCamera | 5 | 6 | 2 | 1 | PASS | PASS | 0 | 0 |\n| NavigationRadar | 12 | 14 | 6 | 1 | PASS | PASS | 0 | 0 |\n| NearContactDetection | 4 | 8 | 2 | 1 | PASS | PASS | 0 | 0 |\n| NetworkAbstraction | 19 | 32 | 9 | 0 | PASS | PASS | 0 | 0 |\n| PlatformController | 20 | 37 | 14 | 0 | PASS | PASS | 0 | 0 |\n| RemoteFireControl | 14 | 20 | 3 | 1 | PASS | PASS | 0 | 0 |\n| SensorFusion | 4 | 6 | 3 | 0 | PASS | PASS | 0 | 0 |\n| SideScanSonar | 38 | 47 | 8 | 5 | PASS | PASS | 0 | 0 |'''
          new_table='''| 장치 | Control | Reply | Monitor | Product | PackedField | XSD | ID 참조 | converter | Semantic raw enum |\n|---|---:|---:|---:|---:|---:|---|---|---:|---:|\n| AutonomousNavigation | 17 | 26 | 10 | 0 | 0 | PASS | PASS | 0 | 0 |\n| CentralControl | 24 | 26 | 3 | 0 | 2 | PASS | PASS | 0 | 0 |\n| ElectroOptical | 20 | 22 | 4 | 2 | 5 | PASS | PASS | 0 | 0 |\n| ElectroOpticalProcessor | 5 | 7 | 2 | 0 | 0 | PASS | PASS | 0 | 0 |\n| IntegratedNavigation | 5 | 6 | 2 | 0 | 29 | PASS | PASS | 0 | 0 |\n| Lidar | 4 | 6 | 2 | 0 | 0 | PASS | PASS | 0 | 0 |\n| NavigationCamera | 5 | 6 | 2 | 1 | 9 | PASS | PASS | 0 | 0 |\n| NavigationRadar | 12 | 14 | 6 | 1 | 0 | PASS | PASS | 0 | 0 |\n| NearContactDetection | 4 | 8 | 2 | 1 | 37 | PASS | PASS | 0 | 0 |\n| NetworkAbstraction | 19 | 32 | 9 | 0 | 15 | PASS | PASS | 0 | 0 |\n| PlatformController | 20 | 37 | 14 | 0 | 2 | PASS | PASS | 0 | 0 |\n| RemoteFireControl | 14 | 20 | 3 | 1 | 4 | PASS | PASS | 0 | 0 |\n| SensorFusion | 4 | 6 | 3 | 0 | 0 | PASS | PASS | 0 | 0 |\n| SideScanSonar | 38 | 47 | 8 | 5 | 8 | PASS | PASS | 0 | 0 |'''
          if old_table not in i:
              raise SystemExit('old structure table not found')
          i=i.replace(old_table,new_table,1)

          old='| 원문 근거 부족 intentional no-map | SSS 5건 |\n| PackedField overlap | 0 |'
          new='| 원문 근거 부족 intentional no-map | SSS 5건 |\n| PackedField 총수 | 111 |\n| PackedField overlap | 0 |'
          if old not in i: raise SystemExit('checklist insertion point not found')
          i=i.replace(old,new,1)

          old='- 중복 OpenIssue 공통 분류\n\n장치별 OpenIssues 문서의 과거 “최종 CDM 감사 예정” 문구는 **본 통합 감사 문서가 supersede**한다.'
          new='- 중복 OpenIssue 공통 분류 및 `USV_OpenIssues_Consolidated_20260828.md` master tracking 문서 작성\n\n장치별 OpenIssues 문서의 과거 “최종 CDM 감사 예정” 문구는 **본 통합 감사 문서와 consolidated OpenIssue master가 supersede**한다.'
          if old not in i: raise SystemExit('section17 text not found')
          i=i.replace(old,new,1)

          tail='이 기준을 이후 USV XML 변경 시 공통 회귀검증 기준으로 사용한다.\n'
          add='''이 기준을 이후 USV XML 변경 시 공통 회귀검증 기준으로 사용한다.\n\n---\n\n## 20. 최종 OpenIssue / Merge Readiness\n\nOpenIssue의 최종 공통/장치고유 분류는 `ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md`를 master로 사용한다.\n\n- Active common master issue: 10개\n- Resolved common master issue: 2개\n- 28개 XML XSD/ID reference blocker: 0개\n- Semantic/Binding 설계 상태: **Review/Merge Ready**\n- Runtime integration 전 우선 확정: `USV-COMMON-01`, `03`, `08`, `09`\n\n현재 남은 TBD는 원문에 없는 값을 의도적으로 추정하지 않은 결과이며, XML 설계 결함과 구분하여 관리한다.\n'''
          if i.count(tail)!=1: raise SystemExit('integrated tail not unique')
          i=i.replace(tail,add,1)

          # SideScanSonar stale global-audit text cleanup.
          x=x.replace('### 7. 최종 CDM 감사\n\n- CDM 명칭과 계층은 USV 장치 전체를 동일 기준으로 정리한 뒤 별도 전수 감사한다.',
                      '### 7. [RESOLVED] 최종 CDM 감사\n\n- USV 14개 장치 최종 통합감사를 완료했으며 `ProtocolXml/Docs/USV_Semantic_Binding_Integrated_Audit_20260828.md`와 `USV_OpenIssues_Consolidated_20260828.md`가 이 후속항목을 supersede한다.',1)
          x=x.replace('- 이번 단계에서는 외부 도구가 이 파일을 직접 참조할 가능성을 고려해 파일 자체는 삭제하지 않는다.\n- SSS XML의 `schemaLocation`만 공통 XSD로 전환하고, USV 전체 migration 완료 후 외부 의존성을 확인한 다음 삭제 여부를 결정한다.',
                      '- SSS XML의 `schemaLocation`과 USV 전체 migration은 공통 XSD 기준으로 완료하였다. 다만 외부 도구가 로컬 snapshot을 직접 참조할 가능성이 남아 있어 파일 자체는 삭제하지 않는다. 외부 의존성 확인 후 삭제 여부만 별도로 결정한다.',1)
          x=x.replace('- `boolean`, 배열, 문자열/char, 사용자 정의 구조체처럼 현재 `WireDataType`으로 직접 표현하기 애매한 항목은 후속 검토로 남긴다.',
                      '- 실제 DDS/IDL `boolean`은 공통 `WireDataType.Boolean`으로 표현한다. 배열, 문자열/char, 사용자 정의 구조체는 각 원문 wire 구조와 공통 XSD 표현을 따른다.',1)
          x=x.replace('- `SideScanSonar.SonarType`, `ReceiveProcessing.SoftwareGain.Mode`, `ReceiveProcessing.LowPassFilter.Mode`, `SideScanSonar.Subsystem(targetDevice)`은 최종 논리 값/CDM 재확인 후 이동한다.',
                      '- `SideScanSonar.SonarType`과 `SideScanSonar.Subsystem(targetDevice)`은 원문 값으로 논리화 완료하였다. `ReceiveProcessing.SoftwareGain.Mode`, `ReceiveProcessing.LowPassFilter.Mode`만 원문 코드 의미 부족으로 TBD를 유지한다.',1)
          x=x.replace('- 새 SonarType/Subsystem/MCS/LaunchReport 하위 CDM 경로는 연결용 임시 키이며 최종 USV CDM 감사에서 명칭/계층을 재검토한다.',
                      '- SonarType/Subsystem/MCS/LaunchReport 하위 CDM은 최종 USV 통합 감사에서 현재 의미 연결을 유지하기로 하였으며, 새로운 원문 근거가 없는 한 재명명하지 않는다.',1)

          # Append final status to historical handoff instead of rewriting its earlier snapshot sections.
          marker='## 20. 2026-08-28 USV 최종 통합감사 업데이트'
          if marker not in h:
              h += '''\n\n---\n\n## 20. 2026-08-28 USV 최종 통합감사 업데이트\n\n> 이 섹션은 본 HANDOFF 상단/중간의 초기 시각 기준 USV 진행상태를 supersede한다. 실제 작업 시작 전에는 항상 GitHub 최신 HEAD를 다시 확인한다.\n\n- RCU 직접 연동 USV 14개 장치의 Semantic/Binding 설계 및 CSV 재심층 감사 완료.\n- 14개 Semantic + 14개 Binding XSD PASS.\n- Control/Reply/Monitor/Product cross-reference 오류 0.\n- converter 0, source-confirmed primitive `dataType` 미지정 0.\n- 최신 PackedField 총수 111.\n- 실제 DDS/IDL Boolean direct field 총 11: EO 8 / EOP 1 / NetworkAbstraction 2 / PlatformController 0.\n- PBIT/IBIT 실제 Result Reply 61개, commandID 포함 0개 → `USV-COMMON-01`.\n- 최종 공통/장치 고유 OpenIssue master: `ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md`.\n- 최종 통합 감사: `ProtocolXml/Docs/USV_Semantic_Binding_Integrated_Audit_20260828.md`.\n- Active common master issue 10개, resolved common 2개.\n- Semantic/Binding 설계 자체는 Review/Merge Ready. Runtime 연동 전 `USV-COMMON-01/03/08/09` 우선 확정 필요.\n- SideScanSonar 문서의 과거 `최종 CDM 감사`는 통합감사 완료로 RESOLVED/superseded.\n- 현재 남은 장치 고유 TBD는 raw code/unit/bit polarity/운용 규칙/배치값/IDL 확인이 필요한 항목이며 원문 없이 임의로 닫지 않는다.\n'''

          integrated.write_text(i,encoding='utf-8')
          sss.write_text(x,encoding='utf-8')
          handoff.write_text(h,encoding='utf-8')
      - name: Validate final integrated state
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=sorted(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=sorted(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          ns={'u':'http://lignex1.com/mcmc2/umsSchema'}
          packed=sum(len(etree.parse(str(p)).xpath('//u:PackedField',namespaces=ns)) for p in binds)
          boolean=sum(len(etree.parse(str(p)).xpath('//*[@dataType="Boolean"]')) for p in binds)
          converter=sum(p.read_text(encoding='utf-8').count('converter=') for p in binds)
          assert len(sems)==14 and len(binds)==14
          assert packed==111, packed
          assert boolean==11, boolean
          assert converter==0, converter
          integ=Path('ProtocolXml/Docs/USV_Semantic_Binding_Integrated_Audit_20260828.md').read_text(encoding='utf-8')
          master=Path('ProtocolXml/Docs/USV_OpenIssues_Consolidated_20260828.md').read_text(encoding='utf-8')
          sss=Path('ProtocolXml/USV/SideScanSonar/SideScanSonar_OpenIssues.md').read_text(encoding='utf-8')
          assert '총 **111개**' in integ
          assert 'USV-COMMON-12' in integ and 'Review/Merge Ready' in integ
          assert 'Active common master issue: **10개**' in master
          assert '### 7. [RESOLVED] 최종 CDM 감사' in sss
          assert '최종 USV CDM 감사에서 명칭/계층을 재검토' not in sss
          print('USV FINAL DOCUMENTATION + XML VALIDATION PASS')
          print(f'SEMANTIC={len(sems)} BINDING={len(binds)} PACKED={packed} BOOLEAN={boolean} CONVERTER={converter}')
          PY
      - name: Commit final integrated audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/Docs/USV_Semantic_Binding_Integrated_Audit_20260828.md ProtocolXml/Docs/MCMC2_Semantic_Binding_HANDOFF_20260828.md ProtocolXml/USV/SideScanSonar/SideScanSonar_OpenIssues.md
          git commit -m 'Finalize USV integrated audit and open issues'
          git push origin HEAD:feature/usv-semantic-binding-audit
