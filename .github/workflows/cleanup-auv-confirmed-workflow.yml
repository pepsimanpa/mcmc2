name: Cleanup AUV Confirmed Workflow
on:
  push:
    branches: [feature/auv-declarative-binding-cleanup]
    paths: ['.github/workflows/cleanup-auv-confirmed-workflow.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-declarative-binding-cleanup
      - name: Finalize comments and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ProtocolXml/AUV/AuvPlatformRfBinding.xml')
          s=p.read_text(encoding='utf-8')
          old='''    AUV RF 구간은 TCP로 연동하며 요청은 RF-1 Telegram, 일반 응답은 RF-2 Telegram,\n    데이터 전송 응답은 RF-3 Telegram을 사용한다.'''
          new='''    AUV RF 구간은 TCP로 연동하며 요청은 RF-1 Telegram, 일반 응답은 RF-2 Telegram을 사용한다.\n    RF-3 파일 데이터는 Control Reply가 아니라 SensorProduct 연속 프레임으로 분리한다.'''
          if old not in s: raise SystemExit('header comment not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='')
          PY
          git rm .github/workflows/apply-auv-confirmed-cleanup.yml
          git rm .github/workflows/cleanup-auv-confirmed-workflow.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize confirmed AUV cleanup'
          git push origin HEAD:feature/auv-declarative-binding-cleanup
