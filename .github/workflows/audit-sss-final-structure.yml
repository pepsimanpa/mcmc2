name: Audit SSS Final Structure

on:
  push:
    branches: [feature/usv-semantic-binding-audit]
    paths: ['.github/workflows/audit-sss-final-structure.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
          fetch-depth: 0
      - name: Audit SSS structure and source-grounded fixed commands
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re
          base=Path('ProtocolXml/USV/SideScanSonar'); sem=base/'SideScanSonarSemantic.xml'; bind=base/'SideScanSonarBinding.xml'; issues=base/'SideScanSonar_OpenIssues.md'
          ns={'u':'http://lignex1.com/mcmc2/umsSchema'}
          etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd')).assertValid(etree.parse(str(sem)))
          etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd')).assertValid(etree.parse(str(bind)))
          S=etree.parse(str(sem)); B=etree.parse(str(bind))
          controls=S.xpath('.//u:ControlSpec|.//u:SetPointSpec',namespaces=ns); bcontrols=B.xpath('.//u:ControlBinding|.//u:ControlBindingDDS',namespaces=ns); replies=S.xpath('.//u:Reply',namespaces=ns); breplies=B.xpath('.//u:Reply',namespaces=ns)
          assert len(controls)==38 and len(bcontrols)==38 and len(replies)==47 and len(breplies)==47
          assert {x.get('id') for x in controls}=={x.get('semantic_id') for x in bcontrols}
          assert {x.get('bindRef') for x in replies}=={x.get('semantic_id') for x in breplies}
          # Source-grounded split Controls: semantic action name -> physical fixed command value.
          expected={
            'stopUsblMotion':('launch','0'),'launchUsbl':('launch','1'),'recoveryUsbl':('launch','2'),'returnUsblOrigin':('launch','3'),
            'startUsbl':('start','1'),'stopUsbl':('start','0'),
            'stopSlide':('start','0'),'moveSlide':('start','1'),'returnSlideWithTowfish':('start','2'),'returnSlideWithoutTowfish':('start','3'),
            'stopWinch':('start','0'),'deployWinch':('start','1'),'recoveryWinch':('start','2'),
            'separateCable':('separation','1'),'cancelCableSeparation':('separation','0'),
            'stopTowfish':('launch','0'),'launchTowfish':('launch','1'),'recoveryTowfish':('launch','2'),
            'stopSlideBackStop':('slideBackStop','0'),'engageSlideBackStop':('slideBackStop','1'),'returnSlideBackStop':('slideBackStop','2'),
            'changeScreenRealTimeMode':('screenChangeMode','0'),'changeScreenMergeMode':('screenChangeMode','1'),
          }
          for cid,(fname,val) in expected.items():
              cb=B.xpath(f'.//u:ControlBinding[@semantic_id="{cid}"]',namespaces=ns)
              if len(cb)!=1: raise SystemExit(f'{cid} binding count {len(cb)}')
              ff=cb[0].xpath(f'./u:FixedField[@name="{fname}"]',namespaces=ns)
              if len(ff)!=1 or ff[0].get('value')!=val: raise SystemExit(f'{cid} expected {fname}={val}')
          # Source range-bearing companion payloads must remain present for every split action; CSCI does not say they are omitted for stop/origin commands.
          for cid in ('stopUsblMotion','launchUsbl','recoveryUsbl','returnUsblOrigin'):
              assert len(B.xpath(f'.//u:ControlBinding[@semantic_id="{cid}"]/u:Field[@name="motorSpeed"]',namespaces=ns))==1
          for cid in ('stopSlide','moveSlide','returnSlideWithTowfish','returnSlideWithoutTowfish'):
              assert len(B.xpath(f'.//u:ControlBinding[@semantic_id="{cid}"]/u:Field[@name="slideDeploy"]',namespaces=ns))==1
          for cid in ('stopWinch','deployWinch','recoveryWinch'):
              assert len(B.xpath(f'.//u:ControlBinding[@semantic_id="{cid}"]/u:Field[@name="winchDeploy"]',namespaces=ns))==1
          # Semantic ranges for these physical companion values.
          def ranges_for(cdm):
              out=[]
              for q in S.xpath(f'.//u:QuantityProfile[@cdm="{cdm}"]',namespaces=ns):
                  r=q.find('{http://lignex1.com/mcmc2/umsSchema}Range'); out.append((r.get('min'),r.get('max')) if r is not None else None)
              return out
          assert set(ranges_for('LaunchRecovery.USBL.MotorSpeed'))=={('0','0.011')}
          assert set(ranges_for('LaunchRecovery.Slide.Position'))=={('0','2.15')}
          assert set(ranges_for('LaunchRecovery.Winch.CableLength'))=={('0','100')}
          # PBIT/IBIT remain one result Reply each, with one GroupResult.
          for rid,count in [('requestPbitResult',6),('requestIbitResult',62)]:
              rr=S.xpath(f'.//u:Reply[@bindRef="{rid}"]',namespaces=ns); assert len(rr)==1
              gg=rr[0].xpath('./u:Results/u:GroupResult',namespaces=ns); assert len(gg)==1
              assert len(gg[0].xpath('./*',namespaces=ns))==count
          # Every ACK contains processing status result, but no routing/correlation metadata is promoted to Semantic Results.
          acks=[r for r in replies if (r.get('bindRef') or '').endswith('Ack')]; assert len(acks)==38
          for r in acks:
              rs=r.xpath('./u:Results/*',namespaces=ns); assert len(rs)==1 and rs[0].get('cdm')=='Control.Response.Status'
          # Sensor products are five distinct remote-facing product channels.
          expected_products={
            'compressedSideScanSignal':('UDPChannel','CompressSideScanSonarSignal'),
            'compressedGapFillerSignal':('UDPChannel','CompressGapSignal'),
            'compressedMergedSignal':('UDPChannel','CompressMergeSignalData'),
            'objectDetection2d':('UDPChannel','ObjectDetection2dArrReportType'),
            'recoveryCamera':('RTPChannel',None),
          }
          sp=S.xpath('.//u:SensorProductSpecs/*',namespaces=ns); pb=B.xpath('.//u:SensorProducts/u:ProductBinding',namespaces=ns); assert len(sp)==5 and len(pb)==5
          assert {x.get('id') for x in sp}==set(expected_products)=={x.get('semantic_id') for x in pb}
          for pid,(channel,msg) in expected_products.items():
              x=B.xpath(f'.//u:ProductBinding[@semantic_id="{pid}"]',namespaces=ns)[0]
              c=x[0]; assert etree.QName(c).localname==channel
              if msg is not None: assert c.get('messageType')==msg
          # The ProductBinding schema is stream/channel selection only; payload ContactTypeList.sonarType is not a missing Field here.
          # Declarative cleanup invariants.
          assert int(B.xpath('count(.//*[@converter])',namespaces=ns))==0
          missing=[]
          for tag in ('Field','FixedField','DerivedField'):
              for e in B.xpath('.//u:'+tag,namespaces=ns):
                  if e.get('dataType') is None: missing.append((tag,e.get('name')))
          bad=[x for x in missing if x[1] not in {'usvHeader','destination'}]
          if bad: raise SystemExit(f'primitive dataType missing {bad[:10]}')
          # Remaining intentionally unresolved parameter interpretations.
          unresolved=[]
          for cdm in ('ReceiveProcessing.TVG.Mode','ReceiveProcessing.SoftwareGain.Mode','ReceiveProcessing.LowPassFilter.Mode'):
              q=S.xpath(f'.//u:QuantityProfile[@cdm="{cdm}"]',namespaces=ns); assert len(q)==1; unresolved.append(cdm)
          # Status power values deliberately remain numeric in Semantic until source polarity is confirmed.
          power_ids=['towedSonarArrayPowerStatus','ultraShortBaseLinePowerStatus','winchPowerStatus','recoveryUnitPowerStatus','cameraPowerStatus']
          for sid in power_ids:
              vv=S.xpath(f'.//u:ValueSetSpec[@id="{sid}"]/u:Values/u:Value',namespaces=ns); assert [(v.text or '').strip() for v in vv]==['0','1']
          print('FINAL_SSS_STRUCTURAL_AUDIT PASS')
          print('CONTROL_REPLY',len(controls),len(replies))
          print('FIXED_COMMANDS_CHECKED',len(expected))
          print('PBIT_IBIT_FIELDS',6,62)
          print('PRODUCTS',[(p.get('id'), expected_products[p.get('id')]) for p in sp])
          print('REMAINING_TBD_PARAMS',unresolved)
          print('MISSING_DATATYPE_COMPOSITE_ONLY',len(missing))
          doc=issues.read_text(encoding='utf-8'); marker='## Final structural audit'
          if marker not in doc:
              doc+='''\n\n## Final structural audit\n\n- Semantic/Binding Control은 `38↔38`, Reply는 `47↔47`이며 ID 연결도 일치한다.\n- 수동 USBL 명령은 `launch=0/1/2/3`(정지/진수/회수/원점복귀), USBL 작동은 `start=0/1`, 슬라이드는 `start=0/1/2/3`, 윈치는 `start=0/1/2`의 분리 Control + `FixedField` 구조를 유지한다. 이 값들은 사용자 선택 enum이 아니라 이미 행위별 Control로 분리되었으므로 FixedField가 적절하다.\n- USBL `motorSpeed(0~0.011 m/s)`, 슬라이드 `slideDeploy(0~2.15 m)`, 윈치 `winchDeploy(0~100 m)` 보조 필드는 정지/원점복귀를 포함한 각 원문 메시지 구조에서 유지한다. 원문에 무시/고정값 규칙이 없으므로 임의 제거하지 않는다.\n- 케이블 분리 `0/1`, 화면모드 `0/1`, 자동 진회수 명령 `0/1/2`, BackStop 현재 `0/1/2` FixedField 구조를 확인했다. BackStop 결과 Report의 raw 의미는 별도 TBD이다.\n- PBIT/IBIT은 각각 하나의 결과 Reply + 하나의 GroupResult이며 내부 필드는 각각 6개/62개이다.\n- SensorProduct 5종은 Semantic/Binding `5↔5`: SSS 압축, GapFiller 압축, 병합 압축, ObjectDetection2D, 진회수 카메라 RTP이다. ProductBinding은 스트림 채널/메시지 선택 구조이므로 `ContactTypeList.sonarType` 같은 payload 내부 분류 필드를 별도 Binding Field로 누락된 것으로 보지 않는다.\n- converter는 0건이고 primitive dataType 미지정은 0건이다. `usvHeader`, `destination` composite만 의도적으로 dataType이 없다.\n- 설계를 막는 미해결 항목은 아니지만 원문 재확인이 필요한 핵심 TBD는 전원상태 5개 0/1 의미, TVG/SW Gain/LPF mode 논리명, PBIT/IBIT raw 상세 의미, BackStop 결과값 의미, commandID 없는 Result Report correlation, LastReceivedCommandID 동시성, dotted-path Adapter 규칙이다.\n'''; issues.write_text(doc,encoding='utf-8',newline='')
          PY
          git diff --check
          git rm .github/workflows/audit-sss-final-structure.yml
      - name: Commit audit record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record final SSS structural audit'
          git push origin HEAD:feature/usv-semantic-binding-audit
