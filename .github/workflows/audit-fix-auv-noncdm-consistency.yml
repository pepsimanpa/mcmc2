name: Audit Fix AUV Non-CDM Consistency

on:
  push:
    branches: [feature/auv-declarative-binding-cleanup]
    paths: ['.github/workflows/audit-fix-auv-noncdm-consistency.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-declarative-binding-cleanup
          fetch-depth: 0

      - name: Apply conservative consistency fixes and validate
        run: |
          python -m pip install --quiet lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re

          p_sem = Path('ProtocolXml/AUV/AuvPlatformSemantic.xml')
          p_rf = Path('ProtocolXml/AUV/AuvPlatformRfBinding.xml')
          c_sem = Path('ProtocolXml/AUV/AuvRfCommSemantic.xml')
          c_rf = Path('ProtocolXml/AUV/AuvRfCommBinding.xml')
          doc = Path('ProtocolXml/Docs/UMS_Semantic_Binding_Design_Rules_20260826.md')

          paths = [p_sem, p_rf, c_sem, c_rf]
          before_comments = {p: len(re.findall(r'<!--[\s\S]*?-->', p.read_text(encoding='utf-8'))) for p in paths}

          # 1) RC_SPEED is a confirmed 1-byte unsigned field.
          s = p_rf.read_text(encoding='utf-8')
          old = '<Field name="remoteSpeed" cdm="Platform.Motion.Speed"/>'
          new = '<Field name="remoteSpeed" cdm="Platform.Motion.Speed" dataType="UInt8"/>'
          if s.count(old) != 1:
              raise SystemExit(f'unexpected remoteSpeed untyped count: {s.count(old)}')
          s = s.replace(old, new, 1)
          p_rf.write_text(s, encoding='utf-8', newline='')

          # 2) RF_CONF_MODE/PWR are confirmed 1-byte physical fields even when unused/fixed.
          s = c_rf.read_text(encoding='utf-8')
          mode_old = '<FixedField name="rfConfMode" value="0"/>'
          pwr_old = '<FixedField name="rfConfPower" value="0"/>'
          mode_count = s.count(mode_old)
          pwr_count = s.count(pwr_old)
          if mode_count == 0 or pwr_count == 0:
              raise SystemExit(f'expected untyped RF config fixed fields, got mode={mode_count}, power={pwr_count}')
          s = s.replace(mode_old, '<FixedField name="rfConfMode" value="0" dataType="UInt8"/>')
          s = s.replace(pwr_old, '<FixedField name="rfConfPower" value="0" dataType="UInt8"/>')
          s = s.replace(
              '- INFO_NUM은 AUV 1의 INFO1이면 1, AUV 2의 INFO1이면 4이다. converter 구현은 별도 확인이 필요하다.',
              '- INFO_NUM은 AUV 1의 INFO1이면 1, AUV 2의 INFO1이면 4이며 SourceValueMap으로 선언한다.'
          )
          c_rf.write_text(s, encoding='utf-8', newline='')

          # 3) RF status configuration echoes are multi-valued logical states, not opaque Result values.
          s = c_sem.read_text(encoding='utf-8')
          replacements = {
              '<Result name="RF 운용모드" cdm="Communication.RF.Configuration.OperationMode"/>': '<ValueSetResult name="RF 운용모드" cdm="Communication.RF.Configuration.OperationMode"><Values><Value name="1:1" cdm="Communication.RF.Configuration.OperationMode.OneToOne"/><Value name="1:2" cdm="Communication.RF.Configuration.OperationMode.OneToTwo"/></Values></ValueSetResult>',
              '<Result name="RF Time Slot" cdm="Communication.RF.Configuration.TimeSlot"/>': '<ValueSetResult name="RF Time Slot" cdm="Communication.RF.Configuration.TimeSlot"><Values><Value name="Time Slot 2" cdm="Communication.RF.Configuration.TimeSlot.Two"/><Value name="Time Slot 4" cdm="Communication.RF.Configuration.TimeSlot.Four"/></Values></ValueSetResult>',
              '<Result name="UHF 채널" cdm="Communication.RF.Configuration.UHF.Channel"/>': '<ValueSetResult name="UHF 채널" cdm="Communication.RF.Configuration.UHF.Channel"><Values><Value name="UHF CH 1" cdm="Communication.RF.Configuration.UHF.Channel.Channel1"/><Value name="UHF CH 2" cdm="Communication.RF.Configuration.UHF.Channel.Channel2"/><Value name="UHF CH 3" cdm="Communication.RF.Configuration.UHF.Channel.Channel3"/></Values></ValueSetResult>',
              '<Result name="L-Band 채널" cdm="Communication.RF.Configuration.LBand.Channel"/>': '<ValueSetResult name="L-Band 채널" cdm="Communication.RF.Configuration.LBand.Channel"><Values><Value name="L-Band CH 1" cdm="Communication.RF.Configuration.LBand.Channel.Channel1"/><Value name="L-Band CH 2" cdm="Communication.RF.Configuration.LBand.Channel.Channel2"/><Value name="L-Band CH 3" cdm="Communication.RF.Configuration.LBand.Channel.Channel3"/></Values></ValueSetResult>',
              '<Result name="UHF 출력" cdm="Communication.RF.Configuration.UHF.Power"/>': '<ValueSetResult name="UHF 출력" cdm="Communication.RF.Configuration.UHF.Power"><Values><Value name="OFF" cdm="Communication.RF.Configuration.UHF.Power.Off"/><Value name="LOW" cdm="Communication.RF.Configuration.UHF.Power.Low"/><Value name="HIGH" cdm="Communication.RF.Configuration.UHF.Power.High"/></Values></ValueSetResult>',
              '<Result name="L-Band 출력" cdm="Communication.RF.Configuration.LBand.Power"/>': '<ValueSetResult name="L-Band 출력" cdm="Communication.RF.Configuration.LBand.Power"><Values><Value name="OFF" cdm="Communication.RF.Configuration.LBand.Power.Off"/><Value name="LOW" cdm="Communication.RF.Configuration.LBand.Power.Low"/><Value name="HIGH" cdm="Communication.RF.Configuration.LBand.Power.High"/></Values></ValueSetResult>',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'unexpected RF status semantic result count for {old}: {s.count(old)}')
              s = s.replace(old, new, 1)
          c_sem.write_text(s, encoding='utf-8', newline='')

          # 4) Keep ambiguous UCD emergency-return position mapping explicitly deferred; do not invent/rename CDM now.
          s = p_sem.read_text(encoding='utf-8')
          marker = '            두 좌표의 ICD 단위는 rad이며 허용 범위는 기재되어 있지 않다.\n'
          addition = marker + '            UCD-2에는 IMU_LAT/IMU_LONG 물리 필드가 있으나 emergencyReturn Reply의 Semantic 결과로 최종 채택할지는 CDM/응답 의미 재검토 때 확정한다.\n'
          if marker not in s:
              raise SystemExit('emergencyReturn comment marker not found')
          if 'UCD-2에는 IMU_LAT/IMU_LONG 물리 필드가 있으나' not in s:
              s = s.replace(marker, addition, 1)
          p_sem.write_text(s, encoding='utf-8', newline='')

          # Document the scope of this conservative pass without resolving deferred CDM work.
          d = doc.read_text(encoding='utf-8')
          anchor = '## 확정된 별도 bit 규칙\n'
          section = '\n'.join([
              '## Issue 15. AUV Semantic-Binding 비-CDM 정합성 정리',
              '',
              '**Status: PARTIAL / CDM DEFERRED**',
              '',
              '- 이번 단계에서는 CDM 명칭/체계와 개별 bit CDM을 새로 확정하지 않는다.',
              '- 원문에서 자료형이 확정된 `RC_SPEED`, RF INFO1의 `RF_CONF_MODE/RF_CONF_PWR` 누락 `dataType`만 보강한다.',
              '- RF 상태 응답의 운용모드/Time Slot/채널/출력은 이미 확정된 논리 선택 집합이므로 `ValueSetResult`로 표현을 통일한다.',
              '- AUV 상세 점검, UCD 요약 점검, EOR, MODE, RF Pre-Launch, STAT_code의 개별 Result↔BitMember CDM 연결은 최종 CDM 감사 때 처리한다.',
              '- UCD-2의 IMU_LAT/IMU_LONG은 물리 필드로 유지하되 `emergencyReturnReply`의 Semantic 결과 채택 여부는 응답 의미/CDM 재검토 시 확정한다.',
              '',
          ])
          if '## Issue 15. AUV Semantic-Binding 비-CDM 정합성 정리' not in d:
              if anchor not in d:
                  raise SystemExit('design doc insertion anchor not found')
              d = d.replace(anchor, section + anchor, 1)
          doc.write_text(d, encoding='utf-8', newline='')

          # Comment preservation: no existing comment may disappear.
          for p in paths:
              after = len(re.findall(r'<!--[\s\S]*?-->', p.read_text(encoding='utf-8')))
              if after < before_comments[p]:
                  raise SystemExit(f'comment loss: {p} {before_comments[p]}->{after}')
              print('COMMENTS', p, before_comments[p], '->', after)

          # XSD validation.
          spec_schema = etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          binding_schema = etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          for f in [p_sem, c_sem]:
              spec_schema.assertValid(etree.parse(str(f)))
              print('PASS SPEC', f)
          for f in [p_rf, Path('ProtocolXml/AUV/AuvPlatformUcdBinding.xml'), c_rf]:
              binding_schema.assertValid(etree.parse(str(f)))
              print('PASS BINDING', f)

          # Structural audit: identify any remaining plain Field/FixedField without dataType.
          for f in [p_rf, Path('ProtocolXml/AUV/AuvPlatformUcdBinding.xml'), c_rf]:
              root = etree.parse(str(f)).getroot()
              ns = {'u':'http://lignex1.com/mcmc2/umsSchema'}
              missing = []
              for tag in ['Field','FixedField','DerivedField']:
                  for e in root.xpath(f'.//u:{tag}', namespaces=ns):
                      if e.get('dataType') is None:
                          missing.append((tag, e.get('name')))
              print('UNTYPED', f, missing)

          # CDM-heavy bit work intentionally deferred.
          print('DEFERRED: AUV check/UCD check/EOR/MODE/PreLaunch/STAT individual CDM mapping')
          PY

          git diff --check
          git rm .github/workflows/audit-fix-auv-noncdm-consistency.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten AUV non-CDM semantic binding consistency'
          git push origin HEAD:feature/auv-declarative-binding-cleanup
