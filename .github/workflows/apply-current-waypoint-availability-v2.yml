name: Apply Current Waypoint Availability Model V2

on:
  push:
    branches: [feature/auv-reply-bit-binding]
    paths: ['.github/workflows/apply-current-waypoint-availability-v2.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auv-reply-bit-binding
          fetch-depth: 0

      - name: Apply model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rep(path, old, new, expected=1):
              p=Path(path); t=p.read_text(encoding='utf-8'); c=t.count(old)
              if c != expected: raise SystemExit(f'{path}: expected {expected}, found {c}')
              p.write_text(t.replace(old,new), encoding='utf-8', newline='')

          rep('ProtocolXml/XSD/CommonBindingSchema.xsd',
'''    <xs:complexType name="FieldType">\n        <xs:attribute name="name" type="xs:string" use="required"/>\n        <xs:attribute name="cdm" type="xs:string"/>\n        <xs:attribute name="inputUnit" type="xs:string"/>\n        <xs:attribute name="outputUnit" type="xs:string"/>\n        <xs:attribute name="converter" type="xs:string"/>\n    </xs:complexType>''',
'''    <!-- 하나의 물리 Field가 복수의 논리 의미를 포함할 때 DerivedSemantic으로 파생한다. -->\n    <xs:complexType name="DerivedSemanticType">\n        <xs:attribute name="cdm" type="xs:string" use="required"/>\n        <xs:attribute name="converter" type="xs:string" use="required"/>\n    </xs:complexType>\n\n    <xs:complexType name="FieldType">\n        <xs:sequence>\n            <xs:element name="DerivedSemantic" type="DerivedSemanticType" minOccurs="0" maxOccurs="unbounded"/>\n        </xs:sequence>\n        <xs:attribute name="name" type="xs:string" use="required"/>\n        <xs:attribute name="cdm" type="xs:string"/>\n        <xs:attribute name="inputUnit" type="xs:string"/>\n        <xs:attribute name="outputUnit" type="xs:string"/>\n        <xs:attribute name="converter" type="xs:string"/>\n    </xs:complexType>''')

          old_sem='<QuantitySpec id="currentWaypointIndex" name="현재 경유점 인덱스" cdm="MissionPlan.CurrentWaypointIndex"><Range min="0" max="65534"/><Resolution>1</Resolution></QuantitySpec><!-- raw 0xFFFF는 현재 추종 경유점 없음으로 Binding/Adapter에서 해석하며 정상 인덱스 범위에 포함하지 않는다. -->'
          new_sem='<BooleanSpec id="currentWaypointAvailable" name="현재 추종 경유점 존재 여부" cdm="MissionPlan.CurrentWaypoint.Available"/><QuantitySpec id="currentWaypointIndex" name="현재 경유점 인덱스" cdm="MissionPlan.CurrentWaypointIndex"><Range min="0" max="65534"/><Resolution>1</Resolution></QuantitySpec><!-- currentWaypointAvailable=false일 때 currentWaypointIndex는 의미값 없음. raw 0xFFFF 매핑은 Binding에서 처리한다. -->'
          rep('ProtocolXml/MDV/MdvPlatformSemantic.xml',old_sem,new_sem)
          rep('ProtocolXml/EMDW/EmdwPlatformSemantic.xml',old_sem,new_sem)

          old_b='            <Field name="currentWaypointIndex" cdm="MissionPlan.CurrentWaypointIndex" converter="UInt16LECurrentWaypointIndexOrNone"/>'
          new_b='''            <Field name="currentWaypointIndex" converter="UInt16LE">\n                <DerivedSemantic cdm="MissionPlan.CurrentWaypoint.Available" converter="WaypointIndexToAvailable"/>\n                <DerivedSemantic cdm="MissionPlan.CurrentWaypointIndex" converter="WaypointIndexToIndexWhenAvailable"/>\n            </Field>'''
          rep('ProtocolXml/MDV/MdvTcpBinding.xml',old_b,new_b)
          rep('ProtocolXml/EMDW/EmdwTcpBinding.xml',old_b,new_b)

          rep('ProtocolXml/Docs/SemanticBindingRules_20260818.md',
'- Reply의 실제 Telegram 및 결과 Field/Bit\n- expectedValue / expectedMask 등 수신 식별 조건',
'- Reply의 실제 Telegram 및 결과 Field/Bit\n- 하나의 물리 Field가 sentinel/state code 등으로 복수의 논리 의미를 포함하면 `Field` 하위 `DerivedSemantic`으로 여러 Semantic CDM을 파생한다. 이때 wire Field 자체를 중복 선언하지 않는다.\n- expectedValue / expectedMask 등 수신 식별 조건')

          p=Path('ProtocolXml/Docs/MdvEmdwDesignDecisions_20260825.md'); t=p.read_text(encoding='utf-8')
          pattern=r'''## 7\. Current Waypoint Index\n\n\*\*Status: RESOLVED / BINDING APPLIED\*\*\n\n정상 경유점 인덱스 범위:\n- `0~65534`\n- 0-based index\n\n특수 wire 값:\n- `0xFFFF` = 현재 추종 경유점 없음\n\nSemantic 정상 Quantity 범위에는 65535를 포함하지 않는다\. Binding은 `UInt16LECurrentWaypointIndexOrNone`을 사용해 `0xFFFF`를 `현재 추종 경유점 없음`으로 해석한다\.\n\nSemantic에서 이 `None` 상태를 Quantity 미제공/null로 둘지 별도 availability 상태로 표현할지는 후속 모델링 항목이다\. `65535`를 정상 Semantic Quantity 값으로 재도입하지 않는다\.'''
          replacement='''## 7. Current Waypoint Index / Availability\n\n**Status: RESOLVED / APPLIED**\n\n정상 경유점 인덱스 범위:\n- `0~65534`\n- 0-based index\n\n특수 wire 값:\n- `0xFFFF` = 현재 추종 경유점 없음\n\nSemantic은 물리 sentinel 값을 직접 노출하지 않고 다음 두 상태로 표현한다.\n- `currentWaypointAvailable` / `MissionPlan.CurrentWaypoint.Available`: 현재 추종 경유점 존재 여부\n- `currentWaypointIndex` / `MissionPlan.CurrentWaypointIndex`: 현재 추종 경유점 인덱스 (`0~65534`)\n\nBinding은 단일 물리 `currentWaypointIndex` Field를 중복 선언하지 않고 `DerivedSemantic`으로 두 의미를 파생한다.\n- raw `0~65534` → `currentWaypointAvailable=true`, `currentWaypointIndex=raw`\n- raw `0xFFFF` → `currentWaypointAvailable=false`, `currentWaypointIndex`는 의미값 없음'''
          t,n=re.subn(pattern,replacement,t)
          if n!=1: raise SystemExit(f'section7 regex matches={n}')
          t=t.replace('''### `UInt16LECurrentWaypointIndexOrNone`\n- raw `0~65534` → 동일 0-based 현재 Waypoint index\n- raw `0xFFFF` → 현재 추종 경유점 없음\n\nMDV/EMDW Mission Progress Binding에 적용하였다.''','''### `WaypointIndexToAvailable` / `WaypointIndexToIndexWhenAvailable`\n`Field converter="UInt16LE"`로 raw 값을 decode한 뒤 동일 물리값에서 두 Semantic 값을 파생한다.\n- `WaypointIndexToAvailable`: `0~65534 → true`, `0xFFFF → false`\n- `WaypointIndexToIndexWhenAvailable`: `0~65534 → 동일 index`, `0xFFFF → 의미값 없음`\n\nMDV/EMDW Mission Progress Binding에 적용하였다.''')
          t=t.replace('- currentWaypointIndex 정상 범위 `0~65534` 적용\n','- currentWaypointIndex 정상 범위 `0~65534` 적용\n- `currentWaypointAvailable` Boolean 상태 및 단일 wire Field → 복수 `DerivedSemantic` 매핑 적용\n',1)
          p.write_text(t,encoding='utf-8',newline='')
          PY

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ns={'u':'http://lignex1.com/mcmc2/umsSchema','xs':'http://www.w3.org/2001/XMLSchema'}
          paths=['ProtocolXml/XSD/CommonBindingSchema.xsd','ProtocolXml/MDV/MdvPlatformSemantic.xml','ProtocolXml/EMDW/EmdwPlatformSemantic.xml','ProtocolXml/MDV/MdvTcpBinding.xml','ProtocolXml/EMDW/EmdwTcpBinding.xml']
          roots={p:ET.parse(p).getroot() for p in paths}
          x=roots[paths[0]]
          assert x.find("xs:complexType[@name='DerivedSemanticType']",ns) is not None
          for plat,prefix in [('MDV','Mdv'),('EMDW','Emdw')]:
              s=roots[f'ProtocolXml/{plat}/{prefix}PlatformSemantic.xml']
              b=roots[f'ProtocolXml/{plat}/{prefix}TcpBinding.xml']
              g=s.find(".//u:GroupSpec[@id='missionExecutionStatus']",ns)
              assert g.find("u:BooleanSpec[@id='currentWaypointAvailable']",ns).get('cdm')=='MissionPlan.CurrentWaypoint.Available'
              idx=g.find("u:QuantitySpec[@id='currentWaypointIndex']",ns)
              assert idx.find('u:Range',ns).get('max')=='65534'
              m=b.find(".//u:MonitorBinding[@semantic_id='missionExecutionStatus']",ns)
              fs=[e for e in m.findall('u:Field',ns) if e.get('name')=='currentWaypointIndex']
              assert len(fs)==1 and fs[0].get('converter')=='UInt16LE' and fs[0].get('cdm') is None
              d={(e.get('cdm'),e.get('converter')) for e in fs[0].findall('u:DerivedSemantic',ns)}
              assert d=={('MissionPlan.CurrentWaypoint.Available','WaypointIndexToAvailable'),('MissionPlan.CurrentWaypointIndex','WaypointIndexToIndexWhenAvailable')}
          print('Current waypoint availability model OK')
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtocolXml/XSD/CommonBindingSchema.xsd ProtocolXml/MDV/MdvPlatformSemantic.xml ProtocolXml/EMDW/EmdwPlatformSemantic.xml ProtocolXml/MDV/MdvTcpBinding.xml ProtocolXml/EMDW/EmdwTcpBinding.xml ProtocolXml/Docs/SemanticBindingRules_20260818.md ProtocolXml/Docs/MdvEmdwDesignDecisions_20260825.md
          git commit -m 'Model current waypoint availability explicitly'
          git push origin HEAD:feature/auv-reply-bit-binding
