name: temporary IntegratedNavigation uploaded CSV reaudit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Refresh IntegratedNavigation audit notes
        shell: python
        run: |
          from pathlib import Path

          bind=Path('ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationBinding.xml')
          issues=Path('ProtocolXml/USV/IntegratedNavigation/IntegratedNavigation_OpenIssues.md')
          b=bind.read_text(encoding='utf-8')
          o=issues.read_text(encoding='utf-8')

          old='<!--imuIbit2의 Bit 0?10 및 dvlIbit2의 Bit 20?31 표기는 원문 자체가 모호하여 reserved 범위를 명시적으로 모델링하지 않는다.-->'
          new='<!--복합항법 CSCI 재심층 감사로 `?`는 구간기호 훼손으로 확정하였다: imuIbit2 Bit0~10, dvlIbit2 Bit20~31은 Reserved. 공통 규칙에 따라 Reserved bit는 Semantic Result/Binding BitMember로 노출하지 않는다.-->'
          if b.count(old) != 1:
              raise SystemExit(f'stale binding comment count={b.count(old)}')
          b=b.replace(old,new,1)

          anchor='- 복합항법 CSCI 재심층 감사에서 `imuIbit2`의 `Bit 0?10 : Reserved`는 동일 UInt32 내 Bit11~31이 연속 정의되어 있어 `Bit 0~10 : Reserved`로, `dvlIbit2`의 `Bit 20?31 : Reserved`는 Bit0~19가 연속 정의되어 있어 `Bit 20~31 : Reserved`로 확정하였다. 두 `?`는 구간기호가 훼손된 원문/CSV 표기 결함으로 정리한다.\n'
          add='- 2026-08-28 재업로드된 `복합항법장치 CSCI.csv` 전체를 현재 Semantic/Binding과 다시 대조하였다. 남은 항목 중 `integratedNavigationAidedSensor`는 key 0/1/2/4/8/16만, `ajAsStatus`는 Range 1~2 및 key 1/2만 직접 정의되어 조합/정상·동시감지 규칙은 추가 확인되지 않았다. `imuIbit2` 가속도계 온도는 Bit24~31 + LSB=1℃까지만, `idcTemperature/idcCpuLoad`는 Unit과 Range 셀의 단일 `0`만 존재하여 signedness/실제 범위를 더 확정할 수 없다. 따라서 기존 미해결 6건은 현 CSV로 추가 종료하지 않는다.\n- 같은 재검증에서 Binding 하단에 남아 있던 "reserved 범위가 모호하다"는 과거 주석이 OpenIssues의 해결 상태와 충돌함을 확인하여, Bit0~10/Bit20~31 Reserved 확정 상태로 주석을 동기화하였다.\n'
          if add not in o:
              if anchor not in o:
                  raise SystemExit('OpenIssues anchor not found')
              o=o.replace(anchor,anchor+add,1)

          old_status='- reserved 구간 표기 2건은 32-bit 전체 bit 배치와 연속 정의를 근거로 해소하였다.\n- 미해결 6건은 사용자 정책 선택사항이 아니라 추가 CSCI/IDL/Adapter 근거가 필요한 비차단 TBD이다.'
          new_status='- reserved 구간 표기 2건은 32-bit 전체 bit 배치와 연속 정의를 근거로 해소하였으며 Binding 주석도 동일 상태로 동기화하였다.\n- 재업로드된 복합항법 CSCI 전체 재검증에서도 추가로 닫을 수 있는 항목은 확인되지 않았다. 미해결 6건은 추가 IDL/Adapter/운용 규칙 근거가 필요한 비차단 TBD이다.'
          if old_status not in o:
              raise SystemExit('OpenIssues status text not found')
          o=o.replace(old_status,new_status,1)

          bind.write_text(b,encoding='utf-8')
          issues.write_text(o,encoding='utf-8')

      - name: Validate all USV XML and assertions
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sems=list(Path('ProtocolXml/USV').glob('*/*Semantic.xml'))
          binds=list(Path('ProtocolXml/USV').glob('*/*Binding.xml'))
          for p in sems: sx.assertValid(etree.parse(str(p)))
          for p in binds: bx.assertValid(etree.parse(str(p)))
          b=Path('ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationBinding.xml').read_text(encoding='utf-8')
          o=Path('ProtocolXml/USV/IntegratedNavigation/IntegratedNavigation_OpenIssues.md').read_text(encoding='utf-8')
          assert '원문 자체가 모호하여 reserved 범위를' not in b
          assert 'Bit0~10, dvlIbit2 Bit20~31은 Reserved' in b
          assert '현 CSV로 추가 종료하지 않는다' in o
          assert '미해결 6건' in o
          assert all('converter=' not in p.read_text(encoding='utf-8') for p in binds)
          print(f'USV Semantic {len(sems)} PASS / Binding {len(binds)} PASS')
          print('INTEGRATED NAVIGATION UPLOADED CSV REAUDIT PASS')
          PY
      - name: Commit IntegratedNavigation reaudit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/IntegratedNavigation/IntegratedNavigationBinding.xml ProtocolXml/USV/IntegratedNavigation/IntegratedNavigation_OpenIssues.md
          git commit -m 'Reaudit IntegratedNavigation against uploaded CSCI'
          git push origin HEAD:feature/usv-semantic-binding-audit
