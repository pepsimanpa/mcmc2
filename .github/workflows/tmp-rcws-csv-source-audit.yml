name: temporary RCWS CSV source audit
on:
  push:
    branches: [feature/usv-semantic-binding-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usv-semantic-binding-audit
      - name: Apply RCWS source-confirmed fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          sem=Path('ProtocolXml/USV/RemoteFireControl/RemoteFireControlSemantic.xml')
          bind=Path('ProtocolXml/USV/RemoteFireControl/RemoteFireControlBinding.xml')
          issues=Path('ProtocolXml/USV/RemoteFireControl/RemoteFireControl_OpenIssues.md')
          s=sem.read_text(encoding='utf-8')
          b=bind.read_text(encoding='utf-8')
          o=issues.read_text(encoding='utf-8')

          def rep(text, old, new, count, label):
              n=text.count(old)
              if n != count:
                  raise SystemExit(f'{label}: expected {count}, found {n}')
              return text.replace(old,new)

          # Same RCWS CSCI defines HeartBeat firingMode as 0~1 with the identical 0=Safe/1=Fire code table.
          s=rep(s,
              '      <!--firingMode 원문 Range는 0~3이나 의미가 정의된 값은 0=안전모드, 1=사격모드뿐이며 2~3의 의미는 원문 미정의이다.-->',
              '      <!--DetailStatusType의 firingMode Range 0~3은 동일 CSCI의 HeartBeat firingMode Range 0~1 및 동일 코드표(0=안전,1=사격)와 충돌한다. 동일 의미 필드의 교차검증에 따라 유효 코드는 0/1로 확정하고 2/3은 표기 오류로 처리한다.-->',1,'firingMode semantic note')

          old='''      <QuantitySpec id="turningAngle" name="포탑구동 선회각" cdm="Weapon.RCWS.Turret.TraverseAngle">\n        <Unit>deg</Unit>\n        </QuantitySpec>\n      <!--DetailStatusType 원문 turningAngle Range 셀은 "0~360-180~180"로 중첩 표기되어 의미가 모호하다. 동일 장치의 DrivingConfig/Status에는 -180~180 deg가 제시되지만, 본 Semantic에서는 원문 모호성을 보존하기 위해 범위를 강제하지 않는다(TBD).-->'''
          new='''      <QuantitySpec id="turningAngle" name="포탑구동 선회각" cdm="Weapon.RCWS.Turret.TraverseAngle">\n        <Unit>deg</Unit>\n        <Range min="-180" max="180"/>\n      </QuantitySpec>\n      <!--DetailStatusType Range 셀의 "0~360-180~180"은 동일 RCWS CSCI의 StatusType.turningAngle이 명시한 -180~180 deg와 교차검증하여 표기 오염으로 정리한다.-->'''
          s=rep(s,old,new,1,'turningAngle semantic range')

          # Expose source-defined IBIT bit locations as raw bit members. Polarity is deliberately not inferred.
          detail_defs={
            'drivingIBIT_Detail': ('Health.RCWS.Driving.IBIT.Detail', [
              ('horizontalMotorIBIT','Bit0.Raw'),('verticalMorotIBIT','Bit1.Raw'),('reloadMotorIBIT','Bit2.Raw'),('inertialMeasurementUnitCommunicationIBIT','Bit3.Raw')]),
            'surveillanceIBIT_Detail': ('Health.RCWS.Surveillance.IBIT.Detail', [
              ('dayCameraIBIT','Bit0.Raw'),('nightWideAngleCameraIBIT','Bit1.Raw'),('nighttelephotoCameraIBIT','Bit2.Raw'),('distanceMeasurementIBIT','Bit3.Raw'),('atmosphericPressureIBIT','Bit4.Raw'),('surveillanceTemperatureIBIT','Bit5.Raw')]),
            'strikeIBIT_Detail': ('Health.RCWS.Strike.IBIT.Detail', [
              ('autoReloadAssemblyIBIT','Bit0.Raw'),('fireAssemblyIBIT','Bit1.Raw'),('weaponControlBoardIBIT','Bit2.Raw')]),
            'controlIBIT_Detail': ('Health.RCWS.Control.IBIT.Detail', [
              ('controlAssemblyIBIT','Bit0.Raw'),('controlPowerIBIT','Bit1.Raw'),('fireControlBoardIBIT','Bit2.Raw'),('communicationControlBoardIBIT','Bit3.Raw'),('driveControlBoardIBIT','Bit4.Raw')]),
          }

          # Append semantic raw bit groups to the IBIT result only.
          start=s.index('<Reply bindRef="requestIbitResult"')
          end=s.index('</Reply>', start)
          sec=s[start:end]
          if 'name="drivingIBIT_Detail"' in sec:
              raise SystemExit('IBIT detail semantic already expanded')
          groups=[]
          for field,(base,members) in detail_defs.items():
              lines=[f'<GroupResult name="{field}" cdm="{base}">']
              for name,bit in members:
                  lines.append(f'<Result name="{name}" cdm="{base}.{bit}"/>')
              lines.append('</GroupResult>')
              groups.append(''.join(lines))
          marker='</Results>'
          if sec.count(marker)!=1:
              raise SystemExit(f'IBIT semantic Results marker count {sec.count(marker)}')
          sec=sec.replace(marker,''.join(groups)+marker)
          s=s[:start]+sec+s[end:]

          # Replace raw detail octets by PackedField/BitMember. Names preserve CSCI labels; CDM keeps bit semantics raw.
          for field,(base,members) in detail_defs.items():
              old=f'        <Field name="{field}" cdm="{base}.Raw" dataType="UInt8"/>'
              lines=[f'        <PackedField name="{field}" width="8" defaultValue="0">']
              for off,(name,bit) in enumerate(members):
                  lines.append(f'          <BitMember name="{name}" cdm="{base}.{bit}" offset="{off}"/>')
              lines.append('        </PackedField>')
              b=rep(b,old,'\n'.join(lines),1,'binding packed '+field)

          old_comment='        <!--IBIT Detail raw bit 정의: driving Bit0=선회모터, Bit1=고각모터, Bit2=급탄모터, Bit3=관성센서 통신; surveillance Bit0=주간카메라, Bit1=야간(협각)카메라, Bit2=야간(광각)카메라, Bit3=거리측정기, Bit4=기압, Bit5=감시조립체 온도; strike Bit0=자동장전조립체 통신, Bit1=격발조립체, Bit2=무장제어보드; control Bit0=통합제어기, Bit1=통합제어기전원, Bit2=사격통제보드, Bit3=통신제어보드, Bit4=구동제어보드. 원문은 각 bit의 0/1 정상/이상 극성을 별도로 명시하지 않아 raw octet으로 유지한다.-->'
          new_comment='        <!--IBIT Detail은 CSCI가 bit 위치와 점검 대상을 직접 명시하므로 PackedField로 분해한다. 다만 각 bit의 0/1 정상/이상 polarity는 직접 정의되지 않아 ValueMap/Boolean 의미는 부여하지 않고 bit별 Raw로 유지한다. surveillance Bit1/2는 symbolic name(wideAngle/telephoto)과 한글 설명(협각/광각)이 서로 충돌하므로 이름 자체만 보존한다.-->'
          b=rep(b,old_comment,new_comment,1,'IBIT binding comment')

          # Rewrite Remaining TBD with source-audit resolutions and narrowed IBIT issue.
          pat=r'## 3\. Remaining TBD\n.*?\n## 4\. 현재 상태'
          new_tbd='''## 3. Remaining TBD — 9개\n\n1. **ControlPanel joystick raw 값 ↔ 각도 변환**\n   - `height`/`turn`은 물리 raw long 0~65535로 정의되어 있고 비고에는 조이스틱 가동범위 -20~+20 deg가 기재되어 있다.\n   - raw 값과 각도의 변환 공식/중립값이 정의되지 않아 Semantic은 raw 입력 계약을 유지한다.\n\n2. **IBIT detail bit polarity / 감시카메라 명칭 충돌**\n   - 이번 RCWS CSCI 재검토로 `drivingIBIT_Detail`, `surveillanceIBIT_Detail`, `strikeIBIT_Detail`, `controlIBIT_Detail`의 bit 위치와 대상은 직접 확인되어 `PackedField/BitMember`와 Semantic bit별 Raw Result로 분해하였다.\n   - 다만 각 bit의 `0/1` 중 어느 값이 정상/이상인지 직접 정의되어 있지 않아 `BooleanResult`/`ValueMap`은 적용하지 않는다.\n   - `surveillanceIBIT_Detail` Bit1/2는 원문 symbolic name(`nightWideAngleCameraIBIT`/`nighttelephotoCameraIBIT`)과 한글 설명(협각/광각)이 서로 뒤바뀐 형태여서 원작자/IDL 확인 전 의미를 교정하지 않는다.\n\n3. **PBIT/IBIT Result correlation**\n   - 공용 요청에는 commandID가 있으나 전용 PBIT/IBIT 결과 Report에는 동일 commandID가 없다.\n   - CommandStatus ACK 이후 전용 결과를 어느 요청과 연결하는지 런타임 규칙 확인이 필요하다.\n\n4. **전용 결과 Report correlation**\n   - `CIPEAimStatusType`, `EOIRAimStatusType`, `DistanceMeasureReportType`, `MenuStatusType`에는 요청 commandID와 직접 연결할 식별자가 없다.\n   - 동시/연속 요청 시 결과 correlation 규칙 확인이 필요하다.\n\n5. **거리측정 특수값**\n   - `targetDistance`: 0=Unknown, 1~4000=m 유효값이다.\n   - UInt16의 4001~65535 값은 의미가 정의되지 않았다.\n   - Sentinel/Invalid를 최종 Semantic 공통 모델에서 어떻게 노출할지는 전역 후속 감사 대상이다.\n\n6. **No-driving zone -30 특수값 적용 범위**\n   - 원통 측 제어 원문은 `noDrivingZone1`에 -30 deg 설정 시 해당 구동제한구역을 설정하지 않는다고 명시하지만, 이번 RCWS CSCI의 `MenuStatusType`은 zone1~12 모두 단순 -30~30 deg 상태값으로만 기재한다.\n   - 동일 특수 규칙이 zone2~12 제어에도 적용되는지는 여전히 직접 근거가 없어 확대 적용하지 않는다.\n\n7. **`initZeroing` event reset 규칙**\n   - 0=초기, 1=영점 초기화는 원통 측 제어 원문에서 확인되나 1 송신 후 자동으로 0으로 초기화해야 하는지는 이번 RCWS CSCI에도 정의가 없다.\n\n8. **Menu SystemAction과 공용 Restart 중복**\n   - `SystemAction`: 0=None, 1=Shutdown, 2=Reboot가 원통 측 제어 원문에 존재하며 `2=Reboot`는 공용 `SystemRebootControlType`과 기능적으로 중복된다.\n   - 이번 RCWS CSCI는 MenuStatus 결과만 제공하고 우선순위/사용 조건을 정의하지 않아 둘 다 보존한다.\n\n9. **물리 오탈자 / 실제 IDL 철자**\n   - 이번 RCWS CSCI 자체에서 `DetailStatusType.cipeAming` 오탈자가 재확인되어 Binding의 해당 물리 이름 보존은 CSCI 기준으로 확정한다.\n   - `ControlPanalConfigType` 등 원통 측 제어 타입의 실제 DDS IDL에서도 동일 철자를 사용하는지는 IDL 확보 시 재확인한다.\n\n### 이번 CSV 재검토로 해결된 항목\n\n- **`firingMode` raw 2/3**: `DetailStatusType`의 Range `0~3`과 달리 동일 RCWS CSCI의 `RCWSHeartBeatReportType.firingMode`는 Range `0~1`이고 양쪽 모두 `0=안전 / 1=사격`만 정의한다. 동일 의미 필드 교차검증에 따라 유효 코드는 0/1로 확정하고 2/3은 Range 표기 오류로 정리한다.\n- **`turningAngle` Range**: `DetailStatusType`의 오염된 `0~360-180~180` 표기와 달리 동일 RCWS CSCI의 `StatusType.turningAngle`은 `-180~180 deg`로 명확하다. 동일 포탑구동 선회각 필드 교차검증에 따라 Semantic Range를 `-180~180 deg`로 확정한다.\n\n## 4. 현재 상태'''
          o2,n=re.subn(pat,new_tbd,o,flags=re.S)
          if n!=1:
              raise SystemExit(f'OpenIssue Remaining TBD replace count {n}')
          o=o2.replace('- 남은 11건은 사용자 정책 선택사항이 아니라 추가 CSCI/IDL/Adapter 근거가 필요한 비차단 TBD이다.',
                      '- 이번 RCWS CSCI 재감사로 `firingMode`/`turningAngle` 2건은 해결하고 IBIT detail은 bit 위치/대상까지 정밀화하였다. 남은 9건은 추가 원통 제어 원문/IDL/Adapter/운용 규칙 근거가 필요한 비차단 TBD이다.')

          # Add audit summary bullets.
          anchor='- PBIT/IBIT 및 CIPE/EOIR 지향·거리측정·메뉴 결과는 각 실제 물리 결과 메시지별 단일 Reply 구조를 유지하였다.\n'
          add='- 동일 RCWS CSCI 내부 교차검증으로 `firingMode` 유효 raw를 0/1로 확정하고 `turningAngle` 범위를 -180~180 deg로 확정하였다.\n- RCWS IBIT detail 4개 octet은 CSCI의 bit 위치/대상 정의를 따라 PackedField로 분해하되, 0/1 polarity가 없어 bit별 Raw 의미로 유지하였다.\n'
          o=rep(o,anchor,anchor+add,1,'OpenIssue summary anchor')

          sem.write_text(s,encoding='utf-8')
          bind.write_text(b,encoding='utf-8')
          issues.write_text(o,encoding='utf-8')

      - name: Validate RCWS and all USV XML
        run: |
          python -m pip install -q lxml
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          sx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonSpecSchema.xsd'))
          bx=etree.XMLSchema(etree.parse('ProtocolXml/XSD/CommonBindingSchema.xsd'))
          sem=Path('ProtocolXml/USV/RemoteFireControl/RemoteFireControlSemantic.xml')
          bind=Path('ProtocolXml/USV/RemoteFireControl/RemoteFireControlBinding.xml')
          sx.assertValid(etree.parse(str(sem)))
          bx.assertValid(etree.parse(str(bind)))
          for p in Path('ProtocolXml/USV').glob('*/*Semantic.xml'): sx.assertValid(etree.parse(str(p)))
          for p in Path('ProtocolXml/USV').glob('*/*Binding.xml'): bx.assertValid(etree.parse(str(p)))
          s=sem.read_text(encoding='utf-8'); b=bind.read_text(encoding='utf-8')
          assert '<Range min="-180" max="180"/>' in s
          for f in ['drivingIBIT_Detail','surveillanceIBIT_Detail','strikeIBIT_Detail','controlIBIT_Detail']:
              assert b.count(f'<PackedField name="{f}"')==1
              assert b.count(f'<Field name="{f}"')==0
              assert s.count(f'<GroupResult name="{f}"')==1
          assert b.count('<PackedField name="drivingIBIT_Detail"')==1
          assert 'converter=' not in b
          print('ALL USV XSD PASS')
          print('RCWS CSV SOURCE AUDIT PASS')
          PY
      - name: Commit RCWS source audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProtocolXml/USV/RemoteFireControl/RemoteFireControlSemantic.xml ProtocolXml/USV/RemoteFireControl/RemoteFireControlBinding.xml ProtocolXml/USV/RemoteFireControl/RemoteFireControl_OpenIssues.md
          git commit -m 'Resolve RCWS CSV-grounded range and IBIT semantics'
          git push origin HEAD:feature/usv-semantic-binding-audit
